<!DOCTYPE html>
<html lang="ko" data-langs="ko,en">
<head>
<meta name="pinterest" content="nopin">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Econ2 Exam3 TA Session</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 4v24h24' fill='none' stroke='%23000' stroke-width='3'/%3E%3Cpath d='M8 8l18 18M8 24L26 8' stroke='%231f6fd1' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/slides/deck.css">
<!--
  Econ2 Exam3 TA Session 덱 — scripts/econ2-exam3/ta/make_ta.py 가 만든다(이 파일을 직접 고치지 말고 make_ta.py · deck-template.html 을 고친다).
  PDF(/econ2/econ2-exam3-ta-session.pdf)를 장마다 그림(pNN.jpg, 1920×1080)으로 넣고,
  그래프가 있는 장은 <div class="g" data-g="pNN"> 가 PPT 의 흑백 그래프 자리를 움직이는 그래프로 덮는다(graphs.js + scn.js).
    자리(left/top/width/height)는 무대 px = EMU ÷ 7620. 빈 <i class="step"> 개수 = 그 장에서 → 로 넘기는 그래프 단계 수.
  PPT 는 영어. 그래프 위 설명 줄만 … 메뉴의 Language 로 한국어 · 영어를 바꾼다.
-->
<style>
  /* 마지막 장: 덱 주소 QR(qr.svg 는 make_ta.py 가 segno 로 만든다) */
  .slide.qr{flex-direction:row;align-items:center;justify-content:center;gap:80px;padding:60px;background:#fff;color:#1f2537}
  .slide.qr>img{width:640px;height:640px;max-width:none;max-height:none;image-rendering:pixelated}
  .qr-t p{margin:0}
  .slide .qr-h{font-size:48px;font-weight:800;line-height:1.25;margin-bottom:28px}
  .slide .qr-u{font-size:34px;font-weight:700;color:#1f6fd1;margin-bottom:40px}
  .slide .qr-s{font-size:26px;color:#5b6170;line-height:1.5}
  .slide.pg{padding:0}
  .slide.pg>img{position:absolute;left:0;top:0;width:1600px;height:900px;max-width:none;max-height:none}
  .g{position:absolute;touch-action:none;-webkit-user-select:none;user-select:none}
  .gsvg{display:block;width:100%;height:100%;font-family:inherit;overflow:visible}
  .g.orig .gsvg{opacity:0;pointer-events:none}
  .gtools{position:absolute;right:4px;top:4px;display:flex;gap:6px;opacity:.5;transition:opacity .2s}
  .g:hover .gtools,.gtools:focus-within{opacity:1}
  .gtools button{font-family:inherit;font-size:16px;font-weight:600;line-height:1;padding:6px 10px;border:1.5px solid #1f2537;border-radius:0;background:#fff;color:#1f2537;cursor:pointer;-webkit-appearance:none;appearance:none}
  .gtools button:hover{background:#1f2537;color:#fff}
  .g.orig .gtools button:last-child{background:#1f2537;color:#fff}
  #overview .gtools{display:none}
  @media print{.gtools{display:none}}
</style>
</head>
<body>
<noscript>JavaScript is required.</noscript>

<main id="stage">
<!--SLIDES-->
  <section class="slide qr" data-title="QR · 이 슬라이드 열기">
    <img src="qr.svg" alt="QR: https://peripheral7.github.io/slides/econ2-exam3/">
    <div class="qr-t">
      <p class="qr-h"><span data-l="ko">휴대폰으로 이 슬라이드 열기</span><span data-l="en" hidden>Open these slides on your phone</span></p>
      <p class="qr-u">peripheral7.github.io/slides/econ2-exam3/</p>
      <p class="qr-s"><span data-l="ko">그래프를 직접 움직여 보기: peripheral7.github.io/econ2/graphs/#ch35</span><span data-l="en" hidden>Try the graphs yourself: peripheral7.github.io/econ2/graphs/en/#ch35</span></p>
    </div>
  </section>
</main>

<script src="/slides/deck.js"></script>
<script src="/slides/econ2-exam3/scn.js"></script>
<script src="/slides/econ2-exam3/graphs.js"></script>
</body>
</html>
