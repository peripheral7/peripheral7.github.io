# 새 저장소(whereto)의 main 에 올리면 Cloudflare Pages 로 배포한다.
# 저장소 Settings → Secrets and variables → Actions 에:
#   Secrets   CLOUDFLARE_API_TOKEN (권한: Account · Cloudflare Pages · Edit), CLOUDFLARE_ACCOUNT_ID
#   Variables VITE_NAVER_MAP_KEY_ID (공개되는 지도 Client ID), VITE_PLACE_SEARCH_URL (https://place-search.<계정>.workers.dev), PAGES_PROJECT (예: whereto)
# 비밀 키(NAVER_CLIENT_SECRET 등)는 여기에 넣지 않는다 — 계산 서버(.env.local)와 Worker 시크릿에만.
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    # Cloudflare 설정(변수 PAGES_PROJECT)을 넣기 전에는 건너뜀 — 첫 push 가 실패로 보이지 않게
    if: ${{ vars.PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
        env:
          VITE_NAVER_MAP_KEY_ID: ${{ vars.VITE_NAVER_MAP_KEY_ID }}
          VITE_PLACE_SEARCH_URL: ${{ vars.VITE_PLACE_SEARCH_URL }}
      - run: npx wrangler@3 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
