name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # VCP 대시보드 산출물이 data 브랜치에 올라오면(03_stock_trading/publish_data.ps1, 매일) data 브랜치에 함께 담긴
  # 트리거 워크플로(trigger-deploy.yml)가 이 워크플로를 workflow_dispatch로 실행한다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # data 브랜치 푸시로 실행돼도 사이트 소스는 항상 main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vcp_dashboard.html / data.json 은 main 히스토리에 쌓지 않고 data 브랜치(커밋 1개)에만 둔다.
      # data 브랜치가 없으면 대시보드 링크가 깨진 사이트가 배포되지 않도록 여기서 멈춘다(이전 배포는 그대로 유지됨).
      - name: Fetch VCP dashboard data (data branch)
        run: |
          if ! git fetch --depth=1 origin data; then
            echo "::error::data 브랜치가 없습니다. 03_stock_trading/publish_data.ps1 -Force 로 먼저 게시하세요."
            exit 1
          fi
          git show FETCH_HEAD:vcp_dashboard.html > public/reports/vcp_dashboard.html
          git show FETCH_HEAD:data.json > public/reports/data.json
          ls -l public/reports/vcp_dashboard.html public/reports/data.json

      # 매일 테스트(/reports/daily-test.html)의 문제 은행은 두 학습 페이지(행정법 기본문제 25 · 실무 종합문제집)에서 만든다.
      # 원본을 고치고 은행 파일을 다시 만들지 않았더라도 사이트에는 항상 최신 문제가 올라가도록 빌드 전에 다시 만든다.
      # (원본이 그대로면 결과 파일도 그대로다. 실패해도 배포를 막지 않고 커밋된 파일을 쓴다.)
      - name: Regenerate daily-test question bank
        run: node scripts/build-daily-test-bank.mjs || echo "::warning title=daily-test-bank::문제 은행 재생성에 실패해 커밋된 파일을 그대로 배포합니다"

      # next/font/google 이 빌드 중에 폰트를 내려받아, 러너의 일시적인 네트워크 오류만으로도 빌드가 실패할 수 있다 → 한 번 재시도한다.
      # 실행 로그는 저장소 관리자만 볼 수 있으므로, 실패하면 마지막 출력을 주석(annotation)으로도 남긴다(로그인 없이 실행 페이지에서 보인다).
      - name: Build (static export)
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if pnpm next build 2>&1 | tee build.log; then exit 0; fi
            level=warning; [ "$attempt" -eq 2 ] && level=error
            echo "::${level} title=next build failed (attempt ${attempt}/2)::$(tail -n 25 build.log | tr -d '\r' | awk 'BEGIN{ORS="%0A"} {print}')"
            [ "$attempt" -lt 2 ] && sleep 10
          done
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
