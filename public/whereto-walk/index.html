function load(i){if(i>=CDNS.length){note('지도 라이브러리를 불러오지 못했어요. 새로고침하거나 잠시 뒤 다시 열어 주세요.');return}

function start(){
const m=L.map('m');
const TILES=[['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:13,attribution:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors'}]];
let ti=-1,errs=0,layer=null;
function nextTiles(){ti++;if(layer)m.removeLayer(layer);if(ti>=TILES.length){note('배경 지도를 받지 못해 선만 보여 드려요. 경로 점검은 그대로 할 수 있어요.');return}
 errs=0;layer=L.tileLayer(TILES[ti][0],Object.assign({maxZoom:19},TILES[ti][1])).addTo(m);
 layer.on('tileerror',()=>{if(++errs===6)nextTiles()})}

const g=L.layerGroup().addTo(m),s=document.getElementById('s'),bk=document.getElementById('bk'),info=document.getElementById('info');
D.forEach((d,i)=>s.add(new Option(d.name+(d.routes.some(r=>r.flag)?' ⚠':''),i)));
function show(i){const d=D[i];g.clearLayers();L.circleMarker(d.gate,{radius:6,color:'#111',weight:2,fillColor:'#ffd60a',fillOpacity:1}).bindTooltip('정문').addTo(g);
const seg=(l,rs,o)=>(rs||[]).forEach(([a,b])=>L.polyline(l.slice(a,b+1),o).addTo(g));
d.routes.forEach((r,k)=>{const c=r.flag?'#d62828':'#1b4965';L.polyline(r.line,{color:c,weight:3,opacity:.85}).addTo(g);seg(r.line,r.steep,{color:'#7b2cbf',weight:4,opacity:.8});
