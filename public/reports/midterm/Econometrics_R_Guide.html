<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R Code and Output, Explained</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<!--
  학습용 해설 페이지. 섹션마다 왼쪽 = R 코드와 실제 출력, 오른쪽 = 중요한 해석부터 순서대로.
  해설 문장을 누르면 그 문장이 말하는 코드 토큰과 출력값이 연한 노란색으로 표시된다(다시 누르면 해제).
  데이터: 아래 SECTIONS. 코드·출력 안의 ⟦id|텍스트⟧ 가 연결 대상, 해설의 refs 가 그 id 목록.
  모든 출력은 R 4.3에서 실제로 실행한 값(Lab2_Practice.csv, social.csv, Wooldridge wage1·mroz, set.seed(4201)).
-->
<style>
  :root{
    --serif:"Source Serif 4","Noto Serif KR",Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,"D2Coding",Menlo,monospace;
    --bg:#F6F5F3; --paper:#FFFFFF; --panel:#FBFAF8; --ink:#1D1D1F; --soft:#6E6E73; --faint:#A1A1A6; --rule:#E6E5E1;
    --hl:rgba(255,214,64,0.38); --hl-line:rgba(214,160,0,0.9); --note-on:rgba(255,214,64,0.18);
    --c-com:#6a737d; --c-str:#22863a; --c-num:#b45309; --c-kw:#8250df; --c-fn:#0550ae; --c-arg:#0f766e; --c-op:#c2185b;
    --gut:16px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#1A1A1C; --paper:#232325; --panel:#1F1F21; --ink:#ECECEE; --soft:#A1A1A6; --faint:#6E6E73; --rule:#38383B;
    --hl:rgba(255,210,80,0.26); --hl-line:rgba(255,210,80,0.8); --note-on:rgba(255,210,80,0.12);
    --c-com:#8b949e; --c-str:#7ee787; --c-num:#ffa657; --c-kw:#d2a8ff; --c-fn:#79c0ff; --c-arg:#56d4c4; --c-op:#ff7b9c; } }
  :root[data-theme="dark"]{
    --bg:#1A1A1C; --paper:#232325; --panel:#1F1F21; --ink:#ECECEE; --soft:#A1A1A6; --faint:#6E6E73; --rule:#38383B;
    --hl:rgba(255,210,80,0.26); --hl-line:rgba(255,210,80,0.8); --note-on:rgba(255,210,80,0.12);
    --c-com:#8b949e; --c-str:#7ee787; --c-num:#ffa657; --c-kw:#d2a8ff; --c-fn:#79c0ff; --c-arg:#56d4c4; --c-op:#ff7b9c; }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--serif); line-height:1.65; font-size:16px;}

  header{max-width:1320px; margin:0 auto; padding:56px 32px 18px;}
  header h1{font-weight:400; font-size:2.6rem; line-height:1.1; margin:0 0 10px; letter-spacing:-0.01em;}
  header p{margin:0; color:var(--soft); font-size:0.95rem; max-width:760px;}
  nav{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--rule);}
  nav .in{max-width:1320px; margin:0 auto; padding:10px 32px; display:flex; flex-wrap:wrap; gap:4px 18px; font-size:0.86rem; align-items:baseline;}
  nav a{color:var(--soft); text-decoration:none;} nav a:hover{color:var(--ink);}
  nav .sp{flex:1;}
  nav button{background:none; border:none; padding:0; font:inherit; font-size:0.86rem; color:var(--soft); cursor:pointer;}
  nav button:hover{color:var(--ink);}

  section{max-width:1320px; margin:0 auto; padding:34px 32px 10px;}
  .sec-head{display:flex; align-items:baseline; gap:12px; margin:0 0 14px;}
  .sec-head .no{font-size:0.9rem; color:var(--soft);}
  .sec-head h2{font-weight:400; font-size:1.55rem; margin:0;}
  .sec-head .src{margin-left:auto; font-size:0.8rem; color:var(--faint); text-align:right;}
  .grid{display:grid; grid-template-columns:minmax(0,58fr) minmax(0,42fr); gap:28px; align-items:start;}

  /* left: code and output, sticky while the notes scroll */
  .left{position:sticky; top:calc(var(--nav-h, 44px) + 8px); max-height:calc(100vh - var(--nav-h, 44px) - 20px); overflow:auto; background:var(--paper); box-shadow:0 0 0 1px rgba(0,0,0,0.05); padding:18px 18px 22px;
    scrollbar-width:thin;}
  .lbl{font-size:0.74rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--faint); margin:0 0 6px;}
  pre{margin:0; font-family:var(--mono); font-size:0.8rem; line-height:1.55; white-space:pre; color:var(--ink);}
  .code .cl{display:block; padding-left:2.6em; text-indent:-2.6em; white-space:pre-wrap; overflow-wrap:anywhere;}
  .code .ln{display:inline-block; width:1.8em; margin-right:0.8em; text-indent:0; text-align:right; color:var(--faint); user-select:none;}
  .out{margin-top:16px; border-top:1px solid var(--rule); padding-top:10px;}
  .out .cmd{font-family:var(--mono); font-size:0.76rem; color:var(--soft); margin:0 0 3px;}
  .out .cmd .at{color:var(--faint); margin-left:8px; font-family:var(--serif);}
  .out pre{overflow-x:auto; padding-bottom:2px;}
  .hl-com{color:var(--c-com); font-style:italic;} .hl-str{color:var(--c-str);} .hl-num{color:var(--c-num);} .hl-kw{color:var(--c-kw); font-weight:600;}
  .hl-fn{color:var(--c-fn);} .hl-arg{color:var(--c-arg);} .hl-op{color:var(--c-op);}

  /* linked token: invisible until its note is selected */
  .k{border-radius:3px; transition:background-color .2s, box-shadow .2s;}
  .k.on{background:var(--hl); box-shadow:inset 0 -1.5px 0 var(--hl-line);}

  /* right: notes in order of importance */
  .notes{list-style:none; margin:0; padding:0; counter-reset:n;}
  .note{counter-increment:n; position:relative; padding:12px 14px 12px 44px; margin:0 0 6px; cursor:pointer; border-radius:6px; transition:background-color .2s;}
  .note::before{content:counter(n); position:absolute; left:12px; top:12px; width:22px; text-align:right; font-size:0.9rem; color:var(--faint);}
  .note:hover{background:rgba(0,0,0,0.03);}
  .note.on{background:var(--note-on);}
  .note.on::before{color:var(--ink);}
  .note .t{font-weight:600; display:block; font-size:0.98rem; margin-bottom:2px;}
  .note .b{font-size:0.95rem;}
  .note:focus-visible{outline:2px solid var(--hl-line); outline-offset:2px;}
  .note .num{font-variant-numeric:tabular-nums;}
  .rank{font-size:0.74rem; color:var(--faint); letter-spacing:0.05em; margin:0 0 8px 14px;}
  footer{max-width:1320px; margin:0 auto; padding:30px 32px 60px; color:var(--faint); font-size:0.8rem;}

  @media (max-width:899.98px){
    header{padding:36px var(--gut) 12px;} header h1{font-size:2rem;}
    nav .in{padding:8px var(--gut); flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; scrollbar-width:none;} nav .sp{flex:0 0 8px;}
    section{padding:26px var(--gut) 6px;}
    .sec-head{flex-wrap:wrap;} .sec-head .src{margin-left:0; text-align:left; flex:0 0 100%;}
    .grid{grid-template-columns:minmax(0,1fr); gap:14px;}
    .left{top:var(--nav-h, 44px); max-height:46vh; z-index:5; box-shadow:0 8px 14px -12px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.05);}
    .note{padding-left:38px;} .note::before{left:6px;}
  }
  @media print{
    nav{display:none;} .left{position:static; max-height:none; overflow:visible; box-shadow:none;} .grid{grid-template-columns:1fr 1fr;}
    section{break-inside:avoid-page;}
  }
</style>
</head>
<body>
<header>
  <h1 id="pgTitle"></h1>
  <p id="pgIntro"></p>
</header>
<nav><div class="in" id="nav"><span class="sp"></span><button type="button" id="langBtn"></button><button type="button" id="clearBtn"></button><button type="button" id="themeBtn"></button></div></nav>
<main id="main"></main>
<footer id="pgFoot"></footer>

<script>
/* ⟦id|text⟧ marks a linked token; several ids: ⟦a,b|text⟧. Output text is R's printout, unchanged apart from the marks. */
const SECTIONS = [
{
  id:'desc', no:'1', title:'기술통계', src:'Lab2.R · Lab2_Practice.csv (n = 27)',
  code:[
    'practice <- read.csv("Lab2_Practice.csv", header=TRUE, ⟦na|na.strings="."⟧)',
    'competence <- practice$COMPETENCE',
    'breaks <- practice$BREAKS',
    'grade <- practice$GRADE',
    '⟦sumb|summary(breaks)⟧',
    '⟦sumg|summary(grade)⟧',
    '⟦dev|sum(competence - mean(competence))⟧',
    '⟦ss|sum((competence - mean(competence))^2)⟧',
    '⟦ss2|sum((competence - mean(competence))^2)⟧/(⟦n1|length(competence) - 1⟧)',
    '⟦var|var(competence)⟧; ⟦sd|sd(competence)⟧',
    '⟦q|quantile(grade)⟧; ⟦iqr|IQR(grade)⟧',
    '⟦box|boxplot(grade)⟧',
    '⟦out|boxplot.stats(grade)$out⟧            # points drawn as outliers'
  ],
  outputs:[
    {cmd:'summary(breaks)', at:'line 5', text:
'   Min. 1st Qu.  Median    Mean 3rd Qu.    Max. \n  0.000   ⟦b_q1|1.000⟧   ⟦b_med|2.000⟧   ⟦b_mean|3.185⟧   ⟦b_q3|4.500⟧  ⟦b_max|12.000⟧ '},
    {cmd:'summary(grade)', at:'line 6', text:
'   Min. 1st Qu.  Median    Mean 3rd Qu.    Max. \n  ⟦g_min|36.00⟧   ⟦g_q1|72.00⟧   ⟦g_med|80.00⟧   ⟦g_mean|77.26⟧   ⟦g_q3|84.00⟧   97.00 '},
    {cmd:'sum(competence - mean(competence))', at:'line 7', text:'[1] ⟦o_dev|1.776357e-15⟧'},
    {cmd:'sum((competence - mean(competence))^2)', at:'line 8', text:'[1] ⟦o_ss|124.0741⟧'},
    {cmd:'sum((competence - mean(competence))^2)/(length(competence) - 1)', at:'line 9', text:'[1] ⟦o_var1|4.77208⟧'},
    {cmd:'var(competence); sd(competence)', at:'line 10', text:'[1] ⟦o_var|4.77208⟧\n[1] ⟦o_sd|2.184509⟧'},
    {cmd:'quantile(grade); IQR(grade)', at:'line 11', text:'  0%  25%  50%  75% 100% \n  36   ⟦q_72|72⟧   80   ⟦q_84|84⟧   97 \n[1] ⟦o_iqr|12⟧'},
    {cmd:'boxplot.stats(grade)$out', at:'line 13', text:'[1] ⟦o_out|36⟧'}
  ],
  notes:[
    {t:'분포 모양: breaks는 오른쪽으로 치우쳤다', b:'breaks의 평균 3.185가 중앙값 2보다 크다. 최댓값 12 같은 큰 값 몇 개가 평균을 끌어올린 것이므로 오른쪽 꼬리가 긴(right-skewed) 분포다.', refs:['sumb','b_mean','b_med','b_max']},
    {t:'grade는 반대로 왼쪽으로 치우쳤다', b:'grade의 평균 77.26이 중앙값 80보다 작다. 낮은 점수 36이 평균을 끌어내린 왼쪽 꼬리(left-skewed) 분포다.', refs:['sumg','g_mean','g_med','g_min']},
    {t:'치우친 변수는 중앙값과 IQR로 요약한다', b:'평균·표준편차는 극단값에 끌려가므로, 순서만 쓰는 중앙값과 IQR = Q3 − Q1이 대표값·퍼짐으로 적절하다. grade의 IQR = 84 − 72 = 12.', refs:['q','q_72','q_84','iqr','o_iqr']},
    {t:'표본분산 = 편차제곱합 ÷ (n − 1)', b:'편차제곱합 124.0741을 n − 1 = 26으로 나눈 4.772가 표본분산이고, var()의 값과 정확히 같다.', refs:['ss','o_ss','ss2','n1','o_var1','var','o_var']},
    {t:'n − 1로 나누는 이유', b:'평균 x̄를 같은 데이터로 추정하면서 자유도 1을 썼기 때문이다. n − 1로 나눠야 s²가 모분산 σ²의 불편추정량이 된다(회귀의 σ̂² = SSR ÷ (n − k − 1)도 같은 원리).', refs:['n1']},
    {t:'표준편차는 분산의 제곱근', b:'s = √4.772 = 2.185. 분산은 단위가 제곱이라 원래 단위로 되돌린 표준편차로 퍼짐을 읽는다.', refs:['sd','o_sd','o_var']},
    {t:'편차의 합은 항상 0', b:'평균으로부터의 편차는 더하면 언제나 0이 된다. 1.776357e-15는 부동소수점 반올림 오차일 뿐이다. 그래서 퍼짐을 재려면 편차를 제곱해서 더한다.', refs:['dev','o_dev','ss']},
    {t:'상자그림 이상치: 1.5 × IQR 규칙', b:'grade의 아래 경계 = Q1 − 1.5 × IQR = 72 − 18 = 54. 36은 54보다 작으므로 boxplot()이 점으로 따로 그리고, boxplot.stats()$out도 36을 돌려준다.', refs:['box','out','o_out','q_72','o_iqr','g_min']},
    {t:'na.strings = "."', b:'파일 안의 "."를 결측값(NA)으로 읽게 한다. 결측이 섞이면 mean() 등은 NA를 돌려주므로 na.rm = TRUE가 필요하다(이 파일은 결측 0개).', refs:['na']}
  ]
},
{
  id:'simple', no:'2', title:'단순회귀와 회귀선', src:'regression.R · social.csv (n = 85, 모든 변수 표준화)',
  code:[
    'social <- read.csv("social.csv", header=T)',
    '⟦y|perform⟧=social$cryp_scoreFINAL; ⟦xe|eye⟧=social$RMET_mean',
    '⟦xs|skill⟧=social$Smean_mean; ravens=social$ravens_mean',
    '⟦plot|plot(perform ~ eye)⟧',
    'eye_regr=lm(perform ~ eye)',
    '⟦abl|abline(eye_regr, col="blue")⟧',
    '⟦hm|abline(h=mean(perform), col="red")⟧',
    '⟦vm|abline(v=mean(eye), col="green")⟧',
    '⟦means|c(mean(perform), mean(eye))⟧',
    '⟦lm|skill_regr=lm(perform ~ skill)⟧',
    '⟦summ|summary(skill_regr)⟧',
    '⟦ci95|confint(skill_regr)⟧',
    '⟦ci99|confint(skill_regr, level=0.99)⟧',
    '⟦cor2|cor(perform, skill)^2⟧'
  ],
  outputs:[
    {cmd:'c(mean(perform), mean(eye))', at:'line 9', text:'[1]  ⟦o_my|9.411765e-11⟧ ⟦o_mx|-2.941177e-10⟧'},
    {cmd:'summary(skill_regr)', at:'line 11', text:
'Coefficients:\n             Estimate Std. Error t value Pr(>|t|)  \n(Intercept) ⟦b0|8.656e-11⟧  1.066e-01   0.000   1.0000  \nskill       ⟦b1|2.141e-01⟧  ⟦se1|1.072e-01⟧   ⟦t1|1.997⟧   ⟦p1|0.0491⟧ ⟦star|*⟧\n---\nSignif. codes:  0 \'***\' 0.001 \'**\' 0.01 \'*\' 0.05 \'.\' 0.1 \' \' 1\n\nResidual standard error: ⟦rse|0.9827⟧ on ⟦df|83⟧ degrees of freedom\nMultiple R-squared:  ⟦r2|0.04585⟧,  Adjusted R-squared:  ⟦ar2|0.03436⟧ \nF-statistic: ⟦F|3.989⟧ on 1 and 83 DF,  p-value: ⟦Fp|0.04908⟧'},
    {cmd:'confint(skill_regr)', at:'line 12', text:'                    2.5 %    97.5 %\n(Intercept) -0.2119943958 0.2119944\nskill        ⟦c95l|0.0008846993⟧ ⟦c95u|0.4273898⟧'},
    {cmd:'confint(skill_regr, level=0.99)', at:'line 13', text:'                  0.5 %    99.5 %\n(Intercept) -0.28099885 0.2809988\nskill       ⟦c99l|-0.06852928⟧ ⟦c99u|0.4968037⟧'},
    {cmd:'cor(perform, skill)^2', at:'line 14', text:'[1] ⟦o_cor2|0.04585475⟧'}
  ],
  notes:[
    {t:'기울기 해석', b:'skill의 계수 0.2141: 사회적 기술이 1 표준편차 높은 팀은 암호 과제 성과가 평균 0.214 표준편차 높다. 변수가 모두 표준화돼 있어 단위가 표준편차다.', refs:['lm','xs','y','b1']},
    {t:'t값과 p값: 5%에서 유의', b:'t = 추정치 ÷ 표준오차 = 0.2141 ÷ 0.1072 = 1.997. 자유도 83에서 p = 0.0491 < 0.05이므로 H₀: β_skill = 0을 5% 수준에서 기각한다. 별 하나(*)가 0.01 < p ≤ 0.05라는 표시다.', refs:['b1','se1','t1','p1','star','df']},
    {t:'신뢰구간과 검정은 같은 결론을 준다', b:'95% 구간 [0.0009, 0.4274]는 0을 포함하지 않아 5%에서 기각, 99% 구간 [−0.0685, 0.4968]은 0을 포함해 1%에서는 기각하지 못한다. p = 0.049가 0.01과 0.05 사이인 것과 정확히 맞는다.', refs:['ci95','c95l','c95u','ci99','c99l','c99u','p1']},
    {t:'R²: 설명력은 4.6%', b:'R² = 0.04585로 성과 변동의 약 4.6%만 설명한다. 단순회귀에서는 R²가 상관계수의 제곱과 같아 cor()² = 0.04585475와 일치한다. R²가 낮아도 기울기 추정 자체는 쓸모 있다.', refs:['r2','cor2','o_cor2']},
    {t:'단순회귀에서는 F = t²', b:'설명변수가 하나뿐이면 전체 F검정은 기울기 t검정과 같은 검정이다. F = 1.997² = 3.989, p-value 0.04908도 t검정의 p와 같다.', refs:['F','Fp','t1','p1']},
    {t:'회귀선은 항상 평균점을 지난다', b:'빨강(ȳ)과 초록(x̄) 선의 교점은 (x̄, ȳ)이다. OLS는 β̂₀ = ȳ − β̂₁x̄이므로 파란 회귀선이 언제나 이 점을 지난다. 여기서는 표준화로 두 평균이 0(9.4e-11, −2.9e-10)이라 절편도 ≈ 0이다.', refs:['abl','hm','vm','means','o_my','o_mx','b0']},
    {t:'잔차표준오차와 자유도', b:'Residual standard error 0.9827은 오차 표준편차의 추정치 σ̂이다. 자유도 = n − k − 1 = 85 − 1 − 1 = 83.', refs:['rse','df']},
    {t:'plot(y ~ x): 결과변수를 먼저', b:'공식에서 ~ 왼쪽이 y축(종속변수 perform), 오른쪽이 x축(설명변수 eye)이다. lm()의 공식과 같은 순서다.', refs:['plot','y','xe']}
  ]
},
{
  id:'multi', no:'3', title:'다중회귀와 예측', src:'regression.R 이어서 · 2절의 변수 그대로 사용',
  code:[
    '⟦mlm|mult_lm=lm(perform ~ skill + ravens)⟧',
    '⟦msum|summary(mult_lm)⟧',

const NAV = { en:['Descriptive statistics','Simple regression','Multiple regression','Dummies and tests','Simulation'], ko:['기술통계','단순회귀','다중회귀','더미·검정','시뮬레이션'] };
/* ---------- rendering ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function rHL(src){   /* light R colouring for plain code fragments */
  const RX = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?\b)|(\b(?:function|if|else|for|while|in|return|TRUE|FALSE|NULL|NA|T)\b)|([A-Za-z_.][\w.]*)(?=\s*\()|(?<=[(,]\s*)([A-Za-z_.][\w.]*)(?=\s*=(?!=))|(<-|%[^%\s]*%|[~$:*])/gm;
  let o = '', last = 0, m;
  while((m = RX.exec(src))){
    o += esc(src.slice(last, m.index));
    const c = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : m[4] ? 'kw' : m[5] ? 'fn' : m[6] ? 'arg' : 'op';
    o += `<span class="hl-${c}">${esc(m[0])}</span>`; last = m.index + m[0].length;
  }
  return o + esc(src.slice(last));
}
const MARK = /⟦([^|⟧]+)\|([^⟧]*)⟧/g;
function marked(s, colour){   /* ⟦ids|text⟧ -> <span class="k" data-k="ids"> */
  let o = '', last = 0, m; MARK.lastIndex = 0;
  while((m = MARK.exec(s))){
    o += colour ? rHL(s.slice(last, m.index)) : esc(s.slice(last, m.index));
    o += `<span class="k" data-k="${esc(m[1])}">${colour ? rHL(m[2]) : esc(m[2])}</span>`; last = m.index + m[0].length;
  }
  return o + (colour ? rHL(s.slice(last)) : esc(s.slice(last)));
}

/* ---------- click a note: light up its tokens ---------- */
function clearAll(){ document.querySelectorAll('.k.on').forEach(e => e.classList.remove('on')); document.querySelectorAll('.note.on').forEach(e => { e.classList.remove('on'); e.setAttribute('aria-pressed','false'); }); }
function select(note){
  const was = note.classList.contains('on'); clearAll(); if(was) return;
  note.classList.add('on'); note.setAttribute('aria-pressed','true');
  const ids = note.dataset.refs.split(' ');
  const hits = [...document.querySelectorAll('.k')].filter(e => e.dataset.k.split(',').some(k => ids.includes(k)));
  hits.forEach(e => e.classList.add('on'));
  /* scroll this section's code panel: show every lit token if they fit, otherwise the first lit output value */
  const left = note.closest('section').querySelector('.left'), mine = hits.filter(e => left.contains(e));
  if(mine.length){
    const c = left.getBoundingClientRect(), rs = mine.map(e => e.getBoundingClientRect());
    const top = Math.min(...rs.map(r => r.top)), bottom = Math.max(...rs.map(r => r.bottom));
    let dy;
    if(bottom - top < c.height - 48) dy = (top + bottom) / 2 - (c.top + c.height / 2);
    else { const o = mine.find(e => e.closest('.out')) || mine[0]; dy = o.getBoundingClientRect().top - c.top - 48; }
    if(top < c.top + 8 || bottom > c.bottom - 8 || bottom - top >= c.height - 48) left.scrollBy({ top: dy, behavior:'smooth' });
  }
}
document.addEventListener('click', e => { const n = e.target.closest('.note'); if(n) select(n); });
document.addEventListener('keydown', e => { const n = e.target.closest && e.target.closest('.note'); if(n && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); select(n); } if(e.key === 'Escape') clearAll(); });
