Econ 1
An econometrician wants to learn the average hourly wage of all workers in Korea and collects data on 2,000 randomly selected workers. Which statement is correct?
A sample is used only when the population is hypothetical|The 2,000 workers are the population, because they are the units actually analyzed|*The 2,000 workers are the sample, and the estimates are statements about what the population of all Korean workers is like|The estimates describe only the 2,000 workers and say nothing about other workers
A sample is the subset of the population chosen for analysis, and we study it to learn what the population is like. An estimate is a judgment about the population based on the sample.
population=연구하려는 대상 전체; sample=분석을 위해 선택된 모집단의 부분집합
===
Econ 1
Which statement best defines external validity?
Whether the OLS estimator is unbiased within the sample used|Whether the sample size is large enough to compute standard errors|Whether the R-squared of the regression is high|*The validity of applying the conclusions of a study outside the context of that study
External validity asks whether a study's conclusions can validly be applied outside the context of that study. It is directly tied to whether the sample represents the population.
external validity=외부 타당성; representative=대표성 있는
===
Econ 1
A researcher surveys only students at one private university in Seoul to estimate the average monthly smartphone spending of all Korean adults. What is the main concern?
OLS cannot be computed because the population is too large|*The sample is unlikely to be representative of the population, so the conclusions may have weak external validity|The estimates are automatically unbiased for all Korean adults because the students were chosen at random within the university|The population becomes hypothetical, so no estimate is possible
Students at one university are unlikely to represent all Korean adults. We must ask whether the sample represents the population, and if it does not, the conclusions are hard to apply to that population (weak external validity).
representative sample=모집단을 대표하는 표본

Econ 2
Consider the model log(price) = \beta_0 + \beta_1 subsidy + \beta_2 log(sunlight) + u. How should \beta_1 be interpreted?
The elasticity of price with respect to subsidy|The slope from a simple regression of price on subsidy|*The change in log(price) from a one-unit increase in subsidy, holding log(sunlight) fixed (a partial slope)|The total change in price from a one-unit increase in subsidy, including any change in sunlight it causes
In multiple regression \beta_1 is not a simple slope but a partial slope: the effect with the other regressor (log(sunlight)) held fixed. The dependent variable is log(price), so the units are also in terms of log(price).
partial slope=다른 변수를 고정했을 때의 기울기; ceteris paribus=다른 조건이 같다면
===
Econ 2
In the model log(price) = \beta_0 + \beta_1 subsidy + \beta_2 log(sunlight) + u, which statement about subsidy is correct?
Subsidy has a linear relationship with price, but not with log(price)|*Subsidy has a linear relationship with log(price), but not with price|Subsidy has a linear relationship with both price and log(price)|Subsidy has a linear relationship with neither price nor log(price)
log(price) is a linear function of subsidy, so that relationship is linear. But price = exp(\beta_0 + \beta_1 subsidy + ...), so price and subsidy are not linearly related.
linear relationship=한 변수가 1단위 변할 때 다른 변수가 항상 같은 양만큼 변하는 관계
===
Econ 2
In the model log(price) = \beta_0 + \beta_1 subsidy + \beta_2 log(sunlight) + u, which statement about sunlight is correct?
\beta_2 is the % change in price for a one-unit increase in sunlight|\beta_2 is the change in log(price) for a 1% increase in price|*log(sunlight) has a linear relationship with log(price), so \beta_2 is approximately the % change in price for a 1% increase in sunlight, holding subsidy fixed|Sunlight has a linear relationship with price, so \beta_2 is the change in price for one more unit of sunlight
Log-log form: log(sunlight) and log(price) are linearly related, and \beta_2 is an elasticity (a 1% increase leads to about a \beta_2% change). Sunlight and price themselves are not linearly related.
elasticity=탄력성 (% 변화 대 % 변화); log-log=양변 모두 로그
===
Econ 2
Suppose log(price) = \beta_0 + \beta_1 battery + \beta_2 battery^2 + u with \beta_2 \ne 0. Which statement is correct?
\beta_1 alone is the constant slope of battery for every value of battery|The model violates the assumption of linearity in parameters, so OLS cannot be used|Battery has a linear relationship with log(price) because the model is linear in parameters|*Battery does not have a linear relationship with log(price); the effect of one more unit of battery depends on the current level of battery
\Delta log(price)/\Delta battery ≈ \beta_1 + 2\beta_2 battery depends on the level of battery, so the relationship is not linear. The model is still linear in the parameters, so OLS can estimate it.
quadratic=이차항; linear in parameters=모수에 대해 선형
===
Econ 2
Suppose log(price) = \beta_0 + \beta_1 battery + \beta_2 sunlight + \beta_3 battery\times sunlight + u with \beta_3 \ne 0. Holding sunlight fixed, what is the effect on log(price) of one more unit of battery?
\beta_3\cdot battery|\beta_1|\beta_1 + \beta_3|*\beta_1 + \beta_3\cdot sunlight
Because battery and sunlight interact, the effect of battery is \beta_1 + \beta_3\cdot sunlight and depends on the level of sunlight. So \beta_1 alone is not the slope of battery, and battery and log(price) are not linearly related.
interaction term=상호작용항(두 변수의 곱)

Econ 3
Which statement describes random sampling?
Every element has an equal probability of being assigned to the treatment or control group|The researcher chooses units that look typical of the population|*Every element in the population has an equal probability of being selected into the sample|The sample contains more than half of the population
Random sampling means every element of the population has the same probability of being drawn into the sample. Equal probability of group assignment is random assignment.
random sampling=무작위 추출; random assignment=무작위 배정

Econ 3
A researcher has a random sample of 500 workers and then flips a coin for each worker to decide who joins a job training program. The coin flip is an example of:
Random sampling|Perfect collinearity|Partialling out|*Random assignment
Drawing the sample is random sampling. Splitting the drawn people into treatment and control groups by a coin flip is random assignment.
treatment group=처치 집단; control group=통제 집단

Econ 3
Consider Model 2: wage = \beta_0 + \beta_1 educ + u, where ability is not included. People with better ability tend to get more education. Why can the OLS estimate of \beta_1 be biased even with a random sample?
There is no sample variation in educ|*Ability goes into u and is correlated with educ, so the zero conditional mean condition E(u∣educ) = 0 fails|Random sampling guarantees unbiasedness, so the estimate cannot be biased|The homoskedasticity assumption fails, which always causes bias
If ability is left out of the model it goes into the error u. If ability and education are correlated, E(u∣educ) = 0 (zero conditional mean) fails, so β̂_1 is biased even under random sampling.
zero conditional mean=E(u∣x)=0, 오차의 조건부 평균이 0
===
Econ 3
In Model 2, wage = \beta_0 + \beta_1 educ + u (ability omitted), suppose ability raises wage and is positively correlated with education. The OLS estimate of \beta_1 tends to:
Have a bias whose sign can never be determined|Understate the true return to education (downward bias)|Be unbiased, because ability is unobserved|*Overstate the true return to education (upward bias)
Omitted variable bias = (effect of ability \beta_2) × (direction of the correlation between educ and abil). Both are positive, so the bias is positive, that is, the estimate is overstated.
omitted variable bias=누락변수 편의; upward bias=과대추정
===
Econ 3
The slides state: "OLS requires random sampling. It may also require random assignment." When estimating the effect of education on wages with Model 2 (wage = \beta_0 + \beta_1 educ + u), why would random assignment help?
Random assignment removes the need for any error term|Random assignment increases the R-squared of the regression|*If educ were randomly assigned, it would be unrelated to ability and other factors in u, so the zero conditional mean condition would hold|Random assignment makes the sample representative of the population
With random assignment, education is not systematically related to factors in the error such as ability, so E(u∣educ) = 0 holds and β̂_1 is unbiased. (Representativeness is the job of random sampling.)
random assignment=무작위 배정

Ch.1
A data set records the crime rate and the number of police officers for the same 150 cities in both 2020 and 2023. What type of data is this?
Pooled cross sections|Cross-sectional data|*Panel (longitudinal) data|Time series data
Observing the same units (cities) repeatedly over time gives panel data. It lets us control for unobserved characteristics that do not change over time.
panel data=같은 단위를 여러 시점에 추적한 데이터
===
Ch.1
A researcher draws a random sample of house prices in 1993 and a new, independent random sample of house prices in 1995 to evaluate a property tax change. What type of data is this?
Panel data|A single cross section|Time series data|*Pooled cross sections
Combining two cross sections drawn independently at two points in time gives a pooled cross section. The same households are not followed, so it is not a panel. It is often used to compare before and after a policy change.
pooled cross section=독립 표본인 여러 횡단면의 결합
===
Ch.1
Which feature is typical of time series data but NOT of a cross section drawn by random sampling?
*Observations are typically serially correlated, and their ordering conveys important information|Observations are more or less independent of each other|The ordering of observations does not matter|All observations are collected at the same point in time
In a time series the observations are serially correlated and their order matters (trend, seasonality). In a randomly sampled cross section the observations are roughly independent and their order carries no information.
serial correlation=계열상관; seasonality=계절성
===
Ch.2
In the simple regression y = \beta_0 + \beta_1 x + u, the OLS estimates β̂_0 and β̂_1 are chosen to:
*Minimize the sum of squared residuals|Make the fitted value equal to y for every observation|Minimize the sum of residuals|Minimize the sum of absolute residuals
OLS (ordinary least squares) minimizes the sum of squared residuals \Sigmaû_i^2. As a result the residuals always sum to zero (an algebraic property).
residual=잔차 (y_i − ŷ_i); SSR=잔차제곱합
===
Ch.2
In a simple regression of y on x, R^2 = 0.25. Which statement is correct?
25% of the observations lie exactly on the regression line|*25% of the sample variation in y is explained by x|x causes 25% of the change in y|The estimated slope equals 0.25
R^2 = SSE/SST = 1 − SSR/SST is the proportion of the sample variation in y explained by x. It does not mean causality or the size of the slope.
SST=총변동; SSE=설명된 변동; SSR=잔차변동
===
Ch.2
The fitted regression is log(wage) = 0.584 + 0.083educ. How should 0.083 be interpreted?
A 1% increase in education raises the wage by 8.3%|*One more year of education is associated with an approximately 8.3% higher wage|One more year of education raises the wage by 0.083%|One more year of education raises the wage by $0.083
Log-level (semi-log) form: a one-unit increase in x changes y by about 100\beta_1 %. 0.083 × 100 = 8.3%.
semi-elasticity=반탄력성 (1단위 변화 대 % 변화)
===
Ch.2
Real earnings (in $1,000s) are regressed on train (= 1 if the person joined a randomly assigned job training program, 0 otherwise): earn = 4.55 + 1.79train. What does 1.79 measure?
Nothing, because OLS cannot be used when x is binary|Participants earn about 1.79% more than non-participants|The average earnings of participants are $1,790|*The average treatment effect: participants earn about $1,790 more on average than non-participants
If x is 0/1, the slope is the difference between the two group means. Under random assignment OLS is an unbiased estimator of the treatment effect. The non-participant mean is $4,550, so 1,790 is about a 39.3% increase.
average treatment effect=평균 처치효과; dummy variable=0/1 변수
===
Ch.2
Under SLR.1–SLR.5, Var(β̂_1) = \sigma^2 / SST_x. Which change makes β̂_1 more precise (smaller variance)?
*More sample variation in x|Fewer observations|A larger error variance \sigma^2|Replacing homoskedasticity with heteroskedasticity
The variance rises with the error variance \sigma^2 and falls with the sample variation in x, SST_x.
homoskedasticity=Var(u∣x)=\sigma^2 일정; SST_x=x의 총 표본변동
===
Ch.3
In y = \beta_0 + \beta_1 x_1 + \beta_2 x_2 + u, the OLS estimate β̂_1 can also be obtained by:
Regressing y on x_2 first, then adding x_1|*Regressing x_1 on x_2 (with a constant), then regressing y on the residuals from that regression|Regressing x_2 on the residuals from a regression of y on x_1|Averaging the slopes of the two simple regressions
Partialling out: regress y on the residual of x_1 after removing the part explained by x_2 (the part uncorrelated with x_2), and the slope is β̂_1.
partialling out=다른 변수의 영향을 걸러냄

Ch.3
Which regression violates MLR.3 (no perfect collinearity)?
log(salary) on log(sales) and ceoten|wage on educ and educ^2|wage on educ and exper, where their correlation is 0.9|*wage on an intercept, male (= 1 if male) and female (= 1 if female)
With an intercept, male + female = 1 is an exact linear relationship, so there is perfect collinearity. educ^2 is not a linear function of educ, and a high correlation (0.9) is multicollinearity, not a violation of MLR.3.
perfect collinearity=설명변수 간 정확한 선형관계
===
Ch.3
The true model is y = \beta_0 + \beta_1 x_1 + \beta_2 x_2 + u, but x_2 is omitted and y is regressed on x_1 only. In which case is the simple regression slope unbiased for \beta_1?
When the sample size is very large|*When \beta_2 = 0 or when x_1 and x_2 are uncorrelated|When the R-squared is high|When x_2 is positively correlated with x_1 and \beta_2 > 0
Omitted variable bias = \beta_2 × \delta_1. If the omitted variable is irrelevant (\beta_2 = 0) or uncorrelated with x_1 (\delta_1 = 0), there is no bias.
omitted variable=누락변수
===
Ch.3
Using 506 communities, the simple regression gives log(price) = 11.71 − 1.043 log(nox), while adding rooms gives log(price) = 9.23 − 0.718 log(nox) + 0.306 rooms. rooms raises price and is negatively correlated with log(nox). Which statement is correct?
The simple regression is biased upward (toward zero), so −1.043 understates the true effect|Adding rooms must always make the nox elasticity more negative|*The simple-regression elasticity −1.043 is biased downward (too negative), as predicted by \beta_2 > 0 and Corr(log(nox), rooms) < 0|The two estimates differ only because of sampling error
Sign of the omitted variable bias = (effect of rooms \beta_2, +) × (correlation between log(nox) and rooms, −) = negative, so the bias is downward. Indeed −1.043 is more negative than −0.718. (Wooldridge problem, HPRICE2)
downward bias=하향편의 (참값보다 작게 추정); elasticity=탄력성
===
Ch.3
High (but not perfect) correlation between x_1 and x_2 in a multiple regression mainly:
Violates MLR.3, so OLS cannot be computed|*Increases the sampling variances of β̂_1 and β̂_2 but does not cause bias|Causes β̂_1 and β̂_2 to be biased|Inflates the variance of every coefficient, including an unrelated x_3
Multicollinearity only inflates the variances of the related variables (diagnosed with VIF) and unbiasedness is preserved. It is not a violation of MLR.3 in the strict sense.
VIF=분산팽창계수; R_j^2=x_j를 다른 x들에 회귀한 R^2
===
Ch.3
The Gauss–Markov theorem states that under MLR.1–MLR.5, the OLS estimators are:
Exactly normally distributed in any sample|The only unbiased estimators of the coefficients|The best estimators even when the errors are heteroskedastic|*BLUE: they have the smallest variance among all linear unbiased estimators
Under MLR.1–5, OLS has the smallest variance among linear unbiased estimators (BLUE). With heteroskedasticity a better estimator exists. Normality requires MLR.6.
BLUE=Best Linear Unbiased Estimator

Ch.4
In a regression, β̂_j = 0.80 with se(β̂_j) = 0.10. What is the t statistic for H_0: \beta_j = 1?
8.0|*−2.0|2.0|−0.2
t = (β̂_j − a_j)/se(β̂_j) = (0.80 − 1)/0.10 = −2.0. Subtract the hypothesized value and divide by the standard error.
t statistic=(추정치 − 가설값)/표준오차
===
Ch.4
In a two-sided t test, the p-value is 0.07. Which statement is correct?
*H_0 is rejected at the 10% level but not at the 5% level|H_0 is rejected at the 5% level|H_0 is rejected at the 1% level|The probability that H_0 is true is 7%
The p-value is the smallest significance level at which H_0 can be rejected. Reject only when p < \alpha: 0.07 < 0.10 but 0.07 > 0.05.
p-value=H_0를 기각하는 최소 유의수준; significance level=유의수준
===
Ch.4
The 95% confidence interval for \beta_1 is [0.02, 0.10]. Which statement is correct?
*In repeated samples, intervals constructed this way contain the true \beta_1 95% of the time, and H_0: \beta_1 = 0 is rejected at the 5% level (two-sided)|There is a 95% probability that β̂_1 lies in [0.02, 0.10]|\beta_1 equals 0.06 with 95% certainty|H_0: \beta_1 = 0 cannot be rejected at the 5% level
The confidence interval's endpoints are random (the parameter is not). Zero lies outside the 95% interval, so the two-sided 5% test rejects \beta_1 = 0.
confidence interval=신뢰구간
===
Ch.4
To test H_0: \beta_3 = 0, \beta_4 = 0, \beta_5 = 0 jointly, which statement is correct?
The F statistic can be negative when the restrictions help the fit|Three separate t tests always give the same conclusion as the F test|The restricted model always has a smaller SSR than the unrestricted model|*Use an F test comparing the SSR of the restricted and unrestricted models; F is large when the SSR rises a lot after imposing the restrictions
F = [(SSR_r − SSR_{ur})/q] / [SSR_{ur}/(n−k−1)]. Imposing restrictions can only raise SSR, so F ≥ 0, and the individual t tests and the joint test can give different conclusions.
exclusion restrictions=제외 제약 (계수 = 0); q=제약의 개수
===
Ch.4
Which can cause the usual OLS t statistics to be invalid (not t-distributed under H_0)?
A sample correlation of 0.95 between two explanatory variables in the model|A low R-squared|*Heteroskedasticity, or omitting an important explanatory variable|Having 500 observations instead of 5,000
Heteroskedasticity violates MLR.5 and omitting an important variable violates MLR.4 (zero conditional mean), so the t distribution does not hold. A high correlation (0.95) between regressors is not a CLM violation (only perfect collinearity is ruled out). (Wooldridge Problem 4.1)
CLM assumptions=고전적 선형모형 가정 MLR.1–MLR.6

Ch.4
For 32 chemical firms, rdintens = 0.472 + 0.321 log(sales) + 0.050 profmarg, where rdintens is R&D as a percentage of sales. If sales increase by 10%, rdintens changes by about:
3.21 percentage points|*0.032 percentage points|32.1 percent|0.321 percentage points
Level-log form: \Delta y ≈ (\beta_1/100)(%\Delta x) = (0.321/100) × 10 ≈ 0.032. rdintens is measured in percent, so this is a percentage-point change. (Wooldridge problem, RDCHEM)
level-log=y는 수준, x는 로그; percentage point=퍼센트포인트

Which statement about the consistency of OLS is correct?
Consistency requires the errors to be normally distributed (MLR.6)|Consistency requires homoskedasticity (MLR.5)|A consistent estimator is unbiased in every finite sample|*Under MLR.1–MLR.4, the distribution of β̂_j collapses to the true \beta_j as n \to \infty, i.e. plim β̂_j = \beta_j
Consistency: as the sample grows the distribution of the estimator concentrates on the true value. MLR.1–MLR.4 suffice, and even the weaker MLR.4′ (E(u) = 0, Cov(x_j, u) = 0) is enough. Normality and homoskedasticity are not needed.
consistency=일치성; plim=확률극한 (probability limit)
===
Ch.5
pctstck = \beta_0 + \beta_1 funds + \beta_2 risktol + u satisfies MLR.1–MLR.4 (pctstck = % of pension in stocks, funds = number of mutual funds offered, risktol = risk tolerance). If funds and risktol are positively correlated and pctstck is regressed on funds only, the inconsistency in β̃_1 is:
Zero, because the full model satisfies MLR.1–MLR.4|Negative, because risktol is omitted|It vanishes as the sample size grows|*Positive: plim β̃_1 − \beta_1 = \beta_2\delta_1 > 0, since \beta_2 > 0 and funds and risktol are positively correlated
Inconsistency = \beta_2 × \delta_1 with \delta_1 = Cov(funds, risktol)/Var(funds). A higher risk tolerance means a larger stock share, so \beta_2 > 0, and the correlation is positive, giving a positive inconsistency. It does not vanish as the sample grows. (Wooldridge Problem 5.2)
inconsistency=비일치성 (점근적 편의); risktol=위험 허용도
===
Ch.5
cigs is the average number of cigarettes smoked per day. Can cigs have a normal distribution in the adult population, and what does this mean for OLS?
Yes, by the central limit theorem every variable is normal|*No: cigs is nonnegative, piles up at zero (most adults do not smoke) and is discrete; still, with a large n, OLS t and F tests are approximately valid|Yes, because cigs is an average|No, so OLS estimates in a cigs equation are biased
The normal distribution is continuous and symmetric and can take negative values. cigs has a mass at zero, so it is not normal. But normality (MLR.6) is unrelated to unbiasedness, and in large samples inference is approximately valid thanks to asymptotic normality. (Wooldridge Problem 5.3)
MLR.6=오차의 정규성 가정
===
Ch.5
Under MLR.1–MLR.5 but without normality (MLR.6), with a large sample:
t tests become invalid no matter how large n is|OLS becomes biased|*The usual t and F statistics are approximately valid, because (β̂_j − \beta_j)/se(β̂_j) is approximately standard normal|OLS standard errors cannot be computed
Asymptotic normality (central limit theorem): even without normality, t and F tests and confidence intervals are approximately valid in large samples. Homoskedasticity (MLR.5) is still needed, though. With heteroskedasticity the usual standard errors are wrong even in large samples.
asymptotic normality=점근적 정규성; CLT=중심극한정리
===
Ch.5
Under MLR.1–MLR.5, se(β̂_j) ≈ c_j/\sqrt{n}. If the sample size is quadrupled, the standard error is approximately:
Quartered|*Halved|Unchanged|Doubled
Standard errors shrink at the rate 1/\sqrt{n}. Since \sqrt{4} = 2, they fall to about half.
\sqrt{n}-asymptotic=표준오차가 1/\sqrt{n} 속도로 감소
===
Ch.5
Crime model (n = 2,725): narr86 is regressed on pcnv, ptime86, qemp86 (restricted model). Its residuals are regressed on pcnv, avgsen, tottime, ptime86, qemp86, giving R^2 = 0.0015. To test H_0: avgsen and tottime have no effect:
*LM = nR^2 ≈ 4.09; compared with χ^2_2 (10% critical value 4.61), H_0 is not rejected at the 10% level|LM = 0.0015, so H_0 is rejected at the 1% level|LM ≈ 4.09; compared with χ^2_5, H_0 is rejected|LM = n(1 − R^2) ≈ 2,721, so H_0 is rejected
LM = n·R^2_u = 2,725 × 0.0015 ≈ 4.09, the degrees of freedom are the number of restrictions q = 2, and the p-value ≈ 0.13. Regress the restricted-model residuals on all of the regressors. (Wooldridge Example 5.3)
LM statistic=라그랑주 승수 통계량 (n-R-squared); q=제약의 개수
===
Ch.6
The dependent variable is changed from dollars to thousands of dollars (divided by 1,000). What happens?
Only the intercept changes|t statistics are divided by 1,000|R-squared falls|*All coefficients and standard errors are divided by 1,000; t statistics and R-squared are unchanged
Changing the units of y changes the coefficients and standard errors by the same factor. So the t statistics, p-values and R^2 do not change (same statistical conclusions).
data scaling=변수 단위 변경
===
Ch.6
For 32 chemical firms, rdintens = 2.613 + 0.00030 sales − 0.0000000070 sales^2 (sales in $ millions). With salesbil = sales/1,000, the coefficients on salesbil and salesbil^2 become:
0.00000030 and −0.0000000000070|0.30 and −0.0000070|*0.30 and −0.0070, with the intercept and R-squared unchanged|0.030 and −0.00070
salesbil coefficient = 0.00030 × 1,000 = 0.30, and salesbil^2 = sales^2/1,000,000, so its coefficient = −0.0000000070 × 10^6 = −0.0070. This gives a form that is easy to report. (Wooldridge Problem 6.3)
rescaling=단위 조정
===
Ch.6
For rdintens = 2.613 + 0.00030 sales − 0.0000000070 sales^2 (sales in $ millions), at what level of sales does the marginal effect of sales on rdintens become negative?
About 2,143|*About 21,429, i.e. $21.4 billion|About 42,857|At sales = 0
Turning point x^* = β̂_1/(2∣β̂_2∣) = 0.00030/(2 × 0.0000000070) ≈ 21,428.57 ($ millions). Beyond it the marginal effect becomes negative. (Wooldridge Problem 6.3)
turning point=전환점; marginal effect=한계효과
===
Ch.6
A housing equation with dependent variable log(price) contains −0.545 rooms + 0.062 rooms^2 (other controls included). Moving from 6 to 7 rooms raises price by about:
6.2%|12.4%|−54.5%|*19.9%
%\Delta price ≈ 100[−0.545 + 2(0.062)(6)] ≈ 19.9%. The turning point is 0.545/(2 × 0.062) ≈ 4.4 rooms, and only about 1% of the communities in the sample have fewer rooms than that. (Wooldridge Example 6.2, HPRICE2)
quadratic=이차항 모형; partial effect=\beta_1 + 2\beta_2 x
===
Ch.6
In log(price) = 9.23 − 0.718 log(nox) + 0.306 rooms, what is the exact percentage change in price from one more room?
Exactly 30.6%|0.306%|3.06%|*About 35.8%, = 100[exp(0.306) − 1]
The 100\beta approximation for log-level is accurate only for small changes. The exact value is 100[exp(\beta\Delta x) − 1] = 100(1.358 − 1) ≈ 35.8%.
exact percentage change=정확한 % 변화
===
Ch.6
In a regression where price and all explanatory variables are standardized (z-scores), the coefficient on nox is −0.340. Interpretation:
A 1 ppm increase in nox lowers price by 34%|*A one standard deviation increase in nox lowers price by 0.34 standard deviation, holding the other variables fixed|A 1% increase in nox lowers price by 0.34%|nox explains 34% of the variation in price
A standardized (beta) coefficient shows how many standard deviations y changes when x changes by one standard deviation, so it lets us compare the effects of variables measured in different units. (Wooldridge Example 6.1)
beta coefficient=표준화 계수; z-score=(x − 평균)/표준편차
===
Ch.6
log(wage) = 5.65 + 0.047educ + 0.00078educ\cdot pareduc + 0.019exper + 0.010tenure (n = 722), where pareduc is total years of both parents' education. What is the estimated return to education when pareduc = 32?
4.7%|0.078%|*About 7.2%|2.5%
\Delta log(wage)/\Delta educ = 0.047 + 0.00078 × pareduc = 0.047 + 0.025 ≈ 0.072. The higher the parents' education, the larger the return to education. (Wooldridge Problem 6.4, WAGE2)
interaction term=상호작용항
===
Ch.6
Which statement about adjusted R-squared is correct?
It always rises when a variable is added|It is always larger than R-squared|It can compare a model for y with a model for log(y)|*It can fall when a variable is added; it rises only if the new variable's ∣t∣ exceeds 1
Adjusted R^2 = 1 − [SSR/(n−k−1)]/[SST/(n−1)] penalizes through the degrees of freedom. R^2 never falls when variables are added, but adjusted R^2 can fall. It cannot be compared across different dependent variables (y vs log y).
adjusted R-squared=수정 결정계수
===
Ch.6
College GPA equation (n = 4,137): predicted colgpa = 2.70 at sat = 1200, hsperc = 30, hsize = 5, with se(ŷ^0) = 0.020 and σ̂ = 0.560. Which is correct?
The prediction interval for one student is narrower than the confidence interval for the mean|Both 95% intervals are 2.66 to 2.74|The prediction interval shrinks to zero width as n grows|*The 95% CI for expected colgpa is about 2.66–2.74, but the 95% prediction interval for one student is about 1.60–3.80, because it also includes the error variance \sigma^2
Confidence interval for the mean: 2.70 ± 1.96(0.020). Prediction interval for one individual: se(ê^0) = \sqrt{0.020^2 + 0.560^2} ≈ 0.560, giving 2.70 ± 1.96(0.560). The error variance does not shrink as n grows. (Wooldridge Examples 6.5–6.6, GPA2)
prediction interval=예측구간 (개별 관측값); confidence interval=평균 E(y∣x)의 신뢰구간
===
Ch.6
The dependent variable is log(y). Using exp(predicted log(y)) as the prediction of y:
*Systematically underestimates E(y∣x); it should be scaled up by α̂_0, e.g. exp(σ̂^2/2) under normality or the average of exp(û_i)|Gives an unbiased prediction of y|Overestimates E(y∣x)|Is valid only when R-squared is high
E(y∣x) = exp(\sigma^2/2)·exp(x\beta), so using only exp(log ŷ) underpredicts. Multiply by α̂_0 > 1 to correct it. (Wooldridge Section 6.4, Example 6.7)
α̂_0=log 모형 예측 보정 계수
===
Ch.6
Palm oil production is estimated as: production = 243.63 − 3.34 tax − 0.61 fuel − 0.03 fuel^2. Production is the amount of palm oil produced, tax is the tax rate (%), and fuel is the fuel price ($). What is the predicted amount of palm oil produced when the tax rate is 5% and the fuel price is $7?
222.45|*221.19|226.93|222.66
production = 243.63 − 3.34(5) − 0.61(7) − 0.03(7)^2 = 243.63 − 16.70 − 4.27 − 1.47 = 221.19.
===
Ch.3
The palm oil equation above is estimated with an intercept and three regressors (tax, fuel, fuel^2). What are the degrees of freedom when the sample size is 85?
84|82|*81|80
df = n − k − 1 = 85 − 3 − 1 = 81.
===
Ch.6
Worker productivity is estimated as: productivity = 3.36 + 0.06 log(training) + 2.53 log(experience) + 0.03 log(training) \times log(experience). Productivity is shoes made per hour, training is training hours, experience is years of experience (log = natural log). What is the predicted number of shoes the worker makes in one hour with 2000 hours of training and 17 years of experience?
6.79|10.98|*11.63|11.30
ln(2000) = 7.6009 and ln(17) = 2.8332; productivity = 3.36 + 0.06(7.6009) + 2.53(2.8332) + 0.03(7.6009)(2.8332) = 3.36 + 0.4561 + 7.1680 + 0.6460 = 11.63; log base 10 would give 6.79, so log means ln.
===
Ch.6
Vaccination is estimated as: log(vaccination) = 0.34 + 0.15 reminder + 0.23 log(ambassador). Reminder is the number of reminders sent and ambassador is the number of ambassadors who are information hubs (log = natural log). What is the predicted amount of log(vaccination) when 1 reminder is sent and there are five ambassadors?
0.65|*0.86|1.64|0.49
log(vaccination) = 0.34 + 0.15(1) + 0.23 ln(5) = 0.34 + 0.15 + 0.23(1.6094) = 0.86.
===
Ch.6
Vaccination is estimated as: log(vaccination) = 0.34 + 0.15 reminder + 0.23 log(ambassador). Reminder is the number of reminders sent and ambassador is the number of ambassadors who are information hubs (log = natural log). What is the predicted amount of vaccination when 1 reminder is sent and there are five ambassadors?
4.47|0.86|*2.36|5.16
vaccination = exp(0.8602) = e^{0.8602} = 2.36.
===

  .case.stacked .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:28px var(--pad) 6px;}
  .case.stacked .case-ex .tables{flex-direction:row; flex-wrap:wrap; align-items:flex-start; gap:0 28px;}
  .case.stacked .case-ex .exbox{display:contents;}
  .case.stacked .case-ex h2, .case.stacked .case-ex .uses{flex:0 0 100%;}
  .case.stacked .case-ex table.t{flex:1 1 auto; width:auto; margin-bottom:30px;}
  .case.stacked .case-ex{scrollbar-width:auto; scrollbar-color:auto;}

  .single-nav{display:flex; justify-content:space-between; padding-top:16px; padding-bottom:30px;}
  .single-nav .link{font-size:0.9rem;}
  .single-progress{padding-top:20px; font-size:0.8rem; color:var(--faint); text-align:center;}
  .next-ch{padding-top:10px; padding-bottom:30px; text-align:right;}

  .data-errors{max-width:var(--paper-w); margin:16px auto 0; padding:12px 18px; color:var(--wrong); font-size:0.88rem; background:var(--paper);}
  .empty-state{padding-top:60px; padding-bottom:60px; text-align:center; color:var(--ink-soft);}
  footer{padding-top:28px; padding-bottom:40px; color:var(--faint); font-size:0.78rem; text-align:center;}

  .lightbox{position:fixed; inset:0; z-index:40; background:rgba(20,20,22,0.6); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox .lb-body{background:var(--paper); padding:26px 30px; max-width:94vw; max-height:92vh; overflow:auto; min-width:min(560px,90vw);}
  .lightbox table.t{font-size:1rem;}
  .lightbox img{max-width:90vw; max-height:84vh;}

  :root{--memo-w:min(300px,86vw);}
  .memo{position:fixed; top:0; right:0; bottom:0; width:var(--memo-w); z-index:22; background:var(--paper); box-shadow:-10px 0 40px rgba(0,0,0,0.08); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; visibility:hidden;}
  body.memo-open .memo{transform:none; visibility:visible;}
  .memo-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px 10px; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);}
  .memo-head .link{text-transform:none; letter-spacing:0; margin-left:14px;}
  .memo-text{flex:1; overflow-y:auto; outline:none; white-space:pre-wrap; word-break:break-word; font-size:0.95rem; padding:6px 20px 16px;}
  .memo-text:empty::before{content:attr(data-placeholder); color:var(--faint);}
  .memo-tab{position:fixed; top:50%; right:0; z-index:22; transform:translateY(-50%); writing-mode:vertical-rl; background:var(--paper); border:none; box-shadow:0 0 0 1px var(--rule); padding:14px 6px; font-size:0.78rem; color:var(--ink-soft); cursor:pointer;}
  body.memo-open .memo-tab{display:none;}
  .tip{position:fixed; z-index:30; transform:translateX(-50%); font-size:0.78rem; color:var(--ink-soft); opacity:0; pointer-events:none; transition:opacity .12s;}
  .tip.show{opacity:1;}
  .to-top{position:fixed; left:50%; bottom:20px; z-index:20; transform:translateX(-50%); background:var(--paper); border:none; box-shadow:0 4px 20px rgba(0,0,0,0.1); border-radius:20px; padding:8px 22px; font-size:0.85rem; color:var(--ink-soft); cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s;}
  .to-top.show{opacity:1; pointer-events:auto;}

  @media (max-width:1420px){
    .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:28px var(--pad) 6px;}
    .case-ex .tables{flex-direction:row; flex-wrap:wrap; align-items:flex-start; gap:0 28px;}
    .case-ex .exbox{display:contents;}
    .case-ex h2, .case-ex .uses{flex:0 0 100%;}
    .case-ex table.t{flex:1 1 auto; width:auto; margin-bottom:30px;}
    .case-ex{scrollbar-width:auto; scrollbar-color:auto;}
  }
  @media (max-width:1180px){
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 20px;}
    .qside:empty{display:none;}
  }
  @media (max-width:820px){
    :root{--paper-w:100vw; --pad:20px;}
    .sheet::before{box-shadow:none;}
    header{padding-top:40px;} header h1{font-size:2.5rem;}
  }

  #printSheet{display:none;}
  @page{size:A4 portrait; margin:22mm 20mm 20mm; @bottom-center{content:counter(page); font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-size:9pt;}}
  @media print{
    html, body{background:#fff !important; color:#000 !important; padding:0 !important; margin:0 !important;}
    body > *:not(#printSheet){display:none !important;}
    #printSheet{display:block; font-family:var(--serif); font-size:10.5pt; line-height:1.5; color:#000;}
    #printSheet h1{font-size:13pt; font-weight:400; text-align:center; margin:0 0 9mm;}
    #printSheet .p-sub{text-align:center; font-size:10pt; margin:-7mm 0 9mm;}
    #printSheet .p-q{break-inside:avoid; page-break-inside:avoid; margin:0 0 5mm;}
    #printSheet .p-q p{margin:0;}
    #printSheet .p-ref{color:#444;}
    #printSheet .p-opt{margin:0 0 0 5mm !important;}
    #printSheet .p-fig{margin:1.5mm 0 2mm; max-width:120mm;}
    #printSheet .p-ex{break-inside:avoid; page-break-inside:avoid; border-top:0.3mm solid #000; border-bottom:0.3mm solid #000; padding:3mm 0 1mm; margin:2mm 0 6mm;}
    #printSheet .p-ex h2{font-size:12.5pt; font-weight:400; margin:0;}
    #printSheet .p-ex .uses{font-size:9pt; margin:0 0 3mm; font-style:italic; color:#333;}
    #printSheet .p-ex .tables{display:flex; gap:8mm; align-items:flex-start;}
    #printSheet .p-ex .tables > table{flex:1 1 0;}
    #printSheet table.t{font-size:9.3pt; color:#000;}
    #printSheet table.t caption{color:#000; font-size:10.5pt; padding-bottom:1.5mm;}
    #printSheet table.t thead th{border-top:0.35mm solid #000;}
    #printSheet table.t tbody tr:last-child td{border-bottom:0.35mm solid #000;}
    #printSheet table.t th, #printSheet table.t td{color:#000;}
    #printSheet table.t th{ border-bottom:0.3mm solid #000; padding:0.8mm 1.5mm;}
    #printSheet table.t td{padding:0.4mm 1.5mm; border-bottom:0.1mm solid #ddd;}
    #printSheet table.t tr.sec td{color:#000; border-bottom:none; padding-top:2mm;}
    #printSheet table.t tr.tot td{border-top:0.25mm solid #000;}
    #printSheet .p-key{break-before:page; page-break-before:always;}
    #printSheet .p-grid{columns:4; font-size:10pt;}
    #printSheet .p-sol{display:none;}
    body.print-solution #printSheet .p-grid{display:none;}
    body.print-solution #printSheet .p-sol{display:block; column-count:2; column-gap:9mm; font-size:9pt; line-height:1.3;}
    #printSheet .p-s{break-inside:avoid; margin:0 0 3mm;}
    #printSheet .p-s p{margin:0;}
    #printSheet .sn-line .lb{font-weight:400; text-shadow:0.3px 0 0 currentColor;}
  }
</style>
</head>
<body>

<div class="sheet" id="sheet">
  <header class="pg"><div class="inpage">
    <h1 id="quizTitle">Quiz</h1>
    <p class="sub" id="quizSub"></p>
    <div class="tools">
      <button class="link" id="allChBtn" type="button">All chapters</button>
      <button class="link" id="printBtn" type="button">Print</button>
      <button class="link" id="printSolBtn" type="button">Print with solution</button>
      <span class="setwrap"><button class="link" id="menuBtn" type="button" aria-expanded="false">Settings</button>
<div class="setrow" id="settings">
        <button class="link" id="layoutToggleBtn" type="button">Single question view</button>
        <button class="link" id="examModeBtn" type="button">Exam mode</button>
        <button class="link" id="darkSw" type="button">Night mode</button>
      </div></span>
      <form class="qsearch" id="qSearchForm" autocomplete="off">
        <input id="qSearch" type="text" inputmode="numeric" placeholder="Go to no. (1, 3-5)" aria-label="Question numbers">
        <button class="link" id="qClear" type="button">Clear</button>
        <div class="qwarn" id="qWarn" role="alert"></div>
      </form>

    </div>
    <div class="howto">1–4 answer · Enter / ↓ next · ↑ previous · Ctrl+Q memo · click a table to enlarge</div>
  </div></header>

  <nav class="pg"><div class="toc inpage" id="toc" aria-label="Chapters"></div></nav>
  <div class="pg"><div class="exam-result inpage" id="examResult"></div></div>

  <div class="scorebar" id="scorebar"><div class="in">
    <div class="tally">Answered <b id="answeredCount">0</b>/<span id="totalCount">0</span> · Correct <b id="correctCount">0</b> <span id="modeLabel"></span></div>
    <div class="bar-links">
      <button class="link on" id="allViewBtn" type="button">All</button>
      <button class="link" id="reviewBtn" type="button" disabled>Review incorrect (0)</button>
      <button class="link" id="flagBtn" type="button" disabled>Marked (0)</button>
      <button class="link" id="copyMissedBtn" type="button" disabled>Copy incorrect #</button>
      <button class="link" id="saveBtn" type="button">Save</button>
      <button class="link" id="resetBtn" type="button">Restart</button>
    </div>
  </div></div>

  <div class="pg"><div class="banner inpage" id="reviewBanner"><span id="reviewBannerText"></span><span id="reviewBannerActions"></span></div></div>
  <main class="pg" id="quiz"></main>
  <div class="pg"><div class="exam-bar inpage" id="examBar"><span id="examInfo"></span><button class="link" id="gradeBtn" type="button">Grade exam →</button></div></div>
  <footer class="pg"><div class="inpage" id="quizFooter"></div></footer>
</div>

<button class="memo-tab" id="memoTab" type="button">Memo</button>
<aside class="memo" id="memo" aria-label="Memo">
  <div class="memo-head"><span>Memo</span><span><button class="link" id="memoBold" type="button" style="font-weight:700">B</button><button class="link" id="memoClose" type="button">Close</button></span></div>
  <div class="memo-text" id="memoText" contenteditable="true" spellcheck="false" data-placeholder="Notes…  Ctrl+B bold"></div>
</aside>

<div id="printSheet"></div>
<div class="lightbox" id="lightbox"><div class="lb-body" id="lbBody"></div></div>
<button class="to-top" id="toTopBtn" type="button">↑ Top</button>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const mathFm = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);
const fm = t => String(t).split(/`([^`]+)`/).map((p, i) => i % 2 ? `<code class="ic">${esc(p)}</code>` : mathFm(p)).join('');

/* explanation -> one line per item; a short leading label in semibold */
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}

function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = rows.shift().split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], chapters = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L.length === 1 && L[0].startsWith('# ')){ chapters.push({ title: L[0].slice(2).trim(), idx: [] }); return; }
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      const tbls = L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5)));
      if(!tbls.length) errs.push(`exhibit ${id}: needs at least one @tbl line`);
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls };
      return;
    }
    if(!chapters.length) chapters.push({ title: meta.title || 'Quiz', idx: [] });
    const ch = chapters.length - 1;
    chapters[ch].seen = (chapters[ch].seen || 0) + 1;
    const who = `${chapters[ch].title} · Q${chapters[ch].seen}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, options, explanation) - check for a missing ===`); return; }
    if(L[0] === '-' && !prevTag) errs.push(`${who}: tag "-" has no previous tag`);
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    let correct = 0;
    const raw3 = L[2].split('|');
    const options = raw3.map((o, i) => { o = o.trim(); if(o.startsWith('*')){ correct = i; return o.slice(1).trim(); } return o; });
    const stars = raw3.filter(o => o.trim().startsWith('*')).length;
    if(stars !== 1) errs.push(`${who}: exactly one option must start with * (found ${stars})`);
    if(options.length < 2 || options.length > 4) errs.push(`${who}: ${options.length} options (use 2-4)`);
    if(options.some(o => !o)) errs.push(`${who}: empty option`);
    let use = null, fig = null;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) use = l.slice(5).trim();
      else if(l.startsWith('@tbl ')) fig = { type: 'tbl', t: parseTbl(l.slice(5)) };
      else if(l.startsWith('@img ')) fig = { type: 'img', src: l.slice(5).trim() };
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…" (use @use, @tbl or @img)`);
    });
    chapters[ch].idx.push(questions.length);
    questions.push({ tag, text: L[1], options, correct, explain: L[3], fig, use, ch, n: chapters[ch].idx.length });
  });
  questions.forEach(q => { if(q.use && !cases[q.use]) errs.push(`question ${q.n}: @use ${q.use} but no "@case ${q.use}" block exists`); });
  chapters.filter(c => !c.idx.length).forEach(c => errs.push(`chapter "${c.title}" has no questions`));
  if(!questions.length) errs.push('no questions found');
  const good = chapters.filter(c => c.idx.length);
  return { meta, questions, cases, chapters: good.length ? good : [{ title: meta.title || 'Quiz', idx: [] }], errs };
}

const PARSED = parseQuizData(document.getElementById('quizData').textContent);
const META = PARSED.meta, QUIZ_TITLE = META.title || 'Quiz', QUESTIONS = PARSED.questions, CHAPTERS = PARSED.chapters, CASES = PARSED.cases;
if(PARSED.errs.length){
  const box = document.createElement('div'); box.className = 'data-errors';
  box.innerHTML = '<b>Quiz data needs fixing</b><ul>' + PARSED.errs.slice(0, 12).map(e => `<li>${esc(e)}</li>`).join('') + '</ul>';
  document.body.insertBefore(box, document.body.firstChild);
}
const $ = id => document.getElementById(id);
$('quizTitle').textContent = QUIZ_TITLE;
$('quizSub').textContent = META.sub || '';
document.title = QUIZ_TITLE + (META.sub ? ' · ' + META.sub.split(' · ')[0] : '');
$('quizFooter').textContent = `${META.subject || ''} — ${META.textbook || ''}`;

let activeCh = 0, viewAll = false, pickNums = null;
const baseIdx = () => viewAll ? QUESTIONS.map((_, i) => i) : CHAPTERS[activeCh].idx;
const scopeIdx = () => pickNums ? baseIdx().filter(i => pickNums.has(QUESTIONS[i].n)) : baseIdx();
const chLabel = ci => { const t = CHAPTERS[ci].title, m = /^\s*(?:chapter|ch\.?|week|lecture)\s*(\d+)/i.exec(t); return m ? 'Ch.' + m[1] : t; };

let current = 0, filterMode = 'all', layoutMode = 'list', reviewList = [], flagList = [];
let answered = new Array(QUESTIONS.length).fill(null);
const missed = new Set(), flagged = new Set();
let examMode = false;
let examPick = new Array(QUESTIONS.length).fill(null), examGraded = new Array(QUESTIONS.length).fill(false), examRes = new Array(QUESTIONS.length).fill(null);
const examActive = qi => examMode && !examGraded[qi];
const shownAns = qi => examActive(qi) ? examPick[qi] : answered[qi];
const setOn = (btn, on) => { btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on)); };
const quizEl = $('quiz'), reviewBtn = $('reviewBtn'), flagBtn = $('flagBtn'), copyMissedBtn = $('copyMissedBtn'), reviewBanner = $('reviewBanner');
const wrongIndices = () => scopeIdx().filter(i => answered[i] !== null && answered[i] !== QUESTIONS[i].correct);
const visibleIndices = () => filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : scopeIdx();

function ranges(nums){
  const a = [...nums].sort((x, y) => x - y), out = [];
  for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; }
  return out.join(', ');
}
function exhibitHTML(id, idx, boxed){
  const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(i => QUESTIONS[i].n);
  const head = `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p>`;
  if(boxed) return `<div class="tables">${c.tbls.map((t, i) => `<div class="exbox">${i ? '' : head}${tblHTML(t)}</div>`).join('')}</div>`;   /* screen: each statement on its own card */
  return head + `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>`;
}
const lightbox = $('lightbox'), lbBody = $('lbBody');
lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ lbBody.innerHTML = html; lightbox.classList.add('show'); }
const figHTML = f => f.type === 'img' ? `<img src="${esc(f.src)}" alt="Figure" style="max-width:100%">` : tblHTML(f.t);

function qaText(qi){
  const q = QUESTIONS[qi], L = i => String.fromCharCode(97 + i);
  const ex = q.use ? `[Exhibit ${q.use}: ${CASES[q.use].title}]\n` + CASES[q.use].tbls.map(tblText).join('\n') + '\n' : '';
  return ex + `Q${q.n}. ${q.text}\n` + (q.fig && q.fig.type === 'tbl' ? tblText(q.fig.t) + '\n' : '') + q.options.map((o, i) => `${L(i)}. ${o}`).join('\n') +
    `\nAnswer: ${L(q.correct)}. ${q.options[q.correct]}\nExplanation:\n${explLines(q.explain).join('\n')}`;
}

/* one question = a block on the page (.qmain, column 2) + a side note in the margin (.qside, column 3) */
function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];
  const main = document.createElement('div');
  main.className = 'qmain inpage' + (first ? ' first' : '');
  main.dataset.index = qi;
  main.addEventListener('click', () => { if(!String(window.getSelection())){ current = qi; markCurrent(); } });
  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<span class="qnum">${q.n}</span>` + (CHAPTERS.length > 1 ? `<span>${esc(chLabel(q.ch))} ·</span>` : '') + `<span class="qtag">${fm(q.tag)}</span>` +
    (q.use ? `<span class="exref">· Exhibit ${esc(q.use)}</span>` : '') + (retry ? '<span class="retry">· retry</span>' : '');
  const tools = document.createElement('span'); tools.className = 'qtools';
  if(!examActive(qi) && answered[qi] !== null){
    const cp = document.createElement('span'); cp.className = 'qcopy'; cp.setAttribute('role', 'button'); cp.textContent = 'copy'; cp.title = 'Copy question, answer and explanation';
    cp.addEventListener('click', e => { e.stopPropagation(); copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed')); });
    tools.appendChild(cp);
  }
  const fl = document.createElement('span');
  fl.className = 'qflag' + (flagged.has(qi) ? ' on' : ''); fl.setAttribute('role', 'button'); fl.textContent = 'review'; fl.title = 'Mark for review';
  fl.addEventListener('click', e => { e.stopPropagation(); const on = !flagged.has(qi); on ? flagged.add(qi) : flagged.delete(qi); fl.classList.toggle('on', on); updateChrome(); });
  tools.appendChild(fl); head.appendChild(tools);
  main.appendChild(head);
  const p = document.createElement('p'); p.className = 'qtext'; p.innerHTML = fm(q.text); main.appendChild(p);
  if(q.fig){
    const f = document.createElement('div'); f.className = 'qfig zoomable'; f.innerHTML = figHTML(q.fig);
    f.addEventListener('click', e => { e.stopPropagation(); openLightbox(figHTML(q.fig)); });
    main.appendChild(f);
  }
  const opts = document.createElement('div'); opts.className = 'options';
  q.options.forEach((o, oi) => {
    const b = document.createElement('div'); b.className = 'opt'; b.setAttribute('role', 'button');
    b.innerHTML = `<span class="optnum">${oi + 1}</span><span>${fm(o)}</span>`;
    if(examActive(qi)){ if(examPick[qi] === oi) b.classList.add('picked'); }
    else if(answered[qi] !== null){ b.classList.add(oi === q.correct ? 'correct' : oi === answered[qi] ? 'incorrect' : 'dim'); }
    b.addEventListener('click', () => { if(String(window.getSelection())) return; selectAnswer(qi, oi); });
    opts.appendChild(b);
  });
  main.appendChild(opts);

  const side = document.createElement('aside');
  side.className = 'qside';
  if(!examActive(qi) && answered[qi] !== null){
    const ok = answered[qi] === q.correct;
    side.innerHTML = `<div class="sn-head"><span class="${ok ? 'ok' : 'no'}">${ok ? 'Correct' : answered[qi] === -1 ? 'Not answered' : 'Incorrect'}</span> · answer ${q.correct + 1}</div>${fmtExpl(q.explain)}`;
  }
  return [main, side];
}

function caseSection(id, qis, idxForNums, retry){
  const sec = document.createElement('section'); sec.className = 'case pg';
  const ex = document.createElement('div'); ex.className = 'case-ex'; ex.innerHTML = exhibitHTML(id, idxForNums, true);
  ex.style.setProperty('--n', String(qis.length + 1));
  ex.querySelectorAll('table').forEach(t => { t.classList.add('zoomable'); t.addEventListener('click', () => openLightbox(t.outerHTML)); });
  sec.appendChild(ex);
  qis.forEach(qi => questionNodes(qi, false, retry).forEach(n => sec.appendChild(n)));
  return sec;
}

function fitExhibits(){   /* an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    const ex = sec.querySelector('.case-ex');
    if(!ex) return;
    const cs = getComputedStyle(ex); if(cs.position !== 'sticky') return;
    const inner = ex.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const tooWide = [...ex.querySelectorAll('table')].some(t => { const p = t.parentElement, ps = getComputedStyle(p); return t.scrollWidth > p.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight) + 1; });
    if(tooWide || ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);
function alignNotes(){   /* a side note starts level with option 1 of its question */
  quizEl.querySelectorAll('.qside').forEach(side => {
    side.style.paddingTop = '';
    const main = side.previousElementSibling, opt = main && main.classList.contains('qmain') && main.querySelector('.opt');
    if(!opt || side.getBoundingClientRect().left < main.getBoundingClientRect().right) return;   /* note sits below the question on narrow screens */
    const lh = el => parseFloat(getComputedStyle(el).lineHeight) || 0;
    const top = opt.getBoundingClientRect().top - main.getBoundingClientRect().top + parseFloat(getComputedStyle(opt).paddingTop) + (lh(opt) - lh(side)) / 2;
    side.style.paddingTop = Math.max(0, Math.round(top)) + 'px';
  });
}
window.addEventListener('resize', alignNotes);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => alignNotes());

const nextChapterIdx = () => (!viewAll && !pickNums && filterMode === 'all' && CHAPTERS.length > 1 && activeCh < CHAPTERS.length - 1) ? activeCh + 1 : -1;
function render(){
  ignoreScrollUntil = performance.now() + 400;
  const y0 = window.scrollY;
  quizEl.innerHTML = '';
  const vis = visibleIndices(), retry = filterMode === 'review';
  if(!vis.length){
    quizEl.innerHTML = `<div class="empty-state inpage">${filterMode === 'flagged' ? 'No questions marked for review.' : 'Nothing to review.'}</div>`;
    updateChrome(); return;
  }
  if(layoutMode === 'single'){
    const pos = Math.max(0, vis.indexOf(current)), qi = vis[pos];
    current = qi;
    const pr = document.createElement('div'); pr.className = 'single-progress inpage'; pr.textContent = `${pos + 1} / ${vis.length}`; quizEl.appendChild(pr);
    const q = QUESTIONS[qi];
    if(q.use){ const sec = caseSection(q.use, [qi], vis, retry); sec.querySelector('.qmain').classList.add('first'); quizEl.appendChild(sec); }
    else questionNodes(qi, true, retry).forEach(n => quizEl.appendChild(n));
    const nav = document.createElement('div'); nav.className = 'single-nav inpage';
    const prev = document.createElement('button'); prev.className = 'link'; prev.textContent = '← Previous'; prev.disabled = pos === 0; prev.addEventListener('click', goPrev);
    const nc = nextChapterIdx(), last = pos === vis.length - 1;
    const next = document.createElement('button'); next.className = 'link'; next.style.color = 'var(--ink)'; next.textContent = last && nc > -1 ? `Next chapter: ${chLabel(nc)} →` : 'Next →'; next.disabled = last && nc < 0;
    next.addEventListener('click', () => { if(last && nc > -1) switchChapter(nc); else goNext(); });
    nav.appendChild(prev); nav.appendChild(next); quizEl.appendChild(nav);
  } else {
    let prevCh = -1, first = true;
    for(let k = 0; k < vis.length; ){
      const qi = vis[k], q = QUESTIONS[qi];
      if(viewAll && CHAPTERS.length > 1 && q.ch !== prevCh){ const h = document.createElement('div'); h.className = 'ch-head inpage'; h.textContent = CHAPTERS[q.ch].title; quizEl.appendChild(h); prevCh = q.ch; first = true; }
      if(q.use){
        const group = [];
        while(k < vis.length && QUESTIONS[vis[k]].use === q.use && QUESTIONS[vis[k]].ch === q.ch){ group.push(vis[k]); k++; }
        const sec = caseSection(q.use, group, vis, retry);
        if(first) sec.querySelector('.qmain').classList.add('first');
        quizEl.appendChild(sec);
      } else { questionNodes(qi, first, retry).forEach(n => quizEl.appendChild(n)); k++; }
      first = false;
    }
    const nc = nextChapterIdx();
    if(nc > -1){ const w = document.createElement('div'); w.className = 'next-ch inpage'; const b = document.createElement('button'); b.className = 'link'; b.textContent = `Next chapter: ${chLabel(nc)} →`; b.addEventListener('click', () => switchChapter(nc)); w.appendChild(b); quizEl.appendChild(w); }
    window.scrollTo(0, y0);
  }
  fitExhibits();
  updateChrome();
  markCurrent();
  alignNotes();
}

function selectAnswer(qi, oi){
  if(examActive(qi)){ if(examPick[qi] === oi) return; examPick[qi] = oi; current = qi; render(); return; }
  if(answered[qi] === oi) return;
  answered[qi] = oi;
  if(oi !== QUESTIONS[qi].correct) missed.add(qi);
  current = qi; render(); scrollToActive();
}
function markCurrent(){ quizEl.querySelectorAll('.qmain').forEach(m => m.classList.toggle('cur', +m.dataset.index === current)); }
function setActive(qi){ const v = visibleIndices(); if(!v.length) return; if(!v.includes(qi)) qi = v[0]; current = qi; render(); scrollToActive(); }
function smoothTop(){ ignoreScrollUntil = performance.now() + 1500; window.scrollTo({ top: 0, behavior: 'smooth' }); }
function scrollToActive(){
  if(layoutMode === 'single') return;
  const el = quizEl.querySelector(`.qmain[data-index="${current}"]`);
  ignoreScrollUntil = performance.now() + 1200;
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function goNext(){ const v = visibleIndices(), p = v.indexOf(current); if(p === -1){ if(v.length) setActive(v[0]); return; } if(p < v.length - 1) setActive(v[p + 1]); }
function goPrev(){ const v = visibleIndices(), p = v.indexOf(current); if(p > 0) setActive(v[p - 1]); }
function enterReviewMode(){ const wl = wrongIndices(); if(!wl.length) return; reviewList = wl; wl.forEach(i => answered[i] = null); filterMode = 'review'; current = wl[0]; render(); scrollToActive(); }
function exitReviewMode(){ filterMode = 'all'; render(); smoothTop(); }

function updateChrome(){
  const ids = scopeIdx(), ex = examMode && ids.some(i => !examGraded[i]);
  const ansN = ids.filter(i => shownAns(i) !== null && shownAns(i) !== -1).length;
  $('totalCount').textContent = ids.length;
  $('answeredCount').textContent = ansN;
  $('correctCount').textContent = ex ? '–' : ids.filter(i => answered[i] === QUESTIONS[i].correct).length;
  const res = examMode && ids.length && ids.every(i => examGraded[i]) ? { c: ids.filter(i => examRes[i] === 'c').length, u: ids.filter(i => examRes[i] === 'u').length, n: ids.length } : null;
  const er = $('examResult'); er.classList.toggle('show', !!res);
  if(res){
    er.innerHTML = `<div class="er-detail">Exam score</div><div class="er-score">${res.c}<small> / ${res.n} · ${Math.round(res.c / res.n * 100)}%</small></div><div class="er-detail">${res.n - res.c - res.u} incorrect · ${res.u} unanswered (counted as incorrect)</div><button class="link" id="retakeBtn" type="button" style="margin-top:8px">Retake exam</button>`;
    $('retakeBtn').addEventListener('click', () => { resetScope(); smoothTop(); });
  }
  $('examBar').classList.toggle('show', ex);
  if(ex){ const left = ids.length - ansN; $('examInfo').textContent = `${ansN} of ${ids.length} answered` + (left ? ` · ${left} unanswered will count as incorrect` : ''); }
  const wl = wrongIndices();
  reviewBtn.disabled = ex || !wl.length || filterMode === 'review';
  reviewBtn.textContent = filterMode === 'review' ? 'Reviewing…' : `Review incorrect (${wl.length})`;
  setOn(reviewBtn, filterMode === 'review');
  copyMissedBtn.disabled = ex || !ids.some(i => missed.has(i));
  setOn($('allViewBtn'), filterMode === 'all');
  const fc = ids.filter(i => flagged.has(i)).length;
  flagBtn.textContent = `Marked (${fc})`; flagBtn.disabled = !fc && filterMode !== 'flagged'; setOn(flagBtn, filterMode === 'flagged');
  $('modeLabel').textContent = ex ? '· exam in progress' : '';
  const still = filterMode === 'review' ? reviewList.filter(i => answered[i] !== null && answered[i] !== QUESTIONS[i].correct) : [];
  const done = filterMode === 'review' && reviewList.length && reviewList.every(i => answered[i] !== null);
  reviewBanner.classList.toggle('show', !!done);
  if(done){
    $('reviewBannerText').textContent = still.length ? `Review complete — ${still.length} of ${reviewList.length} still incorrect.` : `Review complete — all ${reviewList.length} correct.`;
    const a = $('reviewBannerActions'); a.innerHTML = '';
    if(still.length){ const r = document.createElement('button'); r.className = 'link'; r.textContent = 'Retry remaining'; r.addEventListener('click', () => { reviewList = still; still.forEach(i => answered[i] = null); current = still[0]; render(); scrollToActive(); }); a.appendChild(r); }
    const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Back to all'; b.addEventListener('click', exitReviewMode); a.appendChild(b);
  }
  document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px');
}

document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('textarea, input, [contenteditable]')) return;
  if(lightbox.classList.contains('show')){ if(['Escape', 'Enter', ' '].includes(e.key)){ e.preventDefault(); lightbox.classList.remove('show'); } return; }
  if(!visibleIndices().length) return;
  if(e.key >= '1' && e.key <= '4'){ const oi = +e.key - 1; if(QUESTIONS[current] && oi < QUESTIONS[current].options.length){ e.preventDefault(); selectAnswer(current, oi); } }
  else if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){ if(e.target.closest && e.target.closest('button')) return; if(e.altKey || e.ctrlKey || e.metaKey) return; e.preventDefault(); goNext(); }
  else if(e.key === 'ArrowUp'){ if(e.altKey || e.ctrlKey || e.metaKey) return; e.preventDefault(); goPrev(); }
});

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
function parseNums(txt){
  const t = txt.replace(/[，、;；]/g, ',').replace(/[–—~～]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t) return { empty: true };
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){
    let m;
    if(/^\d+$/.test(tok)) out.add(+tok);
    else if((m = tok.match(/^(\d+)-(\d+)$/)) && +m[1] <= +m[2]){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); }
    else return { err: `Not recognised: "${tok}"` };
  }
  return { set: out };
}
function clearPick(silent){ pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); if(!silent){ filterMode = 'all'; current = scopeIdx()[0]; render(); smoothTop(); } }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const r = parseNums(qSearch.value);
  if(r.empty){ clearPick(false); return; }
  if(r.err){ qBad(r.err); return; }
  const have = new Set(baseIdx().map(i => QUESTIONS[i].n)), miss = [...r.set].filter(n => !have.has(n));
  if(miss.length){ qBad(`No question ${miss.slice(0, 6).join(', ')} (1–${Math.max(...have)})`); return; }
  qBad(''); pickNums = r.set; qForm.classList.add('active'); qSearch.value = [...r.set].sort((a, b) => a - b).join(', ');
  filterMode = 'all'; reviewList = []; current = scopeIdx()[0]; render(); smoothTop();
});
qSearch.addEventListener('input', () => qBad(''));
$('qClear').addEventListener('click', () => clearPick(false));

const allChBtn = $('allChBtn'), tocEl = $('toc');

function setViewAll(on){ viewAll = on; clearPick(true); setOn(allChBtn, on); filterMode = 'all'; reviewList = []; if(!scopeIdx().includes(current)) current = scopeIdx()[0]; renderToc(); }

function renderToc(){
  tocEl.classList.toggle('on', CHAPTERS.length > 1);

  tocEl.innerHTML = '';
  CHAPTERS.forEach((c, ci) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'link' + (ci === activeCh && !viewAll ? ' on' : ''); b.textContent = chLabel(ci); b.title = c.title; b.addEventListener('click', () => switchChapter(ci)); tocEl.appendChild(b); });
}
function switchChapter(ci){ if(ci === activeCh && !viewAll) return; clearPick(true); if(viewAll) setViewAll(false); activeCh = ci; filterMode = 'all'; reviewList = []; current = CHAPTERS[ci].idx[0]; renderToc(); render(); smoothTop(); }

$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function sheetHtml(title, idx){
  const L = i => String.fromCharCode(97 + i);
  let html = `<h1>${esc(title)}</h1>${META.sub ? `<p class="p-sub">${esc(META.sub)}</p>` : ''}`, lastCase = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== lastCase) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    lastCase = q.use;
    html += `<div class="p-q"><p>${q.n}. ${q.use ? `<span class="p-ref">[Exhibit ${esc(q.use)}]</span> ` : ''}${fm(q.text)}</p>` + (q.fig ? `<div class="p-fig">${figHTML(q.fig)}</div>` : '') +
      q.options.map((o, oi) => `<p class="p-opt">${L(oi)}. ${fm(o)}</p>`).join('') + '</div>';
  });
  html += `<div class="p-key"><h1>${esc(title)} — Answers</h1><div class="p-grid">` + idx.map(qi => `<div>${QUESTIONS[qi].n}. ${L(QUESTIONS[qi].correct)}</div>`).join('') +
    '</div><div class="p-sol">' + idx.map(qi => `<div class="p-s"><p><b>${QUESTIONS[qi].n}. ${L(QUESTIONS[qi].correct)}</b>${QUESTIONS[qi].use ? ` [Exhibit ${esc(QUESTIONS[qi].use)}]` : ''}</p>${fmtExpl(QUESTIONS[qi].explain)}</div>`).join('') + '</div></div>';
  return html;
}
function buildPrintSheet(sel){

  $('printSheet').innerHTML = viewAll && CHAPTERS.length > 1
    ? CHAPTERS.map((c, ci) => ({ c, ix: sel.filter(i => QUESTIONS[i].ch === ci) })).filter(o => o.ix.length).map(o => `<section>${sheetHtml(o.c.title, o.ix)}</section>`).join('')
    : sheetHtml(CHAPTERS.length > 1 ? CHAPTERS[activeCh].title : QUIZ_TITLE, sel);
}

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
copyMissedBtn.addEventListener('click', () => {

  copyText(`${QUIZ_TITLE} incorrect: ${nums.sort((a, b) => a - b).join(', ')}`).then(() => showTip(copyMissedBtn, 'Copied'), () => showTip(copyMissedBtn, 'Copy failed'));
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}

const toTopBtn = $('toTopBtn');
let lastY = window.scrollY, upAcc = 0, topTimer = null, lastUser = 0, ignoreScrollUntil = 0;
['wheel', 'touchmove'].forEach(ev => window.addEventListener(ev, () => lastUser = performance.now(), { passive: true }));
window.addEventListener('scroll', () => {

const saveBtn = $('saveBtn');
const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'caseQuizProgress:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.options.join('|') + '|' + q.correct).join('\n'));
saveBtn.addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, t: Date.now(), answered, missed: [...missed], flagged: [...flagged], activeCh, current, examMode, examPick, examGraded, examRes, memo: memoHtml() })); showTip(saveBtn, 'Saved'); }
  catch(e){ showTip(saveBtn, 'Save failed'); }
});
function loadProgress(){
  let d; try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ return false; }
  if(!d) return false;
  if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = memoHtml(); }
  if(d.sig !== SAVE_SIG || !Array.isArray(d.answered) || d.answered.length !== QUESTIONS.length) return 'mismatch';
  answered = d.answered; (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
  if(Array.isArray(d.examPick) && d.examPick.length === QUESTIONS.length){ examPick = d.examPick; examGraded = d.examGraded || examGraded; examRes = d.examRes || examRes; }
  examMode = !!d.examMode; setOn(examModeBtn, examMode);
  activeCh = CHAPTERS[d.activeCh] ? d.activeCh : 0;
  current = QUESTIONS[d.current] ? d.current : 0;
  return true;
}
let restored = false; try{ restored = loadProgress(); }catch(e){}

if(CHAPTERS.length > 1 && /midterm|final/i.test(QUIZ_TITLE)) setViewAll(true);
if(!scopeIdx().includes(current)) current = scopeIdx()[0];
renderToc();
render();
if(restored === true) showTip(saveBtn, 'Progress restored');
else if(restored === 'mismatch') showTip(saveBtn, 'Saved data is from another version');
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
