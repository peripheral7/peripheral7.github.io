@case A
Lab2.R — descriptive statistics (W2)
@code practice <- read.csv("Lab2_Practice.csv", header=TRUE, na.strings=".");;competence <- practice$COMPETENCE;;breaks <- practice$BREAKS;;grade <- practice$GRADE;;hist(competence, breaks=15);;summary(breaks);;sum((competence-mean(competence))^2)/(length(competence)-1);;var(competence);;quantile(breaks);;IQR(breaks);;boxplot(grade);;abline(h=median(grade), col="red");;par(mfrow = c(1, 2));;boxplot(grade);;vioplot(grade)
===
W2 · read.csv() and its arguments
Line 1. What does read.csv() return, and what do the arguments header = TRUE and na.strings = "." do?
data frame / dataframe / 데이터프레임|first row / column names / 첫 행|NA / missing / 결측
read.csv(): reads a comma-separated file and returns a **data frame**; header: TRUE means the **first row** holds the column names, not data; na.strings: every "." in the file is read as **NA** (missing), so it does not enter calculations as a value
@use A
===
W2 · The breaks argument of hist()
Line 5. Is breaks in hist(competence, breaks=15) the variable breaks created on line 3? What does it do?
argument / 인자|number of bins / bins / bars / cells / 구간|suggestion / approximately / about / pretty / 대략
No: breaks= here is an **argument** of hist(), matched by its name, not the variable breaks; It sets the **number of bins** (bars) of the histogram, here about 15; A single number is only a **suggestion**: R chooses nearby "pretty" break points, so the exact count can differ
@use A
===
W2 · Reading summary()
Line 6. summary(breaks) returns Min. 0, 1st Qu. 1, Median 2, Mean 3.185, 3rd Qu. 4.5 and Max. 12. What does summary() report, and what does Mean > Median tell you?
quartile / quartiles / minimum / maximum / 사분위|right / positively / positive skew / 오른쪽 / 양의 왜도|large values / outliers / pulled / 큰 값 / 이상치
summary(): for a numeric vector reports the minimum, the first **quartile**, the median, the mean, the third quartile and the maximum; Here the mean (3.185) is above the median (2): a few **large values**, up to 12, pull the mean up; The distribution is **positively (right) skewed**
@use A
===
W2 · Sample variance written out
Lines 7–8 (competence has 27 values; the sum of squared deviations is about 124.07). What does line 7 compute step by step, and why does line 8 give the same number?
sample variance / variance / 분산|n - 1 / 26 / 자유도|4.77|var
(competence - mean(competence))\^2 squares each deviation from the mean, and sum() adds them (about 124.07); length(): gives n = 27, and dividing by **n - 1** = 26 gives about **4.77**; var(): computes the same **sample variance**, with the same n - 1 denominator, so line 8 returns the same value
@use A
===
W2 · quantile() and IQR()
Lines 9–10. quantile(breaks) returns 0, 1, 2, 4.5 and 12. What do these numbers represent, and what does IQR(breaks) return?
quartile / quartiles / percentile / 사분위|minimum / maximum / median / 최소 / 최대 / 중앙값|3.5 / 4.5 - 1 / third quartile minus
quantile(): by default returns the 0%, 25%, 50%, 75% and 100% points: the **minimum**, the first **quartile**, the median, the third quartile and the maximum; IQR(): the **third quartile minus** the first, 4.5 - 1 = **3.5**, the spread of the middle 50% of the students; Unlike the standard deviation, it is not pulled by the large values in the right tail
@use A
===
W2 · boxplot() and abline(h = )
Lines 11–12. What does boxplot(grade) draw, and why does the red line from abline(h = median(grade)) fall exactly on the bold line in the box?
box / hinges / 상자|whiskers / outliers / 1.5 / 수염 / 이상치|median / 중앙값|horizontal / 수평
boxplot(): draws a **box** from the lower to the upper hinge (about Q1 to Q3) with a bold line at the median; The **whiskers** reach the most extreme points within 1.5 times the IQR, and points beyond them are drawn as outliers; abline(): with h set to a value draws a **horizontal** line there; The bold line is the **median**, so the red line at median(grade) falls on it
@use A
===
W2 · par(mfrow = ) and vioplot()
Lines 13–15. What does par(mfrow = c(1, 2)) do, and what appears on screen after lines 14 and 15? (vioplot() comes from the vioplot package.)
1 row and 2 columns / one row / two columns / 1행 / 2열|side by side / next to each other / 나란히|density / violin / 밀도|until / reset / stays / 유지
par(): sets graphics parameters, and mfrow = c(1, 2) splits the window into **1 row and 2 columns**; So the boxplot (line 14) and the violin plot (line 15) of grade appear **side by side**; vioplot(): draws a smoothed **density** mirrored on both sides, with a small box plot inside; The layout stays in effect **until** it is reset, for example with par(mfrow = c(1, 1))
@use A

Lab4.R — functions and strings (W2)
@code library(readxl);;library(stringr);;to12 <- function(str){;;  hour=as.integer(str);;  if (hour>12) {;;    return(paste(hour-12, "PM"));;  } else {;;    return(paste(hour, "AM"));;  };;};;hasMultipleLoc <- function(str){;;  str_detect(str, fixed(","));;};;data=read_excel("Café.xlsx");;data <- as.data.frame(data);;colnames(data)=c("type","location","openingHour","closingHour");;(openingHour <- sapply(data$openingHour, to12));;data$openingHour=openingHour;;(locationText <- ifelse(sapply(data$location, hasMultipleLoc), "Yes", "No"));;data$hasMultipleLoc=locationText
===
W2 · What to12() does
Lines 3–10. What does to12() do, what are the roles of as.integer() and paste(), and what does to12("22") return?
24-hour / 24 hour / 12-hour / 12 hour / convert / 변환|number / integer / 숫자 / 정수|joins / paste / space / 붙|10 PM
to12(): converts an hour on the **24-hour** clock, given as text, into a 12-hour label; as.integer(): turns the text into a **number**, so it can be compared with 12 and reduced by 12; paste(): **joins** its arguments with a space; to12("22"): 22 > 12, so it returns paste(10, "PM"), that is **"10 PM"**
@use B
===
W2 · Testing to12() at the edges
Lines 3–10. What do to12("1") and to12("12") return, and which of the two shows a flaw in the function?
1 AM|12 AM|noon / 12 PM / 정오|> 12 / greater than / 조건
to12("1"): 1 is not greater than 12, so it returns **"1 AM"**, which is correct; to12("12"): 12 is not **greater than** 12 either, so it returns **"12 AM"**; That is the flaw: 12 o'clock in 24-hour time is **noon**, 12 PM; The condition hour > 12 treats 12 as morning, so 12 needs its own case (and 0, midnight, would give "0 AM")
@use B
===
W2 · str\_detect() and fixed()
Lines 11–13. What does hasMultipleLoc() return for "Seoul, Suwon" and for "Seoul", and what does fixed() do?
TRUE / FALSE / logical / 논리|contains / detects / pattern / 포함 / 패턴|literal / exact / not a regular expression / 문자 그대로
str\_detect(): returns **TRUE** or FALSE depending on whether the string **contains** the pattern; So hasMultipleLoc("Seoul, Suwon") is TRUE and hasMultipleLoc("Seoul") is FALSE; fixed(): makes "," a **literal** string matched character by character, not a regular expression
@use B
===
W2 · A function without return()
Lines 11–13. hasMultipleLoc() has no return() statement. What does it return, and why?
last / last expression / last value / 마지막|automatically / implicitly / 자동|TRUE / FALSE / str\_detect
An R function returns the value of the **last** expression it evaluates, even without return(); The last (and only) expression is str\_detect(...), so its TRUE or FALSE is returned **automatically**; return() is needed mainly to leave a function early, as in the two branches of to12()
@use B
===
W2 · read\_excel(), as.data.frame() and colnames()
Lines 14–16. What does each of the three lines do?
Excel / xlsx / 엑셀|tibble / data frame / 데이터프레임|rename / renames / column names / 이름
read\_excel(): from readxl (line 1), reads the **Excel** file Café.xlsx into a **tibble**; as.data.frame(): converts the tibble into an ordinary base R data frame; colnames(data) = c(...) **renames** the four columns to type, location, openingHour and closingHour
@use B
===
W2 · Why sapply()
Line 17. What does sapply() do here, and why not simply call to12(data$openingHour)?
each element / every element / element by element / 각 요소|vector / simplifies / 벡터|if / single / one value / 하나
sapply(): calls to12() on **each element** of the column and simplifies the results into a character **vector**; to12() uses **if**, which needs a single TRUE or FALSE; Given the whole column at once, the condition has many values and if() stops with an error (in current versions of R)
@use B
===
W2 · ifelse() and the new columns
Lines 18–20. What does ifelse() do on line 19, and what do lines 18 and 20 change in data?
condition / test / 조건|each element / element by element / vectorized / 각 요소|Yes / No|overwrites / replaces / new column / 덮어 / 새 열
ifelse(): checks a **condition** for **each element** and returns "Yes" where it is TRUE and "No" where it is FALSE; Line 18 **overwrites** the openingHour column with the 12-hour labels made on line 17; Line 20 adds a **new column**, hasMultipleLoc, with the Yes or No for each café

@case C
regression.R (condensed) — OLS, inference and prediction (W5)
@code social <- read.csv("social.csv", header=T);;perform=social$cryp_scoreFINAL;;eye=social$RMET_mean;;skill=social$Smean_mean;;ravens=social$ravens_mean;;plot(perform ~ eye);;eye_regr=lm(perform ~ eye);;abline(eye_regr, col="blue");;abline(h=mean(perform), col="red");;abline(v=mean(eye), col="green");;skill_regr=lm(perform ~ skill);;skill_summary=summary(skill_regr);;confint(skill_regr, level=0.99);;(skill_coef=cor(perform,skill)^2);;round(skill_summary$r.squared-skill_coef,16);;mult_lm=lm(perform ~ skill + ravens);;(mult_summary=summary(mult_lm));;predict(mult_lm, data.frame(skill=c(0.5,1.5), ravens=c(1.5,0.5)), interval="confidence", level=0.95);;points <- seq(min(eye)-3, max(eye)+3, length.out=10000);;pred <- predict(eye_regr, data.frame(eye=points), interval="confidence", level=0.95);;polygon(c(rev(points), points), c(rev(pred[ ,3]), pred[ ,2]), col=rgb(0,0,0,0.1), border=NA)
===
W5 · plot(), lm() and abline(model)
Lines 6–8. Why is perform written first in perform ~ eye, what does lm() return, and what does abline() draw when it is given that result?
dependent / outcome / y-axis / 종속|linear model / OLS / least squares / 선형|regression line / fitted line / intercept and slope / 회귀선
perform ~ eye: the variable left of ~ is the **dependent** (outcome) variable, so plot() puts perform on the y-axis and eye on the x-axis; lm(): fits a **linear model** by OLS and returns a model object holding the intercept and the slope; abline(): given that object, draws the fitted **regression line** in blue
@use C
===
W5 · Lines at the means
Lines 9–10. What do abline(h = ...) and abline(v = ...) add, and what do they show about the blue OLS line?
horizontal / 수평|vertical / 수직|mean of perform / mean of eye / 평균|passes through / point of means / 지나
abline(): with h draws a **horizontal** line at the **mean of perform**, and with v a **vertical** line at the mean of eye; The two lines cross at the point of means; The OLS line always **passes through** that point, because the OLS intercept equals mean(perform) - slope × mean(eye)
@use C
===
W5 · summary() and confint(level = 0.99)
Lines 12–13. What does summary() report for an lm model, and what does confint(skill\_regr, level = 0.99) return compared with the default?
coefficient table / Estimate / Std. Error / 계수|R-squared / F-statistic / 결정계수|confidence interval / 신뢰구간|wider / 99% / 넓
summary(): reports the **coefficient table** (Estimate, Std. Error, t value and p-value of each term), the residual standard error, the **R-squared** and adjusted R-squared, and the F-statistic; confint(): returns a **confidence interval** for each coefficient, by default at the 95% level; level: 0.99 gives 99% intervals (columns 0.5 % and 99.5 %), which are **wider**
@use C
===
W5 · cor() squared and round(..., 16)
Lines 14–15. The R-squared of perform ~ skill is about 0.0459. What does line 14 compute, how is it related to that R-squared, and what is round(..., 16) for?
correlation / Pearson / 상관|equals / same / 같|floating / rounding / tiny / 반올림 / 오차
cor(): computes the Pearson **correlation** of perform and skill, and \^2 squares it; In a simple regression the squared correlation **equals** the R-squared, so line 14 also gives about 0.0459; round(): rounds the difference to 16 decimals so that tiny **floating**-point differences between the two calculations are not read as a real gap
@use C
===
W5 · The multiple regression and its F-test
Lines 16–17. The summary reports coefficients 0.1712 (skill) and 0.1746 (ravens), R-squared 0.0745 and F(2, 82) = 3.3 with p = 0.04184. What does the F-test test, where do 2 and 82 come from, and what is the conclusion at 5%?
both / jointly / all slopes / 모두 / 동시에|restrictions / predictors / 제약|n - k - 1 / 85 - 2 - 1 / residual degrees of freedom / 잔차 자유도|reject / 기각
F-test: H_0 says the skill and ravens slopes are **both** 0, H_1 that at least one is not 0; 2: the number of **restrictions**, one per predictor tested; 82: the residual degrees of freedom, **n - k - 1** = 85 - 2 - 1; Since p = 0.04184 < 0.05 we **reject** H_0: the model explains perform better than a model with no predictors
@use C
===
W5 · predict() with interval = "confidence"
Line 18. What does predict() do with the data frame, and what does the result look like with interval = "confidence"?
predicted / prediction / fit / 예측|new data / data frame / 새 데이터|lwr / upr / lower / upper / 하한 / 상한|0.3475
predict(): plugs the **new data**, two cases with the same variable names as the model, into the fitted equation and returns the **predicted** values (about 0.3475 and 0.3441); interval: "confidence" adds the **lower and upper** bounds, so the result is a matrix with the columns fit, lwr and upr, one row per case; The interval is for the average perform at those predictor values, not for one new group
@use C
===
W5 · Drawing the confidence band
Lines 19–21. What do seq(), predict() and polygon() do together?
evenly spaced / equally spaced / grid / 등간격|lower and upper / bounds / 하한 / 상한|fills / shaded / band / 음영 / 채우
seq(): creates 10,000 **evenly spaced** values of eye from min(eye) - 3 to max(eye) + 3; predict(): gives the fitted value and the 95% **lower and upper** bounds at each of those points (columns 2 and 3 of pred); polygon(): joins the upper bounds (reversed) and the lower bounds into one closed shape and **fills** it in transparent grey, the **shaded** confidence band around the line
@use C

@case D
simple regression demonstration.R (condensed) — simulation of tests and intervals (W5)
@code set.seed(4201);;slope=0.2; intercept=3; sampleSize=10; sampleCnt=10000;;estimator=c(); t=c(); pValue=c();;for(rowIdx in 1:sampleCnt) {;;  fertilizer=rnorm(sampleSize,10,2);;  yield=intercept+slope*fertilizer+rnorm(sampleSize,0,1);;  coef=summary(lm(yield~fertilizer))$coefficients;;  estimator[rowIdx]=coef[2,1];;  t[rowIdx]=coef[2,3];;  pValue[rowIdx]=coef[2,4];;};;hist(estimator);;alpha=0.05;;rejection=ifelse(pValue<=alpha, "Reject", "Fail to Reject");;(result=table(rejection));;barplot(result, main="Null Hypothesis Rejection");;sampleSize=12; slope=2; sampleCnt=20;;results=data.frame(index=1:sampleCnt);;for(rowIdx in 1:sampleCnt) {;;  fertilizer=rnorm(sampleSize,10,2);;  yield=intercept+slope*fertilizer+rnorm(sampleSize,0,1);;  fer_regr=lm(yield ~ fertilizer);;  results[rowIdx,"slope"]=fer_regr$coefficients[2];;  interval=confint(fer_regr);;  lowerBound=interval["fertilizer","2.5 %"];;  upperBound=interval["fertilizer","97.5 %"];;  results[rowIdx,"inside"]=lowerBound<=slope && slope<=upperBound;;}
===
W5 · set.seed() and rnorm()
Lines 1–6. What do set.seed() and the two rnorm() calls do, and what is the true model that generates yield?
reproducible / same random numbers / 재현|normal / 정규|3 + 0.2 / true model / slope 0.2 / 참
set.seed(): fixes the start of the random number generator, so every run gives the same, **reproducible** draws; rnorm(sampleSize, 10, 2) draws 10 fertilizer values from a **normal** distribution with mean 10 and standard deviation 2; rnorm(sampleSize, 0, 1) draws the error term u with mean 0 and standard deviation 1; So the true model is yield = **3 + 0.2** × fertilizer + u
@use D
===
W5 · The coefficient matrix
Lines 7–10. What is coef, and what do coef[2,1], coef[2,3] and coef[2,4] contain?
matrix / table / 행렬|estimate / slope / 기울기 / 추정|t value / t-statistic / t값|p-value / p값
summary(...)$coefficients: is the coefficient **matrix**, one row per term ((Intercept) and fertilizer) with the columns Estimate, Std. Error, t value and p-value; coef[2,1] is the slope **estimate** of fertilizer, coef[2,3] its **t value** and coef[2,4] its **p-value** for the test of slope = 0; Each is stored at position rowIdx, so after the loop each vector holds 10,000 values
@use D
===
W5 · hist(estimator)
Line 12. What does the histogram of estimator show, and where should it be centred?
sampling distribution / 표본분포|0.2 / true slope / 참 기울기|unbiased / unbiasedness / 불편
hist(): of the 10,000 stored slopes shows the **sampling distribution** of the OLS slope estimator; It should be centred near the **true slope** 0.2, because OLS is **unbiased** under these assumptions; Its spread is the sampling variability that the standard error measures
@use D
===
W5 · Counting rejections
Lines 13–16. What do ifelse(), table() and barplot() do, and what does the share of "Reject" estimate here?
labels / label / Reject|counts / count / frequency / 빈도|bar / bars / 막대|power / 검정력
ifelse(): gives "Reject" where pValue <= 0.05 and "Fail to Reject" otherwise, one **label** per sample; table(): **counts** how many samples carry each label; barplot(): draws one **bar** per label; The true slope is 0.2, not 0, so the null is false and the share of Reject estimates the test's **power**
@use D
===
W5 · If the true slope were 0
If line 2 set slope=0 and the simulation were run again, what would the share of "Reject" estimate, and about what value should it be?
Type I / type 1 / false rejection / 1종 오류|0.05 / 5% / alpha|null is true / hypothesis is true / true null / 귀무가설이 참
With slope=0 the null hypothesis is **true**, so every rejection is a wrong one; The share of Reject then estimates the **Type I** error rate; It should be close to alpha, about **0.05** (5%), apart from simulation noise
@use D
===
W5 · Filling results and checking coverage
Lines 17–28. What do results[rowIdx, "slope"] and interval["fertilizer", "2.5 %"] select, when is inside TRUE, and about how many of the 20 rows should be TRUE?
cell / row and column / column name / 행 / 열|lower / lower bound / 하한|both / 둘 다|19 / 95% / 95
results[rowIdx, "slope"] = ... writes one **cell**, chosen by row number and column name, and creates the column the first time; interval["fertilizer", "2.5 %"] picks the **lower** bound in the fertilizer row of the confint() matrix ("97.5 %" is the upper bound); && is TRUE only if **both** comparisons hold, so inside is TRUE when the true slope 2 lies within the interval; About **95%** of such intervals cover the true slope, roughly 19 of 20, though one run can differ by chance
@use D
===
@case E
W6 — dummy variables and interactions (lecture examples, Wooldridge Ch.7)
@code m1 <- lm(wage ~ female + educ, data = df);;m2 <- lm(wage ~ educ*female, data = df);;m3 <- lm(wage ~ educ + as.factor(region), data = df);;library(car);;linearHypothesis(m2, c("female = 0", "educ:female = 0"));;restricted <- lm(wage ~ educ + exper, data = df);;unrestricted <- lm(wage ~ (educ + exper)*female, data = df);;anova(restricted, unrestricted);;lpm <- lm(inlf ~ educ + age, data = df)
===
W6 · A dummy variable in lm()
Line 1. female = 1 for women and 0 for men. How is the coefficient of female interpreted?
difference / 차이|base group / men / reference / 기준|holding educ / same education / educ constant / 고정 / 통제|intercept / 절편
The coefficient of female is the **difference** in expected wage between women and the **base group**, men; It is measured **holding educ** constant, that is, for a man and a woman with the same education; Graphically it shifts the **intercept**: both groups have the same slope on educ
@use E
===
W6 · The * operator and the interaction term
Line 2. Which terms does educ*female put into the model, and what do the coefficients of educ:female and of female measure?
main effects / main effect / 주효과|interaction / 상호작용|slope / 기울기|intercept / educ = 0 / 절편
educ*female: expands to educ + female + educ:female, the two **main effects** plus their **interaction**; The educ:female coefficient is the difference in the **slope** of educ between women and men (the difference in the return to education); female: the difference in the **intercept**, the wage gap at educ = 0
@use E
===
W6 · as.factor() with several categories
Line 3. region has several categories coded as numbers. What does as.factor() change, and what does lm() then create?
categorical / factor / 범주|dummy / dummies / indicator / 더미 / 가변수|base / reference / omitted / left out / 기준|dummy variable trap / perfect collinearity / 다중공선
as.factor(): treats region as a **categorical** variable, not as one number with a single slope; lm(): creates one **dummy** for each region except one, the **base** (reference) category; Leaving one out avoids the dummy variable trap (perfect collinearity with the intercept); Each dummy coefficient is the wage difference from the base region, holding educ constant
@use E
===
W6 · linearHypothesis() on m2
Lines 4–5. What does linearHypothesis() test here, which kind of test does it report, and what would rejecting the null mean?
jointly / both / together / 동시에|F-test / F|car / package / 패키지|same intercept / same line / no difference / 차이가 없 / 같은
linearHypothesis(): from the **car** package, tests the restrictions female = 0 and educ:female = 0 **jointly**; For an lm model it reports an **F-test**, here with 2 restrictions; The null says women and men have the **same intercept** and the same slope, one line for both; Rejecting it means the wage–education relationship differs by gender
@use E
===
W6 · anova() and the Chow test
Lines 6–8. What does anova(restricted, unrestricted) compute, how many restrictions are tested, and what does the test assume?
F-test / F|nested / compares / 비교|3 / three / 세 개|Chow / same regression / 그룹|same error variance / equal variance / constant error variance / homoskedastic / 등분산
anova(): with two **nested** models **compares** their residual sums of squares with an **F-test**; The unrestricted model adds female, educ:female and exper:female, so **3** restrictions are tested; This is the **Chow** test of whether one regression fits both women and men; It assumes the **same error variance** in both groups
@use E
===
W6 · lm() with a binary dependent variable
Line 9. inlf is 1 if a woman is in the labor force and 0 otherwise. What model does lm() estimate here, what does a coefficient measure, and what are two drawbacks?
linear probability model / LPM / 선형확률|probability / 확률|outside 0 and 1 / below 0 / above 1 / 0과 1|heteroskedastic / heteroskedasticity / 이분산
lm(): with a 0/1 dependent variable estimates a **linear probability model**; A coefficient is the change in the **probability** that inlf = 1 for a one-unit increase in the regressor, holding the others fixed; Drawback 1: fitted values can fall **outside 0 and 1**; Drawback 2: the error variance depends on x, so the model is **heteroskedastic** and the usual standard errors need care
@use E
===
</script>

<style>

  .case{grid-column:1 / -1;}

    width:min(var(--ex-w), calc(100% - var(--gap) - 16px)); margin:20px var(--gap) 0 0; max-height:calc(100vh - var(--bar-h) - 24px); overflow:auto;

  .case-ex .tables{display:flex; flex-direction:column; gap:14px;}
  .case-ex .exbox{background:var(--paper); padding:22px 16px; box-shadow:0 0 0 1px rgba(0,0,0,0.05);}

  .case-ex .tables{min-width:0;}
  .case.stacked .case-ex, .case-ex.flow{overflow-x:auto;}

  .case.stacked .case-ex .exbox{display:contents;}
  .case.stacked .case-ex h2, .case.stacked .case-ex .uses{flex:0 0 100%;}

  .case.stacked .case-ex{scrollbar-width:auto; scrollbar-color:auto;}

  .data-errors{max-width:var(--paper-w); margin:16px auto 0; padding:12px 18px; color:var(--wrong); font-size:0.88rem; background:var(--paper);}
  .empty-state{padding-top:60px; padding-bottom:60px; text-align:center; color:var(--ink-soft);}
  footer{padding-top:28px; padding-bottom:44px; color:var(--faint); font-size:0.78rem; text-align:center;}

  :root{--memo-w:min(300px,86vw);}

  }

    #printSheet .p-ex{break-inside:avoid; page-break-inside:avoid; border-top:0.3mm solid #000; border-bottom:0.3mm solid #000; padding:3mm 0 1mm; margin:2mm 0 6mm;}

    #printSheet .p-ex .uses{font-size:9pt; margin:0 0 3mm; font-style:italic;}
    #printSheet .p-ex .tables{display:flex; gap:8mm; align-items:flex-start;}
    #printSheet .p-ex .tables > table{flex:1 1 0;}
    #printSheet table.t{font-size:9.3pt; color:#000;}
    #printSheet table.t caption{color:#000; font-size:10.5pt; padding-bottom:1.5mm;}
    #printSheet table.t thead th{border-top:0.35mm solid #000;}
    #printSheet table.t tbody tr:last-child td{border-bottom:0.35mm solid #000;}
    #printSheet table.t th, #printSheet table.t td{color:#000;}
    #printSheet table.t th{ border-bottom:0.3mm solid #000; padding:0.8mm 1.5mm;}
    #printSheet table.t td{padding:0.4mm 1.5mm; border-bottom:0.1mm solid #ddd;}
    #printSheet table.t tr.sec td{color:#000; border-bottom:none; padding-top:2mm;}

    #printSheet .p-key{display:none;}

    #printSheet .p-s{break-inside:avoid; margin:0 0 4mm; font-size:9.5pt; line-height:1.35;}

    #printSheet .p-kw{font-style:italic; color:#333;}
    #printSheet .sn-line .lb{font-weight:400; text-shadow:0.3px 0 0 currentColor;}
  }
  /* R code: monospace, no box, R syntax colours */
  .codebox{margin:0 0 14px; padding:0; background:none; border:none; font-family:ui-monospace,SFMono-Regular,Consolas,"D2Coding",Menlo,monospace; font-size:0.86rem; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink);}
  code.ic{font-family:ui-monospace,SFMono-Regular,Consolas,"D2Coding",Menlo,monospace; font-size:0.92em; background:none; padding:0; color:inherit;}
  .lbx{font-weight:600; color:var(--ink);}
  .excode{font-size:0.8rem; line-height:1.5; margin:6px 0 0;}

  :root{--c-com:#6a737d; --c-str:#22863a; --c-num:#b45309; --c-kw:#8250df; --c-fn:#0550ae; --c-arg:#0f766e; --c-op:#c2185b;}

</aside>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const fm0 = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);
const fm = t => String(t).split(/`([^`]+)`/).map((p, i) => i % 2 ? `<code class="ic">${esc(p)}</code>` : fm0(p)).join('')
  .replace(/\*\*(.+?)\*\*/g, '<span class="lbx">$1</span>');   // `code` -> monospace, **term** -> semibold
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}
function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = rows.shift().split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls: L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5))), code: L.filter(l => l.startsWith('@code ')).flatMap(l => l.slice(6).split(';;')) };
      if(!cases[id].tbls.length && !cases[id].code.length) errs.push(`exhibit ${id}: needs at least one @tbl or @code line`);
      return;
    }
    const who = `Q${questions.length + 1}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, key results, model answer)`); return; }
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    const self = L[2] === '~';
    const kws = self ? [] : L[2].split('|').map(g => g.split(' / ').map(s => s.trim()).filter(Boolean));
    if(!self && (kws.length < 1 || kws.some(g => !g.length))) errs.push(`${who}: empty key-result group`);
    let use = null, fig = null, code = null;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) use = l.slice(5).trim();
      else if(l.startsWith('@tbl ')) fig = parseTbl(l.slice(5));
      else if(l.startsWith('@code ')) code = l.slice(6).split(';;');
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…"`);
    });
    questions.push({ tag, text: L[1], kws, self, model: L[3], use, fig, code, n: questions.length + 1 });
  });
  questions.forEach(q => { if(q.use && !cases[q.use]) errs.push(`Q${q.n}: @use ${q.use} but no "@case ${q.use}" block`); });
  if(!questions.length) errs.push('no questions found');
  return { meta, questions, cases, errs };
}
const PARSED = parseQuizData(document.getElementById('quizData').textContent);
const META = PARSED.meta, QUIZ_TITLE = META.title || 'Quiz', QUESTIONS = PARSED.questions, CASES = PARSED.cases, N = QUESTIONS.length;
const $ = id => document.getElementById(id);
if(PARSED.errs.length){ const b = document.createElement('div'); b.className = 'data-errors'; b.innerHTML = '<b>Quiz data needs fixing</b><ul>' + PARSED.errs.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>'; document.body.insertBefore(b, document.body.firstChild); }
$('quizTitle').textContent = QUIZ_TITLE; $('quizSub').textContent = META.sub || ''; document.title = QUIZ_TITLE + (META.sub ? ' · ' + META.sub.split(' · ')[0] : '');
$('quizFooter').textContent = `${META.subject || ''} — ${META.textbook || ''}`;

/* checking: key results found in the written answer */
const PASS = 0.5;
let showAll = false;   // "Show all answers": model answers in the side notes without checking
let drafts = new Array(N).fill(''), snap = new Array(N).fill(null), filterMode = 'all', reviewList = [], flagList = [], pickNums = null, current = 0;
const missed = new Set(), flagged = new Set();
const norm = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const isShort = alt => /^[\x00-\x7f]+$/.test(alt) && norm(alt).length <= 4;
const shortRe = alt => new RegExp('(^|[^a-z0-9.,])' + reEsc(alt.toLowerCase()).replace(/\s+/g, '\\s*') + '($|[^a-z0-9.,]|[.,](?![0-9]))', 'i');
function altMatch(alt, text){ const n = norm(alt); if(!n) return false; return isShort(alt) ? shortRe(alt).test(text) : norm(text).includes(n); }
function findRange(alt, full){
  const n = norm(alt);
  if(!n) return null;
  if(isShort(alt)){ const m = shortRe(alt).exec(full); return m ? [m.index + m[1].length, m.index + m[0].length - m[2].length] : null; }
  let ns = ''; const idx = [];
  for(let i = 0; i < full.length; i++){ const c = full[i].toLowerCase(); if(/[a-z0-9가-힣]/.test(c)){ ns += c; idx.push(i); } }
  const p = ns.indexOf(n);
  return p < 0 ? null : [idx[p], idx[p + n.length - 1] + 1];
}
const htmlToText = h => { const d = document.createElement('div'); d.innerHTML = h.replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(div|p)[^>]*>/gi, '\n'); return d.textContent; };
function grade(qi){
  if(snap[qi] === null) return null;
  const q = QUESTIONS[qi]; if(q.self) return { self: true, hits: [], n: 0, t: 0 };
  const text = htmlToText(snap[qi]);
  const hits = q.kws.map(g => g.some(a => altMatch(a, text)));
  return { hits, n: hits.filter(Boolean).length, t: hits.length };
}
const resultOf = qi => { const g = grade(qi); if(!g) return null; if(g.self) return 2; return g.n / g.t >= PASS ? 2 : g.n ? 1 : 0; };
/* underline the first occurrence of each listed wording group inside an element */
function markIn(el, groups, cls){
  const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while(w.nextNode()) nodes.push(w.currentNode);
  const starts = []; let full = '';
  nodes.forEach(n => { starts.push(full.length); full += n.nodeValue + '\n'; });
  const ranges = [];
  groups.forEach(grp => { for(const a of grp){ const r = findRange(a, full); if(r){ ranges.push(r); break; } } });
  ranges.sort((a, b) => b[0] - a[0]);
  let limit = Infinity;
  ranges.forEach(([s, e]) => {
    if(e > limit) return; limit = s;
    for(let k = nodes.length - 1; k >= 0; k--){
      const ns = starts[k], len = nodes[k].nodeValue.length, a = Math.max(s, ns) - ns, b = Math.min(e, ns + len) - ns;
      if(b <= a) continue;
      let node = nodes[k];
      if(b < len) node.splitText(b);
      if(a > 0) node = node.splitText(a);
      const sp = document.createElement('span'); sp.className = 'mk ' + cls; node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
  });
}

const visibleIndices = () => { const all = QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n)); return filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : all; };
const scopeIdx = () => QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n));
function ranges(nums){ const a = [...nums].sort((x, y) => x - y), out = []; for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; } return out.join(', '); }
function exhibitHTML(id, idx, boxed){ const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(i => QUESTIONS[i].n); const head = `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p>`;
  const code = c.code.length ? `<pre class="codebox excode">${rHLn(c.code.join('\n'))}</pre>` : '';   /* R code exhibit: numbered lines */
  if(code){ if(boxed) return `<div class="tables"><div class="exbox">${head}${code}</div>${c.tbls.map(t => `<div class="exbox">${tblHTML(t)}</div>`).join('')}</div>`; return head + code + (c.tbls.length ? `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>` : ''); }
  if(boxed) return `<div class="tables">${c.tbls.map((t, i) => `<div class="exbox">${i ? '' : head}${tblHTML(t)}</div>`).join('')}</div>`;   /* screen: each statement on its own card */ return head + `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>`; }
const lightbox = $('lightbox'); lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ $('lbBody').innerHTML = html; lightbox.classList.add('show'); }
const richHtml = node => { const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['DIV', 'P'].includes(c.nodeName) ? '<div>' + out(c) + '</div>' : out(c)).join(''); return out(node); };
function qaText(qi){
  const q = QUESTIONS[qi], g = grade(qi);
  return `Q${q.n}. ${q.text}\n` + (q.code ? q.code.join('\n') + '\n' : '') + (drafts[qi].trim() ? `My answer:\n${htmlToText(drafts[qi]).trim()}\n` : '') + (g && !g.self ? `Key results ${g.n}/${g.t}: ` + q.kws.map((k, i) => (g.hits[i] ? '[x] ' : '[ ] ') + k[0]).join('  ') + '\n' : '') + `Model answer:\n${explLines(q.model).join('\n')}`;
}

/* ---------- R syntax colouring for @code lines ---------- */
function rHL(src){
  const RX = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?\b)|(\b(?:function|if|else|for|while|repeat|in|break|next|return|TRUE|FALSE|NULL|NA|NaN|Inf)\b)|([A-Za-z_.][\w.]*)(?=\s*\()|(?<=[(,]\s*)([A-Za-z_.][\w.]*)(?=\s*=(?!=))|(<-|->|%[^%\s]*%|\|>|[~$:])/g;
  return src.split('\n').map(line => {
    let o = '', last = 0, m;
    RX.lastIndex = 0;
    while((m = RX.exec(line))){
      o += esc(line.slice(last, m.index));
      const cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : m[4] ? 'kw' : m[5] ? 'fn' : m[6] ? 'arg' : 'op';
      o += `<span class="hl-${cls}">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    return o + esc(line.slice(last));
  }).join('\n');
}
const rHLn = src => rHL(src).split('\n').map((l, i) => `<span class="cl"><span class="ln">${i + 1}</span>${l}</span>`).join('');
function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];
  const main = document.createElement('div'); main.className = 'qmain inpage' + (first ? ' first' : ''); main.dataset.index = qi;
  const head = document.createElement('div'); head.className = 'qhead';
  head.innerHTML = `<span class="qnum">${q.n}</span><span class="qtag">${fm(q.tag)}</span>` + (q.use ? `<span class="exref">· Exhibit ${esc(q.use)}</span>` : '') + (retry ? '<span class="retry">· retry</span>' : '');
  const tools = document.createElement('span'); tools.className = 'qtools';
  if(snap[qi] !== null){
    const cp = document.createElement('span'); cp.className = 'qcopy'; cp.setAttribute('role', 'button'); cp.textContent = 'copy'; cp.title = 'Copy question, your answer and the model answer';
    cp.addEventListener('click', () => copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed')));
    tools.appendChild(cp);
  }
  const fl = document.createElement('span'); fl.className = 'qflag' + (flagged.has(qi) ? ' on' : ''); fl.setAttribute('role', 'button'); fl.textContent = 'review'; fl.title = 'Mark for review';
  fl.addEventListener('click', () => { const on = !flagged.has(qi); on ? flagged.add(qi) : flagged.delete(qi); fl.classList.toggle('on', on); updateChrome(); });
  tools.appendChild(fl); head.appendChild(tools); main.appendChild(head);
  const p = document.createElement('p'); p.className = 'qtext'; p.innerHTML = fm(q.text); main.appendChild(p);
  if(q.code){ const pre = document.createElement('pre'); pre.className = 'codebox'; pre.innerHTML = rHL(q.code.join('\n')); main.appendChild(pre); }
  if(q.fig){ const f = document.createElement('div'); f.className = 'qfig zoomable'; f.innerHTML = tblHTML(q.fig); f.addEventListener('click', () => openLightbox(tblHTML(q.fig))); main.appendChild(f); }
  const ed = document.createElement('div'); ed.className = 'answer'; ed.contentEditable = 'true'; ed.spellcheck = false;
  ed.setAttribute('role', 'textbox'); ed.setAttribute('aria-multiline', 'true'); ed.dataset.placeholder = 'Write your answer here…';
  ed.innerHTML = drafts[qi];
  ed.addEventListener('focus', () => { current = qi; markCurrent(); });
  ed.addEventListener('input', () => { drafts[qi] = richHtml(ed); });
  ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
  ed.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){
      e.preventDefault();
      if(e.ctrlKey || e.metaKey || e.shiftKey){ document.execCommand('insertParagraph'); drafts[qi] = richHtml(ed); }
      else {
        const v = visibleIndices(), nx = v[v.indexOf(qi) + 1];
        if(snap[qi] !== null && richHtml(ed) === snap[qi]){ if(nx !== undefined) focusAnswer(nx, true); }   /* already checked, nothing changed: move on */
        else check(qi, ed, true);                                                                       /* new or edited answer: check it */
      }
      return;
    }
    if(e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey){
      const v = visibleIndices(), t = v.indexOf(qi) + (e.shiftKey ? -1 : 1);
      if(t >= 0 && t < v.length){ e.preventDefault(); drafts[qi] = richHtml(ed); focusAnswer(v[t], true); }
    }
  });
  main.appendChild(ed);
  if(snap[qi] !== null && !q.self){ const g = grade(qi); markIn(ed, q.kws.filter((_, i) => g.hits[i]), 'ok'); }
  const acts = document.createElement('div'); acts.className = 'acts';
  const cb = document.createElement('button'); cb.type = 'button'; cb.className = 'link'; cb.style.color = 'var(--ink)';
  cb.textContent = q.self ? 'Show answer' : snap[qi] !== null ? 'Check again' : 'Check';
  cb.addEventListener('click', () => check(qi, ed)); acts.appendChild(cb);
  if(snap[qi] !== null){
    const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'link'; rb.textContent = 'Hide answer';
    rb.addEventListener('click', () => { drafts[qi] = richHtml(ed); snap[qi] = null; render(); }); acts.appendChild(rb);
  }
  main.appendChild(acts);

  const side = document.createElement('aside'); side.className = 'qside';
  if(snap[qi] !== null){
    const g = grade(qi);
    const head2 = g.self ? '<div class="sn-head">Model answer</div>' :
      `<div class="sn-head"><span class="${g.n / g.t >= PASS ? 'ok' : g.n ? 'part' : 'no'}">${g.n / g.t >= PASS ? 'Passed' : g.n ? 'Partly' : 'Not yet'}</span> · ${g.n} of ${g.t} key results</div>`;
    side.innerHTML = head2 + fmtExpl(q.model);
    if(!g.self) markIn(side, q.kws.filter((_, i) => !g.hits[i]), 'no');
  } else if(showAll){ side.innerHTML = '<div class="sn-head">Answer</div>' + fmtExpl(q.model); }
  return [main, side];
}
function check(qi, ed, keep){ drafts[qi] = richHtml(ed); snap[qi] = drafts[qi]; current = qi; render(); if(keep) focusAnswer(qi, true); }
function markCurrent(){ document.querySelectorAll('#quiz .qmain').forEach(m => m.classList.toggle('cur', +m.dataset.index === current)); }
function caretEnd(ed){ const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
function focusAnswer(qi, end){ current = qi; markCurrent(); const ed = $('quiz').querySelector(`.qmain[data-index="${qi}"] .answer`); if(ed){ ed.focus({ preventScroll: true }); if(end) caretEnd(ed); ed.closest('.qmain').scrollIntoView({ behavior: 'smooth', block: 'center' }); } }

function fitExhibits(){   /* an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    const ex = sec.querySelector('.case-ex');
    if(!ex) return;
    const cs = getComputedStyle(ex); if(cs.position !== 'sticky') return;
    const inner = ex.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const tooWide = [...ex.querySelectorAll('table')].some(t => { const p = t.parentElement, ps = getComputedStyle(p); return t.scrollWidth > p.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight) + 1; });
    if(tooWide || ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);
function render(){
  const y0 = window.scrollY, quizEl = $('quiz');
  quizEl.innerHTML = '';
  const vis = visibleIndices(), retry = filterMode === 'review';
  if(!vis.length){ quizEl.innerHTML = `<div class="empty-state inpage">${filterMode === 'flagged' ? 'No questions marked for review.' : 'Nothing to review.'}</div>`; updateChrome(); return; }
  let first = true;
  for(let k = 0; k < vis.length; ){
    const q = QUESTIONS[vis[k]];
    if(q.use){
      const group = []; while(k < vis.length && QUESTIONS[vis[k]].use === q.use){ group.push(vis[k]); k++; }
      const sec = document.createElement('section'); sec.className = 'case pg';
      const ex = document.createElement('div'); ex.className = 'case-ex'; ex.innerHTML = exhibitHTML(q.use, vis, true); ex.style.setProperty('--n', String(group.length + 1));
      ex.querySelectorAll('table').forEach(t => { t.classList.add('zoomable'); t.addEventListener('click', () => openLightbox(t.outerHTML)); });
      sec.appendChild(ex);
      group.forEach((qi, j) => questionNodes(qi, first && j === 0, retry).forEach(n => sec.appendChild(n)));
      quizEl.appendChild(sec);
    } else { questionNodes(vis[k], first, retry).forEach(n => quizEl.appendChild(n)); k++; }
    first = false;
  }
  window.scrollTo(0, y0);
  fitExhibits();
  updateChrome();
  markCurrent();
}
function updateChrome(){
  const ids = scopeIdx().filter(i => !QUESTIONS[i].self);
  $('totalCount').textContent = scopeIdx().length;
  $('checkedCount').textContent = scopeIdx().filter(i => snap[i] !== null).length;
  $('passedCount').textContent = ids.filter(i => resultOf(i) === 2).length;
  const wl = ids.filter(i => snap[i] !== null && resultOf(i) < 2);
  const rb = $('reviewBtn'); rb.disabled = !wl.length || filterMode === 'review'; rb.textContent = filterMode === 'review' ? 'Reviewing…' : `Review not passed (${wl.length})`; rb.classList.toggle('on', filterMode === 'review');
  $('allViewBtn').classList.toggle('on', filterMode === 'all');
  const fc = scopeIdx().filter(i => flagged.has(i)).length, fb = $('flagBtn');
  fb.textContent = `Marked (${fc})`; fb.disabled = !fc && filterMode !== 'flagged'; fb.classList.toggle('on', filterMode === 'flagged');
  $('copyMissedBtn').disabled = !scopeIdx().some(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2));
  const done = filterMode === 'review' && reviewList.length && reviewList.every(i => snap[i] !== null);
  $('reviewBanner').classList.toggle('show', !!done);
  if(done){
    const still = reviewList.filter(i => resultOf(i) < 2);
    $('reviewBannerText').textContent = still.length ? `Review complete — ${still.length} of ${reviewList.length} still not passed.` : `Review complete — all ${reviewList.length} passed.`;
    const a = $('reviewBannerActions'); a.innerHTML = '';
    const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Back to all'; b.addEventListener('click', () => { filterMode = 'all'; render(); }); a.appendChild(b);
  }
  document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px');
}
$('reviewBtn').addEventListener('click', () => { const wl = scopeIdx().filter(i => !QUESTIONS[i].self && snap[i] !== null && resultOf(i) < 2); if(!wl.length) return; reviewList = wl; wl.forEach(i => { missed.add(i); snap[i] = null; }); filterMode = 'review'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('allViewBtn').addEventListener('click', () => { filterMode = 'all'; render(); });
$('showAllBtn').addEventListener('click', () => { showAll = !showAll; $('showAllBtn').textContent = showAll ? 'Hide all answers' : 'Show all answers'; $('showAllBtn').classList.toggle('on', showAll); render(); });
$('flagBtn').addEventListener('click', () => { flagList = scopeIdx().filter(i => flagged.has(i)); if(!flagList.length) return; filterMode = 'flagged'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('darkSw').addEventListener('click', () => $('darkSw').classList.toggle('on', document.documentElement.classList.toggle('dark')));

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const t = qSearch.value.replace(/[–—~]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t){ pickNums = null; qForm.classList.remove('active'); render(); return; }
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){ let m; if(/^\d+$/.test(tok)) out.add(+tok); else if((m = tok.match(/^(\d+)-(\d+)$/))){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); } else { qBad(`Not recognised: "${tok}"`); return; } }
  const miss = [...out].filter(n => n < 1 || n > N);
  if(miss.length){ qBad(`No question ${miss.join(', ')} (1–${N})`); return; }
  qBad(''); pickNums = out; qForm.classList.add('active'); filterMode = 'all'; render();
});
qSearch.addEventListener('input', () => qBad(''));
$('qClear').addEventListener('click', () => { pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); render(); });

$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function buildPrintSheet(){
  const idx = visibleIndices();
  let html = `<h1>${esc(QUIZ_TITLE)}</h1>${META.sub ? `<p class="p-sub">${esc(META.sub)}</p>` : ''}`, last = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== last) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    last = q.use;
    const lines = 2;                                               // print: two lines at the question text size (1.5em)
    html += `<div class="p-q"><p>${q.n}. ${q.use ? `[Exhibit ${esc(q.use)}] ` : ''}${fm(q.text)}</p>` + (q.code ? `<pre class="p-code">${rHL(q.code.join('\n'))}</pre>` : '') + (q.fig ? `<div class="p-fig">${tblHTML(q.fig)}</div>` : '') + `<div class="p-lines" style="--n:${lines}"></div></div>`;
  });
  html += `<section class="p-key"><h1>${esc(QUIZ_TITLE)} — Model answers</h1>` + idx.map(qi => { const q = QUESTIONS[qi]; return `<div class="p-s"><p><b>${q.n}.</b> ${fm(q.tag)}</p>${fmtExpl(q.model)}${q.kws.length ? `<p class="p-kw">Key results: ${q.kws.map(k => fm(k[0])).join(' · ')}</p>` : ''}</div>`; }).join('') + '</section>';
  $('printSheet').innerHTML = html;
}
window.addEventListener('beforeprint', buildPrintSheet);
window.addEventListener('afterprint', () => document.body.classList.remove('print-solution'));

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
$('copyMissedBtn').addEventListener('click', () => {
  const nums = scopeIdx().filter(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2)).map(i => QUESTIONS[i].n);
  copyText(`${QUIZ_TITLE} not passed: ${nums.join(', ')}`).then(() => showTip($('copyMissedBtn'), 'Copied'), () => {});
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}
window.addEventListener('resize', () => document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px'));
let armed = false, armTimer = null; const resetBtn = $('resetBtn');
resetBtn.addEventListener('click', () => {
  if(!armed){ armed = true; resetBtn.classList.add('danger'); resetBtn.textContent = 'Click again to clear answers'; armTimer = setTimeout(disarm, 4000); return; }
  clearTimeout(armTimer); disarm(); scopeIdx().forEach(i => { drafts[i] = ''; snap[i] = null; missed.delete(i); }); filterMode = 'all'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
function disarm(){ armed = false; resetBtn.classList.remove('danger'); resetBtn.textContent = 'Restart'; }

const memoEl = $('memoText');
const setMemoOpen = on => document.body.classList.toggle('memo-open', on);
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
$('memoBold').addEventListener('mousedown', e => e.preventDefault());
$('memoBold').addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
$('memoTab').addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'writtenQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.kws.map(k => k.join('/')).join('|')).join('\n'));
$('saveBtn').addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, drafts, snap, missed: [...missed], flagged: [...flagged], memo: memoEl.innerHTML })); showTip($('saveBtn'), 'Saved'); }catch(e){ showTip($('saveBtn'), 'Save failed'); }
});
try{
  const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if(d){
    if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = richHtml(memoEl); }
    if(d.sig === SAVE_SIG && Array.isArray(d.drafts) && d.drafts.length === N){
      const clean = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };
      drafts = d.drafts.map(clean); snap = d.snap.map(s => s === null ? null : clean(s));
      (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
      setTimeout(() => showTip($('saveBtn'), 'Progress restored'), 300);
    }
  }
}catch(e){}
render();
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
