===
기술통계 · W2 · mean vs median
Line 5 and the summary() table. Compare the mean and the median of breaks and of grade. What does each comparison say about the shape of the distribution, and which centre and spread measures suit a skewed variable?
right-skewed / right skewed / skewed to the right / positively skewed / 오른쪽 / 우측|left-skewed / left skewed / skewed to the left / negatively skewed / 왼쪽 / 좌측|median / 중앙값|IQR / interquartile / 사분위
breaks: mean 3.185 > median 2, a few large values pull the mean up, so the distribution is **right-skewed**; grade: mean 77.26 < median 80, the low score 36 pulls the mean down, so it is **left-skewed**; Skewed data: the mean and the SD are pulled by extreme values, so report the **median** and the **IQR** (Q3 − Q1), which use only the order of the data
@use A
===
기술통계 · Ch.2 · variance by hand
Lines 6–9. Explain each output: why line 6 is (almost) 0, why line 7 squares the deviations, and how lines 8–9 turn 124.0741 into the variance and the standard deviation. Why divide by n − 1?
0 / zero / 1.78e-15 / 영|124.07 / 124.0741|26|4.772 / 4.7721|2.18 / 2.185 / 2.1845|unbiased / degree of freedom / degrees of freedom / 불편 / 자유도
Line 6: deviations from the mean always sum to **0**, and 1.78e-15 is only floating-point rounding, so raw deviations cannot measure spread; Line 7: squaring makes every deviation positive, SS = Σ(x_i − x̄)^2 = **124.0741**; Line 8: s^2 = 124.0741 ÷ (27 − 1) = 124.0741 ÷ **26** = **4.772**, the same as var(); Line 9: s = √4.772 = **2.185**, the same unit as competence; Why n − 1: x̄ uses up one **degree of freedom**, and dividing by n − 1 makes s^2 an **unbiased** estimator of σ^2
@use A
===
기술통계 · W2 · IQR and boxplot outliers
Lines 10–11. Using the 1.5 × IQR rule, compute the fences for grade and for breaks and name the points that boxplot() draws as outliers.
54|36|9.75|12
Rule: a point is an outlier if it lies below Q1 − 1.5 × IQR or above Q3 + 1.5 × IQR; grade: IQR = 84 − 72 = 12, lower fence = 72 − 1.5 × 12 = **54** and upper fence = 84 + 18 = 102, so **36** is an outlier; breaks: IQR = 4.5 − 1 = 3.5, upper fence = 4.5 + 1.5 × 3.5 = **9.75**, so **12** is an outlier; Box: the box spans Q1 to Q3, the bold line is the median, the whiskers stop at the last point inside the fences
@use A

===
회귀선 · W5 · plot() and abline()
Lines 4–8. What does each line draw? Where do the red and the green lines cross, and why does the blue OLS line always pass through that point?
outcome first / y ~ x / dependent / 종속변수 / 결과변수|mean / means / 평균|always / passes through / 지나|intercept / 절편 / 0
Line 4: plot(perform ~ eye) is a scatterplot with the **outcome first**, perform on the y-axis and eye on the x-axis; Line 5–6: lm() fits the OLS line and abline() draws it in blue; Lines 7–8: a horizontal line at ȳ and a vertical line at x̄, which cross at the point of **means** (x̄, ȳ) = (0, 0); Why: the first-order condition gives β̂_0 = ȳ − β̂_1 x̄, so ȳ = β̂_0 + β̂_1 x̄ and the OLS line **always passes through** (x̄, ȳ); Here all variables are standardized, so the means are 0 and the **intercept** is ≈ 0
@use B
===
회귀분석 · Ch.2 · summary(lm())
Lines 9–12. From the tables, interpret the skill slope (all variables are standardized), show how t is computed, and interpret R². Check two identities that hold in simple regression: R² = cor² and F = t².
0.214 / 0.2141|1.997|0.0459 / 0.04585 / 4.6%|cor / correlation / 상관|3.989
Slope: one standard deviation more social skill goes with **0.214** SD higher team performance on average; t = β̂ ÷ SE = 0.2141 ÷ 0.1072 = **1.997**, with df = 85 − 2 = 83; R^2 = **0.0459**: skill explains about 4.6% of the variation in performance; Identity 1: in simple regression R^2 = **cor**(perform, skill)^2 = 0.04585, which line 12 prints; Identity 2: the overall F equals t^2 = 1.997^2 = **3.989**, with the same p = 0.0491; Low R^2: does not make the slope useless, it can still be a precise ceteris paribus estimate (Ch.3)
@use B
===
가설검정 · Ch.4 · t-test and confidence interval
Line 11. The 95% CI of the skill slope is [0.0009, 0.4274] and the 99% CI is [−0.0685, 0.4968], with p = 0.0491. At which levels is H_0: β_{skill} = 0 rejected, how do the two intervals show it, and what does "95%" mean?
5% / 0.05|1% / 0.01 / 99%|excludes 0 / does not contain 0 / 0 is outside / 0을 포함하지 / 0 포함 안|repeated samples / repeated sampling / 반복
5% level: p = 0.049 < **0.05**, so H_0 is rejected, and the 95% CI **excludes 0**; 1% level: p > **0.01**, so H_0 is not rejected, and the 99% CI contains 0; Rule: a two-sided test at level α rejects exactly when the 100(1 − α)% CI excludes the null value; 95%: in **repeated samples** 95% of intervals built this way cover the true β, any single interval either contains it or not
@use B
===
가설검정 · Ch.4 · separate t-tests vs the F-test
Lines 13–14. Interpret the skill coefficient in the multiple regression. Then explain how neither slope is significant at 5% on its own (p = 0.122 and 0.115) while F = 3.30 has p = 0.0418.
holding ravens fixed / holding ravens constant / ceteris paribus / same ravens / 고정|0.122 / 0.115|0.0418 / 0.042|jointly / joint / both zero / 결합 / 동시
Skill: holding ravens fixed (**ceteris paribus**), one SD more social skill goes with 0.171 SD higher performance; t-tests: p = **0.122** and 0.115 test one slope at a time, given that the other variable is already in the model; F-test: H_0: β_{skill} = β_{ravens} = 0 against at least one ≠ 0, F(2, 82) = 3.30 with p = **0.042** < 0.05, so they are **jointly** significant; Why both can hold: skill and ravens share explanatory power (correlation 0.246), so each adds little once the other is in, while together they clearly explain performance; Adjusted R^2: rises from 0.0344 to 0.0519, as expected because ravens has |t| = 1.59 > 1 (Ch.6)
@use B
===
회귀분석 · Ch.3 · omitted variable bias
Lines 9, 13 and 15. The skill slope is 0.2141 alone and 0.1712 with ravens, and the slope from regressing ravens on skill equals cor(skill, ravens) = 0.2458 here. Show how the numbers fit together and explain the drop.
0.2141|0.1746|0.2458 / 0.246|omitted variable / omitted-variable / 누락변수 / 생략변수|upward / 상향 / 과대
Formula: simple slope = β̂_1 + β̂_2 × δ̃_1 (Ch.3); Numbers: 0.1712 + **0.1746** × **0.2458** = 0.1712 + 0.0429 = **0.2141**; Why: ravens raises performance (β̂_2 > 0) and moves with skill (δ̃_1 > 0), so without ravens the skill slope picks up part of the ravens effect; Result: the simple slope is biased **upward** by 0.043, the **omitted variable** bias; Note: δ̃_1 equals the correlation here only because both variables are standardized
@use B
===
회귀선 · Ch.6 · predict() and the confidence band
Lines 16–21. Interpret the first prediction and its two intervals, explain why the prediction interval is so much wider, and say what lines 19–21 draw around the regression line.
0.3475 / 0.347|average / mean / expected / 평균|one team / individual / single / one new / 개별|wider / 넓|band / 띠 / narrowest / 가장 좁
Fit: ŷ = **0.3475** for skill = 0.5 and ravens = 1.5; Confidence interval: [−0.034, 0.729] covers the **average** performance E(y | x) of all teams with these scores and reflects only the uncertainty of the estimated coefficients; Prediction interval: [−1.627, 2.322] covers **one team**, so it adds that team's own error, se(ŷ)^2 + σ̂^2 with σ̂ = 0.974, and is always **wider**; Lines 19–21: predict() gives the confidence limits at 10,000 eye values and polygon() shades the confidence **band**, which is narrowest at the mean of eye and widens away from it
@use B

@case C
W6 — formulas, dummy variables and joint tests (df = wage1 n = 526, mroz n = 753)

수식과 더미변수 · W6 · formula operators
Lines 2, 7 and 9. Write out the terms that `educ*female` and `(educ + exper)*female` put into the model. What does `:` mean, and why is `I(exper^2)` needed instead of `exper^2`?
educ + female + educ:female / main effects / main effect / 주효과|interaction / 상호작용|six / 6|I()|crossing / not a square / not squared / 교차 / 제곱이 아니
Line 2: educ*female = educ + female + **educ:female**, both main effects plus their **interaction**; `:` alone adds only the product term educ × female; Line 7: (educ + exper)*female = educ + exper + female + educ:female + exper:female, so with the intercept the model has **6** coefficients; Line 9: inside a formula `^` means **crossing** (`exper^2` would just be exper), so **I()** makes R compute the arithmetic square and add exper squared as a regressor
@use C
===
수식과 더미변수 · Ch.7 · dummy coefficient
Line 1 (m1). Interpret the female coefficient −2.273 (SE 0.279). Which group is the base, and why can't a male dummy be added as well?
2.27 / 2.273|same education / same educ / holding educ / educ fixed / 교육 고정 / 같은 교육|base / reference / men / male / 남성 / 기준|dummy variable trap / perfect collinearity / 완전공선 / 더미변수 함정
female: among people with the **same education**, women earn about **$2.27** per hour less than men on average (t = −2.273 ÷ 0.279 = −8.15, p < 0.001); Base group: men (female = 0), the intercept 0.623 belongs to the men's line and −2.273 shifts it down for women; Male dummy: female + male = 1 for everyone, an exact linear relation with the intercept, the **dummy variable trap** (perfect collinearity, MLR.3); Caution: this is not proof of discrimination, since female may be correlated with omitted productivity factors such as experience (Ch.7)
@use C
===
수식과 더미변수 · Ch.7 · as.factor() with several categories
Line 3 (m3). region has four categories. How many dummies does lm() create from as.factor(region), which one is the base, and how is the south coefficient −0.598 (p = 0.133) read?
three / 3 / k - 1 / k−1|base / reference / east / 기준|same education / holding educ / educ fixed / 교육 고정 / 같은 교육|not significant / insignificant / 유의하지 않
Dummies: as.factor() makes region categorical, and lm() creates k − 1 = **3** dummies (northcen, south, west); Base: the first level in alphabetical order, **east**, is left out to avoid the dummy variable trap; south: with the **same education**, workers in the south earn on average $0.60 per hour less than in the east; Significance: p = 0.133 > 0.05, so the difference is **not significant** at 5%, and every region coefficient is a difference from east, not from the overall mean
@use C

수식과 더미변수 · Ch.7 · interaction and joint test
Lines 2 and 5 (m2). What is the return to education for men and for women, and is the gap significant? Line 5 tests female = 0 and educ:female = 0 together and gives F = 33.51. Why can it reject when neither t-test does?
0.539|0.453 / 0.4535|0.407 / not significant / insignificant / 유의하지 않|33.5 / 33.51|jointly / joint / 결합 / 동시
Men: return to education = **0.539** dollars per hour per year (female = 0); Women: 0.539 − 0.086 = **0.453**; Gap: educ:female = −0.086 with p = **0.407**, so no evidence that the return differs; Joint test: F = **33.51** with 2 and 522 df, p < 0.001, rejects that men and women have the same wage line; Why: female and educ:female are almost collinear (correlation 0.96), so their separate t-tests are weak while **jointly** they clearly matter
@use C

가설검정 · Ch.7 · Chow test by hand
Line 8. Compute F from the RSS values in the table and state the conclusion. What does the test assume about the error variance?
29.6 / 29.65|3|520|reject / 기각|same variance / constant variance / equal variance / same error variance / 등분산
Formula: F = [(SSR_r − SSR_{ur}) ÷ q] ÷ [SSR_{ur} ÷ (n − k − 1)]; Numbers: [(5548.2 − 4737.8) ÷ **3**] ÷ (4737.8 ÷ **520**) = 270.1 ÷ 9.111 = **29.65**; Restrictions: q = 3, the female intercept shift and its two slope interactions, and df = 526 − 6 = 520; Conclusion: p < 0.001, so **reject** H_0 that men and women share one wage equation; Assumption: the Chow test needs the **same error variance** in both groups (Ch.7)
@use C

수식과 더미변수 · Ch.7 · linear probability model
Line 9. inlf = 1 if a woman is in the labor force. Interpret the educ and kidslt6 coefficients, and name two weaknesses of the LPM that this fit shows.
percentage points / percentage point / %p / 퍼센트포인트|3.8 / 0.038|26.2 / 0.262|below 0 / above 1 / outside / 0과 1 / 벗어|heteroskedastic / heteroskedasticity / robust / 이분산
educ: one more year of education raises the probability of being in the labor force by 0.038, that is **3.8 percentage points**, ceteris paribus; kidslt6: each child under 6 lowers it by **26.2** percentage points; Weakness 1: fitted values run from −0.345 to 1.127, and 33 of 753 fall **outside** [0, 1]; Weakness 2: Var(u | x) = p(x)[1 − p(x)] depends on x, so the LPM is necessarily **heteroskedastic** and needs robust standard errors

@case D
simple regression demonstration.R (condensed) — simulation of estimates, tests and intervals (W5)
@code set.seed(4201);;slope=0.2; intercept=3; sampleSize=10;;fertilizer=rnorm(sampleSize,10,2);;yield=intercept+slope*fertilizer+rnorm(sampleSize,0,1);;fer_regr=lm(yield ~ fertilizer);;summary(fer_regr)$coefficients; confint(fer_regr);;sampleCnt=10000; estimator=c(); t=c(); pValue=c();;for(rowIdx in 1:sampleCnt) {;;  fertilizer=rnorm(sampleSize,10,2);;  yield=intercept+slope*fertilizer+rnorm(sampleSize,0,1);;  coef=summary(lm(yield~fertilizer))$coefficients;;  estimator[rowIdx]=coef[2,1]; t[rowIdx]=coef[2,3]; pValue[rowIdx]=coef[2,4];;};;hist(estimator); mean(estimator); sd(estimator);;rejection=ifelse(pValue<=0.05, "Reject", "Fail to Reject");;(result=table(rejection));;sampleSize=12; slope=2; sampleCnt=20;;results=data.frame(index=1:sampleCnt);;for(rowIdx in 1:sampleCnt) {;;  fertilizer=rnorm(sampleSize,10,2);;  yield=intercept+slope*fertilizer+rnorm(sampleSize,0,1);;  interval=confint(lm(yield ~ fertilizer));;  results[rowIdx,"inside"]=interval["fertilizer","2.5 %"]<=slope && slope<=interval["fertilizer","97.5 %"];;};;table(results$inside)
@tbl Line 6 · first sample, n = 10 :: Term|Estimate|SE|t|p|95% CI;;(Intercept)|4.983|1.509|3.302|0.011|[1.503, 8.463];;fertilizer|0.0616|0.139|0.443|0.669|[−0.259, 0.382]
@tbl Lines 14–25 · simulation output :: Line|Output|Value;;14|mean · sd of estimator|0.2027 · 0.190;;16|table(rejection)|Fail 8092 · Reject 1908;;25|table(results$inside)|TRUE 19 · FALSE 1;;25|missed interval (no. 16)|[1.422, 1.979]
===
시뮬레이션 · W5 · the data-generating process
Lines 1–6. What population model do lines 2–4 create, and what does set.seed() guarantee? In the first sample the slope estimate is 0.0616 with p = 0.669 although the true slope is 0.2. Is that a mistake, and what do you conclude from this sample?
reproducible / same random numbers / 재현|0.2 / true slope / population / 모집단 / 참값|fail to reject / not reject / 기각하지 못 / 기각 못|sampling variation / random / chance / 표본 변동 / 우연
Model: yield = 3 + **0.2** × fertilizer + u, with fertilizer ~ N(10, 2^2) and u ~ N(0, 1), so the true slope is known; set.seed(4201): fixes the random number generator, so every run draws the same samples and the results are **reproducible**; First sample: with n = 10, β̂_1 = 0.0616 is far from 0.2 only by **sampling variation**, not by a mistake; Test: p = 0.669 > 0.05, so we **fail to reject** H_0: β_1 = 0 even though it is false, a Type II error, and the 95% CI [−0.259, 0.382] contains both 0 and 0.2
@use D
===
시뮬레이션 · Ch.3 · unbiasedness and the sampling distribution
Lines 7–14. What do coef[2,1], coef[2,3] and coef[2,4] pick out? Over 10,000 samples the slope estimates have mean 0.2027 and sd 0.190. What property of OLS does this show, and what does hist(estimator) picture?
slope estimate / estimate / 기울기 추정|t / t value / t-statistic / t 통계량|p-value / p / p값|unbiased / unbiasedness / 불편|sampling distribution / 표본분포
coef matrix: row 2 is the slope, and columns 1, 3 and 4 are the **slope estimate**, its **t value** and its **p-value** (column 2 is the SE); Mean: 0.2027 ≈ 0.2, so across repeated samples OLS is right on average, E(β̂_1) = β_1: **unbiasedness** (MLR.1–MLR.4); hist(estimator): pictures the **sampling distribution** of β̂_1, centred at 0.2 and roughly normal because the errors are normal (MLR.6); Spread: sd 0.190 shrinks with a larger n or more variation in fertilizer, since Var(β̂_1) = σ^2 ÷ SST_x
@use D
===
시뮬레이션 · Ch.4 · rejection rate = power
Lines 15–16. The table prints Fail to Reject 8092 and Reject 1908, and the true slope is 0.2, not 0. What does the 19.1% rejection rate measure, what is the other 80.9%, how could the rate be raised, and what would it be if the true slope were 0?
power / 검정력|19.1% / 0.191 / 1908|type II / type 2 / 제2종|larger n / sample size / larger slope / 표본 크기|5% / 0.05 / type I / 제1종
Power: H_0 (β_1 = 0) is false here, so every rejection is correct and 1908 ÷ 10,000 = **19.1%** estimates the **power** of the 5% t-test; Type II: the other 80.9% fail to reject a false H_0, a **Type II** error; Raising power: a **larger sample size** or a larger true slope (the script suggests slope 9 or n = 100) makes the effect easier to detect; True slope 0: H_0 is then true and the rejection rate is about α = **5%**, the Type I error rate
@use D
===
시뮬레이션 · Ch.4 · confidence-interval coverage
Lines 17–25. Twenty samples of n = 12 with true slope 2 give 19 intervals that contain 2 and one (no. 16, [1.422, 1.979]) that does not. Is 19 of 20 what you expect, and what does the 95% level actually promise?
19|repeated samples / repeated sampling / 95% of samples / 반복|true slope / true value / parameter / 참값 / 모수|random / 확률
Expected: 0.95 × 20 = **19** intervals, exactly what this run gives, and interval 16 is the expected one-in-twenty miss; Meaning: 95% is a property of the method, in **repeated samples** 95% of the intervals built this way cover the **true slope**; Single interval: once computed it either contains 2 or it does not, so "a 95% probability that β_1 lies in [1.422, 1.979]" is the wrong reading; Key point: the bounds are **random**, β_1 is fixed (Ch.4)
@use D
===

  .excode .cl{display:block; padding-left:2.9em; text-indent:-2.9em;}
  .excode .ln{display:inline-block; width:2em; margin-right:0.9em; text-indent:0; text-align:right; color:var(--faint); user-select:none;}
  @media print{ #printSheet .excode{font-family:Consolas,Menlo,"Courier New",monospace; font-size:8.5pt; line-height:1.35; white-space:pre-wrap; margin:1mm 0 2mm;} #printSheet .excode .ln{color:#888;} }
  :root{--c-com:#6a737d; --c-str:#22863a; --c-num:#b45309; --c-kw:#8250df; --c-fn:#0550ae; --c-arg:#0f766e; --c-op:#c2185b;}
  html.dark{--c-com:#8b949e; --c-str:#7ee787; --c-num:#ffa657; --c-kw:#d2a8ff; --c-fn:#79c0ff; --c-arg:#56d4c4; --c-op:#ff7b9c;}
  .hl-com{color:var(--c-com); font-style:italic;} .hl-str{color:var(--c-str);} .hl-num{color:var(--c-num);} .hl-kw{color:var(--c-kw); font-weight:600;}
  .hl-fn{color:var(--c-fn);} .hl-arg{color:var(--c-arg);} .hl-op{color:var(--c-op);}
  @media print{ #printSheet .p-code{font-family:Consolas,Menlo,"Courier New",monospace; font-size:9.5pt; line-height:1.35; white-space:pre-wrap; margin:1.5mm 0 2mm; break-inside:avoid;} #printSheet code.ic{font-size:0.92em;} }
  /* code lines of the selected question: soft neutral highlight */
  .excode .cl{transition:background-color .25s; border-radius:3px;}
  .excode .cl.hl{background:rgba(0,0,0,0.06);}
  html.dark .excode .cl.hl{background:rgba(255,255,255,0.09);}
  /* desktop (mouse) 1000-1419 px: shift the sheet right so the code stays sticky in a left column; side notes go under the answer */
  @media (min-width:1000px) and (max-width:1419.98px) and (hover:hover) and (pointer:fine){
    :root{--exw:clamp(360px, calc(100vw - 784px), 460px); --paper-w:min(760px, calc(100vw - var(--exw) - 24px));}
    .pg{grid-template-columns:var(--exw) var(--paper-w) minmax(0,1fr);}
    .sheet::before{left:calc(var(--exw) + var(--paper-w) / 2);}
    .scorebar, .data-errors{margin-left:var(--exw); margin-right:0;}
    .case-ex{grid-column:1; grid-row:1 / span var(--n, 1); position:sticky; top:calc(var(--bar-h) + 12px); align-self:start; justify-self:end; width:calc(100% - 20px); max-height:calc(100vh - var(--bar-h) - 24px); overflow:auto; margin:20px 14px 0 0; padding:1px 1px 12px;}
    .case-ex .tables{flex-direction:column; flex-wrap:nowrap;} .case-ex .exbox{display:block;}
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 22px;} .qside:empty{display:none;}
  }
  /* tablets (touch) and narrow windows: the code sticks to the top, under the score bar, and scrolls on its own */
  /* tablets (touch, 600 px and wider): the sheet fills the screen edge to edge, side notes go under the answer */
  @media (pointer:coarse) and (min-width:600px){
    :root{--paper-w:100vw; --pad:40px;}
    html{font-size:clamp(17px, calc(14px + 0.5vw), 21px);}   /* wider sheet, larger type: about 18px at 820, 20px at 1180, 21px at 1366 */
    .sheet::before{box-shadow:none;}
    .scorebar, .data-errors{width:100%; max-width:none; margin-left:0; margin-right:0;}
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 22px;} .qside:empty{display:none;}
  }
  @media (pointer:coarse), (max-width:999.98px){
    .case-ex{grid-column:2; grid-row:auto; position:sticky; top:var(--bar-h); z-index:6; justify-self:stretch; width:auto; margin:0; background:var(--paper);
      max-height:max(calc(var(--vvh, 100dvh) * 0.4), calc(var(--vvh, 100dvh) - var(--bar-h) - 330px)); top:calc(var(--bar-h) + var(--vvt, 0px)); overflow-y:auto; overflow-x:auto; padding:12px var(--pad) 10px; border-bottom:1px solid var(--rule); box-shadow:0 8px 14px -12px rgba(0,0,0,0.3);}
    .case-ex .tables{flex-direction:column; flex-wrap:nowrap; gap:0;} .case-ex .exbox{display:block; background:none; box-shadow:none; padding:0;}
    .case-ex h2{font-size:1rem;} .case-ex .uses{margin:0 0 6px;}
    .case-ex .excode{margin-bottom:18px;} .case-ex table.t{margin-bottom:18px;}
  }
  /* touch devices: the score bar follows the visible area when the on-screen keyboard pans the page */
  @media (pointer:coarse){ .scorebar{top:var(--vvt, 0px);} }
  /* tablets 1000 px and wider (landscape; width, not orientation, so an Android keyboard does not flip the layout): the code stays fixed in the left 3/5, questions, answers and notes scroll in the right 2/5 */
  @media (pointer:coarse) and (min-width:1000px){
    :root{--pad:28px;}
    .case.pg{grid-template-columns:minmax(0,3fr) minmax(0,2fr);}
    .case.pg > .qmain, .case.pg > .qside{grid-column:2;}
    .case-ex{grid-column:1; grid-row:1 / span 99; align-self:start; justify-self:stretch; position:sticky; top:calc(var(--bar-h) + var(--vvt, 0px)); z-index:2;
      width:auto; height:calc(var(--vvh, 100dvh) - var(--bar-h)); max-height:none; margin:0; overflow-y:auto; overflow-x:auto;
      padding:16px 24px 24px; background:var(--bg); border-right:1px solid var(--rule); border-bottom:none; box-shadow:none;}
    .case-ex .excode{font-size:0.78rem;}
    .qhead{flex-wrap:wrap; row-gap:2px;} .exref, .qtools{white-space:nowrap;}
  }
</style>
</head>
<body>

<div class="sheet">
  <header class="pg"><div class="inpage">
    <h1 id="quizTitle">Quiz</h1>
    <p class="sub" id="quizSub"></p>
    <div class="tools">
      <button class="link" id="printBtn" type="button">Print</button>
      <button class="link" id="printSolBtn" type="button">Print with solution</button>
      <span class="setwrap"><button class="link" id="menuBtn" type="button" aria-expanded="false">Settings</button>
      <div class="setrow" id="settings">
        <button class="link" id="darkSw" type="button">Night mode</button>
      </div></span>
      <form class="qsearch" id="qSearchForm" autocomplete="off">
        <input id="qSearch" type="text" inputmode="numeric" placeholder="Go to no. (1, 3-5)" aria-label="Question numbers">
        <button class="link" id="qClear" type="button">Clear</button>
        <div class="qwarn" id="qWarn" role="alert"></div>
      </form>
    </div>
    <div class="howto">Enter check · Enter again next · Ctrl+Enter new line · Tab next · Ctrl+Q memo</div>
  </div></header>

  <div class="scorebar" id="scorebar"><div class="in">
    <div class="tally">Checked <b id="checkedCount">0</b>/<span id="totalCount">0</span> · Passed <b id="passedCount">0</b></div>
    <div class="bar-links">
      <button class="link on" id="allViewBtn" type="button">All</button>
      <button class="link" id="reviewBtn" type="button" disabled>Review not passed (0)</button>
      <button class="link" id="flagBtn" type="button" disabled>Marked (0)</button>
      <button class="link" id="showAllBtn" type="button" title="Show the model answer of every question (not graded)">Show all answers</button>
      <button class="link" id="copyMissedBtn" type="button" disabled>Copy not passed #</button>
      <button class="link" id="saveBtn" type="button">Save</button>
      <button class="link" id="resetBtn" type="button">Restart</button>
    </div>
  </div></div>

  <div class="pg"><div class="banner inpage" id="reviewBanner"><span id="reviewBannerText"></span><span id="reviewBannerActions"></span></div></div>
  <main class="pg" id="quiz"></main>
  <footer class="pg"><div class="inpage" id="quizFooter"></div></footer>
</div>

<button class="memo-tab" id="memoTab" type="button">Memo</button>
<aside class="memo" id="memo" aria-label="Memo">
  <div class="memo-head"><span>Memo</span><span><button class="link" id="memoBold" type="button" style="font-weight:700">B</button><button class="link" id="memoClose" type="button">Close</button></span></div>
  <div class="memo-text" id="memoText" contenteditable="true" spellcheck="false" data-placeholder="Notes…  Ctrl+B bold"></div>
</aside>

<div id="printSheet"></div>
<div class="lightbox" id="lightbox"><div class="lb-body" id="lbBody"></div></div>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const fm0 = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);
const fm = t => String(t).split(/`([^`]+)`/).map((p, i) => i % 2 ? `<code class="ic">${esc(p)}</code>` : fm0(p)).join('')
  .replace(/\*\*(.+?)\*\*/g, '<span class="lbx">$1</span>');   // `code` -> monospace, **term** -> semibold
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}
function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = rows.shift().split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls: L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5))), code: L.filter(l => l.startsWith('@code ')).flatMap(l => l.slice(6).split(';;')) };
      if(!cases[id].tbls.length && !cases[id].code.length) errs.push(`exhibit ${id}: needs at least one @tbl or @code line`);
      return;
    }
    const who = `Q${questions.length + 1}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, key results, model answer)`); return; }
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    const self = L[2] === '~';
    const kws = self ? [] : L[2].split('|').map(g => g.split(' / ').map(s => s.trim()).filter(Boolean));
    if(!self && (kws.length < 1 || kws.some(g => !g.length))) errs.push(`${who}: empty key-result group`);
    let use = null, fig = null, code = null;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) use = l.slice(5).trim();
      else if(l.startsWith('@tbl ')) fig = parseTbl(l.slice(5));
      else if(l.startsWith('@code ')) code = l.slice(6).split(';;');
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…"`);
    });
    questions.push({ tag, text: L[1], kws, self, model: L[3], use, fig, code, n: questions.length + 1 });
  });
  questions.forEach(q => { if(q.use && !cases[q.use]) errs.push(`Q${q.n}: @use ${q.use} but no "@case ${q.use}" block`); });
  if(!questions.length) errs.push('no questions found');
  return { meta, questions, cases, errs };
}
const PARSED = parseQuizData(document.getElementById('quizData').textContent);
PARSED.questions.forEach(q => { const m = q.text.match(/\blines?\s+(\d+)(?:\s*[–-]\s*(\d+))?/i); q.hl = m ? [+m[1], +(m[2] || m[1])] : null; });   // code lines a question refers to
const META = PARSED.meta, QUIZ_TITLE = META.title || 'Quiz', QUESTIONS = PARSED.questions, CASES = PARSED.cases, N = QUESTIONS.length;
const $ = id => document.getElementById(id);
if(PARSED.errs.length){ const b = document.createElement('div'); b.className = 'data-errors'; b.innerHTML = '<b>Quiz data needs fixing</b><ul>' + PARSED.errs.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>'; document.body.insertBefore(b, document.body.firstChild); }
$('quizTitle').textContent = QUIZ_TITLE; $('quizSub').textContent = META.sub || ''; document.title = QUIZ_TITLE + (META.sub ? ' · ' + META.sub.split(' · ')[0] : '');
$('quizFooter').textContent = `${META.subject || ''} — ${META.textbook || ''}`;

/* checking: key results found in the written answer */
const PASS = 0.5;
let showAll = false;   // "Show all answers": model answers in the side notes without checking
let drafts = new Array(N).fill(''), snap = new Array(N).fill(null), filterMode = 'all', reviewList = [], flagList = [], pickNums = null, current = 0;
const missed = new Set(), flagged = new Set();
const norm = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const isShort = alt => /^[\x00-\x7f]+$/.test(alt) && norm(alt).length <= 4;
const shortRe = alt => new RegExp('(^|[^a-z0-9.,])' + reEsc(alt.toLowerCase()).replace(/\s+/g, '\\s*') + '($|[^a-z0-9.,]|[.,](?![0-9]))', 'i');
function altMatch(alt, text){ const n = norm(alt); if(!n) return false; return isShort(alt) ? shortRe(alt).test(text) : norm(text).includes(n); }
function findRange(alt, full){
  const n = norm(alt);
  if(!n) return null;
  if(isShort(alt)){ const m = shortRe(alt).exec(full); return m ? [m.index + m[1].length, m.index + m[0].length - m[2].length] : null; }
  let ns = ''; const idx = [];
  for(let i = 0; i < full.length; i++){ const c = full[i].toLowerCase(); if(/[a-z0-9가-힣]/.test(c)){ ns += c; idx.push(i); } }
  const p = ns.indexOf(n);
  return p < 0 ? null : [idx[p], idx[p + n.length - 1] + 1];
}
const htmlToText = h => { const d = document.createElement('div'); d.innerHTML = h.replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(div|p)[^>]*>/gi, '\n'); return d.textContent; };
function grade(qi){
  if(snap[qi] === null) return null;
  const q = QUESTIONS[qi]; if(q.self) return { self: true, hits: [], n: 0, t: 0 };
  const text = htmlToText(snap[qi]);
  const hits = q.kws.map(g => g.some(a => altMatch(a, text)));
  return { hits, n: hits.filter(Boolean).length, t: hits.length };
}
const resultOf = qi => { const g = grade(qi); if(!g) return null; if(g.self) return 2; return g.n / g.t >= PASS ? 2 : g.n ? 1 : 0; };
/* underline the first occurrence of each listed wording group inside an element */
function markIn(el, groups, cls){
  const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while(w.nextNode()) nodes.push(w.currentNode);
  const starts = []; let full = '';
  nodes.forEach(n => { starts.push(full.length); full += n.nodeValue + '\n'; });
  const ranges = [];
  groups.forEach(grp => { for(const a of grp){ const r = findRange(a, full); if(r){ ranges.push(r); break; } } });
  ranges.sort((a, b) => b[0] - a[0]);
  let limit = Infinity;
  ranges.forEach(([s, e]) => {
    if(e > limit) return; limit = s;
    for(let k = nodes.length - 1; k >= 0; k--){
      const ns = starts[k], len = nodes[k].nodeValue.length, a = Math.max(s, ns) - ns, b = Math.min(e, ns + len) - ns;
      if(b <= a) continue;
      let node = nodes[k];
      if(b < len) node.splitText(b);
      if(a > 0) node = node.splitText(a);
      const sp = document.createElement('span'); sp.className = 'mk ' + cls; node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
  });
}

const visibleIndices = () => { const all = QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n)); return filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : all; };
const scopeIdx = () => QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n));
function ranges(nums){ const a = [...nums].sort((x, y) => x - y), out = []; for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; } return out.join(', '); }
function exhibitHTML(id, idx, boxed){ const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(i => QUESTIONS[i].n); const head = `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p>`;
  const code = c.code.length ? `<pre class="codebox excode">${rHLn(c.code.join('\n'))}</pre>` : '';   /* R code exhibit: numbered lines */
  if(code){ if(boxed) return `<div class="tables"><div class="exbox">${head}${code}</div>${c.tbls.map(t => `<div class="exbox">${tblHTML(t)}</div>`).join('')}</div>`; return head + code + (c.tbls.length ? `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>` : ''); }
  if(boxed) return `<div class="tables">${c.tbls.map((t, i) => `<div class="exbox">${i ? '' : head}${tblHTML(t)}</div>`).join('')}</div>`;   /* screen: each statement on its own card */ return head + `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>`; }
const lightbox = $('lightbox'); lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ $('lbBody').innerHTML = html; lightbox.classList.add('show'); }
const richHtml = node => { const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['DIV', 'P'].includes(c.nodeName) ? '<div>' + out(c) + '</div>' : out(c)).join(''); return out(node); };
function qaText(qi){
  const q = QUESTIONS[qi], g = grade(qi);
  return `Q${q.n}. ${q.text}\n` + (q.code ? q.code.join('\n') + '\n' : '') + (drafts[qi].trim() ? `My answer:\n${htmlToText(drafts[qi]).trim()}\n` : '') + (g && !g.self ? `Key results ${g.n}/${g.t}: ` + q.kws.map((k, i) => (g.hits[i] ? '[x] ' : '[ ] ') + k[0]).join('  ') + '\n' : '') + `Model answer:\n${explLines(q.model).join('\n')}`;
}

/* ---------- R syntax colouring for @code lines ---------- */
function rHL(src){
  const RX = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?\b)|(\b(?:function|if|else|for|while|repeat|in|break|next|return|TRUE|FALSE|NULL|NA|NaN|Inf)\b)|([A-Za-z_.][\w.]*)(?=\s*\()|(?<=[(,]\s*)([A-Za-z_.][\w.]*)(?=\s*=(?!=))|(<-|->|%[^%\s]*%|\|>|[~$:])/g;
  return src.split('\n').map(line => {
    let o = '', last = 0, m;
    RX.lastIndex = 0;
    while((m = RX.exec(line))){
      o += esc(line.slice(last, m.index));
      const cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : m[4] ? 'kw' : m[5] ? 'fn' : m[6] ? 'arg' : 'op';
      o += `<span class="hl-${cls}">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    return o + esc(line.slice(last));
  }).join('\n');
}
const rHLn = src => rHL(src).split('\n').map((l, i) => `<span class="cl"><span class="ln">${i + 1}</span>${l}</span>`).join('');
function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];
  const main = document.createElement('div'); main.className = 'qmain inpage' + (first ? ' first' : ''); main.dataset.index = qi;
  main.addEventListener('click', () => { if(current !== qi){ current = qi; markCurrent(); } });   /* selecting a question highlights its code lines */
  const head = document.createElement('div'); head.className = 'qhead';
  head.innerHTML = `<span class="qnum">${q.n}</span><span class="qtag">${fm(q.tag)}</span>` + (q.use ? `<span class="exref">· Exhibit ${esc(q.use)}</span>` : '') + (retry ? '<span class="retry">· retry</span>' : '');
  const tools = document.createElement('span'); tools.className = 'qtools';
  if(snap[qi] !== null){
    const cp = document.createElement('span'); cp.className = 'qcopy'; cp.setAttribute('role', 'button'); cp.textContent = 'copy'; cp.title = 'Copy question, your answer and the model answer';
    cp.addEventListener('click', () => copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed')));
    tools.appendChild(cp);
  }
  const fl = document.createElement('span'); fl.className = 'qflag' + (flagged.has(qi) ? ' on' : ''); fl.setAttribute('role', 'button'); fl.textContent = 'review'; fl.title = 'Mark for review';
  fl.addEventListener('click', () => { const on = !flagged.has(qi); on ? flagged.add(qi) : flagged.delete(qi); fl.classList.toggle('on', on); updateChrome(); });
  tools.appendChild(fl); head.appendChild(tools); main.appendChild(head);
  const p = document.createElement('p'); p.className = 'qtext'; p.innerHTML = fm(q.text); main.appendChild(p);
  if(q.code){ const pre = document.createElement('pre'); pre.className = 'codebox'; pre.innerHTML = rHL(q.code.join('\n')); main.appendChild(pre); }
  if(q.fig){ const f = document.createElement('div'); f.className = 'qfig zoomable'; f.innerHTML = tblHTML(q.fig); f.addEventListener('click', () => openLightbox(tblHTML(q.fig))); main.appendChild(f); }
  const ed = document.createElement('div'); ed.className = 'answer'; ed.contentEditable = 'true'; ed.spellcheck = false;
  ed.setAttribute('role', 'textbox'); ed.setAttribute('aria-multiline', 'true'); ed.dataset.placeholder = 'Write your answer here…';
  ed.innerHTML = drafts[qi];
  ed.addEventListener('focus', () => { current = qi; markCurrent(); });
  ed.addEventListener('input', () => { drafts[qi] = richHtml(ed); });
  ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
  ed.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){
      e.preventDefault();
      if(e.ctrlKey || e.metaKey || e.shiftKey){ document.execCommand('insertParagraph'); drafts[qi] = richHtml(ed); }
      else {
        const v = visibleIndices(), nx = v[v.indexOf(qi) + 1];
        if(snap[qi] !== null && richHtml(ed) === snap[qi]){ if(nx !== undefined) focusAnswer(nx, true); }   /* already checked, nothing changed: move on */
        else check(qi, ed, true);                                                                       /* new or edited answer: check it */
      }
      return;
    }
    if(e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey){
      const v = visibleIndices(), t = v.indexOf(qi) + (e.shiftKey ? -1 : 1);
      if(t >= 0 && t < v.length){ e.preventDefault(); drafts[qi] = richHtml(ed); focusAnswer(v[t], true); }
    }
  });
  main.appendChild(ed);
  if(snap[qi] !== null && !q.self){ const g = grade(qi); markIn(ed, q.kws.filter((_, i) => g.hits[i]), 'ok'); }
  const acts = document.createElement('div'); acts.className = 'acts';
  const cb = document.createElement('button'); cb.type = 'button'; cb.className = 'link'; cb.style.color = 'var(--ink)';
  cb.textContent = q.self ? 'Show answer' : snap[qi] !== null ? 'Check again' : 'Check';
  cb.addEventListener('click', () => check(qi, ed)); acts.appendChild(cb);
  if(snap[qi] !== null){
    const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'link'; rb.textContent = 'Hide answer';
    rb.addEventListener('click', () => { drafts[qi] = richHtml(ed); snap[qi] = null; render(); }); acts.appendChild(rb);
  }
  main.appendChild(acts);

  const side = document.createElement('aside'); side.className = 'qside';
  if(snap[qi] !== null){
    const g = grade(qi);
    const head2 = g.self ? '<div class="sn-head">Model answer</div>' :
      `<div class="sn-head"><span class="${g.n / g.t >= PASS ? 'ok' : g.n ? 'part' : 'no'}">${g.n / g.t >= PASS ? 'Passed' : g.n ? 'Partly' : 'Not yet'}</span> · ${g.n} of ${g.t} key results</div>`;
    side.innerHTML = head2 + fmtExpl(q.model);
    if(!g.self) markIn(side, q.kws.filter((_, i) => !g.hits[i]), 'no');
  } else if(showAll){ side.innerHTML = '<div class="sn-head">Answer</div>' + fmtExpl(q.model); }
  return [main, side];
}
function check(qi, ed, keep){ drafts[qi] = richHtml(ed); snap[qi] = drafts[qi]; current = qi; render(); if(keep) focusAnswer(qi, true); }
function markCurrent(){ document.querySelectorAll('#quiz .qmain').forEach(m => m.classList.toggle('cur', +m.dataset.index === current)); hlCode(); }
/* the code lines named in the question text ("Line 5", "Lines 7-8") get a soft grey background in the exhibit */
function hlCode(){
  document.querySelectorAll('.excode .cl.hl').forEach(e => e.classList.remove('hl'));
  const q = QUESTIONS[current]; if(!q || !q.use || !q.hl) return;
  const m = $('quiz').querySelector(`.qmain[data-index="${current}"]`), sec = m && m.closest('.case'); if(!sec) return;
  const lines = sec.querySelectorAll('.case-ex .excode .cl'); let first = null, last = null;
  for(let k = q.hl[0]; k <= q.hl[1]; k++){ const el = lines[k - 1]; if(el){ el.classList.add('hl'); first = first || el; last = el; } }
  const box = sec.querySelector('.case-ex');
  if(first && box && box.scrollHeight > box.clientHeight + 2){   /* exhibit scrolls on its own: bring the lines into view */
    const c = box.getBoundingClientRect(), r = first.getBoundingClientRect(), rl = last.getBoundingClientRect();
    if(r.top < c.top + 8 || rl.bottom > c.bottom - 8) box.scrollBy({ top: r.top - c.top - 56, behavior: 'smooth' });
  }
}
function caretEnd(ed){ const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
function focusAnswer(qi, end){ current = qi; markCurrent(); const ed = $('quiz').querySelector(`.qmain[data-index="${qi}"] .answer`); if(ed){ ed.focus({ preventScroll: true }); if(end) caretEnd(ed); ed.closest('.qmain').scrollIntoView({ behavior: 'smooth', block: 'center' }); } }

function fitExhibits(){   /* an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    const ex = sec.querySelector('.case-ex');
    if(!ex) return;
    const cs = getComputedStyle(ex); if(cs.position !== 'sticky') return;
    const inner = ex.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const tooWide = [...ex.querySelectorAll('table')].some(t => { const p = t.parentElement, ps = getComputedStyle(p); return t.scrollWidth > p.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight) + 1; });
    if(ex.querySelector('.excode')) return;   /* a code exhibit stays sticky: its output tables scroll sideways inside their card */
    if(tooWide || ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);
function render(){
  const y0 = window.scrollY, quizEl = $('quiz');
  quizEl.innerHTML = '';
  const vis = visibleIndices(), retry = filterMode === 'review';
  if(!vis.length){ quizEl.innerHTML = `<div class="empty-state inpage">${filterMode === 'flagged' ? 'No questions marked for review.' : 'Nothing to review.'}</div>`; updateChrome(); return; }
  let first = true;
  for(let k = 0; k < vis.length; ){
    const q = QUESTIONS[vis[k]];
    if(q.use){
      const group = []; while(k < vis.length && QUESTIONS[vis[k]].use === q.use){ group.push(vis[k]); k++; }
      const sec = document.createElement('section'); sec.className = 'case pg';
      const ex = document.createElement('div'); ex.className = 'case-ex'; ex.innerHTML = exhibitHTML(q.use, vis, true); ex.style.setProperty('--n', String(group.length + 1));
      ex.querySelectorAll('table').forEach(t => { t.classList.add('zoomable'); t.addEventListener('click', () => openLightbox(t.outerHTML)); });
      sec.appendChild(ex);
      group.forEach((qi, j) => questionNodes(qi, first && j === 0, retry).forEach(n => sec.appendChild(n)));
      quizEl.appendChild(sec);
    } else { questionNodes(vis[k], first, retry).forEach(n => quizEl.appendChild(n)); k++; }
    first = false;
  }
  window.scrollTo(0, y0);
  fitExhibits();
  updateChrome();
  markCurrent();
}
function updateChrome(){
  const ids = scopeIdx().filter(i => !QUESTIONS[i].self);
  $('totalCount').textContent = scopeIdx().length;
  $('checkedCount').textContent = scopeIdx().filter(i => snap[i] !== null).length;
  $('passedCount').textContent = ids.filter(i => resultOf(i) === 2).length;
  const wl = ids.filter(i => snap[i] !== null && resultOf(i) < 2);
  const rb = $('reviewBtn'); rb.disabled = !wl.length || filterMode === 'review'; rb.textContent = filterMode === 'review' ? 'Reviewing…' : `Review not passed (${wl.length})`; rb.classList.toggle('on', filterMode === 'review');
  $('allViewBtn').classList.toggle('on', filterMode === 'all');
  const fc = scopeIdx().filter(i => flagged.has(i)).length, fb = $('flagBtn');
  fb.textContent = `Marked (${fc})`; fb.disabled = !fc && filterMode !== 'flagged'; fb.classList.toggle('on', filterMode === 'flagged');
  $('copyMissedBtn').disabled = !scopeIdx().some(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2));
  const done = filterMode === 'review' && reviewList.length && reviewList.every(i => snap[i] !== null);
  $('reviewBanner').classList.toggle('show', !!done);
  if(done){
    const still = reviewList.filter(i => resultOf(i) < 2);
    $('reviewBannerText').textContent = still.length ? `Review complete — ${still.length} of ${reviewList.length} still not passed.` : `Review complete — all ${reviewList.length} passed.`;
    const a = $('reviewBannerActions'); a.innerHTML = '';
    const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Back to all'; b.addEventListener('click', () => { filterMode = 'all'; render(); }); a.appendChild(b);
  }
  document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px');
}
$('reviewBtn').addEventListener('click', () => { const wl = scopeIdx().filter(i => !QUESTIONS[i].self && snap[i] !== null && resultOf(i) < 2); if(!wl.length) return; reviewList = wl; wl.forEach(i => { missed.add(i); snap[i] = null; }); filterMode = 'review'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('allViewBtn').addEventListener('click', () => { filterMode = 'all'; render(); });
$('showAllBtn').addEventListener('click', () => { showAll = !showAll; $('showAllBtn').textContent = showAll ? 'Hide all answers' : 'Show all answers'; $('showAllBtn').classList.toggle('on', showAll); render(); });
$('flagBtn').addEventListener('click', () => { flagList = scopeIdx().filter(i => flagged.has(i)); if(!flagList.length) return; filterMode = 'flagged'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('darkSw').addEventListener('click', () => $('darkSw').classList.toggle('on', document.documentElement.classList.toggle('dark')));

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const t = qSearch.value.replace(/[–—~]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t){ pickNums = null; qForm.classList.remove('active'); render(); return; }
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){ let m; if(/^\d+$/.test(tok)) out.add(+tok); else if((m = tok.match(/^(\d+)-(\d+)$/))){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); } else { qBad(`Not recognised: "${tok}"`); return; } }
  const miss = [...out].filter(n => n < 1 || n > N);
  if(miss.length){ qBad(`No question ${miss.join(', ')} (1–${N})`); return; }
  qBad(''); pickNums = out; qForm.classList.add('active'); filterMode = 'all'; render();
});
qSearch.addEventListener('input', () => qBad(''));
$('qClear').addEventListener('click', () => { pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); render(); });

$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function buildPrintSheet(){
  const idx = visibleIndices();
  let html = `<h1>${esc(QUIZ_TITLE)}</h1>${META.sub ? `<p class="p-sub">${esc(META.sub)}</p>` : ''}`, last = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== last) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    last = q.use;
    const lines = 2;                                               // print: two lines at the question text size (1.5em)
    html += `<div class="p-q"><p>${q.n}. ${q.use ? `[Exhibit ${esc(q.use)}] ` : ''}${fm(q.text)}</p>` + (q.code ? `<pre class="p-code">${rHL(q.code.join('\n'))}</pre>` : '') + (q.fig ? `<div class="p-fig">${tblHTML(q.fig)}</div>` : '') + `<div class="p-lines" style="--n:${lines}"></div></div>`;
  });
  html += `<section class="p-key"><h1>${esc(QUIZ_TITLE)} — Model answers</h1>` + idx.map(qi => { const q = QUESTIONS[qi]; return `<div class="p-s"><p><b>${q.n}.</b> ${fm(q.tag)}</p>${fmtExpl(q.model)}${q.kws.length ? `<p class="p-kw">Key results: ${q.kws.map(k => fm(k[0])).join(' · ')}</p>` : ''}</div>`; }).join('') + '</section>';
  $('printSheet').innerHTML = html;
}
window.addEventListener('beforeprint', buildPrintSheet);
window.addEventListener('afterprint', () => document.body.classList.remove('print-solution'));

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
$('copyMissedBtn').addEventListener('click', () => {
  const nums = scopeIdx().filter(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2)).map(i => QUESTIONS[i].n);
  copyText(`${QUIZ_TITLE} not passed: ${nums.join(', ')}`).then(() => showTip($('copyMissedBtn'), 'Copied'), () => {});
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}
window.addEventListener('resize', () => document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px'));
let armed = false, armTimer = null; const resetBtn = $('resetBtn');
resetBtn.addEventListener('click', () => {
  if(!armed){ armed = true; resetBtn.classList.add('danger'); resetBtn.textContent = 'Click again to clear answers'; armTimer = setTimeout(disarm, 4000); return; }
  clearTimeout(armTimer); disarm(); scopeIdx().forEach(i => { drafts[i] = ''; snap[i] = null; missed.delete(i); }); filterMode = 'all'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
function disarm(){ armed = false; resetBtn.classList.remove('danger'); resetBtn.textContent = 'Restart'; }

const memoEl = $('memoText');
const setMemoOpen = on => document.body.classList.toggle('memo-open', on);
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
$('memoBold').addEventListener('mousedown', e => e.preventDefault());
$('memoBold').addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
$('memoTab').addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'writtenQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.kws.map(k => k.join('/')).join('|')).join('\n'));
$('saveBtn').addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, drafts, snap, missed: [...missed], flagged: [...flagged], memo: memoEl.innerHTML })); showTip($('saveBtn'), 'Saved'); }catch(e){ showTip($('saveBtn'), 'Save failed'); }
});
try{
  const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if(d){
    if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = richHtml(memoEl); }
    if(d.sig === SAVE_SIG && Array.isArray(d.drafts) && d.drafts.length === N){
      const clean = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };
      drafts = d.drafts.map(clean); snap = d.snap.map(s => s === null ? null : clean(s));
      (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
      setTimeout(() => showTip($('saveBtn'), 'Progress restored'), 300);
    }
  }
}catch(e){}
render();
/* touch devices: --vvh / --vvt follow the visible area (on-screen keyboard), and the line being typed stays in view */
(function(){
  const vv = window.visualViewport, root = document.documentElement;
  if(!vv || !matchMedia('(pointer:coarse)').matches) return;
  let raf = 0;
  function keepCaret(){
    const a = document.activeElement;
    if(!a || !a.classList || !a.classList.contains('answer')) return;
    const s = window.getSelection();
    let r = s && s.rangeCount ? s.getRangeAt(0).getClientRects()[0] : null;
    if(!r || (!r.width && !r.height && !r.top)){ const b = a.getBoundingClientRect(); r = { top: Math.max(b.top, b.bottom - 40), bottom: b.bottom }; }   /* empty line: use the end of the answer */
    const top = vv.offsetTop + (parseFloat(getComputedStyle(root).getPropertyValue('--bar-h')) || 52) + 8, bottom = vv.offsetTop + vv.height - 16;
    if(r.bottom > bottom) window.scrollBy(0, r.bottom - bottom + 24);
    else if(r.top < top) window.scrollBy(0, r.top - top - 24);
  }
  function sync(){
    raf = 0;
    root.style.setProperty('--vvh', vv.height + 'px');
    root.style.setProperty('--vvt', Math.max(0, vv.offsetTop) + 'px');
    keepCaret();
  }
  const queue = () => { if(!raf) raf = requestAnimationFrame(sync); };
  vv.addEventListener('resize', queue); vv.addEventListener('scroll', queue);
  document.addEventListener('input', e => { if(e.target.classList && e.target.classList.contains('answer')) queue(); });
  document.addEventListener('selectionchange', queue);
  sync();
})();
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
