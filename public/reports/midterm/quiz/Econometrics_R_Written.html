===
W1 · Variable assignment
Which symbols assign a value to a variable in R, and what does an assignment do?
assign / assignment / 할당|right-hand side / right side / value on the right / 우변|stored / stores / saves / saved / 저장|left-hand side / left side / variable on the left / 좌변
`<-` and `=` are the **assignment** operators in R; The **right-hand side** (a value or the result of a calculation) is evaluated; The result is **stored** in the variable on the left-hand side
@code x <- 5;;y = x + 2
===
W1 · Vector creation
Which function combines several values into one vector in R, and how does it work?
c() / c function / concatenate / combine|one vector / single vector / a vector / 하나의 벡터|joins / combines / links / puts together / 연결 / 결합
The function **`c()`** (concatenate) combines several values into **one vector**; `c(9, 8, 7, 6)` joins the four numbers into a single vector
@code try1 <- c(9, 8, 7, 6)
===
W1 · Vector arithmetic
What happens when a single number is added to a vector (try1 + 5), and what happens when two vectors of the same length are added?
each element / every element / element-wise / 각 요소|element by element / one by one / individually / separately / position by position / 개별 / 각각
`try1 + 5` adds 5 to **each element** of the vector and gives 14 13 12 11; Two vectors of the same length are added **element by element**, position by position, so `try1 + try2` gives 14 12 10 8
@code try1 <- c(9, 8, 7, 6);;try2 <- c(5, 4, 3, 2);;try1 + 5;;try1 + try2
===
W1 · Structure of a data frame
In an R data frame, what do the rows and the columns represent?
observation / observations / subject / subjects / case / cases / 관측대상 / 피험자|variable / variables / 변수
Each **row** is one **observation** (a subject or a case); Each **column** is one **variable**; `dim(df)` returns the number of rows and the number of columns
@code View(df);;dim(df)
===
W1 · The summary() function
What statistics does summary() report when it is applied to a numeric vector or to a data frame?
minimum / maximum / min / max / 최소 / 최대|mean / median / 평균 / 중앙값|quartile / quartiles / 1st Qu / 3rd Qu / 사분위
`summary()` reports the **minimum** and the **maximum**; It reports the **mean** and the **median**; It reports the first and third **quartiles**; For a data frame it does this for every column
@code summary(x)
===
W1 · Mean versus median with outliers
When a data set contains extreme outliers, which measure of the center is more appropriate, the mean or the median, and why?
median / 중앙값|sensitive / affected / influenced / pulled / 민감 / 영향
The **median** is more appropriate; The mean is **sensitive** to outliers because every value enters the calculation, so one extreme value pulls it away from the center; The median depends only on the middle position of the sorted data, so it is hardly affected
@code mean(x);;median(x)
===
W1 · Reading a histogram
Name two statistical features of a data set that you can read from a histogram created with hist().
distribution / shape / skewness / skewed / 분포 / 모양|frequency / frequencies / count / counts / 빈도|center / centre / central / location / mode / 중심
A histogram shows the **shape of the distribution**, for example skewness; It shows the **frequency** (count) of observations in each bin; It shows where the **center** of the data lies; `breaks` controls the number of bins
@code hist(x, breaks = 15)
===
W1 · Finding the mode with table() and sort()
How can table() and sort() be combined in R to find the mode of a numeric variable?
table() / frequency table / 빈도표|sort() / decreasing / descending / 내림차순|highest frequency / largest count / most frequent / 가장 높은 빈도 / 최빈값
`table(x)` builds a **frequency table** of each value; `sort(table(x), decreasing = TRUE)` orders it in **descending** order; The value with the **highest frequency**, the first entry, is the mode
@code table(x);;sort(table(x), decreasing = TRUE)

W2 · Interpreting Log Wage in W2
In the W2 dataset description, lwage is defined as the natural log of wage. What is the primary econometric purpose of using lwage instead of raw wage?

W2 · Binary Dummy Variables in W2
In the W2 dataset, variables like married, black, south, and urban are coded as binary indicators (e.g., =1 if married). How are these interpreted in regression?
binary dummy variables / indicator variables / 이진 가변수 / 지시 변수|difference in intercept / base group comparison / 절편의 차이 / 기준 집단 대비 차이
Variables such as married and urban function as **binary dummy variables**, representing group membership whose coefficients measure the **difference in intercept** relative to the base category

W2 · Handling Missing Values with na.strings
In Lab 2\_2, what is the precise statistical function of setting na.strings="." when importing data via read.csv()?
replaces missing values / replaces dot with NA / 결측치 처리 / NA로 치환|prevents calculation errors / accurate statistical evaluation / 연산 오류 방지 / 정확한 통계 계산
Setting **na.strings="."** automatically **replaces missing values** (represented by dots) with **NA**, which **prevents calculation errors** when computing summary statistics
===
W2 · Attaching and Detaching Data Frames
What are the functional role and the potential risk of using attach(practice) and detach(practice) in R?
direct variable access / shortcut without dollar sign / $ 없이 변수 직접 접근|name conflict / masking variables / 변수명 충돌 / 이름 가림 현상
`attach()` allows **direct variable access** without typing the dataset prefix, but introduces the risk of a **name conflict** if identical variable names exist
===
W2 · Sum of Mean Deviations Identity
When computing sum(competence - mean(competence)), why does the resulting value theoretically equal zero?
cancel out / offset / 완전히 상쇄|positive and negative deviations / 양의 편차와 음의 편차
The sum of deviations from the mean is always zero because **positive and negative deviations** around the mean perfectly **cancel out**
===
W2 · Variance vs Standard Deviation Units
Why do we take the square root of variance to compute standard deviation instead of using variance directly?
squared units / 제곱 단위|original unit of measurement / 원래 측정 단위 / 해석 용이성
Variance results in **squared units** that inflate error interpretation, whereas taking the square root reverts the metric back to the **original unit of measurement**
===
W2 · IQR Robustness under Skewness
When data is positively skewed with outliers, why is the Interquartile Range (IQR) preferred over standard deviation?
robust to outliers / resist extreme values / 이상치에 강함 / 덜 민감함|middle 50 percent / 중간 50% 범위
The **IQR** measures the spread of the **middle 50 percent** of the data, making it **robust to outliers** that distort the mean and standard deviation

W2 · Mosaic Formula Interface Advantages
In Lab 3\_2, what is the key benefit of using formula notation (e.g., mean(mpg ~ am, data = mtcars)) from the mosaic package?
formula notation / tilde interface / ~ 공식 표기법|group-by calculation / eliminates manual indexing / 그룹별 계산 / 수동 인덱싱 생략

W2 · Package Namespace Resolution Operator
Why would an analyst use the explicit package syntax base::mean(mpg ~ am, data = mtcars)?
namespace resolution / double colon operator / 네임스페이스 명시 / 콜론 연산자|override mask / function conflict / 함수 이름 충돌 방지
The double-colon operator performs **namespace resolution** to explicitly invoke a function, allowing you to **override mask** issues when package function names conflict
===
W2 · Vectorized Function Application using sapply
In Lab 4\_2, what is the functional advantage of using sapply(data$openingHour, to12) over a standard loop?
vectorized application / apply function across elements / 벡터화 적용 / 개별 원소 적용|avoids explicit loops / efficient code / 반복문 생략 / 코드 간소화

W2 · String Pattern Detection Logic
What does the stringr function str\_detect(str, fixed(",")) return, and how is it used in data pipelines?
boolean TRUE FALSE / 논리값 반환 / 참 거짓|pattern matching / detects substring / 문자열 패턴 탐색 / 쉼표 유무 확인
`str_detect()` executes **pattern matching** to evaluate whether a substring exists, returning a **boolean TRUE FALSE** value utilized in conditional logic
===
W5 · Scatterplot formula
Read the code. In the formula perform ~ eye, which variable is the dependent variable and which is the independent variable, and how does plot() use them?
perform / dependent / outcome / 종속변수 / y축 / 결과변수|eye / independent / predictor / 독립변수 / x축 / 설명변수
In **`perform ~ eye`** the variable on the left, **perform**, is the dependent (outcome) variable and goes on the y-axis; the variable on the right, **eye**, is the independent (predictor) variable and goes on the x-axis; That is why the outcome must be written first
@code plot(perform ~ eye)
===
W5 · OLS line and the two means
The code draws a scatterplot of perform on eye, the OLS line (blue), a horizontal line at the mean of perform (red) and a vertical line at the mean of eye (green). Where does the blue line pass, and what does this show about OLS?
passes through / intersection / crosses / 지나 / 통과 / 교점 / 교차|mean of x / mean(x) / mean of eye / x의 평균 / eye의 평균|mean of y / mean(y) / mean of perform / y의 평균 / perform의 평균
The blue OLS line always **passes through** the point where the vertical line at the **mean of x** (eye) meets the horizontal line at the **mean of y** (perform), so the fitted line is anchored at the point of means
@code plot(perform ~ eye);;eye_regr = lm(perform ~ eye);;abline(eye_regr, col="blue");;abline(h=mean(perform), col="red");;abline(v=mean(eye), col="green")
===
W5 · R-squared equals squared correlation
For the simple regression perform ~ skill, the code compares the model R-squared (about 0.046) with the squared correlation. Why does the script round the difference to 16 digits instead of testing with ==, and what equality is being checked?
r-squared equals correlation squared / correlation squared / r^2 = R^2 / 상관계수의 제곱 / 결정계수는 상관계수의 제곱|small differences / floating point / rounding error / 부동소수점 / 반올림 오차 / 미세한 차이 / 계산상의 차이
It checks that in a simple linear regression **R-squared equals the correlation squared**; The two numbers are computed by different formulas, so they can differ by **tiny floating-point (rounding) differences**; rounding the difference to 16 digits lets the check ignore that noise
@code skill_summary = summary(lm(perform ~ skill));;(skill_coef = cor(perform, skill)^2);;round(skill_summary$r.squared - skill_coef, 16)
===
W5 · Null and alternative of the F-test
The code fits perform on skill and ravens, and the last line of the summary reports F(2, 82) = 3.3 with p = 0.04184. State the null and alternative hypotheses of this F-test.
all coefficients are 0 / all coefficients are zero / 계수가 모두 0 / 계수는 모두 0 / both coefficients are 0 / \beta_1 = \beta_2 = 0|at least one / 적어도 하나 / not 0 / not zero / 0이 아니
The null hypothesis is that **all coefficients are 0** (the skill and ravens slopes are both 0, \beta_1 = \beta_2 = 0); The alternative is that **at least one** of them is not 0
@code mult_lm = lm(formula = perform ~ skill + ravens);;(mult_summary = summary(mult_lm))
===
W5 · Degrees of freedom in the F-statistic
In the output F(2, 82) = 3.3 for the model perform ~ skill + ravens, what do the numerator degrees of freedom (2) and the denominator degrees of freedom (82) represent?
number of predictors / number of slope coefficients / 예측변수의 수 / 독립변수의 수 / 설명변수의 수|residual degrees of freedom / residual df / 잔차 자유도 / n - k - 1 / n - 3 / n-3
The numerator df, 2, is the **number of predictors** tested (skill and ravens); The denominator df, 82, is the **residual degrees of freedom**, n - k - 1 = n - 3, which implies n = 85 observations
@code mult_summary = summary(lm(perform ~ skill + ravens));;mult_summary$fstatistic
===
W5 · Conclusion of the F-test
The F-test of the model perform ~ skill + ravens gives F(2, 82) = 3.3 and p = 0.04184. At the 5% significance level, what should we conclude about the model as a whole?
reject the null hypothesis / 귀무가설 기각 / 귀무가설을 기각|at least one / 적어도 하나 / not 0 / 0이 아니|better than / no predictors / intercept-only / significant / 유의 / 예측변수가 없는 모형 / 설명력
Because the p-value 0.04184 is less than 0.05, we **reject the null hypothesis**; At least one of the coefficients is not 0, so the model explains perform **significantly better than a model with no predictors**
@code # F(2,82) = 3.3, p = 0.04184 (alpha = 0.05)
===
W5 · Reading the coefficients
The fitted equation of perform on skill and ravens is y = -4.355e-16 + 0.1712 * skill + 0.1746 * ravens, and all variables are standardized (mean 0, standard deviation 1). Interpret the coefficient 0.1712 and explain why the intercept is essentially 0.
holding ravens constant / controlling for ravens / ceteris paribus / ravens를 통제 / ravens를 고정 / 다른 변수를 고정|standard deviation / 표준편차 / 1 SD / one SD|standardized / mean 0 / mean of 0 / 평균이 0 / 표준화 / passes through the means / 평균점
**Holding ravens constant**, a one **standard deviation** increase in skill is associated with a 0.1712 standard deviation increase in predicted perform; Because all variables are **standardized** (mean 0), the regression plane passes through the point of means, so the intercept is about 0
@code mult_summary$coefficients
===
W5 · Meaning of predict()
Read the code. It returns 0.3475 for a group whose skill is 0.5 and whose ravens score is 1.5. What does this number represent and how is it obtained from the model?
predicted value / point estimate / 예측값 / 점추정치 / 종속변수의 예측|substitut / plug / regression equation / estimated equation / 대입 / 회귀식 / 추정된 식
The value is the **predicted value (point estimate)** of perform for skill = 0.5 and ravens = 1.5; It is obtained by **substituting** these values into the estimated **regression equation**: -4.355e-16 + 0.1712 * 0.5 + 0.1746 * 1.5, which is about 0.3475
@code predict(mult_lm, data.frame(skill=0.5, ravens=1.5))
===
W5 · Columns returned with interval = "confidence"
Read the code. It supplies two new cases, (skill 0.5, ravens 1.5) and (skill 1.5, ravens 0.5), and asks for a 95% confidence interval. What does the output contain for each case, and what population quantity does the interval describe?
fit / predicted value / 예측값 / 점추정치|lwr / upr / lower and upper / lower bound / upper bound / 하한 / 상한|population average / population mean / mean of the dependent variable / 모집단 평균 / 모평균
For each case (one row per pair) the output gives **fit**, the predicted value (about 0.3475 and 0.3441), plus the **lower and upper** bounds (lwr, upr) of a 95% confidence interval; The interval expresses how accurate our estimate of the **population average** of perform is at those predictor values
@code predict(mult_lm, data.frame(skill=c(0.5,1.5), ravens=c(1.5,0.5)), interval = "confidence", level = 0.95)
===
W5 · Confidence band code
The code predicts over 10,000 x-values and shades the region between two columns of pred. What do pred[ ,2] and pred[ ,3] contain, and what does the shaded polygon show?
lower bound / lwr / 하한 / 하한선|upper bound / upr / 상한 / 상한선|confidence band / confidence interval / shaded / 신뢰구간 / 신뢰대 / 음영 / 색칠
The columns of pred are fit, lwr and upr, so pred[ ,2] holds the **lower bounds** and pred[ ,3] holds the **upper bounds** of the 95% confidence interval at every x-value; The polygon fills the area between them, drawing a shaded **confidence band** around the regression line
@code pred <- predict(eye_regr, data.frame(eye=points), interval = "confidence", level = 0.95);;polygon(c(rev(points), points), c(rev(pred[ ,3]), pred[ ,2]), col = rgb(0, 0, 0, 0.1), border = NA)

W5 · Confidence interval versus prediction interval
Suppose the call shown is changed from interval = "confidence" to interval = "prediction". How does the meaning and the width of the interval change?
individual / single observation / new observation / 개별 관측값 / 새로운 관측값 / 개별 값|wider / 더 넓 / larger|population average / mean response / average / 모집단 평균 / 평균 반응
The confidence interval covers the **population average** of the dependent variable, whereas the prediction interval covers an **individual new observation** at those predictor values; Because an individual value also includes its own random error, the prediction interval is **wider**

W5 · Monte Carlo loop
Read the simulation. Each iteration draws a new sample and stores one number in estimator[rowIdx]. What is the number that is stored, and what does hist(estimator) display after 10,000 iterations (true intercept 3, true slope 0.2, sample size 10)?
slope estimate / slope coefficient / estimated slope / 기울기 추정값 / 기울기 추정치 / 기울기 계수|sampling distribution / 표집 분포 / 표집분포 / 표본분포|new random sample / new sample / repeated samples / repeated / 새로운 표본 / 반복 / 매번
Every iteration draws a **new random sample**, regresses yield on fertilizer and stores the **slope estimate** (coef[2, 1], the Estimate of fertilizer); The histogram of these 10,000 slopes shows the **sampling distribution** of the OLS slope estimator, centred near the true slope 0.2
@code for(rowIdx in 1:sampleCnt) {;;  fertilizer = rnorm(sampleSize, 10, 2);;  yield = intercept + slope * fertilizer + rnorm(sampleSize, 0, 1);;  coef = summary(lm(yield ~ fertilizer))$coefficients;;  estimator[rowIdx] = coef[2, 1];;};;hist(estimator)

W5 · Columns of the coefficient table
In the simulation, t[rowIdx] = coef[2,3] and pValue[rowIdx] = coef[2,4] are stored. What do coef[2,3] and coef[2,4] contain?
t-statistic / t statistic / t value / t통계량 / t값|p-value / p value / p값|slope / fertilizer / second row / 기울기 / 두 번째 행

W5 · Rejection rule and what the table estimates
Read the code. The true slope is 0.2, but the null hypothesis says the slope is 0. When is the null rejected, and what does the share of "Reject" in table(rejection) estimate? What would it estimate if the true slope were 0?
p-value less than alpha / p-value less than or equal to alpha / p-value <= alpha / p-value is less than / at most alpha / p값이 유의수준보다 작 / p값이 알파 이하 / 유의수준 이하|power / 검정력|type I error / type 1 error / 제1종 오류 / 1종 오류 / 유의수준
The null is rejected when the **p-value is less than or equal to alpha** (0.05); With a true slope of 0.2 the null is false, so the share of Reject estimates the test's **power**; If the true slope were 0 (a true null), that share would estimate the **Type I error rate**, about alpha
@code alpha = 0.05;;rejection = pValue <= alpha;;rejection = ifelse(rejection, "Reject", "Fail to Reject");;table(rejection)
===
W5 · Coverage of confidence intervals
Read the code. For 20 samples (true slope 2, sample size 12) it records inside. When is inside TRUE, and about how many of the 20 95% intervals do you expect to contain the true slope? Why might the count differ from that?
true slope inside / true slope lies within / contains the true slope / 진정한 기울기가 포함 / 참값이 포함 / 모수가 포함|95% / 95 percent / 19 / 95퍼센트 / 약 19|chance / random / sampling variability / 우연 / 무작위 / 표본마다
inside is TRUE when the **true slope lies within** that sample's interval [lowerBound, upperBound]; Across repeated samples about **95%**, roughly 19 of 20, of the intervals should contain it, but the count of any one run of 20 varies by **chance** (random sampling)
@code interval = confint(fer_regr);;lowerBound = interval["fertilizer", "2.5 %"];;upperBound = interval["fertilizer", "97.5 %"];;inside = lowerBound <= slope && slope <= upperBound
===
W5 · Confidence level and interval width
Read the code. How does changing the confidence level from the default 0.95 to 0.99 affect the width of the confidence intervals for the coefficients, and why?
wider / wide / larger / 넓어 / 더 넓은|more confident / higher confidence / more certain / capture the true / 더 높은 신뢰 / 모수를 포함할 / 더 확신
The 99% intervals are **wider**; To be **more confident** that the interval captures the true parameter, the interval must be larger, which means a less precise estimate
@code confint(mult_lm);;confint(mult_lm, level = 0.99)
===
W5 · Comparing R-squared values
The R-squared of perform ~ skill + ravens is about 0.0745, while the single-predictor squared correlations are about 0.0459 (skill) and 0.0469 (ravens). The check round(mult\_summary$r.squared - skill\_coef, 2) == 0 returns FALSE. What does this say about adding ravens, and is R-squared the sum of the two single values?
larger / increases / higher / 증가 / 커진 / 더 높|not the sum / not additive / overlap / shared / correlated / 합이 아니 / 중복 / 공유
Adding ravens makes R-squared **larger** than either single-predictor value (the difference rounds to 0.03, so the check is FALSE); But 0.0745 is smaller than 0.0459 + 0.0469, so R-squared is **not the sum**: the predictors **overlap** and share some of the explained variance
@code mult_summary$r.squared;;round(mult_summary$r.squared - skill_coef, 2) == 0;;round(mult_summary$r.squared - ravens_coef, 2) == 0
===
W5 · Deviations from the mean (Lab2.R)
Read the code from Lab2.R. Why is the first result always 0 apart from rounding error, why are the deviations squared in the second line, and why does the third line divide by n - 1?
always 0 / always zero / cancel / 항상 0 / 상쇄 / 합이 0|squar / 제곱 / negative and positive|n - 1 / n-1 / sample variance / 표본분산 / 자유도 / degrees of freedom
Deviations from the mean always sum to **zero** because positive and negative deviations **cancel**; Squaring removes the signs so the deviations can be summed, and dividing by **n - 1** gives the **sample variance** (`var(competence)`); its square root is `sd()`
@code sum(competence - mean(competence));;sum((competence - mean(competence))^2);;sum((competence - mean(competence))^2) / (length(competence) - 1)
===
W5 · IQR and boxplot (Lab2.R)
For the variable grade, quantile(grade) gives a first quartile of 72 and a third quartile of 84. What does IQR(grade) compute, what do the box and whiskers of boxplot(grade) show, and why use the IQR when a distribution is skewed or has outliers?
third quartile minus first quartile / Q3 - Q1 / Q3-Q1 / 84 - 72 / 12 / 제3사분위수 - 제1사분위수 / 사분위 범위|1.5 / 1.5 times / 1.5배|outlier / 이상치 / 극단값
`IQR(grade)` is the **third quartile minus the first quartile** (84 - 72 = 12), the range of the middle 50% of the data, drawn as the box; Whiskers extend to the most extreme points within **1.5 times** the IQR, and points beyond are plotted as **outliers**; The IQR is robust, unlike the mean and standard deviation, when data are skewed or have outliers
@code quantile(grade);;IQR(grade);;boxplot(grade);;abline(h=median(grade), col="red")
===
W5 · Reading the scatterplots (Lab2.R)
For the practice data, the correlation of grade with competence is about 0.83 and with breaks about -0.85. Describe the general pattern each scatterplot shows.
positive / 양의 / 양의 상관 / 정의 상관|negative / 음의 / 음의 상관 / 부의 상관
Grade rises as **competence** rises, a **positive** relationship (r about 0.83); Grade falls as the number of **breaks** rises, a **negative** relationship (r about -0.85)
@code plot(grade ~ competence);;plot(grade ~ breaks)
===
W5 · Function logic (Lab4.R)
Read the function to12 from Lab4.R. What does to12("22") return and how? What happens for to12("12"), and why is that a flaw?
10 PM / 10 pm / 10시 PM|subtract 12 / subtracts 12 / minus 12 / hour - 12 / 12를 뺀 / 12를 빼|12 AM / noon / mislabel / 정오 / AM으로 / 잘못
`to12("22")` returns **"10 PM"** because 22 is greater than 12, so the function **subtracts 12** and pastes "PM"; `to12("12")` returns **"12 AM"**: 12 is not greater than 12, so it falls in the else branch and **noon is mislabeled as AM**
@code to12 <- function(str){;;  hour = as.integer(str);;  if (hour > 12) {;;    return(paste(hour - 12, "PM"));;  } else {;;    return(paste(hour, "AM"));;  };;}
===
W5 · Why sapply (Lab4.R)
Read the code from Lab4.R. Why is sapply() used to convert the whole column, instead of calling to12(data$openingHour) directly?
each element / every element / element by element / one at a time / 각 원소 / 원소마다 / 하나씩|if / not vectorized / single value / one value / 벡터화되지 않 / 하나의 값 / 조건문
to12 uses **if**, which is not vectorized and handles only a **single value** at a time; `sapply()` applies the function to **each element** of the column and returns the results as a vector
@code (openingHour <- sapply(data$openingHour, to12));;(closingHour <- sapply(data$closingHour, to12))
===
W6 · lm function syntax
Explain the role of the lm() function in R and how the formula y ~ x1 + x2 specifies the dependent variable and the independent variables.
linear model / linear regression / OLS / 선형 모델 / 선형모형 / 회귀모형 / 선형회귀|dependent variable / left of the tilde / left side / 종속변수 / 왼쪽|independent variables / explanatory variables / right of the tilde / right side / 독립변수 / 설명변수 / 오른쪽|formula / tilde / 포뮬러 / 모형식 / 공식 / 틸데
The **`lm()`** function fits a **linear model** (an OLS regression); In the **formula** `y ~ x1 + x2`, the tilde separates the **dependent variable** y on the left from the **independent variables** x1 and x2 on the right, which are joined by plus signs
@code model <- lm(y ~ x1 + x2, data = df);;summary(model)
===
W6 · Factor conversion and dummy variables
Why is the as.factor() function used on a categorical variable such as session before running a regression in R?
categorical variable / categorical / 범주형 변수 / 범주형|dummy variables / dummy / indicator / 가변수 / 더미 변수 / 더미|automatically / 자동|base category / reference category / reference level / 기준 범주 / 기준 수준
Using **`as.factor()`** tells R to treat the variable as a **categorical variable** rather than a number; `lm()` then **automatically** creates **dummy variables** for the categories and leaves one out as the **base (reference) category**
@code model <- lm(y ~ x + as.factor(session), data = df)
===
W6 · Interaction terms in R formulas
Explain the difference between using "+", ":" and "*" between two variables x1 and x2 in an R model formula.
main effects / main effect / 주 효과 / 주효과|interaction / 상호작용 / 교차항|both / x1 + x2 + x1:x2 / shorthand / 모두 포함 / 함께 포함 / 약식
"+" includes only the **main effects** of x1 and x2; ":" includes only their **interaction** term (the product x1 * x2); "*" is shorthand for x1 + x2 + `x1:x2`, so it includes **both** the main effects and the interaction
@code lm(y ~ x1 + x2);;lm(y ~ x1:x2);;lm(y ~ x1*x2)
===
W6 · F-statistic interpretation
What does a significant F-statistic of the overall regression, shown in the last line of summary(model), indicate about the relationship between the dependent variable and the independent variables?
overall significance / model significance / jointly significant / 전체 유의성 / 모델 유의성 / 모형 전체|at least one / 적어도 하나|not zero / different from zero / not 0 / 0이 아니 / 0과 다르
A significant F-statistic indicates the **overall significance** of the model; The null hypothesis that all slope coefficients are 0 is rejected, so **at least one** coefficient of the independent variables is **different from zero**
@code summary(model)
===
W6 · Coefficients and economic significance
How do you interpret the estimated coefficient of a continuous independent variable in a linear regression model?
holding constant / holding other variables constant / other variables in the model constant / all other variables constant / ceteris paribus / 다른 변수를 고정 / 다른 조건이 일정 / 통제|unit change / one unit / one-unit / 1단위 / 단위 증가 / 단위 변화|marginal effect / expected change / average change / 한계 효과 / 기대 변화 / 변화량 / 평균적으로
The coefficient measures the expected **marginal effect** on the dependent variable of a **one-unit change** in that independent variable, **holding** all other variables in the model **constant**
@code summary(model)$coefficients
===
W6 · Linear hypothesis testing
What is the purpose of the linearHypothesis() function from the car package in R?
restrictions / linear restrictions / 제약 / 선형 제약|test / hypothesis test / 가설 검정 / 검정|coefficients / 계수|F-test / F test / F검정 / F통계량
The **`linearHypothesis()`** function **tests** linear hypotheses, that is, linear **restrictions** on the **coefficients** of a fitted regression model, such as several coefficients being 0 at the same time or two coefficients being equal; For an lm object it reports an **F-test**
@code library(car);;linearHypothesis(model, c("x1 = 0", "x2 = 0"))
===
W6 · Coefficient of a dummy variable
In the regression lm(wage ~ female + educ), female is a dummy variable equal to 1 for women and 0 for men. How is the coefficient of female interpreted?
difference / 차이|base group / reference group / baseline / men / male / 기준 집단 / 기준 그룹 / 남성|holding educ constant / holding education constant / educ를 고정 / educ를 통제 / 다른 조건이 같
The coefficient of female is the **difference** in the expected wage between women and the **base group** (men), **holding educ constant**
@code lm(wage ~ female + educ, data = df)
===
W6 · Interaction with a dummy variable
In the regression lm(wage ~ educ*female), what does the coefficient of the interaction term educ:female measure, and what does the coefficient of female alone measure?
difference in slopes / different slope / slope differs / 기울기 차이 / 기울기가 다르|return to education / effect of educ / effect of education / 교육 수익률 / 교육의 효과|intercept / 절편
The coefficient of `educ:female` is the **difference in slopes**: how much the effect of educ on wage (the **return to education**) for women differs from that for men; The coefficient of female alone shifts the **intercept**, the wage difference at educ = 0
@code lm(wage ~ educ*female, data = df)
===
W6 · Testing differences across groups (Chow test)
The code compares a restricted model, with one regression for both groups, and an unrestricted model with a full set of interactions with the dummy female. What hypothesis does anova(restricted, unrestricted) test, and what assumption does this test make?
same regression / no difference between the groups / all group coefficients are 0 / dummy and interaction coefficients are 0 / 같은 회귀식 / 그룹 간 차이가 없|F-test / F test / SSR / F검정 / F통계량 / Chow|constant error variance / same error variance / equal variance / homoskedastic / 오차분산이 같 / 등분산
The null hypothesis is that the **same regression** holds for both groups, that is, the coefficient of female and all its interaction coefficients are 0; The **F-test** compares the SSR of the restricted and unrestricted models (the Chow test), and it assumes a **constant error variance** across the groups
@code restricted <- lm(wage ~ educ + exper, data = df);;unrestricted <- lm(wage ~ (educ + exper)*female, data = df);;anova(restricted, unrestricted)
===
W6 · Binary dependent variable
In the code, the dependent variable inlf is binary (1 = in the labor force, 0 = not). What do the coefficients of this lm() regression measure, and what is a known drawback?
probability / 확률|linear probability model / LPM / 선형확률모형|outside 0 and 1 / below 0 / above 1 / negative probability / 0과 1 / 범위 밖 / 음의 확률
This is a **linear probability model**; A coefficient measures the change in the **probability** that inlf = 1 for a one-unit change in the regressor; A drawback is that the fitted values can fall **outside 0 and 1**, for example a negative predicted probability
@code lpm <- lm(inlf ~ educ + age, data = df)
===

<body>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const fm0 = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);
const fm = t => String(t).split(/`([^`]+)`/).map((p, i) => i % 2 ? `<code class="ic">${esc(p)}</code>` : fm0(p)).join('')
  .replace(/\*\*(.+?)\*\*/g, '<span class="lbx">$1</span>');   // `code` -> monospace, **term** -> semibold
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}
function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = rows.shift().split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls: L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5))) };
      if(!cases[id].tbls.length) errs.push(`exhibit ${id}: needs at least one @tbl line`);
      return;
    }
    const who = `Q${questions.length + 1}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, key results, model answer)`); return; }
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    const self = L[2] === '~';
    const kws = self ? [] : L[2].split('|').map(g => g.split(' / ').map(s => s.trim()).filter(Boolean));
    if(!self && (kws.length < 1 || kws.some(g => !g.length))) errs.push(`${who}: empty key-result group`);
    let use = null, fig = null, code = null;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) use = l.slice(5).trim();
      else if(l.startsWith('@tbl ')) fig = parseTbl(l.slice(5));
      else if(l.startsWith('@code ')) code = l.slice(6).split(';;');
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…"`);
    });
    questions.push({ tag, text: L[1], kws, self, model: L[3], use, fig, code, n: questions.length + 1 });
  });
  questions.forEach(q => { if(q.use && !cases[q.use]) errs.push(`Q${q.n}: @use ${q.use} but no "@case ${q.use}" block`); });
  if(!questions.length) errs.push('no questions found');
  return { meta, questions, cases, errs };
}
const PARSED = parseQuizData(document.getElementById('quizData').textContent);
const META = PARSED.meta, QUIZ_TITLE = META.title || 'Quiz', QUESTIONS = PARSED.questions, CASES = PARSED.cases, N = QUESTIONS.length;
const $ = id => document.getElementById(id);
if(PARSED.errs.length){ const b = document.createElement('div'); b.className = 'data-errors'; b.innerHTML = '<b>Quiz data needs fixing</b><ul>' + PARSED.errs.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>'; document.body.insertBefore(b, document.body.firstChild); }
$('quizTitle').textContent = QUIZ_TITLE; $('quizSub').textContent = META.sub || ''; document.title = QUIZ_TITLE + (META.sub ? ' · ' + META.sub.split(' · ')[0] : '');
$('quizFooter').textContent = `${META.subject || ''} — ${META.textbook || ''}`;

/* checking: key results found in the written answer */
const PASS = 0.5;
let drafts = new Array(N).fill(''), snap = new Array(N).fill(null), filterMode = 'all', reviewList = [], flagList = [], pickNums = null, current = 0;
const missed = new Set(), flagged = new Set();
const norm = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const isShort = alt => /^[\x00-\x7f]+$/.test(alt) && norm(alt).length <= 4;
const shortRe = alt => new RegExp('(^|[^a-z0-9.,])' + reEsc(alt.toLowerCase()).replace(/\s+/g, '\\s*') + '($|[^a-z0-9.,]|[.,](?![0-9]))', 'i');
function altMatch(alt, text){ const n = norm(alt); if(!n) return false; return isShort(alt) ? shortRe(alt).test(text) : norm(text).includes(n); }
function findRange(alt, full){
  const n = norm(alt);
  if(!n) return null;
  if(isShort(alt)){ const m = shortRe(alt).exec(full); return m ? [m.index + m[1].length, m.index + m[0].length - m[2].length] : null; }
  let ns = ''; const idx = [];
  for(let i = 0; i < full.length; i++){ const c = full[i].toLowerCase(); if(/[a-z0-9가-힣]/.test(c)){ ns += c; idx.push(i); } }
  const p = ns.indexOf(n);
  return p < 0 ? null : [idx[p], idx[p + n.length - 1] + 1];
}
const htmlToText = h => { const d = document.createElement('div'); d.innerHTML = h.replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(div|p)[^>]*>/gi, '\n'); return d.textContent; };
function grade(qi){
  if(snap[qi] === null) return null;
  const q = QUESTIONS[qi]; if(q.self) return { self: true, hits: [], n: 0, t: 0 };
  const text = htmlToText(snap[qi]);
  const hits = q.kws.map(g => g.some(a => altMatch(a, text)));
  return { hits, n: hits.filter(Boolean).length, t: hits.length };
}
const resultOf = qi => { const g = grade(qi); if(!g) return null; if(g.self) return 2; return g.n / g.t >= PASS ? 2 : g.n ? 1 : 0; };
/* underline the first occurrence of each listed wording group inside an element */
function markIn(el, groups, cls){
  const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while(w.nextNode()) nodes.push(w.currentNode);
  const starts = []; let full = '';
  nodes.forEach(n => { starts.push(full.length); full += n.nodeValue + '\n'; });
  const ranges = [];
  groups.forEach(grp => { for(const a of grp){ const r = findRange(a, full); if(r){ ranges.push(r); break; } } });
  ranges.sort((a, b) => b[0] - a[0]);
  let limit = Infinity;
  ranges.forEach(([s, e]) => {
    if(e > limit) return; limit = s;
    for(let k = nodes.length - 1; k >= 0; k--){
      const ns = starts[k], len = nodes[k].nodeValue.length, a = Math.max(s, ns) - ns, b = Math.min(e, ns + len) - ns;
      if(b <= a) continue;
      let node = nodes[k];
      if(b < len) node.splitText(b);
      if(a > 0) node = node.splitText(a);
      const sp = document.createElement('span'); sp.className = 'mk ' + cls; node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
  });
}

const visibleIndices = () => { const all = QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n)); return filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : all; };
const scopeIdx = () => QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n));
function ranges(nums){ const a = [...nums].sort((x, y) => x - y), out = []; for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; } return out.join(', '); }
function exhibitHTML(id, idx, boxed){ const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(i => QUESTIONS[i].n); const head = `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p>`; if(boxed) return `<div class="tables">${c.tbls.map((t, i) => `<div class="exbox">${i ? '' : head}${tblHTML(t)}</div>`).join('')}</div>`;   /* screen: each statement on its own card */ return head + `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>`; }
const lightbox = $('lightbox'); lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ $('lbBody').innerHTML = html; lightbox.classList.add('show'); }
const richHtml = node => { const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['DIV', 'P'].includes(c.nodeName) ? '<div>' + out(c) + '</div>' : out(c)).join(''); return out(node); };
function qaText(qi){
  const q = QUESTIONS[qi], g = grade(qi);
  return `Q${q.n}. ${q.text}\n` + (q.code ? q.code.join('\n') + '\n' : '') + (drafts[qi].trim() ? `My answer:\n${htmlToText(drafts[qi]).trim()}\n` : '') + (g && !g.self ? `Key results ${g.n}/${g.t}: ` + q.kws.map((k, i) => (g.hits[i] ? '[x] ' : '[ ] ') + k[0]).join('  ') + '\n' : '') + `Model answer:\n${explLines(q.model).join('\n')}`;
}

/* ---------- R syntax colouring for @code lines ---------- */
function rHL(src){
  const RX = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?\b)|(\b(?:function|if|else|for|while|repeat|in|break|next|return|TRUE|FALSE|NULL|NA|NaN|Inf)\b)|([A-Za-z_.][\w.]*)(?=\s*\()|([A-Za-z_.][\w.]*)(?=\s*=(?!=))|(<-|->|%[^%\s]*%|\|>|[~$:])/g;
  return src.split('\n').map(line => {
    let o = '', last = 0, m;
    RX.lastIndex = 0;
    while((m = RX.exec(line))){
      o += esc(line.slice(last, m.index));
      const cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : m[4] ? 'kw' : m[5] ? 'fn' : m[6] ? 'arg' : 'op';
      o += `<span class="hl-${cls}">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    return o + esc(line.slice(last));
  }).join('\n');
}
function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];
  const main = document.createElement('div'); main.className = 'qmain inpage' + (first ? ' first' : ''); main.dataset.index = qi;
  const head = document.createElement('div'); head.className = 'qhead';
  head.innerHTML = `<span class="qnum">${q.n}</span><span class="qtag">${fm(q.tag)}</span>` + (q.use ? `<span class="exref">· Exhibit ${esc(q.use)}</span>` : '') + (retry ? '<span class="retry">· retry</span>' : '');
  const tools = document.createElement('span'); tools.className = 'qtools';
  if(snap[qi] !== null){
    const cp = document.createElement('span'); cp.className = 'qcopy'; cp.setAttribute('role', 'button'); cp.textContent = 'copy'; cp.title = 'Copy question, your answer and the model answer';
    cp.addEventListener('click', () => copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed')));
    tools.appendChild(cp);
  }
  const fl = document.createElement('span'); fl.className = 'qflag' + (flagged.has(qi) ? ' on' : ''); fl.setAttribute('role', 'button'); fl.textContent = 'review'; fl.title = 'Mark for review';
  fl.addEventListener('click', () => { const on = !flagged.has(qi); on ? flagged.add(qi) : flagged.delete(qi); fl.classList.toggle('on', on); updateChrome(); });
  tools.appendChild(fl); head.appendChild(tools); main.appendChild(head);
  const p = document.createElement('p'); p.className = 'qtext'; p.innerHTML = fm(q.text); main.appendChild(p);
  if(q.code){ const pre = document.createElement('pre'); pre.className = 'codebox'; pre.innerHTML = rHL(q.code.join('\n')); main.appendChild(pre); }
  if(q.fig){ const f = document.createElement('div'); f.className = 'qfig zoomable'; f.innerHTML = tblHTML(q.fig); f.addEventListener('click', () => openLightbox(tblHTML(q.fig))); main.appendChild(f); }
  const ed = document.createElement('div'); ed.className = 'answer'; ed.contentEditable = 'true'; ed.spellcheck = false;
  ed.setAttribute('role', 'textbox'); ed.setAttribute('aria-multiline', 'true'); ed.dataset.placeholder = 'Write your answer here…';
  ed.innerHTML = drafts[qi];
  ed.addEventListener('focus', () => { current = qi; markCurrent(); });
  ed.addEventListener('input', () => { drafts[qi] = richHtml(ed); });
  ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
  ed.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){
      e.preventDefault();
      if(e.ctrlKey || e.metaKey || e.shiftKey){ document.execCommand('insertParagraph'); drafts[qi] = richHtml(ed); }
      else {
        const v = visibleIndices(), nx = v[v.indexOf(qi) + 1];
        if(snap[qi] !== null && richHtml(ed) === snap[qi]){ if(nx !== undefined) focusAnswer(nx, true); }   /* already checked, nothing changed: move on */
        else check(qi, ed, true);                                                                       /* new or edited answer: check it */
      }
      return;
    }
    if(e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey){
      const v = visibleIndices(), t = v.indexOf(qi) + (e.shiftKey ? -1 : 1);
      if(t >= 0 && t < v.length){ e.preventDefault(); drafts[qi] = richHtml(ed); focusAnswer(v[t], true); }
    }
  });
  main.appendChild(ed);
  if(snap[qi] !== null && !q.self){ const g = grade(qi); markIn(ed, q.kws.filter((_, i) => g.hits[i]), 'ok'); }
  const acts = document.createElement('div'); acts.className = 'acts';
  const cb = document.createElement('button'); cb.type = 'button'; cb.className = 'link'; cb.style.color = 'var(--ink)';
  cb.textContent = q.self ? 'Show answer' : snap[qi] !== null ? 'Check again' : 'Check';
  cb.addEventListener('click', () => check(qi, ed)); acts.appendChild(cb);
  if(snap[qi] !== null){
    const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'link'; rb.textContent = 'Hide answer';
    rb.addEventListener('click', () => { drafts[qi] = richHtml(ed); snap[qi] = null; render(); }); acts.appendChild(rb);
  }
  main.appendChild(acts);

  const side = document.createElement('aside'); side.className = 'qside';
  if(snap[qi] !== null){
    const g = grade(qi);
    const head2 = g.self ? '<div class="sn-head">Model answer</div>' :
      `<div class="sn-head"><span class="${g.n / g.t >= PASS ? 'ok' : g.n ? 'part' : 'no'}">${g.n / g.t >= PASS ? 'Passed' : g.n ? 'Partly' : 'Not yet'}</span> · ${g.n} of ${g.t} key results</div>`;
    side.innerHTML = head2 + fmtExpl(q.model);
    if(!g.self) markIn(side, q.kws.filter((_, i) => !g.hits[i]), 'no');
  }
  return [main, side];
}
function check(qi, ed, keep){ drafts[qi] = richHtml(ed); snap[qi] = drafts[qi]; current = qi; render(); if(keep) focusAnswer(qi, true); }
function markCurrent(){ document.querySelectorAll('#quiz .qmain').forEach(m => m.classList.toggle('cur', +m.dataset.index === current)); }
function caretEnd(ed){ const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
function focusAnswer(qi, end){ current = qi; markCurrent(); const ed = $('quiz').querySelector(`.qmain[data-index="${qi}"] .answer`); if(ed){ ed.focus({ preventScroll: true }); if(end) caretEnd(ed); ed.closest('.qmain').scrollIntoView({ behavior: 'smooth', block: 'center' }); } }

function fitExhibits(){   /* an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    const ex = sec.querySelector('.case-ex');
    if(!ex) return;
    const cs = getComputedStyle(ex); if(cs.position !== 'sticky') return;
    const inner = ex.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const tooWide = [...ex.querySelectorAll('table')].some(t => { const p = t.parentElement, ps = getComputedStyle(p); return t.scrollWidth > p.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight) + 1; });
    if(tooWide || ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);
function render(){
  const y0 = window.scrollY, quizEl = $('quiz');
  quizEl.innerHTML = '';
  const vis = visibleIndices(), retry = filterMode === 'review';
  if(!vis.length){ quizEl.innerHTML = `<div class="empty-state inpage">${filterMode === 'flagged' ? 'No questions marked for review.' : 'Nothing to review.'}</div>`; updateChrome(); return; }
  let first = true;
  for(let k = 0; k < vis.length; ){
    const q = QUESTIONS[vis[k]];
    if(q.use){
      const group = []; while(k < vis.length && QUESTIONS[vis[k]].use === q.use){ group.push(vis[k]); k++; }
      const sec = document.createElement('section'); sec.className = 'case pg';
      const ex = document.createElement('div'); ex.className = 'case-ex'; ex.innerHTML = exhibitHTML(q.use, vis, true); ex.style.setProperty('--n', String(group.length + 1));
      ex.querySelectorAll('table').forEach(t => { t.classList.add('zoomable'); t.addEventListener('click', () => openLightbox(t.outerHTML)); });
      sec.appendChild(ex);
      group.forEach((qi, j) => questionNodes(qi, first && j === 0, retry).forEach(n => sec.appendChild(n)));
      quizEl.appendChild(sec);
    } else { questionNodes(vis[k], first, retry).forEach(n => quizEl.appendChild(n)); k++; }
    first = false;
  }
  window.scrollTo(0, y0);
  fitExhibits();
  updateChrome();
  markCurrent();
}
function updateChrome(){
  const ids = scopeIdx().filter(i => !QUESTIONS[i].self);
  $('totalCount').textContent = scopeIdx().length;
  $('checkedCount').textContent = scopeIdx().filter(i => snap[i] !== null).length;
  $('passedCount').textContent = ids.filter(i => resultOf(i) === 2).length;
  const wl = ids.filter(i => snap[i] !== null && resultOf(i) < 2);
  const rb = $('reviewBtn'); rb.disabled = !wl.length || filterMode === 'review'; rb.textContent = filterMode === 'review' ? 'Reviewing…' : `Review not passed (${wl.length})`; rb.classList.toggle('on', filterMode === 'review');
  $('allViewBtn').classList.toggle('on', filterMode === 'all');
  const fc = scopeIdx().filter(i => flagged.has(i)).length, fb = $('flagBtn');
  fb.textContent = `Marked (${fc})`; fb.disabled = !fc && filterMode !== 'flagged'; fb.classList.toggle('on', filterMode === 'flagged');
  $('copyMissedBtn').disabled = !scopeIdx().some(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2));
  const done = filterMode === 'review' && reviewList.length && reviewList.every(i => snap[i] !== null);
  $('reviewBanner').classList.toggle('show', !!done);
  if(done){
    const still = reviewList.filter(i => resultOf(i) < 2);
    $('reviewBannerText').textContent = still.length ? `Review complete — ${still.length} of ${reviewList.length} still not passed.` : `Review complete — all ${reviewList.length} passed.`;
    const a = $('reviewBannerActions'); a.innerHTML = '';
    const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Back to all'; b.addEventListener('click', () => { filterMode = 'all'; render(); }); a.appendChild(b);
  }
  document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px');
}
$('reviewBtn').addEventListener('click', () => { const wl = scopeIdx().filter(i => !QUESTIONS[i].self && snap[i] !== null && resultOf(i) < 2); if(!wl.length) return; reviewList = wl; wl.forEach(i => { missed.add(i); snap[i] = null; }); filterMode = 'review'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('allViewBtn').addEventListener('click', () => { filterMode = 'all'; render(); });
$('flagBtn').addEventListener('click', () => { flagList = scopeIdx().filter(i => flagged.has(i)); if(!flagList.length) return; filterMode = 'flagged'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('darkSw').addEventListener('click', () => $('darkSw').classList.toggle('on', document.documentElement.classList.toggle('dark')));

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const t = qSearch.value.replace(/[–—~]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t){ pickNums = null; qForm.classList.remove('active'); render(); return; }
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){ let m; if(/^\d+$/.test(tok)) out.add(+tok); else if((m = tok.match(/^(\d+)-(\d+)$/))){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); } else { qBad(`Not recognised: "${tok}"`); return; } }
  const miss = [...out].filter(n => n < 1 || n > N);
  if(miss.length){ qBad(`No question ${miss.join(', ')} (1–${N})`); return; }
  qBad(''); pickNums = out; qForm.classList.add('active'); filterMode = 'all'; render();
});
qSearch.addEventListener('input', () => qBad(''));
$('qClear').addEventListener('click', () => { pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); render(); });

$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function buildPrintSheet(){
  const idx = visibleIndices();
  let html = `<h1>${esc(QUIZ_TITLE)}</h1>${META.sub ? `<p class="p-sub">${esc(META.sub)}</p>` : ''}`, last = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== last) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    last = q.use;
    const lines = 2;                                               // print: two lines at the question text size (1.5em)
    html += `<div class="p-q"><p>${q.n}. ${q.use ? `[Exhibit ${esc(q.use)}] ` : ''}${fm(q.text)}</p>` + (q.code ? `<pre class="p-code">${rHL(q.code.join('\n'))}</pre>` : '') + (q.fig ? `<div class="p-fig">${tblHTML(q.fig)}</div>` : '') + `<div class="p-lines" style="--n:${lines}"></div></div>`;
  });
  html += `<section class="p-key"><h1>${esc(QUIZ_TITLE)} — Model answers</h1>` + idx.map(qi => { const q = QUESTIONS[qi]; return `<div class="p-s"><p><b>${q.n}.</b> ${fm(q.tag)}</p>${fmtExpl(q.model)}${q.kws.length ? `<p class="p-kw">Key results: ${q.kws.map(k => fm(k[0])).join(' · ')}</p>` : ''}</div>`; }).join('') + '</section>';
  $('printSheet').innerHTML = html;
}
window.addEventListener('beforeprint', buildPrintSheet);
window.addEventListener('afterprint', () => document.body.classList.remove('print-solution'));

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
$('copyMissedBtn').addEventListener('click', () => {
  const nums = scopeIdx().filter(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2)).map(i => QUESTIONS[i].n);
  copyText(`${QUIZ_TITLE} not passed: ${nums.join(', ')}`).then(() => showTip($('copyMissedBtn'), 'Copied'), () => {});
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}
window.addEventListener('resize', () => document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px'));
let armed = false, armTimer = null; const resetBtn = $('resetBtn');
resetBtn.addEventListener('click', () => {
  if(!armed){ armed = true; resetBtn.classList.add('danger'); resetBtn.textContent = 'Click again to clear answers'; armTimer = setTimeout(disarm, 4000); return; }
  clearTimeout(armTimer); disarm(); scopeIdx().forEach(i => { drafts[i] = ''; snap[i] = null; missed.delete(i); }); filterMode = 'all'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
function disarm(){ armed = false; resetBtn.classList.remove('danger'); resetBtn.textContent = 'Restart'; }

const memoEl = $('memoText');
const setMemoOpen = on => document.body.classList.toggle('memo-open', on);
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
$('memoBold').addEventListener('mousedown', e => e.preventDefault());
$('memoBold').addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
$('memoTab').addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'writtenQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.kws.map(k => k.join('/')).join('|')).join('\n'));
$('saveBtn').addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, drafts, snap, missed: [...missed], flagged: [...flagged], memo: memoEl.innerHTML })); showTip($('saveBtn'), 'Saved'); }catch(e){ showTip($('saveBtn'), 'Save failed'); }
});
try{
  const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if(d){
    if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = richHtml(memoEl); }
    if(d.sig === SAVE_SIG && Array.isArray(d.drafts) && d.drafts.length === N){
      const clean = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };
      drafts = d.drafts.map(clean); snap = d.snap.map(s => s === null ? null : clean(s));
      (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
      setTimeout(() => showTip($('saveBtn'), 'Progress restored'), 300);
    }
  }
}catch(e){}
render();
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
