<!DOCTYPE html>
<!--
  WRITTEN-ANSWER TEMPLATE (서술형 / 계산 서술) - an A4 exam sheet with side notes.
  Make a quiz: copy this file and replace ONLY the text between <script type="text/plain" id="quizData"> and </script>. Do not edit anything else.

  PURPOSE     multi-step calculations written out by hand: the student writes every formula and number on the ruled lines.
              Concepts belong in the multiple-choice template. Do not ask how to operate the calculator: the calculator
              solution is part of every model answer instead.
  CURRENT     the question being worked on has its number underlined and is scrolled to the middle of the screen.
  PAGE        an A4-proportioned sheet (centred, 760 px) with ruled answer lines. The model answer appears as a SIDE NOTE outside
              the sheet, in the right margin, after "Check". A shared exhibit (balance sheet, income statement ...) is a separate
              sheet in the left margin, sticky while its questions scroll. Below 1340 px the exhibit moves onto the sheet; below
              1000 px the side note moves under the answer. One serif font everywhere, hairline rules only, no boxes or buttons.

  DATA FORMAT (blocks separated by a line that is only ===)
    meta        title: / sub: / subject: / textbook:   then ===      (sub: = scope and number of questions only)
    exhibit     @case ID  /  title line  /  @tbl Caption :: H1|H2|H3;;row;;!Section;;=Total|1|2   (one or more @tbl lines)
                Questions that use the same exhibit must be consecutive.
    question    lines, then ===:
                1 tag, with the chapter: "Ch.5 · Amortizing loan" (or "-" = same tag as the previous question)
                2 question text - say what to compute and that formulas must be written
                3 KEY RESULTS used for checking: groups separated by |, accepted wordings inside a group by " / " (space-slash-space).
                  Use the key numbers of the solution (intermediate and final), e.g.  1,648 / 1648|700|748
                  Give a comma-free alternative for numbers of 1,000 or more. A short entry (4 characters or fewer, e.g. 748, 20%) must
                  appear as a whole number, so 748 does not match 1,748. A question passes when 60% of the groups are found (this file: 50%, const PASS).
                  Write ~ instead to make a question self-check only (no checking, the model answer is just shown).
                4 model answer on ONE line: one step per item separated by "; " - every item becomes its own line in the side note,
                  and a short leading label before " = " or ":" (e.g. "OCF = ...", "BA II Plus: ...") is set in semibold.
                  Always give the formula with the substituted numbers AND the calculator solution.
                5+ optional:  @use ID   (shown as a small light "Exhibit A" next to the tag)    @tbl Caption :: H1|H2;;a|b   (table under the question)
    @code       optional extra line:  @code line1;;line2  (R code under the question: monospace, no box, R colours; ;; = new line). Inline `code` in text and answers = monospace.
    CONDITIONS  every question must stand alone: restate the numbers it needs, or point to its exhibit with @use.

  SUPERSCRIPTS / SUBSCRIPTS (위첨자·아래첨자 - follow exactly)
                ^ takes ONE following character: (1 + r)^t  (1.08)^5;   ^{..} for TWO OR MORE: (1.005)^{48}  (FV ÷ PV)^{1/t}      WRONG: (1.005)^48
                _ takes ONE following character: D_0  D_1  P_t;          _{..} for TWO OR MORE: D_{t+1}  P_{t-1}                 WRONG: D0, D1 as plain text
                Calculator register / key names are labels, not math: CF0, C01, P1, P2, I/Y, P/Y stay plain. Write \_ or \^ for a literal _ or ^.
                Symbols: \pi \Delta \times \le \ge \approx. The same rules apply in question text, model answers and @tbl cells.

  REVIEW / COPY  two small text marks at the top right of each question: "copy" (after checking) and "review" (click to mark; a dot appears).
  EXHIBITS    plain tables: one size, one weight, one colour; hairlines and spacing only; cells never wrap. Each table is a clear block:
              a caption larger than the cells, a dark rule above the header and below the last row. An exhibit too wide for the
              margin moves onto the sheet above its questions automatically; there tables sit side by side or stacked, never wrapping a row.
              The score bar has the width of the sheet. Settings: a text link with a small drop-down list under it (night mode); it floats, so the page never shifts.
  ANSWER BOX  starts at two ruled lines and grows by one line with every Ctrl+Enter (font 0.92rem, line height 1.75em).
  KEYS        Enter = check (Enter again with no edits = next question; Enter after editing = check again) · Ctrl+Enter (or Shift+Enter) = new line · Tab / Shift+Tab = next / previous answer · Ctrl+Q = memo
  PRINT       A4 exam paper: each exhibit printed once before its questions ("Used in questions 1–3"), linked questions marked [Exhibit A],
              ruled space for the answer; "Print with solution" adds an answer key with the formatted model answers and key results.
  Mistakes in the data are listed in a red box at the top of the page.
-->

===
W1 · Finding the mode with table() and sort()
Read the code. What does table(x) return, and what does sort(..., decreasing = TRUE) do with it?
frequency / frequencies / count / counts / 빈도|decreasing / descending / largest first / 내림차순|mode / most frequent / 최빈값
table(): counts how many times each distinct value occurs and returns a **frequency** table (here 2 twice, 3 three times, 5 once); sort(): with decreasing = TRUE orders those counts from largest to smallest (**descending**); The first entry is the value with the highest count, the **mode** (here 3)
@code x <- c(2, 3, 3, 5, 3, 2);;table(x);;sort(table(x), decreasing = TRUE)
===
W2 · read.csv() and its arguments
Read the code from Lab2.R. What does read.csv() do, and what do the arguments header = TRUE and na.strings = "." do?
data frame / dataframe / 데이터프레임|first row / column names / variable names / 첫 행|NA / missing / 결측
read.csv(): reads a comma-separated text file and returns a **data frame**; header: TRUE means the **first row** holds the column (variable) names, not data; na.strings: every cell that contains "." is read as **NA** (missing), so it does not enter calculations as a value; Several codes can be given at once, for example c(".", "-")
@code practice <- read.csv("Lab2_Practice.csv", header=TRUE, na.strings=".")
===
W2 · attach() and detach()
Read the code from Lab2.R. What do attach(practice) and detach(practice) do?
search path / 검색 경로|by name / directly / without / $ 없이 / 직접|removes / remove / 제거 / 해제
attach(): adds the data frame to R's **search path**, so its columns can be used **by name** (COMPETENCE instead of practice$COMPETENCE); detach(): **removes** the data frame from the search path again; Risk: a column can mask, or be masked by, another object with the same name
@code attach(practice);;mean(COMPETENCE);;detach(practice)
===
W2 · quantile() and IQR()
For breaks, the first line returns 0, 1, 2, 4.5 and 12 and the second returns 3.5. What does each function compute?
quartile / quartiles / percentile / 사분위|minimum / maximum / median / 최소 / 최대 / 중앙값|third quartile minus / Q3 - Q1 / 4.5 - 1 / 3.5 / middle 50
quantile(): by default returns the 0%, 25%, 50%, 75% and 100% points, that is the **minimum**, the first **quartile**, the median, the third quartile and the maximum (0, 1, 2, 4.5, 12); IQR(): the interquartile range, the **third quartile minus** the first quartile (4.5 - 1 = 3.5), the spread of the middle 50% of the data
@code quantile(breaks);;IQR(breaks)
===
W2 · boxplot() and abline(h = )
Read the code from Lab2.R. What does boxplot(grade) draw, and what does abline(h = median(grade), col = "red") add to it?
box / hinges / quartile / 상자|median / 중앙값|whiskers / outliers / 1.5 / 수염 / 이상치|horizontal / 수평
boxplot(): draws a **box** from the lower to the upper hinge (about Q1 to Q3) with a bold line at the **median**; The **whiskers** reach the most extreme points within 1.5 times the IQR of the box, and points beyond them are drawn as outliers; abline(): with h set to a value it draws a **horizontal** line at that y-value, so here a red line through the median
@code boxplot(grade);;abline(h=median(grade), col="red")
===
W2 · vioplot() and its package
Read the code from Lab2.R. What does vioplot() draw, and why must install.packages("vioplot") and library("vioplot") be run first?
density / 밀도|box plot / boxplot / 상자|package / not in base / 패키지|load / loads / every session / 불러
vioplot(): draws a violin plot for each variable, a smoothed **density** mirrored on both sides with a small **box plot** inside; install.packages(): downloads the **package** once, because vioplot is not part of base R; library(): **loads** the package in every new session so that vioplot() can be found
@code install.packages("vioplot");;library("vioplot");;vioplot(competence, breaks, grade)
===
W2 · par(mfrow = )
Read the code from Lab2.R. What does par(mfrow = c(1, 2)) do to the plots that follow it?
graphics parameter / par / 그래픽|1 row and 2 columns / one row / two columns / 1행 / 2열|side by side / next to each other / 나란히|until / reset / stays / 유지
par(): sets **graphics parameters**; mfrow: c(1, 2) splits the plotting window into **1 row and 2 columns**, and the following plots fill the panels row by row; Here boxplot(grade) and vioplot(grade) appear **side by side**; The layout stays in effect **until** it is reset, for example with par(mfrow = c(1, 1))
@code par(mfrow = c(1, 2));;boxplot(grade);;vioplot(grade)
===
W2 · source() with echo = TRUE
What does source() do, and what does the argument echo = TRUE add?
runs / executes / run / 실행|prints / shows / displays / 출력
source(): **runs** every command saved in the script file, from top to bottom; echo: TRUE also **prints** each command in the console before its output, as if it had been typed there
@code source("~/R_w2.R", echo = TRUE)
===
W2 · Sample variance written out
Read the code from Lab2.R (competence has 27 values). What does the first line compute, step by step, and which built-in function gives the same value?
sample variance / variance / 분산|n - 1 / 26 / length / 자유도|var
(competence - mean(competence))\^2: squares every deviation from the mean, and sum() adds them up (about 124.07); length(): returns n = 27, so the sum is divided by **n - 1** = 26; The result, about 4.77, is the **sample variance**, the same value that var(competence) returns
@code sum((competence-mean(competence))^2)/(length(competence)-1);;var(competence)
===
W2 · Logical indexing with [ ]
In mtcars, am = 0 marks cars with an automatic transmission. What does mpg[am == 0] select, and what does the whole line compute?
logical / TRUE / FALSE / 논리|only / keeps / selects / subset / 선택|automatic / 자동|average / mean / 평균
am == 0 compares every element with 0 and returns a **logical** vector of TRUE and FALSE; mpg[...]: keeps **only** the mpg values at the positions where the condition is TRUE; mean(): averages those values, so the line gives the **average** mpg of **automatic** cars; attach(mtcars) is what lets mpg and am be used by name
@code attach(mtcars);;mean(mpg[am==0])
===
W2 · A user-defined function: to12()
Read the function from Lab4.R. What does to12() do with its input, and what do as.integer() and paste() contribute to it?
24-hour / 24 hour / 12-hour / 12 hour / convert / 변환|number / integer / numeric / 숫자 / 정수|joins / paste / combines / space / 붙|10 PM
to12(): converts an hour on the **24-hour** clock, given as text, into a 12-hour label; as.integer(): turns the text "22" into the **number** 22 so it can be compared with 12 and reduced; paste(): **joins** its arguments with a space, so to12("22") returns "10 PM"; Flaw: hour > 12 sends 12 to the else branch, so noon is returned as "12 AM"
@code to12 <- function(str){;;  hour=as.integer(str);;  if (hour>12) {;;    return(paste(hour-12, "PM"));;  } else {;;    return(paste(hour, "AM"));;  };;};;to12("22")
===
W2 · Why as.integer() is needed
In Lab4.R, hour = "13" is stored as text. Why does paste(hour - 12, "PM") stop with an error, and how does to12() avoid the problem?
character / text / string / 문자|error / non-numeric / 오류|as.integer / convert / converts / 변환
hour: "13" is a **character** string, and arithmetic is not defined for text; So hour - 12 stops with an **error** (non-numeric argument to binary operator), even though the comparison as.integer(hour) > 12 works; to12() first **converts** the input with as.integer(), so hour - 12 is computed on the number 13
@code hour="13";;if(as.integer(hour)>12) {;;  print(paste(hour-12, "PM"));;}
===
W2 · str\_detect() with fixed()
Read the code from Lab4.R. What does str\_detect(str, fixed(",")) return, what does fixed() do, and what do the two calls return?
TRUE / FALSE / logical / 논리|contains / pattern / detects / 포함 / 패턴|literal / exact / not a regular expression / 문자 그대로
str\_detect(): returns **TRUE** or FALSE for each string, depending on whether it **contains** the pattern; fixed(): makes the pattern a **literal** string, matched character by character, not a regular expression; So hasMultipleLoc("Seoul, Suwon") is TRUE and hasMultipleLoc("Seoul") is FALSE
@code library(stringr);;hasMultipleLoc <- function(str){;;  str_detect(str, fixed(","));;};;hasMultipleLoc("Seoul, Suwon");;hasMultipleLoc("Seoul")
===
W2 · sapply()
Read the code from Lab4.R. What does sapply() do here, and why is it used instead of calling to12(data$openingHour) directly?
each element / every element / element by element / 각 요소|vector / simplifies / 벡터|if / single value / one value / not vectorized / 하나
sapply(): calls to12() on **each element** of data$openingHour and simplifies the results into a **vector**; It is needed because to12() uses **if**, which takes a single TRUE or FALSE, so calling to12() on the whole column at once fails
@code (openingHour <- sapply(data$openingHour, to12))
===
W2 · ifelse()
Read the code from Lab4.R. What does ifelse() do in this line, and what ends up in the new column?
condition / test / 조건|each element / element by element / vectorized / 각 요소|Yes / No
ifelse(): checks a **condition** for **each element** and returns the second argument where it is TRUE and the third where it is FALSE; Here the TRUE or FALSE from hasMultipleLoc() becomes "Yes" or "No", one per café, and is stored in the new column hasMultipleLoc
@code (locationText <- ifelse(sapply(data$location, hasMultipleLoc), "Yes", "No"));;data$hasMultipleLoc = locationText
===
W2 · read\_excel(), as.data.frame() and colnames()
Read the code from Lab4.R. What does each of the three functions do?
Excel / xlsx / 엑셀|tibble / data frame / 데이터프레임|rename / renames / column names / 이름
read\_excel(): from the readxl package, reads the **Excel** file Café.xlsx into a **tibble**; as.data.frame(): converts the tibble into an ordinary base R data frame; colnames(data) = c(...): **renames** the four columns to type, location, openingHour and closingHour
@code library(readxl);;data = read_excel("Café.xlsx");;data <- as.data.frame(data);;colnames(data) = c("type", "location", "openingHour", "closingHour")

W5 · lm() and abline() with a model
Read the code from regression.R. What does lm() return here, and what does abline() draw when it is given that result?
linear model / OLS / least squares / 선형 / 최소제곱|regression line / fitted line / intercept and slope / 회귀선|stores / stored / object / 저장
lm(): fits a **linear model** by OLS, perform on eye, and returns a model object that holds the coefficients; abline(): given that object, draws the **fitted regression line** (its intercept and slope) on the scatterplot, in blue; The model is **stored** in eye\_regr so that later calls such as summary() and confint() can use it
@code plot(perform ~ eye);;eye_regr = lm(perform ~ eye);;abline(eye_regr, col = "blue")
===
W5 · summary() of an lm model
Read the code from regression.R. What does summary() report for an lm model, and what does $r.squared extract?
coefficient table / Estimate / Std. Error / 계수|t value / p-value / 유의확률|R-squared / r.squared / 결정계수|F-statistic / F
summary(): for an lm object reports the **coefficient table**, with Estimate, Std. Error, t value and p-value for each term; It also gives the residual standard error, the **R-squared** and adjusted R-squared, and the overall **F-statistic** with its p-value; The $r.squared part extracts only the R-squared from that summary
@code eye_summary = summary(eye_regr);;eye_summary;;eye_summary$r.squared
===
W5 · confint() and its level argument
Read the code from regression.R. What does confint() return, and what changes when level = 0.99 is added?
confidence interval / confidence intervals / 신뢰구간|coefficient / coefficients / 계수|95% / default / 0.95 / 기본|wider / 99% / 넓
confint(): returns a **confidence interval** for each **coefficient** of the model, one row per term with a lower and an upper bound; By **default** the level is 95% (columns 2.5 % and 97.5 %); level: 0.99 gives 99% intervals (columns 0.5 % and 99.5 %), which are **wider**
@code confint(eye_regr);;confint(eye_regr, level = 0.99)
===
W5 · cor() and round()
Read the code from regression.R. What does cor() compute, why is it squared, and what is round(..., 16) for?
correlation / Pearson / 상관|R-squared / r squared / 결정계수|floating / rounding / tiny / 반올림 / 오차
cor(): computes the Pearson **correlation** between perform and skill, and \^2 squares it; In a simple regression the squared correlation equals the **R-squared**, which is what the script checks; round(): rounds the difference to 16 decimal places so that tiny **floating**-point differences between the two calculations are not mistaken for a real gap
@code (skill_coef = cor(perform, skill)^2);;round(skill_summary$r.squared - skill_coef, 16)
===
W5 · predict() with interval = "confidence"
Read the code from regression.R. What does predict() do with the data frame it is given, and what do the arguments interval and level change?
predicted / prediction / fit / 예측|new data / data frame / newdata / 새 데이터|lwr / upr / lower / upper / 하한 / 상한|0.3475
predict(): plugs the **new data**, a data frame with the same variable names as the model, into the fitted equation and returns the **predicted** values (about 0.3475 and 0.3441); interval: "confidence" adds the **lower and upper** bounds, so the result is a matrix with the columns fit, lwr and upr; level: 0.95 sets the confidence level of those bounds
@code predict(mult_lm, data.frame(skill=c(0.5,1.5), ravens=c(1.5,0.5)), interval="confidence", level=0.95)
===
W5 · seq(), polygon() and lines()
Read the code from regression.R. What does each of seq(), polygon() and lines() do in drawing the confidence band?
evenly spaced / equally spaced / grid / 등간격|fills / shaded / band / 채우 / 음영|dashed / boundaries / boundary / 점선 / 경계
seq(): creates 10,000 **evenly spaced** x-values from min(eye) - 3 to max(eye) + 3; polygon(): joins the upper bounds (reversed) and the lower bounds into one closed shape and **fills** it in transparent grey, the **shaded** confidence band; lines(): draws the upper and lower bounds as green **dashed** lines
@code points <- seq(min(eye)-3, max(eye)+3, length.out=10000);;pred <- predict(eye_regr, data.frame(eye=points), interval="confidence");;polygon(c(rev(points), points), c(rev(pred[ ,3]), pred[ ,2]), col=rgb(0,0,0,0.1), border=NA);;lines(points, pred[ ,3], lty='dashed', col='green')
===
W5 · set.seed() and rnorm()
Read the code from the simulation script. What do set.seed() and rnorm() do?
reproducible / same random numbers / same results / 재현|normal / 정규|mean 10 / mean / 평균|standard deviation / sd / 표준편차
set.seed(): fixes the starting point of the random number generator, so the same random numbers, and the same results, are **reproducible** on every run; rnorm(): draws sampleSize values from a **normal** distribution, here with **mean** 10 and **standard deviation** 2 for fertilizer; The second rnorm(sampleSize, 0, 1) adds random errors with mean 0 and standard deviation 1
@code set.seed(4201);;fertilizer = rnorm(sampleSize, 10, 2);;yield = intercept + slope*fertilizer + rnorm(sampleSize, 0, 1)
===
W5 · The for loop and the coefficient matrix
Read the simulation loop (sampleCnt = 10,000). What does the for loop do, and what do coef[2,1], coef[2,3] and coef[2,4] contain?
repeats / loop / 10,000 / 10000 / 반복|estimate / slope / 추정 / 기울기|t value / t-statistic / t값|p-value / p값
for: **repeats** the body 10,000 times, once per rowIdx, each time drawing a new sample and fitting lm(); summary(...)$coefficients: is the coefficient matrix, and row 2 is fertilizer; coef[2,1]: the slope **estimate**, coef[2,3] its **t value** and coef[2,4] its **p-value**, each stored at position rowIdx of its vector
@code for(rowIdx in 1:sampleCnt) {;;  fertilizer=rnorm(sampleSize,10,2);;  yield=intercept+slope*fertilizer+rnorm(sampleSize,0,1);;  coef=summary(lm(yield~fertilizer))$coefficients;;  estimator[rowIdx]=coef[2,1];;  t[rowIdx]=coef[2,3];;  pValue[rowIdx]=coef[2,4];;}
===
W5 · ifelse(), table() and barplot()
Read the code from the simulation script. What does each line do, and what does the share of "Reject" estimate here (the true slope is 0.2)?
labels / Reject / Fail to Reject|counts / count / frequency / 빈도|bar / bars / 막대|power / 검정력
pValue <= alpha gives TRUE where the p-value is at most 0.05; ifelse(): turns TRUE and FALSE into the **labels** "Reject" and "Fail to Reject"; table(): **counts** how many of the 10,000 samples fall under each label; barplot(): draws one **bar** per label with its count; Because the true slope is 0.2, not 0, the share of Reject estimates the test's **power**
@code rejection = pValue <= alpha;;rejection = ifelse(rejection, "Reject", "Fail to Reject");;(result = table(rejection));;barplot(result, main = "Null Hypothesis Rejection")
===
W5 · Filling a results data frame
Read the confidence-interval loop. What do data.frame(), results[rowIdx, "slope"], interval["fertilizer", "2.5 %"] and && do?
data frame / 데이터프레임|cell / row and column / column name / 행 / 열|lower / lower bound / 2.5 / 하한|both / 둘 다 / 모두
data.frame(): with index = 1:sampleCnt creates a **data frame** with 20 rows; results[rowIdx, "slope"] = ... writes into one **cell**, chosen by row number and column name, and creates the column the first time it is used; interval["fertilizer", "2.5 %"] picks the **lower** bound of the fertilizer interval from the confint() matrix, and "97.5 %" the upper bound; && is TRUE only if **both** conditions hold, so inside is TRUE when the true slope lies within the interval
@code results = data.frame(index=1:sampleCnt);;results[rowIdx,"slope"] = fer_regr$coefficients[2];;interval = confint(fer_regr);;lowerBound = interval["fertilizer","2.5 %"];;upperBound = interval["fertilizer","97.5 %"];;inside = lowerBound<=slope && slope<=upperBound
===
W5 · ggplot() layers
Read the plotting code from the simulation script. What does each layer add to the chart of the 20 confidence intervals?
point / points / 점|error bar / error bars / interval / 오차 막대 / 구간|vertical line / true slope / 수직선
ggplot(): sets the data (results) and the mapping of slope to the x-axis and index to the y-axis; geom\_point(): draws each estimated slope as a **point**, one row per sample; geom\_errorbarh(): draws a horizontal **error bar** from lower\_bound to upper\_bound, the confidence interval; geom\_vline(): adds a green **vertical line** at the true slope 2, so the intervals that miss it are easy to see
@code ggplot(results, aes(x=slope, y=index)) + geom_point(size=3.5) +;;  geom_errorbarh(aes(xmin = lower_bound, xmax = upper_bound)) +;;  geom_vline(xintercept = 2, color = "green")
===
W6 · as.factor() inside lm()
What does as.factor(session) do in this regression, and what does lm() then create from it?
factor / categorical / 범주|dummy / dummies / indicator / 더미 / 가변수|base / reference / left out / omitted / 기준
as.factor(): turns session into a **factor**, a categorical variable, instead of a number; lm(): then creates a **dummy** variable for every category except one, the **base** (reference) category, which is absorbed in the intercept; Each dummy coefficient is the difference from the base category, holding x constant
@code model <- lm(y ~ x + as.factor(session), data = df)
===
W6 · The : and * operators in a formula
What terms does each of the three formulas put into the model?
interaction / product / 상호작용|main effects / main effect / 주효과|both / shorthand / x1 + x2 + x1:x2 / 모두
x1:x2 adds only the **interaction** term, the product of x1 and x2; x1*x2: is shorthand for x1 + x2 + x1:x2, so it adds **both** the **main effects** and the interaction; x1 + x2: has the main effects only
@code lm(y ~ x1:x2);;lm(y ~ x1*x2);;lm(y ~ x1 + x2)
===
W6 · linearHypothesis()
What does linearHypothesis() from the car package do with the model in this call?
restrictions / restriction / hypotheses / 제약 / 가설|jointly / together / at the same time / both / 동시에|F-test / F
linearHypothesis(): from the car package, tests linear **restrictions** on the coefficients of a fitted model; Here it tests "x1 = 0" and "x2 = 0" **jointly**, not one at a time; For an lm model it reports an **F-test**, with the residual sums of squares of the restricted and unrestricted models, F and its p-value
@code library(car);;linearHypothesis(model, c("x1 = 0", "x2 = 0"))
===
W6 · anova() with two nested models
What does anova(restricted, unrestricted) do, and what test is it here?
compares / nested / 비교|F-test / F|RSS / residual sum of squares / SSR / 잔차제곱합|Chow / both groups / 그룹
anova(): given two **nested** models, **compares** them with an **F-test**; It uses the residual sum of squares (**RSS**) of each model and the number of extra parameters, and reports F and its p-value; Here the unrestricted model interacts every term with female, so the test is the **Chow** test of whether one regression fits both groups
@code restricted <- lm(wage ~ educ + exper, data = df);;unrestricted <- lm(wage ~ (educ + exper)*female, data = df);;anova(restricted, unrestricted)
===

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const fm0 = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};

  const questions = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls: L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5))) };
      if(!cases[id].tbls.length) errs.push(`exhibit ${id}: needs at least one @tbl line`);
      return;
    }
    const who = `Q${questions.length + 1}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, key results, model answer)`); return; }
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    const self = L[2] === '~';
    const kws = self ? [] : L[2].split('|').map(g => g.split(' / ').map(s => s.trim()).filter(Boolean));
    if(!self && (kws.length < 1 || kws.some(g => !g.length))) errs.push(`${who}: empty key-result group`);
    let use = null, fig = null, code = null;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) use = l.slice(5).trim();
      else if(l.startsWith('@tbl ')) fig = parseTbl(l.slice(5));
      else if(l.startsWith('@code ')) code = l.slice(6).split(';;');
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…"`);
    });
    questions.push({ tag, text: L[1], kws, self, model: L[3], use, fig, code, n: questions.length + 1 });

const norm = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, '');

/* underline the first occurrence of each listed wording group inside an element */
function markIn(el, groups, cls){
  const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);

  groups.forEach(grp => { for(const a of grp){ const r = findRange(a, full); if(r){ ranges.push(r); break; } } });

/* ---------- R syntax colouring for @code lines ---------- */
function rHL(src){
  const RX = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?\b)|(\b(?:function|if|else|for|while|repeat|in|break|next|return|TRUE|FALSE|NULL|NA|NaN|Inf)\b)|([A-Za-z_.][\w.]*)(?=\s*\()|([A-Za-z_.][\w.]*)(?=\s*=(?!=))|(<-|->|%[^%\s]*%|\|>|[~$:])/g;

    let o = '', last = 0, m;
    RX.lastIndex = 0;
    while((m = RX.exec(line))){
      o += esc(line.slice(last, m.index));
      const cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : m[4] ? 'kw' : m[5] ? 'fn' : m[6] ? 'arg' : 'op';
      o += `<span class="hl-${cls}">${esc(m[0])}</span>`;
      last = m.index + m[0].length;

}

function fitExhibits(){   /* an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */

$('qClear').addEventListener('click', () => { pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); render(); });

$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function buildPrintSheet(){
  const idx = visibleIndices();
  let html = `<h1>${esc(QUIZ_TITLE)}</h1>${META.sub ? `<p class="p-sub">${esc(META.sub)}</p>` : ''}`, last = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== last) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    last = q.use;
    const lines = 2;                                               // print: two lines at the question text size (1.5em)
    html += `<div class="p-q"><p>${q.n}. ${q.use ? `[Exhibit ${esc(q.use)}] ` : ''}${fm(q.text)}</p>` + (q.code ? `<pre class="p-code">${rHL(q.code.join('\n'))}</pre>` : '') + (q.fig ? `<div class="p-fig">${tblHTML(q.fig)}</div>` : '') + `<div class="p-lines" style="--n:${lines}"></div></div>`;
  });
  html += `<section class="p-key"><h1>${esc(QUIZ_TITLE)} — Model answers</h1>` + idx.map(qi => { const q = QUESTIONS[qi]; return `<div class="p-s"><p><b>${q.n}.</b> ${fm(q.tag)}</p>${fmtExpl(q.model)}${q.kws.length ? `<p class="p-kw">Key results: ${q.kws.map(k => fm(k[0])).join(' · ')}</p>` : ''}</div>`; }).join('') + '</section>';
  $('printSheet').innerHTML = html;
}
window.addEventListener('beforeprint', buildPrintSheet);
window.addEventListener('afterprint', () => document.body.classList.remove('print-solution'));

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
$('copyMissedBtn').addEventListener('click', () => {
  const nums = scopeIdx().filter(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2)).map(i => QUESTIONS[i].n);
  copyText(`${QUIZ_TITLE} not passed: ${nums.join(', ')}`).then(() => showTip($('copyMissedBtn'), 'Copied'), () => {});
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}
window.addEventListener('resize', () => document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px'));
let armed = false, armTimer = null; const resetBtn = $('resetBtn');
resetBtn.addEventListener('click', () => {
  if(!armed){ armed = true; resetBtn.classList.add('danger'); resetBtn.textContent = 'Click again to clear answers'; armTimer = setTimeout(disarm, 4000); return; }
  clearTimeout(armTimer); disarm(); scopeIdx().forEach(i => { drafts[i] = ''; snap[i] = null; missed.delete(i); }); filterMode = 'all'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
function disarm(){ armed = false; resetBtn.classList.remove('danger'); resetBtn.textContent = 'Restart'; }

const memoEl = $('memoText');
const setMemoOpen = on => document.body.classList.toggle('memo-open', on);
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
$('memoBold').addEventListener('mousedown', e => e.preventDefault());
$('memoBold').addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
$('memoTab').addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'writtenQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.kws.map(k => k.join('/')).join('|')).join('\n'));
$('saveBtn').addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, drafts, snap, missed: [...missed], flagged: [...flagged], memo: memoEl.innerHTML })); showTip($('saveBtn'), 'Saved'); }catch(e){ showTip($('saveBtn'), 'Save failed'); }
});
try{
  const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if(d){
    if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = richHtml(memoEl); }
    if(d.sig === SAVE_SIG && Array.isArray(d.drafts) && d.drafts.length === N){
      const clean = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };
      drafts = d.drafts.map(clean); snap = d.snap.map(s => s === null ? null : clean(s));
      (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
      setTimeout(() => showTip($('saveBtn'), 'Progress restored'), 300);
    }
  }
}catch(e){}
render();
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
</html>
