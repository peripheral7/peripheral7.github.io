<!DOCTYPE html>
<!--
  WRITTEN-ANSWER TEMPLATE (서술형 / 계산 서술) - an A4 exam sheet with side notes.
  Make a quiz: copy this file and replace ONLY the text between <script type="text/plain" id="quizData"> and </script>. Do not edit anything else.

  PURPOSE     multi-step calculations written out by hand: the student writes every formula and number on the ruled lines.
              Concepts belong in the multiple-choice template. Do not ask how to operate the calculator: the calculator
              solution is part of every model answer instead.
  CURRENT     the question being worked on has its number underlined and is scrolled to the middle of the screen.
  PAGE        an A4-proportioned sheet (centred, 760 px) with ruled answer lines. The model answer appears as a SIDE NOTE outside
              the sheet, in the right margin, after "Check". A shared exhibit (balance sheet, income statement ...) is a separate
              sheet in the left margin, sticky while its questions scroll. Below 1340 px the exhibit moves onto the sheet; below
              1000 px the side note moves under the answer. One serif font everywhere, hairline rules only, no boxes or buttons.

  DATA FORMAT (blocks separated by a line that is only ===)
    meta        title: / sub: / subject: / textbook:   then ===      (sub: = scope and number of questions only)
    exhibit     @case ID  /  title line  /  @tbl Caption :: H1|H2|H3;;row;;!Section;;=Total|1|2   (one or more @tbl lines)
                Questions that use the same exhibit must be consecutive.
    question    lines, then ===:
                1 tag, with the chapter: "Ch.5 · Amortizing loan" (or "-" = same tag as the previous question)
                2 question text - say what to compute and that formulas must be written
                3 KEY RESULTS used for checking: groups separated by |, accepted wordings inside a group by " / " (space-slash-space).
                  Use the key numbers of the solution (intermediate and final), e.g.  1,648 / 1648|700|748
                  Give a comma-free alternative for numbers of 1,000 or more. A short entry (4 characters or fewer, e.g. 748, 20%) must
                  appear as a whole number, so 748 does not match 1,748. A question passes when 60% of the groups are found.
                  Write ~ instead to make a question self-check only (no checking, the model answer is just shown).
                4 model answer on ONE line: one step per item separated by "; " - every item becomes its own line in the side note,
                  and a short leading label before " = " or ":" (e.g. "OCF = ...", "BA II Plus: ...") is set in semibold.
                  Always give the formula with the substituted numbers AND the calculator solution.
                5+ optional:  @use ID   (shown as a small light "Exhibit A" next to the tag)    @tbl Caption :: H1|H2;;a|b   (table under the question)
    CONDITIONS  every question must stand alone: restate the numbers it needs, or point to its exhibit with @use.

  SUPERSCRIPTS / SUBSCRIPTS (위첨자·아래첨자 - follow exactly)
                ^ takes ONE following character: (1 + r)^t  (1.08)^5;   ^{..} for TWO OR MORE: (1.005)^{48}  (FV ÷ PV)^{1/t}      WRONG: (1.005)^48
                _ takes ONE following character: D_0  D_1  P_t;          _{..} for TWO OR MORE: D_{t+1}  P_{t-1}                 WRONG: D0, D1 as plain text
                Calculator register / key names are labels, not math: CF0, C01, P1, P2, I/Y, P/Y stay plain. Write \_ or \^ for a literal _ or ^.
                Symbols: \pi \Delta \times \le \ge \approx. The same rules apply in question text, model answers and @tbl cells.

  REVIEW / COPY  two small text marks at the top right of each question: "copy" (after checking) and "review" (click to mark; a dot appears).
  EXHIBITS    plain tables: one size, one weight, one colour; hairlines and spacing only; cells never wrap. Each table is a clear block:
              a caption larger than the cells, a dark rule above the header and below the last row. An exhibit too wide for the
              margin moves onto the sheet above its questions automatically; there tables sit side by side or stacked, never wrapping a row.
              The score bar has the width of the sheet. Settings: a text link with a small drop-down list under it (night mode); it floats, so the page never shifts.
  ANSWER BOX  starts at two ruled lines and grows by one line with every Ctrl+Enter (font 0.92rem, line height 1.75em).
  KEYS        Enter = check (Enter again with no edits = next question; Enter after editing = check again) · Ctrl+Enter (or Shift+Enter) = new line · Tab / Shift+Tab = next / previous answer · Ctrl+Q = memo
  PRINT       A4 exam paper: each exhibit printed once before its questions ("Used in questions 1–3"), linked questions marked [Exhibit A],
              ruled space for the answer; "Print with solution" adds an answer key with the formatted model answers and key results.
  Mistakes in the data are listed in a red box at the top of the page.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="text/plain" id="quizData">
title: Business Finance Midterm
sub: Written Calculations · Chapters 2–7 · 15 questions
subject: Business Finance, Prof. Gemma Lee, Kyung Hee University
textbook: Business Finance lecture notes (Chapters 2–7) and chapter practice questions (RWJ, Essentials of Corporate Finance)
===
@case A
Harborview Outfitters, Inc.
@tbl Balance sheets, December 31 ($ millions) :: Item|2024|2025;;!Assets;;Cash|150|200;;Accounts receivable|600|700;;Inventory|850|900;;=Total current assets|1,600|1,800;;Net fixed assets|4,400|4,600;;=Total assets|6,000|6,400;;!Liabilities and owners' equity;;Accounts payable|520|560;;Notes payable|280|240;;=Total current liabilities|800|800;;Long-term debt|1,800|1,900;;Common stock and paid-in surplus|1,400|1,500;;Retained earnings|2,000|2,200;;=Total owners' equity|3,400|3,700;;=Total liabilities and owners' equity|6,000|6,400
@tbl 2025 income statement ($ millions) :: Item|2025;;Net sales|4,800;;Cost of goods sold|2,900;;Depreciation|500;;=Earnings before interest and taxes|1,400;;Interest paid|200;;=Taxable income|1,200;;Taxes (21%)|252;;=Net income|948;;Dividends|748;;Addition to retained earnings|200
===
Ch.2 · Cash flow from assets, two ways
Harborview Outfitters, Inc. ($ millions). Compute the 2025 cash flow from assets in two ways: (a) from the asset side, CFFA = OCF − NCS − ΔNWC; (b) from the financing side, CFFA = CF to creditors + CF to stockholders, where net new borrowing is the change in long-term debt and net new equity is the change in common stock and paid-in surplus. Write each formula and show that both give the same figure.
1,648 / 1648|700|748|100|648
OCF = EBIT + depreciation − taxes = 1,400 + 500 − 252 = 1,648; NCS = ending net FA − beginning net FA + depreciation = 4,600 − 4,400 + 500 = 700; ΔNWC = (1,800 − 800) − (1,600 − 800) = 1,000 − 800 = 200; CFFA = OCF − NCS − ΔNWC = 1,648 − 700 − 200 = 748; CF to creditors = interest paid − net new borrowing = 200 − (1,900 − 1,800) = 100; CF to stockholders = dividends paid − net new equity = 748 − (1,500 − 1,400) = 648; Check = 100 + 648 = 748, the same as the asset-side figure
@use A
===
Ch.3 · DuPont identity
Harborview Outfitters, Inc. ($ millions). Using 2025 year-end figures, compute the profit margin, total asset turnover and equity multiplier, combine them into ROE with the DuPont identity, and confirm the result with NI / TE.
19.75|0.75|1.73|25.62
PM = NI / sales = 948 / 4,800 = 19.75%; TAT = sales / TA = 4,800 / 6,400 = 0.75; EM = TA / TE = 6,400 / 3,700 = 1.73; ROE = PM × TAT × EM = 0.1975 × 0.75 × 1.73 = 25.62%; Check = NI / TE = 948 / 3,700 = 25.62%
@use A
===
Ch.3 · Liquidity and leverage
Harborview Outfitters, Inc. ($ millions). For 2025, compute the current ratio, the quick ratio, the total debt ratio and the debt-equity ratio. Write each formula.
2.25|1.13|0.42|0.73
Current ratio = CA / CL = 1,800 / 800 = 2.25; Quick ratio = (CA − inventory) / CL = (1,800 − 900) / 800 = 1.13; Total debt = TA − TE = 6,400 − 3,700 = 2,700; Total debt ratio = TD / TA = 2,700 / 6,400 = 0.42; D/E = TD / TE = 2,700 / 3,700 = 0.73
@use A
===
Ch.2 · Average and marginal tax rates
Assume the tax schedule in the table. A taxpayer reports taxable income of $200,000. Compute the total tax, the average tax rate and the marginal tax rate.
40,000 / 40000|20%|30%
Tax = 0.10 × 50,000 + 0.20 × 100,000 + 0.30 × 50,000 = 5,000 + 20,000 + 15,000 = 40,000; Average rate = total tax / taxable income = 40,000 / 200,000 = 20%; Marginal rate = rate on the next dollar of income = 30%
@tbl Tax schedule :: Taxable income|Rate;;Up to $50,000|10%;;$50,001 – $150,000|20%;;Above $150,000|30%
===
Ch.4 · Rate and time
An investment of $12,000 today will be worth $20,000 in 7 years. (a) What annual rate does it earn? (b) At that rate, how many years would it take $12,000 to grow to $30,000? Write the equation for each part before solving.
7.57|12.56
(a) Equation: 20,000 = 12,000 × (1 + r)^7; r = (20,000 / 12,000)^{1/7} − 1 = 7.57%; BA II Plus: 7 N, −12000 PV, 0 PMT, 20000 FV, CPT I/Y = 7.57; (b) Equation: 30,000 = 12,000 × (1.0757)^t; t = ln(2.5) / ln(1.0757) = 12.56 years; BA II Plus: 7.57 I/Y, −12000 PV, 0 PMT, 30000 FV, CPT N = 12.56
===
Ch.5 · Two deposits
You deposit $3,000 today and another $5,000 in 18 months. The account pays 6%, compounded monthly. How much is in the account at the end of 4 years? Show the value of each deposit separately.
3,811.47 / 3811.47|5,807.00 / 5,807 / 5807|9,618.47 / 9618.47
r = 6% / 12 = 0.5% per month; FV = 3,000 × (1.005)^{48} + 5,000 × (1.005)^{30}; First deposit = 3,000 × (1.005)^{48} = 3,811.47 (48 months); Second deposit = 5,000 × (1.005)^{30} = 5,807.00 (30 months); Total = 9,618.47; BA II Plus: 48 N, 0.5 I/Y, 0 PMT, −3000 PV, CPT FV = 3,811.47; 30 N, −5000 PV, CPT FV = 5,807.00
===
Ch.5 · Amortizing loan
You borrow $12,000 for 3 years at 7.2%, compounded monthly, repaid in equal monthly payments. Compute (a) the monthly payment, (b) the interest in the first payment and (c) the loan balance after the 12th payment.
371.62|72.00 / 72|8,283.46 / 8283.46
r = 7.2% / 12 = 0.6% per month, N = 36; Payment: 12,000 = C × [1 − 1/(1.006)^{36}] / 0.006, so C = 371.62; First interest = 0.006 × 12,000 = 72.00; Balance after 12 = PV of the 24 remaining payments = 371.62 × [1 − 1/(1.006)^{24}] / 0.006 = 8,283.46; BA II Plus: 36 N, 0.6 I/Y, 12000 PV, 0 FV, CPT PMT = −371.62; AMORT: P1 = 1, P2 = 12, BAL = 8,283.46
===
Ch.5 · Lease value (annuity due)
A two-year office lease requires $1,200 at the beginning of every month. The relevant rate is 7.2%, compounded monthly. Value it first as an ordinary annuity and then as the annuity due it actually is.
26,747.92 / 26747.92|26,908.41 / 26908.41
r = 0.6% per month, N = 24; Ordinary annuity = 1,200 × [1 − 1/(1.006)^{24}] / 0.006 = 26,747.92; Annuity due = ordinary annuity × (1 + r) = 26,747.92 × 1.006 = 26,908.41; BA II Plus: 24 N, 0.6 I/Y, −1200 PMT, 0 FV, CPT PV = 26,747.92, then × 1.006 (or BGN mode, switched off afterwards)
===
Ch.5 · Rate on a car loan
A $22,000 car can be financed with 48 monthly payments of $540. Write the equation for the monthly rate, then report the monthly rate, the quoted annual rate (APR) and the effective annual rate.
0.69 / 0.6902|8.28|8.60 / 8.6
Formula: 22,000 = 540 × [1 − 1/(1 + r)^{48}] / r, solved by iteration; Monthly rate = 0.6902%; APR = 0.6902% × 12 = 8.28%; EAR = (1.006902)^{12} − 1 = 8.60%; BA II Plus: 48 N, 22000 PV, −540 PMT, 0 FV, CPT I/Y = 0.6902; ICONV: NOM = 8.28, C/Y = 12, CPT EFF = 8.60
===
Ch.5 · Comparing lenders
Lender A charges 11.8%, compounded monthly. Lender B charges 12%, compounded semiannually. Convert both quotes to effective annual rates and state which loan is cheaper.
12.46|12.36|Lender B / choose B / B is cheaper
EAR(A) = (1 + 0.118/12)^{12} − 1 = 12.46%; EAR(B) = (1 + 0.12/2)^2 − 1 = 12.36%; Decision: borrow from Lender B, which has the lower EAR; ICONV: NOM = 11.8, C/Y = 12, CPT EFF = 12.46; NOM = 12, C/Y = 2, CPT EFF = 12.36
===
Ch.6 · Bond pricing
A $1,000 bond pays a 6% coupon semiannually and matures in 12 years. Price it when comparable bonds yield 7% and when they yield 5% (quoted annual rates), and say whether it sells at a premium or a discount in each case.
919.71|1,089.42 / 1089.42|discount / 할인|premium / 할증
Inputs: N = 12 × 2 = 24, PMT = 60 / 2 = 30, FV = 1,000; At 7%: P = 30 × [1 − 1/(1.035)^{24}] / 0.035 + 1,000 / (1.035)^{24} = 919.71, a discount (coupon rate < yield); At 5%: P = 30 × [1 − 1/(1.025)^{24}] / 0.025 + 1,000 / (1.025)^{24} = 1,089.42, a premium (coupon rate > yield); BA II Plus: 24 N, 3.5 I/Y, 30 PMT, 1000 FV, CPT PV = −919.71; 2.5 I/Y, CPT PV = −1,089.42
===
Ch.6 · Yield to maturity
A $1,000 bond pays a 5% coupon semiannually, matures in 8 years and trades at $940. Write the pricing equation, then find the six-month yield, the quoted YTM, the effective annual yield and the current yield, and rank the coupon rate, current yield and YTM.
2.98|5.95|6.04|5.32
Formula: 940 = 25 × [1 − 1/(1 + r)^{16}] / r + 1,000 / (1 + r)^{16}, solved by iteration; Six-month yield = 2.98%; Quoted YTM = 2.98% × 2 = 5.95%; Effective annual yield = (1.0298)^2 − 1 = 6.04%; Current yield = annual coupon / price = 50 / 940 = 5.32%; Ranking: coupon rate 5.00% < current yield 5.32% < YTM 5.95% (a discount bond); BA II Plus: 16 N, −940 PV, 25 PMT, 1000 FV, CPT I/Y = 2.98
===
Ch.7 · Constant growth
A company just paid a dividend of $1.80 per share. Dividends grow at 4% a year forever and investors require 12%. Compute (a) today's price, (b) the expected price three years from today and (c) the dividend yield and capital gains yield.
23.40|26.32|8%|4%
D_1 = D_0 × (1 + g) = 1.80 × 1.04 = 1.872; P_0 = D_1 / (R − g) = 1.872 / 0.08 = 23.40; P_3 = D_4 / (R − g) = 1.80 × (1.04)^4 / 0.08 = 2.1057 / 0.08 = 26.32; Dividend yield = D_1 / P_0 = 1.872 / 23.40 = 8%; Capital gains yield = g = 4% (R = 8% + 4% = 12%)
===
Ch.7 · Nonconstant growth
A firm just paid a $1.50 dividend. Dividends will grow at 15% for the next two years and at 4% forever after that. The required return is 12%. Write out each dividend, the terminal price and the value today.
1.725|1.98375 / 1.984 / 1.98|2.0631 / 2.063|25.79|23.68
D_1 = 1.50 × 1.15 = 1.725; D_2 = 1.725 × 1.15 = 1.98375; D_3 = 1.98375 × 1.04 = 2.0631; P_2 = D_3 / (R − g) = 2.0631 / (0.12 − 0.04) = 25.79; P_0 = 1.725 / 1.12 + (1.98375 + 25.79) / (1.12)^2 = 1.540 + 22.140 = 23.68; BA II Plus CF: CF0 = 0, C01 = 1.725, C02 = 27.773, NPV I = 12, CPT = 23.68
===
Ch.7 · A firm that pays nothing yet
A firm will pay no dividend for the next three years. It will pay $1.00 at the end of year 4, and that dividend will then grow at 5% forever. The required return is 15%. Value the stock today, showing the date at which you apply the growth model.
10.00 / 10|6.58
Growth model at date 3, one period before the first dividend: P_3 = D_4 / (R − g) = 1.00 / (0.15 − 0.05) = 10.00; P_0 = P_3 / (1.15)^3 = 10.00 / 1.5209 = 6.58; BA II Plus: 3 N, 15 I/Y, 0 PMT, 10 FV, CPT PV = −6.58
===
</script>

  :root{--memo-w:min(300px,86vw);}

  @media (max-width:1420px){
    .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:32px var(--pad) 6px;}

    #printSheet .sn-line .lb{font-weight:400; text-shadow:0.3px 0 0 currentColor;}
  }

<body>

<div class="sheet">

<button class="memo-tab" id="memoTab" type="button">Memo</button>

  <div class="memo-head"><span>Memo</span><span><button class="link" id="memoBold" type="button" style="font-weight:700">B</button><button class="link" id="memoClose" type="button">Close</button></span></div>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const fm = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`)
  .replace(/\*\*(.+?)\*\*/g, '<span class="lbx">$1</span>');
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}
function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = rows.shift().split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls: L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5))) };
      if(!cases[id].tbls.length) errs.push(`exhibit ${id}: needs at least one @tbl line`);
      return;
    }
    const who = `Q${questions.length + 1}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, key results, model answer)`); return; }
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    const self = L[2] === '~';
    const kws = self ? [] : L[2].split('|').map(g => g.split(' / ').map(s => s.trim()).filter(Boolean));
    if(!self && (kws.length < 1 || kws.some(g => !g.length))) errs.push(`${who}: empty key-result group`);
    let use = null, fig = null;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) use = l.slice(5).trim();
      else if(l.startsWith('@tbl ')) fig = parseTbl(l.slice(5));
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…"`);
    });
    questions.push({ tag, text: L[1], kws, self, model: L[3], use, fig, n: questions.length + 1 });
  });
  questions.forEach(q => { if(q.use && !cases[q.use]) errs.push(`Q${q.n}: @use ${q.use} but no "@case ${q.use}" block`); });
  if(!questions.length) errs.push('no questions found');
  return { meta, questions, cases, errs };
}
const PARSED = parseQuizData(document.getElementById('quizData').textContent);
const META = PARSED.meta, QUIZ_TITLE = META.title || 'Quiz', QUESTIONS = PARSED.questions, CASES = PARSED.cases, N = QUESTIONS.length;
const $ = id => document.getElementById(id);
if(PARSED.errs.length){ const b = document.createElement('div'); b.className = 'data-errors'; b.innerHTML = '<b>Quiz data needs fixing</b><ul>' + PARSED.errs.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>'; document.body.insertBefore(b, document.body.firstChild); }
$('quizTitle').textContent = QUIZ_TITLE; $('quizSub').textContent = META.sub || ''; document.title = QUIZ_TITLE + (META.sub ? ' · ' + META.sub.split(' · ')[0] : '');
$('quizFooter').textContent = `${META.subject || ''} — ${META.textbook || ''}`;

/* checking: key results found in the written answer */
const PASS = 0.6;
let drafts = new Array(N).fill(''), snap = new Array(N).fill(null), filterMode = 'all', reviewList = [], flagList = [], pickNums = null, current = 0;
const missed = new Set(), flagged = new Set();
const norm = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const isShort = alt => /^[\x00-\x7f]+$/.test(alt) && norm(alt).length <= 4;
const shortRe = alt => new RegExp('(^|[^a-z0-9.,])' + reEsc(alt.toLowerCase()).replace(/\s+/g, '\\s*') + '($|[^a-z0-9.,]|[.,](?![0-9]))', 'i');
function altMatch(alt, text){ const n = norm(alt); if(!n) return false; return isShort(alt) ? shortRe(alt).test(text) : norm(text).includes(n); }
function findRange(alt, full){
  const n = norm(alt);
  if(!n) return null;
  if(isShort(alt)){ const m = shortRe(alt).exec(full); return m ? [m.index + m[1].length, m.index + m[0].length - m[2].length] : null; }
  let ns = ''; const idx = [];
  for(let i = 0; i < full.length; i++){ const c = full[i].toLowerCase(); if(/[a-z0-9가-힣]/.test(c)){ ns += c; idx.push(i); } }
  const p = ns.indexOf(n);
  return p < 0 ? null : [idx[p], idx[p + n.length - 1] + 1];
}
const htmlToText = h => { const d = document.createElement('div'); d.innerHTML = h.replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(div|p)[^>]*>/gi, '\n'); return d.textContent; };
function grade(qi){
  if(snap[qi] === null) return null;
  const q = QUESTIONS[qi]; if(q.self) return { self: true, hits: [], n: 0, t: 0 };
  const text = htmlToText(snap[qi]);
  const hits = q.kws.map(g => g.some(a => altMatch(a, text)));
  return { hits, n: hits.filter(Boolean).length, t: hits.length };
}
const resultOf = qi => { const g = grade(qi); if(!g) return null; if(g.self) return 2; return g.n / g.t >= PASS ? 2 : g.n ? 1 : 0; };
/* underline the first occurrence of each listed wording group inside an element */
function markIn(el, groups, cls){
  const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while(w.nextNode()) nodes.push(w.currentNode);
  const starts = []; let full = '';
  nodes.forEach(n => { starts.push(full.length); full += n.nodeValue + '\n'; });
  const ranges = [];
  groups.forEach(grp => { for(const a of grp){ const r = findRange(a, full); if(r){ ranges.push(r); break; } } });
  ranges.sort((a, b) => b[0] - a[0]);
  let limit = Infinity;
  ranges.forEach(([s, e]) => {
    if(e > limit) return; limit = s;
    for(let k = nodes.length - 1; k >= 0; k--){
      const ns = starts[k], len = nodes[k].nodeValue.length, a = Math.max(s, ns) - ns, b = Math.min(e, ns + len) - ns;
      if(b <= a) continue;
      let node = nodes[k];
      if(b < len) node.splitText(b);
      if(a > 0) node = node.splitText(a);
      const sp = document.createElement('span'); sp.className = 'mk ' + cls; node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
  });
}

const visibleIndices = () => { const all = QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n)); return filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : all; };
const scopeIdx = () => QUESTIONS.map((_, i) => i).filter(i => !pickNums || pickNums.has(QUESTIONS[i].n));
function ranges(nums){ const a = [...nums].sort((x, y) => x - y), out = []; for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; } return out.join(', '); }
function exhibitHTML(id, idx, boxed){ const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(i => QUESTIONS[i].n); const head = `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p>`; if(boxed) return `<div class="tables">${c.tbls.map((t, i) => `<div class="exbox">${i ? '' : head}${tblHTML(t)}</div>`).join('')}</div>`;   /* screen: each statement on its own card */ return head + `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>`; }
const lightbox = $('lightbox'); lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ $('lbBody').innerHTML = html; lightbox.classList.add('show'); }
const richHtml = node => { const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['DIV', 'P'].includes(c.nodeName) ? '<div>' + out(c) + '</div>' : out(c)).join(''); return out(node); };
function qaText(qi){
  const q = QUESTIONS[qi], g = grade(qi);
  return `Q${q.n}. ${q.text}\n` + (drafts[qi].trim() ? `My answer:\n${htmlToText(drafts[qi]).trim()}\n` : '') + (g && !g.self ? `Key results ${g.n}/${g.t}: ` + q.kws.map((k, i) => (g.hits[i] ? '[x] ' : '[ ] ') + k[0]).join('  ') + '\n' : '') + `Model answer:\n${explLines(q.model).join('\n')}`;
}

function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];
  const main = document.createElement('div'); main.className = 'qmain inpage' + (first ? ' first' : ''); main.dataset.index = qi;
  const head = document.createElement('div'); head.className = 'qhead';
  head.innerHTML = `<span class="qnum">${q.n}</span><span class="qtag">${fm(q.tag)}</span>` + (q.use ? `<span class="exref">· Exhibit ${esc(q.use)}</span>` : '') + (retry ? '<span class="retry">· retry</span>' : '');
  const tools = document.createElement('span'); tools.className = 'qtools';
  if(snap[qi] !== null){
    const cp = document.createElement('span'); cp.className = 'qcopy'; cp.setAttribute('role', 'button'); cp.textContent = 'copy'; cp.title = 'Copy question, your answer and the model answer';
    cp.addEventListener('click', () => copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed')));
    tools.appendChild(cp);
  }
  const fl = document.createElement('span'); fl.className = 'qflag' + (flagged.has(qi) ? ' on' : ''); fl.setAttribute('role', 'button'); fl.textContent = 'review'; fl.title = 'Mark for review';
  fl.addEventListener('click', () => { const on = !flagged.has(qi); on ? flagged.add(qi) : flagged.delete(qi); fl.classList.toggle('on', on); updateChrome(); });
  tools.appendChild(fl); head.appendChild(tools); main.appendChild(head);
  const p = document.createElement('p'); p.className = 'qtext'; p.innerHTML = fm(q.text); main.appendChild(p);
  if(q.fig){ const f = document.createElement('div'); f.className = 'qfig zoomable'; f.innerHTML = tblHTML(q.fig); f.addEventListener('click', () => openLightbox(tblHTML(q.fig))); main.appendChild(f); }
  const ed = document.createElement('div'); ed.className = 'answer'; ed.contentEditable = 'true'; ed.spellcheck = false;
  ed.setAttribute('role', 'textbox'); ed.setAttribute('aria-multiline', 'true'); ed.dataset.placeholder = 'Write the formulas and your working here…';
  ed.innerHTML = drafts[qi];
  ed.addEventListener('focus', () => { current = qi; markCurrent(); });
  ed.addEventListener('input', () => { drafts[qi] = richHtml(ed); });
  ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
  ed.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){
      e.preventDefault();
      if(e.ctrlKey || e.metaKey || e.shiftKey){ document.execCommand('insertParagraph'); drafts[qi] = richHtml(ed); }
      else {
        const v = visibleIndices(), nx = v[v.indexOf(qi) + 1];
        if(snap[qi] !== null && richHtml(ed) === snap[qi]){ if(nx !== undefined) focusAnswer(nx, true); }   /* already checked, nothing changed: move on */
        else check(qi, ed, true);                                                                       /* new or edited answer: check it */
      }
      return;
    }
    if(e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey){
      const v = visibleIndices(), t = v.indexOf(qi) + (e.shiftKey ? -1 : 1);
      if(t >= 0 && t < v.length){ e.preventDefault(); drafts[qi] = richHtml(ed); focusAnswer(v[t], true); }
    }
  });
  main.appendChild(ed);
  if(snap[qi] !== null && !q.self){ const g = grade(qi); markIn(ed, q.kws.filter((_, i) => g.hits[i]), 'ok'); }
  const acts = document.createElement('div'); acts.className = 'acts';
  const cb = document.createElement('button'); cb.type = 'button'; cb.className = 'link'; cb.style.color = 'var(--ink)';
  cb.textContent = q.self ? 'Show answer' : snap[qi] !== null ? 'Check again' : 'Check';
  cb.addEventListener('click', () => check(qi, ed)); acts.appendChild(cb);
  if(snap[qi] !== null){
    const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'link'; rb.textContent = 'Hide answer';
    rb.addEventListener('click', () => { drafts[qi] = richHtml(ed); snap[qi] = null; render(); }); acts.appendChild(rb);
  }
  main.appendChild(acts);

  const side = document.createElement('aside'); side.className = 'qside';
  if(snap[qi] !== null){
    const g = grade(qi);
    const head2 = g.self ? '<div class="sn-head">Model answer</div>' :
      `<div class="sn-head"><span class="${g.n / g.t >= PASS ? 'ok' : g.n ? 'part' : 'no'}">${g.n / g.t >= PASS ? 'Passed' : g.n ? 'Partly' : 'Not yet'}</span> · ${g.n} of ${g.t} key results</div>`;
    side.innerHTML = head2 + fmtExpl(q.model);
    if(!g.self) markIn(side, q.kws.filter((_, i) => !g.hits[i]), 'no');
  }
  return [main, side];
}
function check(qi, ed, keep){ drafts[qi] = richHtml(ed); snap[qi] = drafts[qi]; current = qi; render(); if(keep) focusAnswer(qi, true); }
function markCurrent(){ document.querySelectorAll('#quiz .qmain').forEach(m => m.classList.toggle('cur', +m.dataset.index === current)); }
function caretEnd(ed){ const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
function focusAnswer(qi, end){ current = qi; markCurrent(); const ed = $('quiz').querySelector(`.qmain[data-index="${qi}"] .answer`); if(ed){ ed.focus({ preventScroll: true }); if(end) caretEnd(ed); ed.closest('.qmain').scrollIntoView({ behavior: 'smooth', block: 'center' }); } }

function fitExhibits(){   /* an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    const ex = sec.querySelector('.case-ex');
    if(!ex) return;
    const cs = getComputedStyle(ex); if(cs.position !== 'sticky') return;
    const inner = ex.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const tooWide = [...ex.querySelectorAll('table')].some(t => { const p = t.parentElement, ps = getComputedStyle(p); return t.scrollWidth > p.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight) + 1; });
    if(tooWide || ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);
function render(){
  const y0 = window.scrollY, quizEl = $('quiz');
  quizEl.innerHTML = '';
  const vis = visibleIndices(), retry = filterMode === 'review';
  if(!vis.length){ quizEl.innerHTML = `<div class="empty-state inpage">${filterMode === 'flagged' ? 'No questions marked for review.' : 'Nothing to review.'}</div>`; updateChrome(); return; }
  let first = true;
  for(let k = 0; k < vis.length; ){
    const q = QUESTIONS[vis[k]];
    if(q.use){
      const group = []; while(k < vis.length && QUESTIONS[vis[k]].use === q.use){ group.push(vis[k]); k++; }
      const sec = document.createElement('section'); sec.className = 'case pg';
      const ex = document.createElement('div'); ex.className = 'case-ex'; ex.innerHTML = exhibitHTML(q.use, vis, true); ex.style.setProperty('--n', String(group.length + 1));
      ex.querySelectorAll('table').forEach(t => { t.classList.add('zoomable'); t.addEventListener('click', () => openLightbox(t.outerHTML)); });
      sec.appendChild(ex);
      group.forEach((qi, j) => questionNodes(qi, first && j === 0, retry).forEach(n => sec.appendChild(n)));
      quizEl.appendChild(sec);
    } else { questionNodes(vis[k], first, retry).forEach(n => quizEl.appendChild(n)); k++; }
    first = false;
  }
  window.scrollTo(0, y0);
  fitExhibits();
  updateChrome();
  markCurrent();
}
function updateChrome(){
  const ids = scopeIdx().filter(i => !QUESTIONS[i].self);
  $('totalCount').textContent = scopeIdx().length;
  $('checkedCount').textContent = scopeIdx().filter(i => snap[i] !== null).length;
  $('passedCount').textContent = ids.filter(i => resultOf(i) === 2).length;
  const wl = ids.filter(i => snap[i] !== null && resultOf(i) < 2);
  const rb = $('reviewBtn'); rb.disabled = !wl.length || filterMode === 'review'; rb.textContent = filterMode === 'review' ? 'Reviewing…' : `Review not passed (${wl.length})`; rb.classList.toggle('on', filterMode === 'review');
  $('allViewBtn').classList.toggle('on', filterMode === 'all');
  const fc = scopeIdx().filter(i => flagged.has(i)).length, fb = $('flagBtn');
  fb.textContent = `Marked (${fc})`; fb.disabled = !fc && filterMode !== 'flagged'; fb.classList.toggle('on', filterMode === 'flagged');
  $('copyMissedBtn').disabled = !scopeIdx().some(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2));
  const done = filterMode === 'review' && reviewList.length && reviewList.every(i => snap[i] !== null);
  $('reviewBanner').classList.toggle('show', !!done);
  if(done){
    const still = reviewList.filter(i => resultOf(i) < 2);
    $('reviewBannerText').textContent = still.length ? `Review complete — ${still.length} of ${reviewList.length} still not passed.` : `Review complete — all ${reviewList.length} passed.`;
    const a = $('reviewBannerActions'); a.innerHTML = '';
    const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Back to all'; b.addEventListener('click', () => { filterMode = 'all'; render(); }); a.appendChild(b);
  }
  document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px');
}
$('reviewBtn').addEventListener('click', () => { const wl = scopeIdx().filter(i => !QUESTIONS[i].self && snap[i] !== null && resultOf(i) < 2); if(!wl.length) return; reviewList = wl; wl.forEach(i => { missed.add(i); snap[i] = null; }); filterMode = 'review'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('allViewBtn').addEventListener('click', () => { filterMode = 'all'; render(); });
$('flagBtn').addEventListener('click', () => { flagList = scopeIdx().filter(i => flagged.has(i)); if(!flagList.length) return; filterMode = 'flagged'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('darkSw').addEventListener('click', () => $('darkSw').classList.toggle('on', document.documentElement.classList.toggle('dark')));

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const t = qSearch.value.replace(/[–—~]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t){ pickNums = null; qForm.classList.remove('active'); render(); return; }
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){ let m; if(/^\d+$/.test(tok)) out.add(+tok); else if((m = tok.match(/^(\d+)-(\d+)$/))){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); } else { qBad(`Not recognised: "${tok}"`); return; } }
  const miss = [...out].filter(n => n < 1 || n > N);
  if(miss.length){ qBad(`No question ${miss.join(', ')} (1–${N})`); return; }
  qBad(''); pickNums = out; qForm.classList.add('active'); filterMode = 'all'; render();
});
qSearch.addEventListener('input', () => qBad(''));
$('qClear').addEventListener('click', () => { pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); render(); });

$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function buildPrintSheet(){
  const idx = visibleIndices();
  let html = `<h1>${esc(QUIZ_TITLE)}</h1>${META.sub ? `<p class="p-sub">${esc(META.sub)}</p>` : ''}`, last = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== last) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    last = q.use;
    const lines = 3;                                               // print: about two handwritten sentences
    html += `<div class="p-q"><p>${q.n}. ${q.use ? `[Exhibit ${esc(q.use)}] ` : ''}${fm(q.text)}</p>` + (q.fig ? `<div class="p-fig">${tblHTML(q.fig)}</div>` : '') + `<div class="p-lines" style="--n:${lines}"></div></div>`;
  });
  html += `<section class="p-key"><h1>${esc(QUIZ_TITLE)} — Model answers</h1>` + idx.map(qi => { const q = QUESTIONS[qi]; return `<div class="p-s"><p><b>${q.n}.</b> ${fm(q.tag)}</p>${fmtExpl(q.model)}${q.kws.length ? `<p class="p-kw">Key results: ${q.kws.map(k => fm(k[0])).join(' · ')}</p>` : ''}</div>`; }).join('') + '</section>';
  $('printSheet').innerHTML = html;
}
window.addEventListener('beforeprint', buildPrintSheet);
window.addEventListener('afterprint', () => document.body.classList.remove('print-solution'));

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
$('copyMissedBtn').addEventListener('click', () => {
  const nums = scopeIdx().filter(i => missed.has(i) || (snap[i] !== null && resultOf(i) < 2)).map(i => QUESTIONS[i].n);
  copyText(`${QUIZ_TITLE} not passed: ${nums.join(', ')}`).then(() => showTip($('copyMissedBtn'), 'Copied'), () => {});
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}
window.addEventListener('resize', () => document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px'));
let armed = false, armTimer = null; const resetBtn = $('resetBtn');
resetBtn.addEventListener('click', () => {
  if(!armed){ armed = true; resetBtn.classList.add('danger'); resetBtn.textContent = 'Click again to clear answers'; armTimer = setTimeout(disarm, 4000); return; }
  clearTimeout(armTimer); disarm(); scopeIdx().forEach(i => { drafts[i] = ''; snap[i] = null; missed.delete(i); }); filterMode = 'all'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
function disarm(){ armed = false; resetBtn.classList.remove('danger'); resetBtn.textContent = 'Restart'; }

const memoEl = $('memoText');
const setMemoOpen = on => document.body.classList.toggle('memo-open', on);
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
$('memoBold').addEventListener('mousedown', e => e.preventDefault());
$('memoBold').addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
$('memoTab').addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'writtenQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.kws.map(k => k.join('/')).join('|')).join('\n'));
$('saveBtn').addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, drafts, snap, missed: [...missed], flagged: [...flagged], memo: memoEl.innerHTML })); showTip($('saveBtn'), 'Saved'); }catch(e){ showTip($('saveBtn'), 'Save failed'); }
});
try{
  const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if(d){
    if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = richHtml(memoEl); }
    if(d.sig === SAVE_SIG && Array.isArray(d.drafts) && d.drafts.length === N){
      const clean = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };
      drafts = d.drafts.map(clean); snap = d.snap.map(s => s === null ? null : clean(s));
      (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
      setTimeout(() => showTip($('saveBtn'), 'Progress restored'), 300);
    }
  }
}catch(e){}
render();
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
