# Chapter 2: Asset Classes and Financial Instruments
===
T-bill yields
A Treasury bill with a face value of $10,000 and 120 days to maturity is selling for $9,780. What are its bank discount yield (BDY) and bond equivalent yield (BEY)?
*BDY 6.60%; BEY 6.84%|BDY 6.84%; BEY 6.60%|BDY 6.69%; BEY 6.84%|BDY 6.60%; BEY 6.69%
BDY = [(F − P) ÷ F] × (360 ÷ n) = (220 ÷ 10,000) × (360 ÷ 120) = 6.60%; BEY = [(F − P) ÷ P] × (365 ÷ n) = (220 ÷ 9,780) × (365 ÷ 120) = 6.84%.
bank discount yield=discount divided by face value times 360 over days; bond equivalent yield=discount divided by price times 365 over days
===
Money-market yield conventions
For the same Treasury bill, which ordering of the three yield measures is correct?
Effective annual yield < bond equivalent yield < bank discount yield|Bond equivalent yield < bank discount yield < effective annual yield|*Bank discount yield < bond equivalent yield < effective annual yield|All three are equal because they describe the same bill
BDY divides by face value over 360 days, BEY divides by the lower purchase price over 365 days, and EAY also compounds, so accuracy and size rise BDY → BEY → EAY.
BDY BEY EAY=three yield conventions for one discount bill; to compare instruments convert to BEY or EAY
===
Quoting conventions
Which of the following money market instruments is quoted on an interest-bearing (add-on) basis rather than on a discount basis?
*Negotiable certificate of deposit|Treasury bill|Commercial paper|Banker's acceptance
T-bills, commercial paper and bankers’ acceptances are sold below face value (discount basis), whereas CDs, repos, federal funds and Eurodollar deposits pay principal plus interest at maturity (add-on).
discount basis=sold below face with no coupon; add-on basis=principal plus interest paid at maturity
===
Repurchase agreements
In a repurchase agreement (repo), the dealer:
Buys securities from an investor with an agreement to sell them back later at a lower price|*Sells securities to an investor with an agreement to buy them back the next day at a higher price|Lends securities to an investor in exchange for an unsecured promissory note|Exchanges dollar deposits for foreign-currency deposits at an agreed forward rate
A repo is a short-term, often overnight, collateralized loan to the dealer; the higher repurchase price is the interest, and in a reverse repo the investor lends cash and holds the collateral.
repo=sale of securities with an agreement to buy back later at a higher price; reverse repo=the mirror image
===
Municipal bonds
A municipal bond yields 3.2% and a taxable corporate bond of comparable risk yields 4.5%. For an investor in the 32% marginal tax bracket, what is the equivalent taxable yield of the municipal bond, and which bond is better?
Equivalent taxable yield 4.71%; the corporate bond|Equivalent taxable yield 2.18%; the corporate bond|*Equivalent taxable yield 4.71%; the municipal bond|Equivalent taxable yield 4.22%; the municipal bond
Equivalent taxable yield = 3.2% ÷ (1 − 0.32) = 4.71%, which exceeds the corporate bond’s 4.5%, so the municipal bond leaves more after tax (3.2% versus 4.5% × 0.68 = 3.06%).
equivalent taxable yield=municipal yield divided by one minus the tax rate
===
Municipal bonds
A taxable corporate bond yields 7.0% and a comparable-risk municipal bond yields 4.2%. At what marginal tax rate would an investor be indifferent between the two?
28%|35%|*40%|60%
Set after-tax yields equal: 7.0% × (1 − t) = 4.2%, so t = 1 − 4.2 ÷ 7.0 = 40%; investors above this bracket prefer the muni, those below prefer the taxable bond.
indifference tax rate=bracket at which after-tax yields of muni and taxable bond are equal
===
Treasury quotes
A Treasury bond with a par value of $1,000 is quoted at an asked price of 103-12. What is the dollar price of the bond?
$1,031.20|$1,031.88|*$1,033.75|$1,037.50
The digits after the dash are 32nds of a point: 103 + 12/32 = 103.375% of par, i.e. $1,033.75 per $1,000.
Treasury quote=price as a percentage of par with digits after the dash in 32nds not cents
===
TIPS
A TIPS bond has a par value of $1,000 and a coupon rate of 2.0%. Inflation over the year is 3.5%, and the principal is adjusted accordingly. What coupon payment does the holder receive for the year?
$20.00|*$20.70|$35.00|$55.70
TIPS pay the coupon on the inflation-adjusted principal: $1,000 × 1.035 = $1,035, and $1,035 × 2.0% = $20.70.
TIPS=Treasury bond whose principal is adjusted for inflation and whose coupon is paid on the adjusted principal
===
Common stock
Which pair of characteristics best describes common stock?
Fixed claim and unlimited liability|Residual claim and unlimited liability|*Residual claim and limited liability|Fixed claim and limited liability
Shareholders are last in line, receiving only what remains after creditors and preferred holders are paid, and they can lose no more than the amount invested because personal assets are shielded.
residual claim=right to what is left after creditors and preferred holders are paid; limited liability=loss capped at the amount invested
===
Preferred stock
Preferred stock is often called a hybrid of debt and equity because:
It can be converted into the firm’s bonds at the holder’s discretion at any time and pays interest instead of dividends|It carries full voting rights like common stock and a guaranteed maturity date like a bond|*It pays a fixed dividend like a perpetual bond with no maturity, yet it is equity that ranks below bondholders and above common stockholders|Its dividend is tax-deductible for the issuer, like interest, and rises automatically with the firm’s earnings
Preferred pays a fixed, often cumulative dividend and has priority over common but ranks below debt; unlike bond interest, its dividends are not tax-deductible for the issuer.
cumulative preferred=skipped dividends accrue and must be paid before common dividends
===
ADRs
A foreign company’s common share trades at KRW 540,000 in Seoul. One ADR represents 1/10 of a common share, and the exchange rate is KRW 1,350 per U.S. dollar. Ignoring costs, what is the ADR’s approximate dollar price?
$4.00|*$40.00|$400.00|$54,000
ADR price = share price × ratio ÷ exchange rate = 540,000 × 1/10 ÷ 1,350 = $40.00.
deposit ratio=fraction or multiple of a home share that one ADR represents
===
Price-weighted index
Consider the three stocks in the table, where Pt is the price and Qt the shares outstanding at time t. Stock C splits two-for-one in the last period (its price falls from 132 to 70 after the split). What is the rate of return on a price-weighted index for the first period (t = 0 to t = 1), and what must the divisor become for the second period so that the split does not change the index level?
Return 3.20%; new divisor 2.24|Return 6.12%; new divisor 3.00|*Return 6.12%; new divisor 2.24|Return 6.12%; new divisor 2.38
Price-weighted return = (86 + 42 + 132) ÷ (80 + 45 + 120) − 1 = 260 ÷ 245 − 1 = 6.12%; just before the split the index is (86 + 42 + 132) ÷ 3 = 86.67, and after it the sum is 86 + 42 + 66 = 194, so the divisor must be d = 194 ÷ 86.67 = 2.24.
price-weighted index=sum of prices divided by a divisor; divisor adjustment=keeps the index level unchanged after a split

Equally and value-weighted indexes
Using the three stocks in the table (stock C splits two-for-one in the last period), what are the first-period returns (t = 0 to t = 1) on an equally weighted index and on a value-weighted index?
*Equally weighted 3.61%; value-weighted 3.20%|Equally weighted 3.20%; value-weighted 3.61%|Equally weighted 3.61%; value-weighted 6.12%|Equally weighted 6.12%; value-weighted 3.20%
Equally weighted = average of the three returns = (7.50% − 6.67% + 10.00%) ÷ 3 = 3.61%; value-weighted = total market value growth = (86×150 + 42×300 + 132×100) ÷ (80×150 + 45×300 + 120×100) − 1 = 38,700 ÷ 37,500 − 1 = 3.20%.
equally weighted index=average of the stock returns; value-weighted index=return on the total market capitalization
@tbl Stock|P0|Q0|P1|Q1|P2|Q2;;A|80|150|86|150|89|150;;B|45|300|42|300|40|300;;C|120|100|132|100|70|200
===
Equally weighted index
Which statement about an equally weighted index is correct?
It corresponds to a buy-and-hold strategy, so no trading is needed as prices change|It gives the greatest weight to the highest-priced stocks, as the Dow Jones Industrial Average does|It gives the greatest weight to the largest-capitalization firms, as the S&P 500 does|*Maintaining it requires periodic rebalancing — selling stocks that have risen and buying stocks that have fallen
An equally weighted index averages stock returns, i.e. an equal dollar amount in each stock; prices drift the weights apart, so the investor must keep trading back to equal dollars.
rebalancing=trading to restore target weights after prices move
===
Options
Which statement about a call option is correct?
The holder is obligated to buy the asset at expiration regardless of the asset’s price|*The holder has the right but not the obligation to buy the asset at the exercise price, and loses at most the premium paid|The holder’s loss is unlimited, because the asset price can rise without bound and the holder must deliver at the strike|A call is exercised only when the market price falls below the strike price at or before expiration
The buyer pays a premium for a right: the loss is capped at the premium and the gain is open-ended, and the call is exercised only when the market price is above the strike.
call=right to buy at the strike price; premium=price paid up front for the option
===
Option payoffs
You buy a call option with a strike price of $50 for a premium of $3 per share, and the stock trades at $57 at expiration. You also buy a put option with a strike price of $60 for a premium of $4. What is your profit per share on the call, and at what stock price does the put break even?
Call profit $7; put break-even $56|Call profit $4; put break-even $64|Call profit $10; put break-even $60|*Call profit $4; put break-even $56
Call profit = max(57 − 50, 0) − 3 = $4; a put pays K − S_T, so the premium is recovered when S_T = K − premium = 60 − 4 = $56.
option profit=payoff minus premium paid; put break-even=strike minus premium
===
Futures and options
Which statement correctly distinguishes a long futures position from a long call position?
The futures buyer has the right but not the obligation to take delivery, while the call buyer is obligated to buy|Both positions require an up-front premium payment of the same size|The futures buyer’s maximum loss is limited to the initial margin posted|*The futures buyer is obligated to settle at the futures price, while the call buyer will exercise only if it is profitable
An option is a right, bought for a premium, with a capped loss; a futures contract is an obligation with no premium (margin only), marked to market daily, so a move against you must still be settled.
futures=obligation to trade at a set price on a future date; marked to market=gains and losses settled daily

# Chapter 3: Securities Markets
===
Primary market
Which of the following transactions takes place in the primary market?
An investor buys 100 shares of Samsung Electronics from another investor on the exchange|A mutual fund sells its holdings of Toyota stock to a pension fund|*A firm sells newly issued shares to the public in an initial public offering|A dealer buys shares into inventory from a customer
The primary market is where new securities are issued and the issuing firm receives the proceeds; every later trade among investors is a secondary-market trade that brings the firm no new money.
primary market=market where new securities are sold and the issuer receives the proceeds; secondary market=trading of existing securities among investors
===
Underwriting
In a firm commitment underwriting, the investment bank:
Acts only as an agent and returns any unsold shares to the issuer|Guarantees the issuing firm a minimum share price for one year after the offering|*Buys the entire issue from the firm and bears the placement risk of reselling it to the public|Lends the issuing firm the offering proceeds, to be repaid out of future earnings
The underwriter sets an offer price from book-building demand and, under a firm commitment, bears the placement risk; its compensation is the spread between the price it pays and the price it charges.
firm commitment=underwriter buys the whole issue and bears the placement risk; book-building=gauging investor demand before setting the offer price
===
IPO cost
A firm sells 200,000 shares in an initial public offering at an offer price of $25. The underwriter’s explicit fees are $150,000, and the share price closes at $28 on the first day of trading. What is the best estimate of the total cost of the equity issue to the firm?
$150,000|$600,000|*$750,000|$4,850,000
Cost = explicit fee + money left on the table = $150,000 + (28 − 25) × 200,000 = $750,000.
money left on the table=first-day price gain times shares sold, a hidden cost to the issuer
===
Limit-order book
The sell side of a limit-order book for a stock shows the orders in the table. You submit a market order to buy 700 shares. What total amount will you pay, ignoring commissions?
$21,980|*$22,000|$22,015|$22,085
A market buy fills against the lowest asks first: 300 × $31.40 + 400 × $31.45 = $22,000 (an average of $31.43).
market order=executes immediately at the best available prices, sweeping several book levels if needed
@tbl Ask price|Shares offered;;$31.40|300;;$31.45|500;;$31.55|600
===
Market vs. limit orders
Which statement correctly contrasts a market order with a limit order?
A market order guarantees a price but not execution; a limit order guarantees execution but not price|*A market order executes immediately at the best available price; a limit order executes only at the specified price or better, and may never execute|Both orders execute immediately at the quoted price, but a limit order pays a lower commission|A limit order can only be used to buy, while a market order can be used to buy or sell and is the only order allowed during trading hours
A market order buys certainty of execution but not of price; a limit order buys certainty of price but not of execution, and you rarely get both.
limit order=buy at or below, or sell at or above, a price you set
===
Stop orders
You own a stock at $120 and place a stop-loss order at $108. Overnight, bad news makes the stock open the next morning at $102. What happens?
The shares are sold at exactly $108, because a stop-loss order guarantees the stop price|The order is never triggered, because the price skipped over $108 without trading at it|*The stop is triggered and a market order sells the shares near the $102 opening price|The order becomes a limit order at $108, which cannot be filled at the lower opening price
A stop-loss guarantees execution, not price, so after a gap down it fills near the opening price; a stop-limit order, by contrast, would guarantee the price but might not fill at all.
gap-down risk=price jumps past the stop so the fill is far below it; stop-limit=becomes a limit order at the trigger and may not fill
===
Market structure
Which statement correctly contrasts the NYSE and Nasdaq?
*The NYSE is an auction, order-driven market with a central limit-order book, while Nasdaq is a dealer, quote-driven market with competing market makers|The NYSE is a dealer market with competing market makers, while Nasdaq is an auction market with a central limit-order book|Both are pure dealer markets with no limit-order book|Nasdaq has a physical trading floor, while the NYSE has no human oversight at all
The NYSE uses a central limit-order book with price–time priority (with human oversight at the open and close); Nasdaq has no trading floor and liquidity comes from multiple dealers posting quotes.
auction market=all traders converge on one place and price; dealer market=dealers quote bid and ask and trade from inventory
===
Buying power
You have $15,000 of cash and the initial margin requirement is 40%. What is the maximum value of stock you can buy, and how much do you borrow? (Ignore commissions.)
Buy $37,500; borrow $15,000|*Buy $37,500; borrow $22,500|Buy $30,000; borrow $15,000|Buy $25,000; borrow $10,000
Buying power = cash ÷ initial margin = $15,000 ÷ 0.40 = $37,500; the loan is $37,500 − $15,000 = $22,500.
buying power=cash divided by the initial margin requirement
===
Margin call
An investor buys 800 shares at $25 per share using the maximum allowable initial margin of 50%, so the margin loan is $10,000. The maintenance margin is 35%. At what share price will the investor receive a margin call?
$8.75|$12.50|$16.25|*$19.23
Margin = (800P − 10,000) ÷ 800P = 0.35 → 800P × 0.65 = 10,000, so P = $19.23; below this price a margin call is issued.
maintenance margin=minimum equity ratio; falling below it triggers a margin call
===
Return on margin
An investor buys 300 shares at $60 per share, borrowing 40% of the purchase price at an interest rate of 7% per year. One year later the shares are sold at $66. The stock pays no dividends and commissions are ignored. What is the rate of return on the investor’s equity?
9.67%|10.00%|*12.00%|16.67%
Position = 300 × $60 = $18,000; equity = $10,800, loan = $7,200; ending equity = 300 × $66 − $7,200 × 1.07 = $12,096, so the return is 12,096 ÷ 10,800 − 1 = 12.00% (versus 10.00% unlevered).
leverage=borrowing magnifies returns up or down; interest accrues on the loan whatever the stock does
===
Margin trading
Which statement about buying stock on margin is correct?
Margin reduces the volatility of the investor’s return because the loan is a fixed obligation|*Margin magnifies both gains and losses on the investor’s equity, and interest on the loan accrues whatever the stock does|The investor’s maximum loss on a margined position equals the loss on an unmargined position|The initial margin requirement is set by each individual broker and cannot be changed by regulators
The shares are collateral for a fixed loan, so all price variation falls on the investor’s equity; leverage scales the return up and down, and Reg T sets initial margin at a minimum of 50% equity.
Reg T=Federal Reserve rule requiring at least 50% equity to open a margin position
===
Short-sale mechanics
Which statement about the cash flows and obligations in a short sale is correct?
*The proceeds are held in the account as collateral, additional margin must be posted, and the short seller must reimburse any dividends the stock pays|The short seller receives the sale proceeds in cash and may withdraw them immediately to invest elsewhere, with no further obligation|The short seller is entitled to receive any dividends paid on the borrowed shares, because the seller is the owner of record|The position requires no margin because the shares were sold rather than bought, so no capital is at risk
Short sales must be done in a margin account: the proceeds are not withdrawn, the investor also deposits initial margin, and dividends and borrow fees are costs of staying short.
payment in lieu=reimbursing the lender for dividends paid while short
===
Short-sale margin call
An investor sells short 200 shares at $40 per share and deposits the required initial margin of 50% in cash. The maintenance margin is 35%. At what share price will the investor receive a margin call?
$39.00|*$44.44|$54.00|$60.00
Collateral = proceeds $8,000 + margin $4,000 = $12,000; margin = (12,000 − 200P) ÷ 200P = 0.35, so P = 12,000 ÷ (200 × 1.35) = $44.44; for a short position the call comes when the price rises.
short margin=equity divided by the value of shares owed; equity shrinks as the price rises
===
Short-sale return
An investor sells short 500 shares at $60 per share and deposits an initial margin of 50% of the short value. One year later the investor covers at $54, after the stock paid a dividend of $1.50 per share. Treating the initial margin as the amount invested, what is the rate of return on the short position?
7.50%|*15.00%|20.00%|25.00%
Profit = (60 − 54 − 1.50) × 500 = $2,250 (the dividend must be reimbursed); the investment is the margin of $15,000, so the return is 2,250 ÷ 15,000 = 15.00%.
return on a short=profit divided by the margin deposited; dividends paid are a cost
===
Regulation
Which statement about U.S. securities regulation is correct?
The Securities Exchange Act of 1934 tightened governance after the 2002 scandals, and the CFTC regulates futures|*The Sarbanes–Oxley Act of 2002 tightened auditing and governance standards after accounting scandals, and the CFTC regulates futures|The Sarbanes–Oxley Act of 2002 tightened governance, and FINRA is the government agency that regulates futures|The Securities Act of 1933 tightened governance after the 2002 scandals, and the SEC regulates futures
Sarbanes–Oxley (2002) responded to the accounting scandals; the SEC oversees securities and security options, the CFTC oversees futures, and FINRA is the industry self-regulatory body.
Sarbanes–Oxley Act=2002 law tightening corporate governance, auditing and reporting; CFTC=regulator of futures and commodity derivatives

# Chapter 4: Mutual Funds and Other Investment Companies
===
Core services
Which of the following is NOT one of the four core services an investment company provides to small investors?
Diversification and divisibility|Lower transaction costs from trading in large blocks|Record keeping and administration|*A guaranteed return above the market index
The four services are record keeping and administration, diversification and divisibility, professional management and lower transaction costs; whether managers succeed on average is an empirical question.
four core services=record keeping, diversification and divisibility, professional management, lower transaction costs
===
Computing NAV
A fund holds 120,000 shares of A at $52, 200,000 shares of B at $18, 90,000 shares of C at $64, and 350,000 shares of D at $9.50. Liabilities are $0.9 million and there are 2.2 million fund shares outstanding. What is the NAV per share?
$6.68|*$8.19|$8.60|$9.01
Assets = 120,000×52 + 200,000×18 + 90,000×64 + 350,000×9.5 = $18,925,000; NAV = (18,925,000 − 900,000) ÷ 2,200,000 = $8.19.
NAV=(market value of assets minus liabilities) divided by shares outstanding
===
New shares at NAV
An open-end fund has a NAV of $32.00. An investor buys $1.6 million of the fund. How many new shares are issued, and what is NAV afterward?
50,000 shares; NAV rises to $32.80|1,600,000 shares; NAV stays at $32.00|No new shares; NAV rises|*50,000 shares; NAV stays at $32.00
New shares = $1,600,000 ÷ $32.00 = 50,000; assets and shares rise in proportion, so NAV stays at $32.00.
issuance at NAV=new investors buy in at NAV, so existing holders are not diluted
===
Open-end orders
You place an order to buy shares of an open-end mutual fund at 10:30 a.m. At what price is the order filled?
At the last NAV published before 10:30 a.m.|At the market price quoted on the exchange at 10:30 a.m.|At any limit price you specify, if the market reaches it|*At the NAV struck at the 4:00 p.m. close that day
Open-end funds transact only at NAV, struck once daily at 4:00 p.m. ET, so every order that day gets the same price and you do not know it when you order; intraday prices and limit orders belong to ETFs and closed-end funds.
struck NAV=the single daily price at which open-end funds trade
===
Closed-end funds
Which statement about closed-end funds is correct?
*Shares outstanding are fixed after the IPO, and the market price can differ from NAV|Investors redeem shares directly with the fund at NAV whenever they wish|Shares outstanding change daily as investors buy new shares from, and redeem them to, the fund|The market price is required by law to equal NAV at the close of each trading day
A closed-end fund neither issues nor redeems shares after its IPO; investors trade with each other on an exchange, so supply and demand set a price that may be at a premium or discount to NAV.
closed-end fund=fixed number of shares traded on an exchange at a market price
===
Closed-end fund return
You buy a closed-end fund at $21.00 when its NAV is $24.00. One year later NAV is still $24.00, the price is $22.50, and the fund distributed $1.05 per share. What is your rate of return?
4.38%|7.14%|11.33%|*12.14%
Return = (22.50 − 21.00 + 1.05) ÷ 21.00 = 12.14%, measured on the market price actually paid.
discount narrowing=price rising toward NAV, an extra gain to the buyer
===
Unit investment trusts
Which feature describes a unit investment trust (UIT)?
An actively managed portfolio overseen by a board of directors|A private pool open only to accredited investors|*A fixed, unmanaged portfolio that terminates on a set date|A fund that trades continuously on an exchange at NAV
A sponsor deposits a fixed portfolio into a trust and sells redeemable units; with essentially no trading afterwards, management fees are very low and the trust is self-liquidating.
UIT=unit investment trust with a fixed unmanaged portfolio; sponsors typically charge NAV plus a 1 to 4 percent markup
===
Hedge funds
Compared with a mutual fund, a hedge fund typically:
Offers daily redemption at NAV to the general public, like an open-end mutual fund|Faces tighter limits on leverage and short sales because it is regulated more heavily|*Is open only to accredited or institutional investors and is largely exempt from the Investment Company Act|Charges a lower fee than a mutual fund because it is less regulated and pays no incentive fee
Hedge funds are private pools that disclose little, may use short sales, derivatives and heavy leverage, impose lock-up periods, and charge about “2 and 20”.
hedge fund=private pool for accredited or institutional investors; 2 and 20=about 2 percent of assets plus 20 percent of profits
===
12b-1 fees
Which statement about 12b-1 fees is correct?

*Cov = −64.5; ρ = −0.96|Cov = 64.5; ρ = 0.96|Cov = −27.0; ρ = −0.40|Cov = −64.5; ρ = −2.93
E(S) = 8% and E(B) = 5%; Cov = Σ p × (dev S) × (dev B) = −64.5; σS = 18.35% and σB = 3.67%, so ρ = −64.5 ÷ (18.35 × 3.67) = −0.96; the stock does worst exactly when the bond does best.
covariance=probability-weighted product of the two deviations from their means; correlation=covariance divided by the product of the standard deviations
@tbl State|Prob.|Stock return|Bond return;;Severe recession|0.25|−20%|+11%;;Mild recession|0.25|+4%|+5%;;Normal growth|0.25|+16%|+2%;;Boom|0.25|+30%|+2%
===
Two-asset portfolio
A stock fund has E(r) = 11% and σ = 22%; a bond fund has E(r) = 5% and σ = 8%; their correlation is 0.3. What are the expected return and standard deviation of a portfolio with 70% in stocks and 30% in bonds?
E(rP) = 9.20%, σP = 17.80%|E(rP) = 9.20%, σP = 15.59%|E(rP) = 8.00%, σP = 12.78%|*E(rP) = 9.20%, σP = 16.28%
E(rP) = 0.7(11) + 0.3(5) = 9.20%; variance = 0.49(484) + 0.09(64) + 2(0.7)(0.3)(52.8) = 265.10, so σP = 16.28%.
portfolio variance=wS² σS² plus wB² σB² plus 2 wS wB Cov; expected return is linear in the weights
===
Zero-risk mix
A stock fund (E(r) = 14%, σ = 30%) and a bond fund (E(r) = 6%, σ = 10%) have a correlation of −1. What weight in stocks creates a zero-risk portfolio, and what is its expected return?
75.0% in stocks; E(r) = 12.0%|*25.0% in stocks; E(r) = 8.0%|33.3% in stocks; E(r) = 8.7%|50.0% in stocks; E(r) = 10.0%
Set wSσS = wBσB: 30w = 10(1 − w), so w = 10 ÷ (30 + 10) = 0.25; E(r) = 0.25(14) + 0.75(6) = 8.0%, with zero standard deviation.
zero-risk mix=weights that make the two risky positions offset each other when rho is minus one
===
Minimum-variance portfolio
Stock fund σS = 24%, bond fund σB = 8%, correlation 0.1. What is the weight in stocks of the minimum-variance portfolio, and its standard deviation?
10.00% in stocks; σ = 7.81%|92.55% in stocks; σ = 22.28%|7.45% in stocks; σ = 8.00%|*7.45% in stocks; σ = 7.79%
Cov = 0.1 × 24 × 8 = 19.2; wS = (σB² − Cov) ÷ (σS² + σB² − 2Cov) = (64 − 19.2) ÷ (576 + 64 − 38.4) = 0.0745; σ = 7.79%, below the bond fund’s own 8%.
minimum-variance portfolio=the mix with the lowest possible standard deviation, found with the closed-form weight formula
===
Diversification condition
A portfolio is 100% in a bond fund with σB = 12%. A stock fund has σS = 30%. For which correlation with the bond fund does adding a small amount of stock reduce the portfolio’s risk?
*ρ = 0.25|ρ = 0.40|ρ = 0.60|ρ = 0.90
Adding the riskier asset lowers risk whenever ρ < σB/σS = 12/30 = 0.40; ρ = 0.25 satisfies this, while ρ = 0.40 is exactly the break-even and higher correlations raise risk.
risk-reducing condition=correlation below the ratio of the safer asset’s sd to the riskier asset’s sd
===
Opportunity set
As the correlation between two risky assets decreases while the expected returns and standard deviations stay the same, what happens to the portfolio opportunity set?
It becomes a straight line between the two assets|It shifts upward, so every mix earns a higher expected return|*It bows further to the left, so a given expected return can be earned at lower risk|It is unchanged, because expected returns are linear in the weights
Expected return depends only on the weights, so diversification shows up as a leftward bow; at ρ = +1 the set is a straight line, and at ρ = −1 it touches the vertical axis.
opportunity set=all risk-return combinations from mixing the assets in different weights
===
Efficient and dominated portfolios
On the opportunity set of two risky assets, which portfolios are efficient?
*Those on the upward-sloping part starting at the minimum-variance portfolio|Those on the downward-sloping part below the minimum-variance portfolio|Every portfolio on the curve|Only the two single-asset portfolios
Points below the minimum-variance portfolio are dominated by points above it with the same risk but a higher expected return, so only the upper branch is efficient.
efficient portfolio=highest expected return for a given risk; dominated portfolios are beaten on both return and risk
===
Optimal risky portfolio
Stock fund: E(r) = 13%, σ = 24%; bond fund: E(r) = 5%, σ = 9%; correlation 0.25; rf = 2%. What are the weights, expected return, standard deviation and Sharpe ratio of the optimal risky portfolio?
*Stocks 39.13%, bonds 60.87%; E(rP) = 8.13%, σP = 12.00%, Sharpe 0.511|Stocks 4.92%, bonds 95.08%; E(rP) = 5.39%, σP = 8.93%, Sharpe 0.380|Stocks 34.02%, bonds 65.98%; E(rP) = 7.72%, σP = 11.23%, Sharpe 0.509|Stocks 60.87%, bonds 39.13%; E(rP) = 9.87%, σP = 15.86%, Sharpe 0.496
Cov = 54.0; RS = 11, RB = 3; wS* = [11(81) − 3(54.0)] ÷ [11(81) + 3(576) − 14(54.0)] = 729 ÷ 1863 = 0.3913; E(rP) = 0.3913(13) + 0.6087(5) = 8.13%; σP² = 143.93, so σP = 12.00%; Sharpe = (8.13 − 2) ÷ 12.00 = 0.511.
optimal risky portfolio=the mix with the highest Sharpe ratio (tangency portfolio)
===
Steepest CAL
rf = 2%. Which of the candidate risky portfolios in the table gives the steepest capital allocation line?
Minimum-variance portfolio (lowest risk)|All stocks (highest expected return)|All bonds (simplest low-risk choice)|*Optimal risky portfolio (highest Sharpe ratio)
Sharpe ratios: All bonds 0.333; Minimum-variance portfolio 0.380; 60 / 40 portfolio 0.497; All stocks 0.458; Optimal risky portfolio 0.511; the CAL slope is the Sharpe ratio, and neither the lowest-risk nor the highest-return portfolio maximizes it.
CAL slope=Sharpe ratio of the risky portfolio; steeper means more expected return at every risk level
@tbl Candidate portfolio|w in stocks|E(rP)|σP;;All bonds|0.00%|5.00%|9.00%;;Minimum-variance portfolio|4.92%|5.39%|8.93%;;60 / 40 portfolio|60.00%|9.80%|15.69%;;All stocks|100.00%|13.00%|24.00%;;Optimal risky portfolio|39.13%|8.13%|12.00%
===
Complete portfolio
The optimal risky portfolio has E(rP) = 8.13%, σP = 12.00% with 39.13% in the stock fund; rf = 2%. What fraction of total wealth should an investor with A = 5 hold in the stock fund?
14.81%|*33.33%|39.13%|85.19%
y* = [E(rP) − rf] ÷ (A·σP²) = 0.0613 ÷ (5 × 0.014393) = 0.8519; stocks = y* × wS* = 0.8519 × 0.3913 = 33.33% of total wealth (look-through).
look-through weight=y* times the weight inside the risky portfolio
===
Separation property
Two clients with risk aversion A = 3 and A = 8 face the same inputs and can lend and borrow at the same risk-free rate. According to the separation property:
*They hold the same stock-to-bond ratio inside the risky portfolio but different amounts of T-bills|They hold different risky portfolios, with the more risk-averse client holding more bonds inside P|They hold the same total allocation to risky assets|The client with A = 8 holds no risky assets
The tangency portfolio is the same for everyone; only y* differs, so the more risk-averse client simply puts more in T-bills while keeping the identical mix within P.
separation property=portfolio choice splits into a technical task (find P) and a personal task (choose y)
===
Limits of separation
Which of the following is a reason why the separation property breaks down in practice?
All investors face identical taxes and the same constraints|Investors agree on the input list and hold the same expectations|Human capital is the same for every investor in the economy|*Borrowing rates exceed lending rates, which kinks the CAL
The other limits listed in the slides are tax differences, human capital (a semiconductor engineer should tilt away from semiconductors), disagreement over the input list, and binding constraints.
kinked CAL=a higher borrowing rate than lending rate, so the line bends at P
===
Efficient frontier with many assets
Which statement about the Markowitz efficient frontier of n risky assets is correct?
Each individual asset lies on the efficient frontier, since single securities are its building blocks|*Individual assets lie inside the frontier, and only the branch above the minimum-variance portfolio is efficient|The entire frontier is efficient, including the part below the minimum-variance portfolio|The tangency portfolio is found by minimizing variance for a zero expected return
The frontier is found by minimizing variance for each target return; single assets are dominated, and the tangency portfolio P* remains the unique Sharpe-maximizing portfolio.
efficient frontier=lowest risk for each expected return among all portfolios of n assets
===
Input list
To run the Markowitz optimization on n = 200 securities, how many estimates are needed in total, and how many of them are covariances?
19,900 in total; 19,900 covariances|20,300 in total; 39,800 covariances|*20,300 in total; 19,900 covariances|40,000 in total; 19,900 covariances
Total = n expected returns + n variances + n(n − 1)/2 covariances = 200 + 200 + 19,900 = 20,300 = n(n + 3)/2; covariances are symmetric, so only n(n − 1)/2 = 19,900 are distinct.
input list=expected returns, variances and covariances for all securities
===
Home bias
Korean households hold mostly domestic equities, although Korea is a small share of world market capitalization. Why would adding foreign equities usually reduce risk?
Foreign equities always earn higher expected returns than domestic equities|Correlations between countries are exactly zero, so foreign risk is fully independent|Adding foreign equities removes market risk entirely, because currencies offset equity moves|*Foreign markets have different industrial structures, so their correlation with domestic stocks is below +1
The benefit is a covariance argument, not a forecasting argument: as long as cross-border correlations are below +1 the interaction term helps, although correlations have risen over recent decades and currency risk must be handled separately.
home-bias puzzle=holding mostly domestic assets despite the diversification benefit of foreign ones

/* ---- code: `inline` in a monospace font; ```lang blocks coloured by language ---- */
:root{--code-bg:#F7F8FA; --tk-k:#8A3FA0; --tk-s:#2F7A3B; --tk-c:#8A8F98; --tk-n:#B5541C; --tk-f:#2B5FA8;}

@media print{
  #printSheet{--tk-k:#7A2E90; --tk-s:#24692F; --tk-c:#6B7079; --tk-n:#A04612; --tk-f:#1F4F96;}
