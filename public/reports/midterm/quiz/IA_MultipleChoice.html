<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// Math text: escape, then x^2 / x^{n+1} -> superscript, P_t / P_{t-1} -> subscript, \pi \Delta \times ... -> symbols. \^ and \_ stay literal.
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const mathFm = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);

/* ---------- code: `inline` -> monospace; ```lang fenced block -> coloured <pre> ---------- */
const CODE_ALIAS = { py:'python', python3:'python', javascript:'js', ts:'js', typescript:'js', jsx:'js', tsx:'js', node:'js',
  'c++':'c', cpp:'c', cs:'c', csharp:'c', 'c#':'c', go:'c', kotlin:'java', swift:'c', rust:'c', bash:'sh', shell:'sh', zsh:'sh', mysql:'sql', postgresql:'sql', sqlite:'sql' };
const CODE_KW = {
  python:'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield self print len range',
  js:'async await break case catch class const continue default delete do else export extends false finally for function if import in instanceof let new null of return static super switch this throw true try typeof undefined var void while yield console',
  java:'abstract boolean break byte case catch char class continue default do double else enum extends final finally float for if implements import instanceof int interface long new null package private protected public return short static super switch this throw throws true false try void while var String System',
  c:'auto bool break case char const continue default do double else enum extern false float for if int long nullptr return short signed sizeof static struct switch true typedef union unsigned void while class public private protected namespace using template typename new delete include define std cout cin endl vector string fn let mut func package import var',
  sql:'select from where and or not insert into values update set delete create table drop alter join left right inner outer full on group by order having as distinct limit offset null is in like between count sum avg min max case when then else end primary key foreign references union all exists asc desc',
  r:'function if else for while repeat break next return TRUE FALSE NULL NA in library',
  sh:'if then else elif fi for while do done case esac in function return echo export local cd ls sudo'
};
function detectLang(s){
  if(/^\s*(def |class \w+:|import \w|from \w+ import)|print\(|:\s*$/m.test(s) && !/[{};]\s*$/m.test(s)) return 'python';
  if(/\b(select|insert into|update|create table)\b[\s\S]*\b(from|values|set|\()/i.test(s)) return 'sql';
  if(/#include|std::|printf\(|cout\s*<</.test(s)) return 'c';
  if(/\b(public|private)\s+(static\s+)?\w+|System\.out/.test(s)) return 'java';
  if(/<-|\blibrary\(/.test(s)) return 'r';
  if(/\b(const|let|function)\b|=>|console\./.test(s)) return 'js';
  if(/^#!\/bin|^\s*(echo|export|sudo|cd) /m.test(s)) return 'sh';
  return 'text';
}
function hl(code, lang){
  const L = CODE_ALIAS[lang] || lang;
  if(!CODE_KW[L]) return esc(code);
  const kw = new Set(CODE_KW[L].split(' ')), ci = L === 'sql';
  const com = ['python', 'r', 'sh'].includes(L) ? '#[^\\n]*' : L === 'sql' ? '--[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const str = '"""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'' + (L === 'js' ? '|`(?:\\\\.|[^`\\\\])*`' : '');
  const re = new RegExp('(' + com + ')|(' + str + ')|(\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-z_]\\w*)(?=\\s*\\()|([A-Za-z_]\\w*)', 'g');
  let out = '', last = 0, m;
  while((m = re.exec(code))){
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    const t = esc(m[0]);
    if(m[1]) out += `<span class="tk-c">${t}</span>`;
    else if(m[2]) out += `<span class="tk-s">${t}</span>`;
    else if(m[3]) out += `<span class="tk-n">${t}</span>`;
    else { const w = m[4] || m[5]; out += kw.has(ci ? w.toLowerCase() : w) ? `<span class="tk-k">${t}</span>` : m[4] ? `<span class="tk-f">${t}</span>` : t; }
  }
  return out + esc(code.slice(last));
}
const codeHTML = c => `<pre class="code" data-lang="${esc(c.lang)}">${c.lang !== 'text' ? `<span class="lang">${esc(c.lang)}</span>` : ''}<code>${hl(c.text, c.lang)}</code></pre>`;
const codeTxt = q => q.code ? '```' + q.code.lang + '\n' + q.code.text + '\n```\n' : '';
const fm = t => {                                          // `inline code` is kept out of the math markup
  const keep = [];
  const s = String(t).replace(/`([^`]+)`/g, (m, c) => { keep.push(`<code class="ic">${esc(c)}</code>`); return `\u0000${keep.length - 1}\u0000`; });
  return mathFm(s).replace(/\u0000(\d+)\u0000/g, (m, i) => keep[+i]);
};

/* Data lives in <script id="quizData"> at the top of this file (see DATA-START/END). */
function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim());
  const meta = {};
  blocks.shift().split('\n').forEach(l => {
    const i = l.indexOf(':');
    if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim();
  });
  let prevTag = '';
  const questions = [], chapters = [], errs = [];
  if(!meta.title) errs.push('meta block: title: is missing (first block = title:/sub:/subject:/textbook: lines, then ===)');
  blocks.forEach(block => {
    const L = [];                                           // ```lang ... ``` lines are taken out as the question's code block
    let fence = null, fenceOpen = false;
    block.replace(/^\n+|\s+$/g, '').split('\n').forEach(l => {
      const f = l.trim().match(/^```\s*([\w+#.-]*)\s*$/);
      if(f && !fenceOpen){ fenceOpen = true; if(fence) fence.lines.push(''); else fence = { lang: f[1].toLowerCase(), lines: [] }; return; }
      if(f && fenceOpen){ fenceOpen = false; return; }
      if(fenceOpen) fence.lines.push(l); else L.push(l.trim() ? l.replace(/^\s+/, '') : l);
    });
    while(L.length && !L[L.length - 1].trim()) L.pop();
    if(L.length === 1 && L[0].startsWith('# ')){            // chapter marker: "# Chapter title"
      chapters.push({ title: L[0].slice(2).trim(), idx: [] });
      return;
    }
    if(!chapters.length) chapters.push({ title: meta.title || 'Quiz', idx: [] });
    const ch = chapters.length - 1;
    chapters[ch].seen = (chapters[ch].seen || 0) + 1;      // counts malformed blocks too, so error numbers match the data
    const who = `${chapters[ch].title} · Q${chapters[ch].seen}`;
    if(fenceOpen) errs.push(`${who}: code block has no closing line of three backticks`);
    const qtext0 = fence ? fence.lines.join('\n').replace(/^\n+|\s+$/g, '') : '';
    const qcode = qtext0 ? { lang: (fence.lang && (CODE_ALIAS[fence.lang] || fence.lang)) || detectLang(qtext0), text: qtext0 } : null;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, options, explanation), found ${L.length} - check for a missing ===`); return; }
    if(L[0].trim() === '-' && !prevTag) errs.push(`${who}: tag "-" has no previous tag`);
    const tag = L[0].trim() === '-' ? prevTag : L[0].trim();
    prevTag = tag;
    let correct = 0;
    const options = L[2].split('|').map((o, i) => {
      o = o.trim();
      if(o.startsWith('*')){ correct = i; return o.slice(1).trim(); }
      return o;
    });
    const stars = L[2].split('|').filter(o => o.trim().startsWith('*')).length;
    if(stars !== 1) errs.push(`${who}: exactly one option must start with * (found ${stars})`);
    if(options.length < 2 || options.length > 4) errs.push(`${who}: ${options.length} options (use 2-4)`);
    if(options.some(o => !o) || !L[1].trim() || !L[3].trim()) errs.push(`${who}: empty option, question or explanation`);
    const extra = L.slice(4), figLine = extra.find(l => l.startsWith('@')), termLine = extra.find(l => !l.startsWith('@')) || '';
    let fig = null;
    const fm = figLine && figLine.match(/^@(img|tbl)\s+(.+)$/);
    if(figLine && !fm) errs.push(`${who}: unknown line starting with @ (use "@img file" or "@tbl H1|H2;;a|b")`);
    if(fm && fm[1] === 'tbl'){ const rr = fm[2].split(';;').map(r => r.split('|').length); if(rr.length < 2 || new Set(rr).size !== 1) errs.push(`${who}: @tbl needs a header row + at least 1 row, all with the same number of columns`); }
    if(fm) fig = fm[1] === 'img' ? { type: 'img', src: fm[2].trim() } : { type: 'tbl', rows: fm[2].split(';;').map(r => r.split('|').map(c => c.trim())) };
    const vocab = termLine.split(';').map(x => x.trim()).filter(Boolean).map(pair => {
      const i = pair.indexOf('=');
      return i < 0 ? [pair, ''] : [pair.slice(0, i).trim(), pair.slice(i + 1).trim()];
    });
    chapters[ch].idx.push(questions.length);
    questions.push({ tag, code: qcode, text: L[1].trim(), options, correct, explain: L[3].trim(), vocab, fig, ch, n: chapters[ch].idx.length });
  });
  chapters.filter(c => !c.idx.length).forEach(c => errs.push(`chapter "${c.title}" has no questions`));
  if(!questions.length) errs.push('no questions found');
  const good = chapters.filter(c => c.idx.length);
  return { meta, questions, chapters: good.length ? good : [{ title: meta.title || 'Quiz', idx: [] }], errs };
}

const PARSED = parseQuizData(document.getElementById('quizData').textContent);
const META = PARSED.meta;
const QUIZ_TITLE = META.title || 'Quiz';
const QUESTIONS = PARSED.questions;
const CHAPTERS = PARSED.chapters;
if(PARSED.errs.length){                           // data mistakes: show them instead of failing silently
  const box = document.createElement('div');
  box.className = 'data-errors';
  box.innerHTML = '<b>Quiz data needs fixing</b><ul>' + PARSED.errs.slice(0, 10).map(e => `<li>${esc(e)}</li>`).join('') + '</ul>' + (PARSED.errs.length > 10 ? `<div>… and ${PARSED.errs.length - 10} more</div>` : '');
  document.body.insertBefore(box, document.querySelector('header'));
}
let activeCh = 0;
let viewAll = false;                                    // all-chapters view (not saved)
let pickNums = null;                                  // question numbers typed in the search box (null = all)
const baseIdx = () => viewAll ? QUESTIONS.map((_, i) => i) : CHAPTERS[activeCh].idx;
const scopeIdx = () => pickNums ? baseIdx().filter(i => pickNums.has(QUESTIONS[i].n)) : baseIdx();
const chLabel = ci => { const t = CHAPTERS[ci].title, m = /^\s*(?:chapter|ch\.?|week|lecture)\s*(\d+)/i.exec(t); return m ? 'Ch.' + m[1] : t; };   // "Chapter 3: Markets" -> "Ch.3"
const printTitle = () => CHAPTERS.length > 1 ? CHAPTERS[activeCh].title : QUIZ_TITLE;

document.getElementById('quizTitle').textContent = QUIZ_TITLE;
document.getElementById('quizSub').textContent = META.sub || '';
document.title = QUIZ_TITLE;
document.getElementById('quizFooter').textContent = `Source: ${META.subject || ''} — ${META.textbook || ''}`;

let current = 0;
let answered = new Array(QUESTIONS.length).fill(null);
let filterMode = 'all';   // 'all' | 'review' | 'flagged'
const flagged = new Set();                                 // questions ticked "Review" (top right of each question)
let flagList = [];                                         // marked questions shown in "Marked for Review" mode
let layoutMode = 'list';  // 'list' | 'single'
let reviewList = [];
const missed = new Set();   // questions answered wrong at least once since Restart
let examMode = false;                                   // exam mode: answers hidden until Grade
let examPick = new Array(QUESTIONS.length).fill(null);  // ungraded exam selections
let examGraded = new Array(QUESTIONS.length).fill(false);   // graded in exam mode (per question, so any chapter or all chapters can be graded)
let examRes = new Array(QUESTIONS.length).fill(null);       // 'c' correct / 'w' wrong / 'u' unanswered, set when graded
const examActive = qi => examMode && !examGraded[qi];
const shownAns = qi => examActive(qi) ? examPick[qi] : answered[qi];
const setOn = (btn, on) => { btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on)); };

const quizEl = document.getElementById('quiz');
const answeredCountEl = document.getElementById('answeredCount');
const correctCountEl = document.getElementById('correctCount');
const wrongCountEl = document.getElementById('wrongCount');
const reviewBtn = document.getElementById('reviewBtn');
const allViewBtn = document.getElementById('allViewBtn');
const layoutToggleBtn = document.getElementById('layoutToggleBtn');
const keywordsToggleBtn = document.getElementById('keywordsToggleBtn');
const darkModeBtn = document.getElementById('darkModeBtn');
const resetBtn = document.getElementById('resetBtn');
const copyMissedBtn = document.getElementById('copyMissedBtn');
const toTopBtn = document.getElementById('toTopBtn');
const modeLabel = document.getElementById('modeLabel');
const reviewBanner = document.getElementById('reviewBanner');
const reviewBannerText = document.getElementById('reviewBannerText');
const reviewBannerActions = document.getElementById('reviewBannerActions');

function wrongIndices(){
  return scopeIdx().filter(i => answered[i] !== null && answered[i] !== QUESTIONS[i].correct);
}
function visibleIndices(){
  return filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : scopeIdx();
}

function figHTML(f){
  return f.type === 'img' ? `<img src="${esc(f.src)}" alt="Figure">`
    : '<table>' + f.rows.map((r, i) => '<tr>' + r.map(c => i ? `<td>${fm(c)}</td>` : `<th>${fm(c)}</th>`).join('') + '</tr>').join('') + '</table>';
}
const lightbox = document.getElementById('lightbox'), lbBody = document.getElementById('lbBody');
const closeLightbox = () => lightbox.classList.remove('show');
lightbox.addEventListener('click', closeLightbox);
function openLightbox(f){ lbBody.innerHTML = figHTML(f); lightbox.classList.add('show'); }

function qaText(qi){                               // question + options, answer, explanation (plain text for pasting)
  const q = QUESTIONS[qi], L = i => String.fromCharCode(97 + i);
  const ch = CHAPTERS.length > 1 ? `[${CHAPTERS.find(c => c.idx.includes(qi)).title}] ` : '';
  return `${ch}Q${q.n}. ${q.text}\n` + codeTxt(q) + q.options.map((o, i) => `${L(i)}. ${o}`).join('\n') +
    (q.fig && q.fig.type === 'tbl' ? '\n[Table]\n' + q.fig.rows.map(r => r.join(' | ')).join('\n') : '') +
    `\nAnswer: ${L(q.correct)}. ${q.options[q.correct]}\nExplanation: ${q.explain}`;
}

function buildRow(qi, { showRetryPill }){
  const q = QUESTIONS[qi];
  const row = document.createElement('div');
  row.className = 'qrow' + (qi === current ? ' active' : '') + (q.fig ? ' has-fig' : '');
  row.dataset.index = qi;
  if(layoutMode === 'list'){
    row.addEventListener('click', () => {
      if(String(window.getSelection())) return;           // user is selecting text
      current = qi;
      quizEl.querySelectorAll('.qrow').forEach(r => r.classList.toggle('active', Number(r.dataset.index) === qi));
    });
  }

  const qmain = document.createElement('div');
  qmain.className = 'qmain';

  const qhead = document.createElement('div');
  qhead.className = 'qhead';
  qhead.innerHTML = `<div class="qnum">${q.n}</div>` + (CHAPTERS.length > 1 ? `<div class="qchap">${esc(chLabel(q.ch))}</div>` : '') + `<div class="qtag">${fm(q.tag)}</div>` + (showRetryPill ? `<span class="retry-pill">Retry</span>` : '');
  const fl = document.createElement('label');
  fl.className = 'qflag' + (flagged.has(qi) ? ' on' : '');
  fl.title = 'Mark this question for review';
  fl.innerHTML = `<input type="checkbox"${flagged.has(qi) ? ' checked' : ''}>Review`;
  fl.addEventListener('click', e => e.stopPropagation());
  fl.querySelector('input').addEventListener('change', e => {
    e.target.checked ? flagged.add(qi) : flagged.delete(qi);
    fl.classList.toggle('on', e.target.checked);
    updateChrome();
  });
  qhead.appendChild(fl);
  qmain.appendChild(qhead);

  const qtext = document.createElement('p');
  qtext.className = 'qtext';
  qtext.innerHTML = fm(q.text);
  qmain.appendChild(qtext);
  if(q.code) qmain.insertAdjacentHTML('beforeend', codeHTML(q.code));

  const opts = document.createElement('div');
  opts.className = 'options';
  q.options.forEach((optText, oi) => {
    const btn = document.createElement('div');
    btn.className = 'opt';
    btn.setAttribute('role', 'button');
    btn.innerHTML = `<span class="optnum">${oi+1}</span><span>${fm(optText)}</span>`;
    if(examActive(qi)){
      if(examPick[qi] === oi) btn.classList.add('picked');
    } else if(answered[qi] !== null){
      if(oi === q.correct) btn.classList.add('correct');
      else if(oi === answered[qi]) btn.classList.add('incorrect');
      else btn.classList.add('dim');
    }
    btn.addEventListener('click', () => { if(String(window.getSelection())) return; selectAnswer(qi, oi); });
    opts.appendChild(btn);
  });
  qmain.appendChild(opts);

  const fb = document.createElement('div');
  const fbOn = !examActive(qi) && answered[qi] !== null;
  fb.className = 'feedback' + (fbOn ? ' show ' + (answered[qi] === q.correct ? 'right' : 'wrong') : '');
  if(fbOn){
    const verdict = answered[qi] === q.correct ? 'Correct.' : (answered[qi] === -1 ? 'Not answered.' : 'Incorrect.');
    fb.innerHTML = `<span class="verdict">${verdict}</span>${fm(q.explain)}`;
  }
  qmain.appendChild(fb);

  row.appendChild(qmain);

  if(!examActive(qi) && answered[qi] !== null){        // graded: copy button, end of the tag row
    const cp = document.createElement('span');
    cp.className = 'copyq'; cp.setAttribute('role', 'button'); cp.title = 'Copy question, answer and explanation'; cp.textContent = 'Copy';
    cp.addEventListener('click', (e) => {
      e.stopPropagation();
      copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed'));
    });
    qhead.appendChild(cp);
  }

  const margin = document.createElement('div');
  margin.className = 'margin' + (q.fig ? ' figbox' : '');
  if(q.fig){                                   // figure/table replaces the keywords for this question
    margin.innerHTML = `<div class="fig" role="button">${figHTML(q.fig)}</div>`;
    margin.querySelector('.fig').addEventListener('click', () => { if(!String(window.getSelection())) openLightbox(q.fig); });
    row.appendChild(margin);
    return row;
  }
  const label = document.createElement('div');
  label.className = 'margin-label';
  label.textContent = 'Key vocabulary';
  margin.appendChild(label);
  const ul = document.createElement('ul');
  q.vocab.forEach(([term, def]) => {
    const li = document.createElement('li');
    li.innerHTML = `<b>${fm(term)}</b>${def ? ' — ' + fm(def) : ''}`;
    ul.appendChild(li);
  });
  margin.appendChild(ul);
  row.appendChild(margin);

  return row;
}

function render(){
  ignoreScrollUntil = performance.now() + 400;
  quizEl.innerHTML = '';
  const visible = visibleIndices();

  if(visible.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = filterMode === 'flagged' ? `<div class="big">No questions marked for review.</div>`
      : `<div class="big">Nothing to review.</div><div>Every question was answered correctly — switch back to "All Questions".</div>`;
    quizEl.appendChild(empty);
    updateChrome();
    return;
  }

  if(layoutMode === 'single'){
    quizEl.classList.remove('list-view');
    const pos = Math.max(0, visible.indexOf(current));
    const qi = visible[pos] !== undefined ? visible[pos] : visible[0];
    current = qi;

    const shell = document.createElement('div');
    shell.className = 'single-shell';

    const progress = document.createElement('div');
    progress.className = 'single-progress';
    progress.innerHTML = `<span>Question ${pos+1} of ${visible.length}</span><span>${[viewAll && CHAPTERS.length > 1 ? esc(CHAPTERS[QUESTIONS[qi].ch].title) : '', filterMode === 'review' ? 'Review mode' : ''].filter(Boolean).join(' · ')}</span>`;
    shell.appendChild(progress);

    const bar = document.createElement('div');
    bar.className = 'single-progress-bar';
    bar.innerHTML = `<i style="width:${((pos+1)/visible.length*100).toFixed(1)}%"></i>`;
    shell.appendChild(bar);

    const body = document.createElement('div');
    body.className = 'single-body';
    body.appendChild(buildRow(qi, { showRetryPill: filterMode === 'review' }));
    shell.appendChild(body);

    const nav = document.createElement('div');
    nav.className = 'single-nav';
    const prevBtn = document.createElement('button');
    prevBtn.className = 'btn';
    prevBtn.textContent = '← Previous';
    prevBtn.disabled = pos === 0;
    prevBtn.addEventListener('click', goPrev);
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn primary';
    const nc = nextChapterIdx(), lastQ = pos === visible.length - 1;
    nextBtn.textContent = lastQ && nc > -1 ? `Next chapter: ${chLabel(nc)} →` : 'Next →';
    nextBtn.disabled = lastQ && nc < 0;
    nextBtn.addEventListener('click', () => { if(lastQ && nc > -1) switchChapter(nc); else goNext(); });
    nav.appendChild(prevBtn);
    nav.appendChild(nextBtn);
    shell.appendChild(nav);

    quizEl.appendChild(shell);
  } else {
    quizEl.classList.add('list-view');
    let prevCh = -1;
    visible.forEach((qi) => {
      if(viewAll && CHAPTERS.length > 1 && QUESTIONS[qi].ch !== prevCh){
        const h = document.createElement('div'); h.className = 'ch-head'; h.textContent = CHAPTERS[QUESTIONS[qi].ch].title; quizEl.appendChild(h);
      }
      prevCh = QUESTIONS[qi].ch;
      quizEl.appendChild(buildRow(qi, { showRetryPill: filterMode === 'review' }));
    });
    const nc = nextChapterIdx();
    if(nc > -1){                                              // one chapter shown: button below its last question
      const w = document.createElement('div'); w.className = 'next-ch';
      const nb = document.createElement('button'); nb.type = 'button'; nb.className = 'btn primary'; nb.textContent = `Next chapter: ${chLabel(nc)} →`; nb.title = CHAPTERS[nc].title;
      nb.addEventListener('click', () => switchChapter(nc));
      w.appendChild(nb); quizEl.appendChild(w);
    }
  }

  updateChrome();
}

function selectAnswer(qi, oi){
  if(examActive(qi)){
    if(examPick[qi] === oi) return;
    examPick[qi] = oi; current = qi; render(); return;
  }
  if(answered[qi] === oi) return;
  answered[qi] = oi;
  if(oi !== QUESTIONS[qi].correct) missed.add(qi);
  current = qi;
  render();
}
const nextChapterIdx = () => (!viewAll && !pickNums && filterMode === 'all' && CHAPTERS.length > 1 && activeCh < CHAPTERS.length - 1) ? activeCh + 1 : -1;
function setActive(qi){
  const visible = visibleIndices();
  if(visible.length === 0) return;
  if(!visible.includes(qi)) qi = visible[0];
  current = qi;
  render();
  scrollToActive();
}
function smoothTop(){                          // page-caused scroll: must not reveal the Top button
  ignoreScrollUntil = performance.now() + 1500;
  window.scrollTo({top:0, behavior:'smooth'});
}
function scrollToActive(){
  if(layoutMode === 'single') return;
  const el = quizEl.querySelector(`.qrow[data-index="${current}"]`);
  ignoreScrollUntil = performance.now() + 1200;   // page-caused smooth scroll must not count as user scrolling
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
function goNext(){
  const visible = visibleIndices();
  const pos = visible.indexOf(current);
  if(pos === -1){ if(visible.length) setActive(visible[0]); return; }
  if(pos < visible.length - 1){ setActive(visible[pos+1]); }
}
function goPrev(){
  const visible = visibleIndices();
  const pos = visible.indexOf(current);
  if(pos > 0){ setActive(visible[pos-1]); }
}
function enterReviewMode(){
  const wl = wrongIndices();
  if(wl.length === 0) return;
  reviewList = wl;
  wl.forEach(i => { answered[i] = null; });
  filterMode = 'review';
  current = wl[0];
  render();
  scrollToActive();
}
function exitReviewMode(){
  filterMode = 'all';
  render();
  if(layoutMode === 'list') smoothTop();
}
function updateChrome(){
  const ids = scopeIdx();
  const ex = examMode && ids.some(i => !examGraded[i]);      // an exam is in progress in this view
  const answeredNum = ids.filter(i => shownAns(i) !== null && shownAns(i) !== -1).length;
  const correctNum = ids.filter(i => answered[i] === QUESTIONS[i].correct).length;
  document.getElementById('totalCount').textContent = ids.length;
  answeredCountEl.textContent = answeredNum;
  correctCountEl.textContent = ex ? '–' : correctNum;

  const res = examMode && ids.length && ids.every(i => examGraded[i]) ? { c: ids.filter(i => examRes[i] === 'c').length, u: ids.filter(i => examRes[i] === 'u').length, n: ids.length } : null;
  const er = document.getElementById('examResult');
  er.classList.toggle('show', !!res);
  if(res){
    const pct = res.n ? Math.round(res.c / res.n * 100) : 0;
    er.innerHTML = `<div class="er-inner"><div class="er-label">Exam Score</div><div class="er-score">${res.c}<small>/ ${res.n}</small></div><div class="er-pct" style="color:${pct >= 90 ? '#0d4a18' : pct >= 80 ? '#1b6b25' : pct >= 70 ? '#388e3c' : pct >= 40 ? '#d9730d' : '#b3261e'}">${pct}%</div><div class="er-detail">${res.n - res.c - res.u} incorrect · ${res.u} unanswered (counted as incorrect)</div><button class="btn" id="retakeBtn" type="button">Retake Exam</button></div>`;
    document.getElementById('retakeBtn').addEventListener('click', () => { resetChapter(); smoothTop(); });
  }
  const eb = document.getElementById('examBar');
  eb.classList.toggle('show', ex);
  if(ex){
    const left = ids.length - answeredNum;
    document.getElementById('examInfo').textContent = `${answeredNum} of ${ids.length} answered` + (left ? ` · ${left} unanswered will be marked incorrect` : '');
  }

  const wl = wrongIndices();
  const currentWrongInReview = filterMode === 'review' ? reviewList.filter(i => answered[i] !== null && answered[i] !== QUESTIONS[i].correct) : [];

  wrongCountEl.textContent = wl.length;
  copyMissedBtn.disabled = ex || !ids.some(i => missed.has(i));
  reviewBtn.disabled = ex || wl.length === 0 || filterMode === 'review';
  reviewBtn.textContent = filterMode === 'review' ? 'Reviewing…' : `Review Incorrect (${wl.length})`;

  allViewBtn.classList.toggle('active-mode', filterMode === 'all');
  const fc = scopeIdx().filter(i => flagged.has(i)).length;
  flagBtn.textContent = `Marked for Review (${fc})`;
  flagBtn.disabled = fc === 0 && filterMode !== 'flagged';
  flagBtn.classList.toggle('active-mode', filterMode === 'flagged');
  modeLabel.textContent = ex ? '' : (filterMode === 'review' ? `Review mode — ${reviewList.length} previously incorrect question(s)` : filterMode === 'flagged' ? `Marked for review — ${flagList.length} question(s)` : '');

  const reviewAnsweredCount = reviewList.filter(i => answered[i] !== null).length;
  const reviewDone = filterMode === 'review' && reviewAnsweredCount === reviewList.length && reviewList.length > 0;

  if(reviewDone){
    reviewBanner.classList.add('show');
    if(currentWrongInReview.length === 0){
      reviewBannerText.textContent = `Review complete — all ${reviewList.length} question(s) answered correctly.`;
      reviewBannerActions.innerHTML = '';
      const backBtn = document.createElement('button');
      backBtn.className = 'btn primary';
      backBtn.textContent = 'Back to All Questions';
      backBtn.addEventListener('click', exitReviewMode);
      reviewBannerActions.appendChild(backBtn);
    } else {
      reviewBannerText.textContent = `Review complete — ${currentWrongInReview.length} of ${reviewList.length} still incorrect.`;
      reviewBannerActions.innerHTML = '';
      const retryBtn = document.createElement('button');
      retryBtn.className = 'btn primary';
      retryBtn.textContent = 'Retry Remaining';
      retryBtn.addEventListener('click', () => {
        reviewList = currentWrongInReview;
        currentWrongInReview.forEach(i => { answered[i] = null; });
        current = reviewList[0];
        reviewBanner.classList.remove('show');
        render();
        scrollToActive();
      });
      const backBtn = document.createElement('button');
      backBtn.className = 'btn';
      backBtn.textContent = 'Back to All Questions';
      backBtn.addEventListener('click', exitReviewMode);
      reviewBannerActions.appendChild(retryBtn);
      reviewBannerActions.appendChild(backBtn);
    }
  } else {
    reviewBanner.classList.remove('show');
  }
}

document.addEventListener('keydown', (e) => {
  if(e.target && e.target.closest && e.target.closest('textarea, input, [contenteditable]')) return;   // typing in the memo must not trigger quiz keys
  if(lightbox.classList.contains('show')){            // enlarged view: Esc / Enter / Space close it, nothing else acts
    if(e.key === 'Escape' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); closeLightbox(); }
    return;
  }
  const visible = visibleIndices();
  if(visible.length === 0) return;
  if(e.key >= '1' && e.key <= '4'){
    const oi = parseInt(e.key, 10) - 1;
    if(QUESTIONS[current] && oi < QUESTIONS[current].options.length){
      e.preventDefault();
      selectAnswer(current, oi);
    }
  } else if(e.key === 'Enter' || e.key === ' '){
    if(e.target.closest && e.target.closest('summary')) return;   // let "How to use" toggle normally
    e.preventDefault();
    goNext();
  } else if(e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey && (e.target === document.body || e.target === document.documentElement)){   // Tab / Shift+Tab: next / previous question (when no button has focus)
    e.preventDefault();
    if(e.shiftKey) goPrev(); else goNext();
  } else if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    if(e.key === 'ArrowDown') goNext(); else goPrev();
  }
});

reviewBtn.addEventListener('click', enterReviewMode);
const flagBtn = document.getElementById('flagBtn');
flagBtn.addEventListener('click', () => {                  // show only the questions ticked "Review"
  flagList = scopeIdx().filter(i => flagged.has(i));
  if(!flagList.length) return;
  filterMode = 'flagged'; reviewList = [];
  reviewBanner.classList.remove('show');
  if(!flagList.includes(current)) current = flagList[0];
  render(); smoothTop();
});
allViewBtn.addEventListener('click', exitReviewMode);
layoutToggleBtn.addEventListener('click', () => {
  layoutMode = layoutMode === 'list' ? 'single' : 'list';
  setOn(layoutToggleBtn, layoutMode === 'single');
  render();
});

keywordsToggleBtn.addEventListener('click', () => {
  const showing = document.body.classList.toggle('show-keywords');
  setOn(keywordsToggleBtn, showing);
});

const darkSw = document.getElementById('darkSw');
function setDark(d){ document.documentElement.classList.toggle('dark', d); setOn(darkSw, d); }
darkSw.addEventListener('click', () => setDark(!document.documentElement.classList.contains('dark')));

const examModeBtn = document.getElementById('examModeBtn');
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
// ---- question-number search: practise only the typed numbers (numbers are those shown on the question circles) ----
const qSearch = document.getElementById('qSearch'), qWarn = document.getElementById('qWarn'), qForm = document.getElementById('qSearchForm');
function qBad(msg){ qWarn.textContent = msg; qWarn.classList.toggle('show', !!msg); qSearch.classList.toggle('bad', !!msg); }
function parseNums(txt){                              // "1,2,3,15" / "1 2 3" / "1, 3-5": spaces are optional
  const t = txt.replace(/[，、;；]/g, ',').replace(/[–—~～]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t) return { empty: true };
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){
    let m;
    if(/^\d+$/.test(tok)) out.add(+tok);
    else if((m = tok.match(/^(\d+)-(\d+)$/)) && +m[1] <= +m[2] && +m[2] - +m[1] < 1000){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); }
    else return { err: `Not recognised: "${tok}" — type numbers like 1, 2, 3, 15` };
  }
  return { set: out };
}
function clearPick(silent){
  pickNums = null; qSearch.value = ''; qBad(''); document.getElementById('qSearchForm').classList.remove('active');
  if(!silent){ filterMode = 'all'; reviewList = []; reviewBanner.classList.remove('show'); current = scopeIdx()[0]; render(); smoothTop(); }
}
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const r = parseNums(qSearch.value);
  if(r.empty){ clearPick(false); return; }
  if(r.err){ qBad(r.err); return; }
  const have = new Set(baseIdx().map(i => QUESTIONS[i].n));
  const miss = [...r.set].filter(n => !have.has(n)).sort((a, b) => a - b);
  if(miss.length){ qBad(`No question ${miss.slice(0, 6).join(', ')}${miss.length > 6 ? '…' : ''} here (${viewAll ? 'all chapters' : 'this chapter'} has 1–${Math.max(...have)})`); return; }
  qBad(''); pickNums = r.set; qForm.classList.add('active');
  qSearch.value = [...r.set].sort((a, b) => a - b).join(', ');
  filterMode = 'all'; reviewList = []; reviewBanner.classList.remove('show');
  current = scopeIdx()[0]; render(); smoothTop();
});
qSearch.addEventListener('input', () => qBad(''));
document.getElementById('qClear').addEventListener('click', () => clearPick(false));
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('#settings, #menuBtn')){ settingsEl.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); } });
menuBtn.addEventListener('click', () => { const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); });
function gradeExam(){
  const ids = scopeIdx().filter(i => !examGraded[i]);        // everything in view that is not graded yet
  ids.forEach(i => {
    missed.delete(i);
    const p = examPick[i];
    examGraded[i] = true;
    if(p === null){ examRes[i] = 'u'; answered[i] = -1; missed.add(i); }          // unanswered = incorrect
    else { answered[i] = p; if(p === QUESTIONS[i].correct) examRes[i] = 'c'; else { examRes[i] = 'w'; missed.add(i); } }
  });
  filterMode = 'all'; reviewList = [];
  current = scopeIdx()[0];
  render();
  smoothTop();
}
document.getElementById('gradeBtn').addEventListener('click', gradeExam);
examModeBtn.addEventListener('click', () => {
  examMode = !examMode;
  setOn(examModeBtn, examMode);
  if(examMode && scopeIdx().some(i => !examGraded[i])){ filterMode = 'all'; reviewList = []; reviewBanner.classList.remove('show'); }
  render();
});
const allChBtn = document.getElementById('allChBtn');
if(CHAPTERS.length < 2) allChBtn.remove();
function setViewAll(on){
  viewAll = on;
  clearPick(true);
  setOn(allChBtn, on);
  filterMode = 'all'; reviewList = [];
  reviewBanner.classList.remove('show');
  if(!scopeIdx().includes(current)) current = scopeIdx()[0];
  renderToc();
}
allChBtn.addEventListener('click', () => { setViewAll(!viewAll); render(); smoothTop(); });
document.getElementById('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
document.getElementById('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });

function sheetHtml(title, idx){                    // one chapter: questions, then its answer key (numbers are per chapter)
  const L = i => String.fromCharCode(97 + i);
  let html = `<h1>${esc(title)}</h1><h2>Multiple Choice</h2>`;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    html += `<div class="p-q"><p>${QUESTIONS[qi].n}. ${fm(q.text)}</p>` + (q.code ? codeHTML(q.code) : '') + (q.fig ? `<div class="p-fig">${figHTML(q.fig)}</div>` : '') +
      q.options.map((o, oi) => `<p class="p-opt">${L(oi)}. ${fm(o)}</p>`).join('') + `</div>`;
  });
  html += `<div class="p-key"><h1>${esc(title)} — Answers</h1><div class="p-grid">` +
    idx.map(qi => `<div>${QUESTIONS[qi].n}. ${L(QUESTIONS[qi].correct)}</div>`).join('') +
    `</div><div class="p-sol">` +
    idx.map(qi => `<div class="p-s"><p><b>${QUESTIONS[qi].n}. ${L(QUESTIONS[qi].correct)}</b></p><p>${fm(QUESTIONS[qi].explain)}</p></div>`).join('') +
    `</div></div>`;
  return html;
}
function buildPrintSheet(indices){
  const sel = indices || scopeIdx();
  document.getElementById('printSheet').innerHTML = viewAll && CHAPTERS.length > 1
    ? CHAPTERS.map((c, ci) => ({ c, ix: sel.filter(i => QUESTIONS[i].ch === ci) })).filter(o => o.ix.length)
        .map(o => `<section class="p-ch">${sheetHtml(o.c.title, o.ix)}</section>`).join('')
    : sheetHtml(printTitle(), sel);
}
buildPrintSheet();
// In the review (wrong-answer) page, print only those questions.
window.addEventListener('beforeprint', () => buildPrintSheet(visibleIndices()));   // exactly what is on screen: chapter / all chapters / Review / search
window.addEventListener('afterprint', () => { document.body.classList.remove('print-solution'); });

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let done = false;
    try{ done = document.execCommand('copy'); }catch(e){}
    ta.remove(); done ? ok() : fail();
  });
}
copyMissedBtn.addEventListener('click', () => {
  const chs = viewAll ? CHAPTERS.map((c, ci) => ci) : [activeCh];
  const lines = chs.map(ci => {
    const nums = [...missed].filter(i => QUESTIONS[i].ch === ci).map(i => QUESTIONS[i].n).sort((a, b) => a - b);
    return nums.length ? `${CHAPTERS.length > 1 ? CHAPTERS[ci].title : QUIZ_TITLE} incorrect: ${nums.join(', ')}` : '';
  }).filter(Boolean);
  if(!lines.length) return;
  copyText(lines.join('\n')).then(
    () => showTip(copyMissedBtn, 'Copied'),
    () => showTip(copyMissedBtn, 'Copy failed')
  );
});
const liveTips = [];
function placeTip(t){
  const r = t.anchor.getBoundingClientRect(), h = t.el.offsetHeight;
  let top = r.top - 8 - h;                       // above the button
  if(top < 4) top = r.bottom + 8;                // no room above (button stuck at the very top) -> below
  t.el.style.left = (r.left + r.width / 2) + 'px';
  t.el.style.top = top + 'px';
}
function showTip(anchor, msg, ms = 700){
  const el = document.createElement('div');
  el.className = 'tip';
  el.textContent = msg;
  document.body.appendChild(el);
  const t = { el, anchor };
  liveTips.push(t);
  placeTip(t);
  requestAnimationFrame(() => el.classList.add('show'));
  t.hide = () => {
    clearTimeout(t.timer);
    el.classList.remove('show');
    setTimeout(() => { el.remove(); const i = liveTips.indexOf(t); if(i > -1) liveTips.splice(i, 1); }, 130);
  };
  t.timer = setTimeout(t.hide, ms);
  return t;
}
window.addEventListener('scroll', () => liveTips.forEach(placeTip), { passive: true });
window.addEventListener('resize', () => liveTips.forEach(placeTip));

// Back-to-top: shows at bottom centre as soon as the USER scrolls UP (TOP_REVEAL px) while far from the top.
// Scroll changes caused by the page itself (re-rendering after an answer, smooth jumps) are ignored.
const TOP_REVEAL = 30;                                    // px of upward scroll before it appears (small = near-instant; filters jitter)
const topThreshold = () => Math.max(900, window.innerHeight * 1.5);
let lastY = window.scrollY, upAcc = 0, topHideTimer = null, lastUserScroll = 0, pointerOnScrollbar = false, ignoreScrollUntil = 0;
const hideTop = () => { toTopBtn.classList.remove('show'); upAcc = 0; };
const markUser = () => { lastUserScroll = performance.now(); };
window.addEventListener('wheel', markUser, { passive: true });
window.addEventListener('touchmove', markUser, { passive: true });
window.addEventListener('keydown', e => { if(e.defaultPrevented) return; if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End'].includes(e.key)) markUser(); });
window.addEventListener('pointerdown', e => { if(e.target === document.documentElement) pointerOnScrollbar = true; });
window.addEventListener('pointerup', () => { pointerOnScrollbar = false; });
window.addEventListener('scroll', () => {
  const y = window.scrollY, d = y - lastY;
  lastY = y;
  const byUser = pointerOnScrollbar || performance.now() - lastUserScroll < 700;
  if(!byUser || performance.now() < ignoreScrollUntil) return;
  if(d > 0 || y <= topThreshold()){ clearTimeout(topHideTimer); hideTop(); return; }
  upAcc -= d;                                              // d < 0 : scrolling up
  if(upAcc >= TOP_REVEAL){
    toTopBtn.classList.add('show');
    clearTimeout(topHideTimer);
    topHideTimer = setTimeout(hideTop, 2200);
  }
}, { passive: true });
toTopBtn.addEventListener('mouseenter', () => clearTimeout(topHideTimer));
toTopBtn.addEventListener('mouseleave', () => { topHideTimer = setTimeout(hideTop, 1200); });
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

let resetArmed = false, resetArmTimer = null, resetTip = null;
resetBtn.addEventListener('click', () => {
  if(!resetArmed){
    resetArmed = true;
    resetBtn.classList.add('danger');                 // colour only; the label stays "Restart"
    resetTip = showTip(resetBtn, 'Restart?', 4000);   // click again within 4s to run
    clearTimeout(resetArmTimer);
    resetArmTimer = setTimeout(disarmReset, 4000);
    return;
  }
  clearTimeout(resetArmTimer);
  disarmReset();
  resetChapter();
  smoothTop();
});
function resetChapter(){                      // this chapter only (answers, exam picks, exam score)
  scopeIdx().forEach(i => { answered[i] = null; examPick[i] = null; examGraded[i] = false; examRes[i] = null; missed.delete(i); });
  current = scopeIdx()[0];
  filterMode = 'all';
  reviewList = [];
  reviewBanner.classList.remove('show');
  render();
}
function disarmReset(){
  resetArmed = false;
  resetBtn.classList.remove('danger');
  if(resetTip){ resetTip.hide(); resetTip = null; }
}

// ---- memo (one notepad for all chapters; stored together with Save) ----
const memoEl = document.getElementById('memoText'), memoTab = document.getElementById('memoTab');
function setMemoOpen(on){ document.body.classList.toggle('memo-open', on); memoTab.setAttribute('aria-expanded', String(on)); }
function memoHtml(){                                  // keep only bold, line breaks and text
  const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue.replace(/\u200B/g, '')) : c.nodeName === 'BR' ? '<br>' :
    ['B', 'STRONG'].includes(c.nodeName) ? `<b>${out(c)}</b>` : c.nodeName === 'SUP' ? `<sup>${out(c)}</sup>` : c.nodeName === 'SUB' ? `<sub>${out(c)}</sub>` : (c.nodeName === 'DIV' || c.nodeName === 'P') ? '<div>' + out(c) + '</div>' : out(c)).join('');
  return out(memoEl);
}
function setMemo(s, isHtml){
  if(!isHtml){ memoEl.textContent = s; return; }
  memoEl.innerHTML = s;
  memoEl.innerHTML = memoHtml();                       // sanitise whatever was stored
}
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
const memoBoldBtn = document.getElementById('memoBold');
memoBoldBtn.addEventListener('mousedown', e => e.preventDefault());   // keep the selection in the memo
memoBoldBtn.addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
['memoSup', 'memoSub'].forEach(id => {
  const b = document.getElementById(id);
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => { memoEl.focus(); document.execCommand(id === 'memoSup' ? 'superscript' : 'subscript'); });
});
memoEl.addEventListener('keydown', e => {            // Ctrl+. superscript, Ctrl+, subscript
  if(e.ctrlKey && !e.altKey && (e.key === '.' || e.key === ',')){ e.preventDefault(); document.execCommand(e.key === '.' ? 'superscript' : 'subscript'); }
});
// Typing x^2 + space, P_{t-1}, \pi + space turns into x², P(t-1), π as you type (same markup as the questions).
memoEl.addEventListener('input', e => {
  if(e.inputType !== 'insertText' || !e.data) return;
  const sel = getSelection();
  if(!sel.rangeCount || !sel.isCollapsed) return;
  const node = sel.anchorNode, off = sel.anchorOffset;
  if(node.nodeType !== 3 || node.parentNode.closest('sup, sub')) return;
  const text = node.data.slice(0, off);
  let m, endM;
  if(e.data === '}'){ m = text.match(/[\^_]\{[^}]*\}$/); endM = off; }
  else if(/^[\s.,;:)=+*\/]$/.test(e.data)){ m = text.slice(0, -1).match(/(?:\^-?[0-9A-Za-z]|_[0-9A-Za-z]|\\[A-Za-z]+)$/); endM = off - 1; }
  if(!m) return;
  const s = m[0], start = endM - s.length;
  let repl;
  if(s[0] === '\\'){ if(!MATH[s.slice(1)]) return; repl = document.createTextNode(MATH[s.slice(1)]); }
  else { repl = document.createElement(s[0] === '^' ? 'sup' : 'sub'); repl.textContent = s.slice(1).replace(/^\{|\}$/g, ''); }
  const tail = node.data.slice(endM), after = document.createTextNode(tail || '\u200B');   // ZWSP keeps the caret outside <sub>/<sup>
  node.data = node.data.slice(0, start);
  node.after(repl); repl.after(after);
  const r = document.createRange(); r.setStart(after, tail ? off - endM : 1); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
});
function toggleMemo(){ const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); else memoEl.blur(); }
memoTab.addEventListener('click', toggleMemo);
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });   // click anywhere outside the memo closes it
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); toggleMemo(); } });
document.getElementById('memoClose').addEventListener('click', () => setMemoOpen(false));

// ---- Save / restore progress (all chapters) in this browser's localStorage ----
const saveBtn = document.getElementById('saveBtn');
const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'quizProgress:' + QUIZ_TITLE;
const SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.options.join('|') + '|' + q.correct).join('\n'));
function setSaveTitle(t){ saveBtn.title = t ? 'Last saved ' + new Date(t).toLocaleString() : 'Save progress in this browser'; }
function saveProgress(){
  try{
    const t = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, t, answered, missed: [...missed], flagged: [...flagged], activeCh, current, filterMode, reviewList, examMode, examPick, examGraded, examRes, memo: memoHtml(), memoFmt: 'html', memoOpen: document.body.classList.contains('memo-open') }));
    setSaveTitle(t);
    showTip(saveBtn, 'Saved');
  }catch(e){ showTip(saveBtn, 'Save failed'); }
}
function loadProgress(){                       // returns true if progress was restored
  let d;
  try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ return false; }
  if(!d) return false;
  setSaveTitle(d.t);
  if(typeof d.memo === 'string') setMemo(d.memo, d.memoFmt === 'html');      // the memo does not depend on the questions: restore it even if they changed
  if(d.memoOpen) setMemoOpen(true);
  if(d.sig !== SAVE_SIG || !Array.isArray(d.answered) || d.answered.length !== QUESTIONS.length) return 'mismatch';
  answered = d.answered;
  if(Array.isArray(d.examPick) && d.examPick.length === QUESTIONS.length) examPick = d.examPick;
  if(Array.isArray(d.examGraded) && d.examGraded.length === QUESTIONS.length){ examGraded = d.examGraded; examRes = Array.isArray(d.examRes) && d.examRes.length === QUESTIONS.length ? d.examRes : examRes; }
  examMode = !!d.examMode;
  setOn(examModeBtn, examMode);
  d.missed.forEach(i => missed.add(i));
  (d.flagged || []).forEach(i => { if(i >= 0 && i < QUESTIONS.length) flagged.add(i); });
  activeCh = CHAPTERS[d.activeCh] ? d.activeCh : 0;
  const ids = CHAPTERS[activeCh].idx;
  reviewList = (d.reviewList || []).filter(i => ids.includes(i));
  filterMode = d.filterMode === 'review' && reviewList.length ? 'review' : 'all';
  if(filterMode === 'all') reviewList = [];
  current = visibleIndices().includes(d.current) ? d.current : visibleIndices()[0];
  return true;
}
saveBtn.addEventListener('click', saveProgress);
setSaveTitle(0);
const restored = loadProgress();

const tocEl = document.getElementById('toc');
function renderToc(){
  tocEl.classList.toggle('on', CHAPTERS.length > 1);          // single chapter: no contents list
  if(CHAPTERS.length < 2) return;
  tocEl.innerHTML = '<div class="toc-inner"></div>';
  const inner = tocEl.firstChild;
  CHAPTERS.forEach((c, ci) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = chLabel(ci);
    b.title = c.title;
    if(ci === activeCh && !viewAll) b.className = 'active';
    b.addEventListener('click', () => switchChapter(ci));
    inner.appendChild(b);
  });
}
function switchChapter(ci){
  if(ci === activeCh && !viewAll) return;
  clearPick(true);
  if(viewAll) setViewAll(false);
  activeCh = ci;
  filterMode = 'all';
  reviewList = [];
  reviewBanner.classList.remove('show');
  current = CHAPTERS[ci].idx[0];
  renderToc();
  render();
  smoothTop();
}

if(CHAPTERS.length > 1 && filterMode === 'all' && /midterm|final/i.test(QUIZ_TITLE)) setViewAll(true);   // title contains "midterm" / "final": All chapters is the default view
renderToc();
render();
if(restored === true) showTip(saveBtn, 'Progress restored');
else if(restored === 'mismatch') showTip(saveBtn, 'Saved data is from another version');
</script>
