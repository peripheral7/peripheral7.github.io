title: Econometrics Midterm
sub: Short Answer · Econometrics 1–3 (Slides), Wooldridge Ch.1–6, Quiz 2 · 37 questions
subject: Econometrics
textbook: Econometrics 1–3 lecture slides; Wooldridge, Introductory Econometrics: A Modern Approach 8e, Ch.1–6 (textbook examples & problems)
===
Econ 1
What is the difference between a population and a sample?
entire / whole / all / 전체|subset / part of / 부분|selected / chosen / 선택 / 추출
A population is the **entire** set of individuals, objects or data points we want to study, while a sample is a **subset** of the population that is **selected** for analysis.
population=모집단; sample=표본
===
Econ 1
Why do econometricians usually study a sample instead of the population, and what is the goal of studying the sample?
costly / cost / expensive / 비용|impossible / 불가능|population is like / learn about the population / infer / about the population / 모집단이 어떠한지 / 모집단을 파악 / 모집단을 추론 / 모집단에 대해
Studying the whole population is often too **costly** or **impossible**, so we study a sample; the goal is to find out what the **population is like** from the sample.
estimate=표본을 바탕으로 한 모집단에 대한 추정
===
Econ 1
Define external validity and state which property of the sample matters for it.
outside / beyond / other context / other settings / 밖 / 외부 / 다른 상황|conclusions / results / findings / 결론 / 결과|representative / 대표
External validity is the validity of applying the **conclusions** of a study **outside** the context of that study; it depends on whether the sample is **representative** of the population.
external validity=외부 타당성
===
Econ 2
In log(price) = \beta_0 + \beta_1 subsidy + \beta_2 log(sunlight) + u, why is \beta_1 called a partial slope rather than simply "the slope"?
holding / held / fixed / constant / ceteris paribus / 고정 / 일정 / 통제|other variables / other explanatory / other factors / sunlight / 다른 변수 / 다른 요인|one-unit / one unit / 1단위 / 한 단위
\beta_1 is the change in log(price) from a **one-unit** increase in subsidy while **holding** the **other variables** (log(sunlight)) fixed, so it isolates the effect of subsidy alone.
partial slope=부분 기울기
===
Econ 2
In log(price) = \beta_0 + \beta_1 battery + \beta_2 sunlight + \beta_3 battery×sunlight + u with \beta_3 ≠ 0, why does battery not have a linear relationship with log(price)?
interact / interaction / 상호작용|depends / depend / 달라 / 의존 / 따라|not constant / changes / varies / different / 일정하지 / 변한 / 변화
Because battery and sunlight **interact**, the effect of battery on log(price) is \beta_1 + \beta_3·sunlight, which **depends** on the level of sunlight; the slope is **not constant**.
interaction term=상호작용항
===
Econ 3
What is the difference between random sampling and random assignment?
equal probability / same probability / equally likely / equal chance / same chance / 동일한 확률 / 같은 확률|selected / chosen / drawn / 선택 / 추출 / 뽑|assigned / assignment to a group / 배정 / 할당
In random sampling every element of the population has an **equal probability** of being **selected**; in random assignment every element has an equal probability of being **assigned** to a group.
random sampling=무작위 추출; random assignment=무작위 배정
===
Econ 3
For Model 2, wage = \beta_0 + \beta_1 educ + u (ability not included), explain why the zero conditional mean condition may be violated.
ability / abil / 능력|error / u / 오차|correlated / correlation / related / 상관
**Ability** is omitted, so it goes into the **error** u; because people with better ability get more education, educ is **correlated** with u, so E(u∣educ) = 0 fails and \beta_1 is estimated with bias.
zero conditional mean=E(u∣x) = 0
===
Econ 3
What is a control variable, and why is ability added in Model 1, wage = \beta_0 + \beta_1 educ + \beta_2 abil + u?
hold / held / fixed / constant / 고정 / 통제|zero conditional mean / conditional mean / 조건부 평균 / ZCM|bias / biased / 편의 / 편향
A control variable is included to **hold** another factor **fixed** so it no longer sits in the error; adding ability helps satisfy the **zero conditional mean** condition and removes the **bias** in \beta_1.
control variable=통제변수
===
Ch.1
What does "ceteris paribus" mean, and why is it important in econometrics?
other factors / other relevant / all else / other things / 다른 요인 / 다른 조건|equal / fixed / constant / held / 동일 / 고정 / 일정 / 같|causal / cause / 인과
Ceteris paribus means "**other relevant factors** being **equal**"; most economic questions ask for the **causal** effect of one variable holding all other factors fixed.
ceteris paribus=다른 조건이 같다면
===
Ch.1
What is panel (longitudinal) data, and what is one advantage of it?
same / same units / same individuals / 같은 / 동일한|over time / several years / multiple periods / 시간 / 여러 시점 / 시점|time-invariant / unobserved / unobservable / lagged / 관측되지 않는 / 불변 / 시차
Panel data follow the **same** cross-sectional units **over time**; they can account for **time-invariant** unobservables and model lagged responses.
panel data=패널 데이터
===
Ch.2
What does OLS minimize, and what is a residual?
sum of squared residuals / squared residuals / squared / SSR / 잔차제곱합 / 제곱합 / 제곱|actual / observed / 실제 / 관측|fitted / predicted / 예측 / 적합
OLS chooses the estimates that minimize the **sum of squared residuals**; a residual is the **actual** value y_i minus the **fitted** value ŷ_i.
residual=잔차
===
Ch.2
What does R-squared measure in a regression?
fraction / proportion / share / percentage / percent / 비율 / 퍼센트|variation / variance / 변동 / 분산|explained / 설명
R^2 = SSE/SST is the **fraction** of the sample **variation** in y that is **explained** by the explanatory variable(s).
SST=총변동; SSE=설명된 변동; low R^2=그래도 ceteris paribus 효과는 잘 추정될 수 있음
===
Ch.2
What does the homoskedasticity assumption (SLR.5) state?
variance / 분산|error / u / 오차|same / constant / does not depend / does not change / 일정 / 동일 / 같
Homoskedasticity means the **error** u has the **same** (constant) **variance** for any value of x: Var(u∣x) = \sigma^2.
heteroskedasticity=이분산
===
Ch.2
What does it mean that the OLS estimator β̂_1 is unbiased?
on average / average / expected value / 평균 / 기댓값|repeated / many samples / repeatedly / 반복|true / population value / population parameter / 참값 / 모수
Unbiasedness means E(β̂_1) = \beta_1: if sampling and estimation were **repeated** many times, the estimates would **on average** equal the **true** population value, though one estimate may differ.
unbiased=불편
===
Ch.3
When does omitting a relevant-looking variable x_2 NOT cause bias in the estimated coefficient on x_1?
irrelevant / no effect / zero effect / coefficient is zero / 영향이 없 / 무관 / 0|uncorrelated / not correlated / no correlation / 상관이 없 / 무상관 / 상관관계가 없
There is no omitted variable bias if the omitted variable is **irrelevant** (its coefficient is zero) or **uncorrelated** with x_1.
bias=\beta_2 × \delta_1 (x_2의 효과 × x_1과의 상관 방향)
===
Ch.3
What is the main consequence of multicollinearity (high but not perfect correlation among regressors) for OLS?
variance / standard error / 분산 / 표준오차|increase / inflate / higher / larger / 증가 / 커 / 높|unbiased / not biased / no bias / not cause bias / 불편 / 편의가 없 / 편향되지
Multicollinearity **increases** the sampling **variance** of the affected slope estimators, but OLS remains **unbiased**; it can be detected with variance inflation factors.
VIF=분산팽창계수
===
Ch.3
State the Gauss–Markov theorem.
BLUE / best linear unbiased|smallest variance / minimum variance / lowest variance / 최소 분산 / 분산이 가장 작 / 분산이 최소|MLR.1 / MLR.5 / assumptions / homoskedasticity / 가정
Under **MLR.1–MLR.5**, OLS is **BLUE** (best linear unbiased estimator): it has the **smallest variance** among all linear unbiased estimators.
BLUE=최량 선형 불편추정량
===
Ch.4
Define the p-value of a hypothesis test.
smallest / lowest / minimum / 가장 작은 / 최소|significance level / 유의수준|reject / 기각
The p-value is the **smallest** **significance level** at which the null hypothesis would be **rejected**; we reject H_0 when the p-value is below the chosen level.
significance level=유의수준
===
Ch.4
Does a statistically significant coefficient always matter in practice? Answer in 1–2 sentences.
not necessarily / not always / no / 반드시 / 아니|magnitude / size / how large / 크기 / 얼마나|economic / practical / 경제적 / 실질적 / 실제
**Not necessarily**: statistical significance only shows the effect differs from zero, while **economic** (practical) significance depends on the **magnitude** of the coefficient.
practical significance=실질적 중요성
===
Ch.4
Interpret a 95% confidence interval for \beta_j.
repeated / many samples / 반복|contain / cover / include / 포함|true / population / 모수 / 참값
In **repeated** samples, intervals built this way **contain** the **true** population coefficient in 95% of cases; the bounds are random, not the parameter.
confidence interval=신뢰구간
===
Ch.4
Which can make the usual OLS t statistics invalid (no t distribution under H_0): (i) heteroskedasticity, (ii) a sample correlation of 0.95 between two regressors in the model, (iii) omitting an important explanatory variable? Explain briefly.
heteroskedasticity / heteroskedastic / heteroscedasticity / 이분산|omitted / omitting / omission / 누락|correlation / collinearity / 0.95 / 상관 / 공선성
**Heteroskedasticity** (i) and an **omitted** important variable (iii) violate the CLM assumptions, so the t statistics are invalid; a high **correlation** of 0.95 (ii) is not a CLM violation (only perfect collinearity is ruled out).
CLM=MLR.1–MLR.6
===
Ch.5
What does it mean that an estimator is consistent, and which assumptions are enough for OLS to be consistent?
sample size / n grows / large / infinity / 표본 크기 / 표본이 커 / 무한|collapse / converge / concentrate / plim / 수렴 / 집중|true / population / 참값 / 모수|MLR.4 / MLR.1 / uncorrelated / zero correlation / 무상관
An estimator is consistent if, as the **sample size** grows, its distribution **collapses** to the **true** parameter (plim β̂_j = \beta_j); OLS is consistent under **MLR.1–MLR.4** (even zero correlation between each x_j and u is enough).
plim=확률극한
===
Ch.5
pctstck = \beta_0 + \beta_1 funds + \beta_2 risktol + u satisfies MLR.1–MLR.4 (risktol = risk tolerance). If funds and risktol are positively correlated and pctstck is regressed on funds only, what is the sign of the inconsistency in β̃_1, and why?
positive / upward / overstate / 양 / 과대 / 상향|risktol / risk / 위험|correlated / correlation / 상관|not disappear / does not vanish / persist / large sample / 사라지지 / 표본이 커져도
The inconsistency is **positive**: plim β̃_1 − \beta_1 = \beta_2\delta_1, with \beta_2 > 0 (higher **risktol** raises pctstck) and \delta_1 > 0 because funds and risktol are positively **correlated**; it does **not disappear** as n grows.
inconsistency=\beta_2 × Cov(x_1, x_2)/Var(x_1)
===
Ch.5
Can cigs (average cigarettes smoked per day) have a normal distribution in the adult population? What does this imply for OLS inference?
zero / 0 / 비흡연 / 피우지 않|nonnegative / negative / discrete / skewed / 음수 / 이산 / 치우|not normal / cannot / 정규분포가 아니 / 따르지 않 / 아니|large sample / asymptotic / central limit / CLT / 대표본 / 점근 / 중심극한
No: most adults smoke **zero** cigarettes and cigs is **nonnegative** and discrete, so it is **not normal**; with a **large sample**, asymptotic normality still makes the t and F tests approximately valid.
MLR.6=정규성 가정
===
Ch.5
How is the LM (n-R-squared) statistic for testing q exclusion restrictions computed, and what distribution does it follow?
restricted / 제약|residuals / residual / 잔차|nR / nR2 / n R-squared / n times / 표본크기 곱|chi-square / chi-squared / chi / 카이
Estimate the **restricted** model, regress its **residuals** on all the explanatory variables, and compute LM = **nR^2** from that auxiliary regression; under H_0 it is approximately **chi-square** with q degrees of freedom.
q=제약의 개수; 예: n = 2,725, R^2 = 0.0015 → LM ≈ 4.09
===
Ch.6
If the dependent variable is divided by 1,000 (dollars → thousands of dollars), what happens to the OLS coefficients, standard errors, t statistics and R-squared?
divided / 1,000 / 1000 / 나뉘 / 나누|unchanged / same / not change / 변하지 / 그대로 / 동일|t statistic / t stat / t-stat / t값 / t 통계량|R-squared / R2 / 결정계수
All coefficients and standard errors are **divided by 1,000**, while the **t statistics** and **R-squared** stay **unchanged**; only the units change, not the statistical conclusions.
scaling=단위 변경
===
Ch.6
What is a beta (standardized) coefficient, and why is it useful?
standardized / z-score / 표준화|standard deviation / 표준편차|units / scale / 단위|compare / comparable / 비교
A beta coefficient comes from regressing the **standardized** y on standardized x's; it is the change in y, in **standard deviations**, from a one standard deviation increase in x_j, so effects measured in different **units** can be **compared**.
z-score=(x − 평균)/표준편차
===
Ch.6
For rdintens = 2.613 + 0.00030 sales − 0.0000000070 sales^2 (sales in $ millions), give the turning-point formula for a quadratic and find where the marginal effect of sales becomes negative.
~
Turning point x^* = **β̂_1/(2∣β̂_2∣)** = 0.00030/(2 × 0.0000000070) ≈ **21,428.57**, i.e. sales of about **$21.4 billion**; beyond that the estimated marginal effect of sales on rdintens is negative.
marginal effect=β̂_1 + 2β̂_2 sales
===
Ch.6
In log(wage) = \beta_0 + \beta_1 educ + \beta_2 educ\cdot pareduc + \beta_3 exper + \beta_4 tenure + u (pareduc = both parents' education), what is the return to one more year of education, and what does \beta_2 measure?
depends / depend / 달라 / 따라 / 의존|parents / pareduc / 부모|interaction / 상호작용
The return is \beta_1 + \beta_2·pareduc, so it **depends** on **parents' education**; the **interaction** coefficient \beta_2 is how much the return changes for one more year of pareduc (estimate 0.00078: at pareduc = 32 the return is about 7.2%).
interaction term=상호작용항
===
Ch.6
Why is adjusted R-squared used, and when does adding a variable increase it?
never falls / never decreases / always increases / 항상 증가 / 감소하지 / 줄지|penalty / penalize / 벌점 / 페널티|degrees of freedom / 자유도|t statistic / t stat / t값 / greater than one / exceeds one / 1보다 / larger than 1
R-squared **never falls** when a variable is added, so adjusted R-squared imposes a **penalty** for extra regressors using **degrees of freedom**; adding a variable raises it only if that variable's **t statistic** exceeds one in absolute value.
R̄^2=1 − [SSR/(n−k−1)]/[SST/(n−1)]
===
Ch.6
Why is a 95% prediction interval for one individual outcome y^0 much wider than the 95% confidence interval for E(y∣x = x^0)?
error / unobserved / 오차 / 관측되지|variance / 분산|individual / single / new / 개별 / 한 명
The confidence interval reflects only the sampling **variance** of ŷ^0, while the prediction interval also includes the variance of the unobserved **error** for an **individual** outcome (\sigma^2), which does not shrink as n grows (e.g. colgpa: CI 2.66–2.74 vs PI 1.60–3.80).
prediction interval=예측구간
===
Ch.6
When the dependent variable is log(y), why is exp(predicted log(y)) not a good prediction of y, and how is it fixed?
underestimate / too small / 과소 / 작게|multiply / scale / adjust / 곱 / 보정 / 조정|residuals / normal / smearing / 잔차 / 정규
exp(log ŷ) systematically **underestimates** E(y∣x); we **multiply** it by α̂_0 = exp(σ̂^2/2) under **normal** errors, or by the average of exp(û_i) from the residuals.
α̂_0=보정 계수 (> 1)
===
Ch.6
Palm oil production is estimated as: production = 243.63 − 3.34 tax − 0.61 fuel − 0.03 fuel^2. Production is the amount of palm oil produced, tax is the tax rate (%), and fuel is the fuel price ($). What is the predicted amount of palm oil produced when the tax rate is 5% and the fuel price is $7? Write the equation with the numbers substituted (two decimal places).
221.19 / 22119|16.7 / 16.70|4.27|1.47
production = 243.63 − 3.34(5) − 0.61(7) − 0.03(7)^2; = 243.63 − 16.70 − 4.27 − 1.47 = 221.19

Ch.3
The palm oil equation above is estimated with an intercept and three regressors (tax, fuel, fuel^2). What are the degrees of freedom when the sample size is 85? Write the formula and the numbers.
81|n − k − 1 / n-k-1|85 − 3 − 1 / 85-3-1
df = n − k − 1 = 85 − 3 − 1 = 81

Ch.6

11.63 / 1163|7.60 / 7.6009|2.83 / 2.8332|7.17 / 7.168|0.65 / 0.646

Ch.6
Vaccination is estimated as: log(vaccination) = 0.34 + 0.15 reminder + 0.23 log(ambassador). Reminder is the number of reminders sent and ambassador is the number of ambassadors who are information hubs (log = natural log). What is the predicted amount of log(vaccination) when 1 reminder is sent and there are five ambassadors? Write the equation with the numbers substituted (two decimal places).
0.86 / 0.8602|0.37 / 0.3702|1.61 / 1.6094

Ch.6
Vaccination is estimated as: log(vaccination) = 0.34 + 0.15 reminder + 0.23 log(ambassador). Reminder is the number of reminders sent and ambassador is the number of ambassadors who are information hubs (log = natural log). What is the predicted amount of vaccination when 1 reminder is sent and there are five ambassadors? Write the equation with the numbers substituted (two decimal places).

<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --serif:"Source Serif 4","Noto Serif KR",Georgia,"Times New Roman",serif;
    --bg:#F6F5F3; --paper:#FFFFFF; --ink:#1D1D1F; --ink-soft:#6E6E73; --faint:#A1A1A6; --rule:#E6E5E1; --line:#E9E8E4;
    --correct:#2F6B47; --wrong:#A3402F;
    --paper-w:760px; --pad:64px; --note-w:260px; --ex-w:440px; --gap:30px; --bar-h:52px; --lh:1.75em;
  }
  html.dark{
    --bg:#1A1A1C; --paper:#262628; --ink:#ECECEE; --ink-soft:#A1A1A6; --faint:#6E6E73; --rule:#38383B; --line:#343437;
    --correct:#8CC6A0; --wrong:#E39A8C;
  }
  *{box-sizing:border-box;}
  button, input, select, textarea, code, pre, kbd, table, caption{font-family:inherit;}
  html{-webkit-font-smoothing:antialiased;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--serif); font-optical-sizing:auto; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; line-height:1.6; padding:0 0 60px;}
  sup, sub{font-size:0.72em; line-height:0;}

  .sheet{position:relative; isolation:isolate;}
  .sheet::before{content:""; position:absolute; z-index:-1; top:0; bottom:0; left:50%; width:var(--paper-w); transform:translateX(-50%); background:var(--paper); box-shadow:0 0 0 1px rgba(0,0,0,0.03), 0 10px 40px rgba(0,0,0,0.05);}
  .pg{display:grid; grid-template-columns:minmax(0,1fr) var(--paper-w) minmax(0,1fr);}
  .pg > *{grid-column:2;}
  .inpage{padding-left:var(--pad); padding-right:var(--pad);}

  header{padding-top:70px; padding-bottom:10px; text-align:center;}
  header h1{font-weight:400; font-size:3.5rem; line-height:1.08; margin:0 0 16px; letter-spacing:-0.015em; text-wrap:balance;}
  header p.sub{margin:0; color:var(--ink-soft); font-size:0.95rem;}
  .tools{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px 18px; margin-top:24px; font-size:0.85rem; position:relative;}
  .link{background:none; border:none; padding:0; font-size:0.85rem; color:var(--ink-soft); cursor:pointer;}
  .link:hover{color:var(--ink);}
  .link.on{color:var(--ink); text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px;}
  .link:disabled{color:var(--faint); cursor:default;}
  .link.danger{color:var(--wrong);}
  .qsearch{position:relative; display:inline-flex; align-items:center; gap:8px;}
  .setwrap{position:relative; display:inline-block;}
  .setrow{display:none; position:absolute; z-index:20; top:calc(100% + 8px); left:50%; transform:translateX(-50%); flex-direction:column; align-items:flex-start; gap:7px; padding:12px 18px; white-space:nowrap; background:var(--paper); border:1px solid var(--rule); box-shadow:0 8px 24px rgba(0,0,0,0.06);}
  .setrow.open{display:flex;}
  .qsearch input{width:150px; font-size:0.85rem; color:var(--ink); background:none; border:none; border-bottom:1px solid var(--rule); padding:2px 0; outline:none; text-align:center;}
  .qsearch input.bad{border-bottom-color:var(--wrong);}
  .qwarn{position:absolute; left:50%; transform:translateX(-50%); top:calc(100% + 4px); font-size:0.75rem; color:var(--wrong); white-space:nowrap; display:none;}
  .qwarn.show{display:block;}
  #qClear{visibility:hidden;} .qsearch.active #qClear{visibility:visible;}
  .howto{font-size:0.8rem; color:var(--faint); text-align:center; margin-top:12px; padding-bottom:8px;}

  .scorebar{position:sticky; top:0; z-index:10; width:var(--paper-w); max-width:100%; margin:0 auto; background:var(--paper); border-bottom:1px solid var(--rule);}
  .scorebar .in{padding:12px var(--pad) 11px; display:flex; flex-wrap:wrap; gap:4px 14px; justify-content:space-between; align-items:baseline; font-size:0.8rem;}
  .scorebar .link{font-size:0.8rem;}
  .tally{color:var(--ink-soft);} .tally b{color:var(--ink); font-weight:600;}
  .bar-links{display:flex; flex-wrap:wrap; gap:4px 13px;}
  .banner{display:none; padding-top:18px; font-size:0.9rem; color:var(--ink-soft); text-align:center;}
  .banner.show{display:block;}
  .banner .link{margin-left:14px;}

  main{padding-top:6px;}
  .qmain{position:relative; padding-top:32px; padding-bottom:26px;}
  .qmain.first::before{display:none;}
  .qhead{display:flex; align-items:baseline; gap:10px; margin-bottom:6px; font-size:0.82rem; color:var(--ink-soft);}
  .qmain.cur .qnum{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:5px;}   /* the question being worked on */
  .qnum{font-weight:400; color:var(--ink); font-size:0.95rem; min-width:1.4em;}
  .exref{color:var(--faint); font-size:0.78rem;}
  .retry{color:var(--wrong); font-size:0.78rem;}
  .qtools{margin-left:auto; display:inline-flex; align-items:baseline; gap:14px;}
  .qcopy, .qflag{cursor:pointer; user-select:none; color:var(--faint); font-size:0.78rem; transition:color .2s;}
  .qcopy:hover, .qflag:hover{color:var(--ink-soft);}
  .qflag.on{color:var(--ink); animation:flagpop .3s ease;}
  .qflag.on::before{content:"●"; display:inline-block; font-size:0.62em; margin-right:5px; vertical-align:0.18em; color:#B9822A;}
  @keyframes flagpop{0%{opacity:.25; letter-spacing:0.08em;} 100%{opacity:1; letter-spacing:0;}}
  .qtext{font-size:1.06rem; margin:0 0 14px;}
  .qfig{margin:0 0 14px; max-width:420px;}

  /* ruled writing space */
  .answer{display:block; width:100%; min-height:calc(var(--lh) * 2); outline:none; font-size:0.92rem; line-height:var(--lh); color:var(--ink); overflow-wrap:anywhere; white-space:pre-wrap;
    background-image:linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--line) calc(var(--lh) - 1px)); background-size:100% var(--lh); background-attachment:local;}
  .answer:empty::before{content:attr(data-placeholder); color:var(--faint);}
  .acts{display:flex; gap:18px; margin-top:8px; font-size:0.82rem;}
  .mk{text-decoration-line:underline; text-decoration-thickness:1px; text-underline-offset:3px;}
  .mk.ok{text-decoration-color:var(--correct);}
  .mk.no{text-decoration-color:var(--wrong);}

  /* side note outside the sheet */
  .qside{grid-column:3; align-self:start; padding-top:32px; margin-left:var(--gap); max-width:var(--note-w); font-size:0.8rem; line-height:1.55; color:#2C2C2E;}
  html.dark .qside{color:#D8D8DC;}
  .sn-head{color:var(--ink-soft); font-size:0.74rem; letter-spacing:0.04em; margin-bottom:4px;}
  .sn-head .ok{color:var(--correct);} .sn-head .part{color:#8A6414;} .sn-head .no{color:var(--wrong);}
  html.dark .sn-head .part{color:#E0B965;}
  .sn-line{margin:0 0 3px;}
  .sn-line .lb{font-weight:400; color:var(--ink); text-shadow:0.35px 0 0 currentColor;}

  table.t{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums lining-nums; font-size:0.86rem; line-height:1.45; color:var(--ink);}
  table.t caption{caption-side:top; text-align:left; font-size:1rem; line-height:1.3; color:var(--ink); padding:0 0 8px;}
  table.t thead th{border-top:1px solid var(--ink);}
  table.t tbody tr:last-child td{border-bottom:1px solid var(--ink);}
  table.t th, table.t td{font-weight:400; font-style:normal; color:var(--ink); padding:2px 6px; text-align:right; white-space:nowrap;}
  table.t th{border-bottom:1px solid var(--rule);}
  table.t th:first-child, table.t td:first-child{text-align:left; padding-left:0;}
  table.t td:last-child, table.t th:last-child{padding-right:0;}
  table.t tr.sec td{padding-top:10px;}
  table.t tr.tot td{border-top:1px solid var(--rule);}
  .zoomable{cursor:zoom-in;}

  .case{grid-column:1 / -1;}
  .case-ex{grid-column:1; grid-row:1 / span var(--n, 1); align-self:start; justify-self:end; position:sticky; top:calc(var(--bar-h) + 12px);
    width:min(var(--ex-w), calc(100% - var(--gap) - 16px)); margin:20px var(--gap) 0 0; max-height:calc(100vh - var(--bar-h) - 24px); overflow:auto;
    padding:1px 1px 12px; scrollbar-width:thin; scrollbar-color:transparent transparent;}
  .case-ex:hover{scrollbar-color:var(--rule) transparent;}
  .case-ex::-webkit-scrollbar{width:5px; height:5px;} .case-ex::-webkit-scrollbar-thumb{background:transparent; border-radius:3px;} .case-ex:hover::-webkit-scrollbar-thumb{background:var(--rule);}
  .case-ex .tables{display:flex; flex-direction:column; gap:14px;}
  .case-ex .exbox{background:var(--paper); padding:22px 16px; box-shadow:0 0 0 1px rgba(0,0,0,0.05);}
  .case-ex .exbox table.t{margin-bottom:0; line-height:1.38;}
  .case-ex h2{font-size:1.2rem; font-weight:400; margin:0;}
  .case-ex .uses{font-size:0.76rem; color:var(--faint); margin:2px 0 14px;}
  .case-ex table.t{margin-bottom:30px;}
  .case-ex .tables{min-width:0;}
  .case.stacked .case-ex, .case-ex.flow{overflow-x:auto;}
  .case.stacked .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:28px var(--pad) 6px;}
  .case.stacked .case-ex .tables{flex-direction:row; flex-wrap:wrap; align-items:flex-start; gap:0 28px;}
  .case.stacked .case-ex .exbox{display:contents;}
  .case.stacked .case-ex h2, .case.stacked .case-ex .uses{flex:0 0 100%;}
  .case.stacked .case-ex table.t{flex:1 1 auto; width:auto; margin-bottom:30px;}
  .case.stacked .case-ex{scrollbar-width:auto; scrollbar-color:auto;}

  .data-errors{max-width:var(--paper-w); margin:16px auto 0; padding:12px 18px; color:var(--wrong); font-size:0.88rem; background:var(--paper);}
  .empty-state{padding-top:60px; padding-bottom:60px; text-align:center; color:var(--ink-soft);}
  footer{padding-top:28px; padding-bottom:44px; color:var(--faint); font-size:0.78rem; text-align:center;}
  .lightbox{position:fixed; inset:0; z-index:40; background:rgba(20,20,22,0.6); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox .lb-body{background:var(--paper); padding:26px 30px; max-width:94vw; max-height:92vh; overflow:auto; min-width:min(560px,90vw);}
  .lightbox table.t{font-size:1rem;}

  :root{--memo-w:min(300px,86vw);}
  .memo{position:fixed; top:0; right:0; bottom:0; width:var(--memo-w); z-index:22; background:var(--paper); box-shadow:-10px 0 40px rgba(0,0,0,0.08); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; visibility:hidden;}
  body.memo-open .memo{transform:none; visibility:visible;}
  .memo-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px 10px; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);}
  .memo-head .link{text-transform:none; letter-spacing:0; margin-left:14px;}
  .memo-text{flex:1; overflow-y:auto; outline:none; white-space:pre-wrap; word-break:break-word; font-size:0.95rem; padding:6px 20px 16px;}
  .memo-text:empty::before{content:attr(data-placeholder); color:var(--faint);}
  .memo-tab{position:fixed; top:50%; right:0; z-index:22; transform:translateY(-50%); writing-mode:vertical-rl; background:var(--paper); border:none; box-shadow:0 0 0 1px var(--rule); padding:14px 6px; font-size:0.78rem; color:var(--ink-soft); cursor:pointer;}
  body.memo-open .memo-tab{display:none;}
  .tip{position:fixed; z-index:30; transform:translateX(-50%); font-size:0.78rem; color:var(--ink-soft); opacity:0; pointer-events:none; transition:opacity .12s;}
  .tip.show{opacity:1;}

  @media (max-width:1420px){
    .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:32px var(--pad) 6px;}
    .case-ex .tables{flex-direction:row; flex-wrap:wrap; align-items:flex-start; gap:0 28px;}
    .case-ex .exbox{display:contents;}
    .case-ex h2, .case-ex .uses{flex:0 0 100%;}
    .case-ex table.t{flex:1 1 auto; width:auto; margin-bottom:30px;}
    .case-ex{scrollbar-width:auto; scrollbar-color:auto;}
  }
  @media (max-width:1180px){
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 22px;}
    .qside:empty{display:none;}
  }
  @media (max-width:820px){
    :root{--paper-w:100vw; --pad:20px;}
    .sheet::before{box-shadow:none;}
    header{padding-top:44px;} header h1{font-size:2.5rem;}
  }

  #printSheet{display:none;}
  @page{size:A4 portrait; margin:22mm 20mm 20mm; @bottom-center{content:counter(page); font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-size:9pt;}}
  @media print{
    html, body{background:#fff !important; color:#000 !important; padding:0 !important; margin:0 !important;}
    body > *:not(#printSheet){display:none !important;}
    #printSheet{display:block; font-family:var(--serif); font-size:10.5pt; line-height:1.5; color:#000;}
    #printSheet h1{font-size:13pt; font-weight:400; text-align:center; margin:0 0 9mm;}
    #printSheet .p-sub{text-align:center; font-size:10pt; margin:-7mm 0 9mm;}
    #printSheet .p-q{break-inside:avoid; page-break-inside:avoid; margin:0 0 4mm;}
    #printSheet .p-q p{margin:0;}
    #printSheet .p-fig{margin:1.5mm 0 2mm; max-width:110mm;}
    #printSheet .p-lines{height:calc(var(--n, 8) * 8mm); background-image:linear-gradient(to bottom, transparent calc(8mm - 0.2mm), #ccc calc(8mm - 0.2mm)); background-size:100% 8mm; -webkit-print-color-adjust:exact; print-color-adjust:exact; margin-top:1mm;}
    #printSheet .p-ex{break-inside:avoid; page-break-inside:avoid; border-top:0.3mm solid #000; border-bottom:0.3mm solid #000; padding:3mm 0 1mm; margin:2mm 0 6mm;}
    #printSheet .p-ex h2{font-size:12.5pt; font-weight:400; margin:0;}
    #printSheet .p-ex .uses{font-size:9pt; margin:0 0 3mm; font-style:italic;}
    #printSheet .p-ex .tables{display:flex; gap:8mm; align-items:flex-start;}
    #printSheet .p-ex .tables > table{flex:1 1 0;}
    #printSheet table.t{font-size:9.3pt; color:#000;}
    #printSheet table.t caption{color:#000; font-size:10.5pt; padding-bottom:1.5mm;}
    #printSheet table.t thead th{border-top:0.35mm solid #000;}
    #printSheet table.t tbody tr:last-child td{border-bottom:0.35mm solid #000;}
    #printSheet table.t th, #printSheet table.t td{color:#000;}
    #printSheet table.t th{ border-bottom:0.3mm solid #000; padding:0.8mm 1.5mm;}
    #printSheet table.t td{padding:0.4mm 1.5mm; border-bottom:0.1mm solid #ddd;}
    #printSheet table.t tr.sec td{color:#000; border-bottom:none; padding-top:2mm;}
    #printSheet table.t tr.tot td{border-top:0.25mm solid #000;}
    #printSheet .p-key{display:none;}
    body.print-solution #printSheet .p-key{display:block; break-before:page; page-break-before:always;}
    #printSheet .p-s{break-inside:avoid; margin:0 0 4mm; font-size:9.5pt; line-height:1.35;}
    #printSheet .p-s p{margin:0;}
    #printSheet .p-kw{font-style:italic; color:#333;}
    #printSheet .sn-line .lb{font-weight:400; text-shadow:0.3px 0 0 currentColor;}
  }
</style>
</head>
<body>

<div class="sheet">
  <header class="pg"><div class="inpage">
    <h1 id="quizTitle">Quiz</h1>
    <p class="sub" id="quizSub"></p>
    <div class="tools">
      <button class="link" id="printBtn" type="button">Print</button>
      <button class="link" id="printSolBtn" type="button">Print with solution</button>
      <span class="setwrap"><button class="link" id="menuBtn" type="button" aria-expanded="false">Settings</button>
      <div class="setrow" id="settings">
        <button class="link" id="darkSw" type="button">Night mode</button>
      </div></span>
      <form class="qsearch" id="qSearchForm" autocomplete="off">
        <input id="qSearch" type="text" inputmode="numeric" placeholder="Go to no. (1, 3-5)" aria-label="Question numbers">
        <button class="link" id="qClear" type="button">Clear</button>
        <div class="qwarn" id="qWarn" role="alert"></div>
      </form>
    </div>
    <div class="howto">Enter check · Enter again next · Ctrl+Enter new line · Tab next · Ctrl+Q memo</div>
  </div></header>

  <div class="scorebar" id="scorebar"><div class="in">
    <div class="tally">Checked <b id="checkedCount">0</b>/<span id="totalCount">0</span> · Passed <b id="passedCount">0</b></div>
    <div class="bar-links">
      <button class="link on" id="allViewBtn" type="button">All</button>

</div>

<button class="memo-tab" id="memoTab" type="button">Memo</button>
<aside class="memo" id="memo" aria-label="Memo">
  <div class="memo-head"><span>Memo</span><span><button class="link" id="memoBold" type="button" style="font-weight:700">B</button><button class="link" id="memoClose" type="button">Close</button></span></div>
  <div class="memo-text" id="memoText" contenteditable="true" spellcheck="false" data-placeholder="Notes…  Ctrl+B bold"></div>

<div id="printSheet"></div>
<div class="lightbox" id="lightbox"><div class="lb-body" id="lbBody"></div></div>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const fm = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`)
  .replace(/\*\*(.+?)\*\*/g, '<span class="lbx">$1</span>');
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}
function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = rows.shift().split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');

const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'writtenQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.kws.map(k => k.join('/')).join('|')).join('\n'));
$('saveBtn').addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, drafts, snap, missed: [...missed], flagged: [...flagged], memo: memoEl.innerHTML })); showTip($('saveBtn'), 'Saved'); }catch(e){ showTip($('saveBtn'), 'Save failed'); }
});
try{
  const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if(d){
    if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = richHtml(memoEl); }
    if(d.sig === SAVE_SIG && Array.isArray(d.drafts) && d.drafts.length === N){
      const clean = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };
      drafts = d.drafts.map(clean); snap = d.snap.map(s => s === null ? null : clean(s));
      (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
      setTimeout(() => showTip($('saveBtn'), 'Progress restored'), 300);
    }
  }
}catch(e){}
render();
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
</html>
