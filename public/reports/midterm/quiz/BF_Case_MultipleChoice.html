# Chapter 3: Working with Financial Statements
===
★ Enterprise value to EBITDA
Harborview Outfitters has market capitalization of $20,000 thousand (500 thousand shares at $40), interest-bearing debt of $1,760 thousand (notes payable plus long-term debt), cash of $260 thousand and EBITDA of $1,530 thousand. What is EV/EBITDA?
13.07|14.22|*14.05|14.39
Step 1: EV = Market cap + Interest-bearing debt − Cash; Step 2: EV = 20,000 + 1,760 − 260 = 21,500; Step 3: EV/EBITDA = 21,500 / 1,530 = 14.05; Why subtract cash: an acquirer also acquires the firm's cash.
===
★ DuPont comparison
Firm X has a profit margin of 2%, total asset turnover of 4.0 and an equity multiplier of 2.5. Firm Y has a profit margin of 8%, total asset turnover of 1.0 and an equity multiplier of 2.5. Which statement is correct?
Firm X relies more on financial leverage than Firm Y.|Firm Y uses its assets more efficiently than Firm X.|*Both earn an ROE of 20%: X through rapid asset turnover and Y through high margins, with equal leverage.|Firm Y earns the higher ROE because its margin is higher.
Formula: ROE = Profit margin × Total asset turnover × Equity multiplier; Step 1: ROE(X) = 0.02 × 4.0 × 2.5 = 20%; Step 2: ROE(Y) = 0.08 × 1.0 × 2.5 = 20%; Step 3: Equity multipliers are equal (2.5), so leverage is the same; Reading: X turns assets over 4 times faster, Y earns a 4 times higher margin.

# Chapter 5: Discounted Cash Flow Valuation
===
★ Annuity due
A lease requires $1,000 at the beginning of every month for 24 months. The rate is 6% compounded monthly. What is the lease worth today?
$22,562.87|$24,000.00|*$22,675.68|$22,450.61
Step 1: Monthly rate r = 6% / 12 = 0.5%; Step 2: PV (ordinary) = 1,000 × [1 − 1/(1.005)^{24}] / 0.005 = 22,562.87; Step 3: PV (due) = 22,562.87 × 1.005 = 22,675.68; BA II Plus: 24 N, 0.5 I/Y, −1000 PMT, 0 FV, CPT PV = 22,562.87; Then: × 1.005 = 22,675.68 (or BGN mode).
===
★ Which loan is cheaper
Lender A quotes 8.4% compounded monthly. Lender B quotes 8.5% compounded semiannually. Which loan is cheaper?
Lender A, because its quoted rate is lower|Lender A, because its EAR is 8.68% versus 8.73% for B|*Lender B, because its EAR is 8.68% versus 8.73% for A|They cost the same
Step 1: EAR(A) = (1 + 0.084/12)^{12} − 1 = 8.73%; Step 2: EAR(B) = (1 + 0.085/2)^{2} − 1 = 8.68%; Step 3: Compare EARs, never quoted rates; Answer: B is cheaper (lower EAR).
===
★ Months versus years
You save $400 at the end of every month in an account paying 6% compounded monthly. How many years until the balance reaches $30,000?
63.85 years|6.25 years|*5.32 years
Step 1: 30,000 = 400 × [(1.005)^t − 1] / 0.005; Step 2: (1.005)^t = 1.375; Step 3: t = ln 1.375 / ln 1.005 = 63.85 months; Step 4: Years = 63.85 / 12 = 5.32; BA II Plus: 0.5 I/Y, −400 PMT, 0 PV, 30000 FV, CPT N = 63.85 (months).
===
★ Deferred annuity
You will receive $5,000 a year for 10 years, but the first payment arrives 4 years from today. The discount rate is 8%. What is the stream worth today?
$33,550.41|$24,660.55|*$26,633.39|$28,764.07
Step 1: The annuity formula gives the value one period before the first payment, at date 3; Step 2: PV_3 = 5,000 × [1 − 1/(1.08)^{10}] / 0.08 = 33,550.41; Step 3: PV_0 = 33,550.41 / (1.08)^3 = 26,633.39; Watch for: discounting 4 years is the common error; BA II Plus: 10 N, 8 I/Y, −5000 PMT, 0 FV, CPT PV = 33,550.41; then 3 N, 0 PMT, −33550.41 FV, CPT PV = 26,633.39.
===
★ Payment with mismatched compounding
You borrow $20,000 for 4 years with monthly payments. The bank quotes 8% compounded quarterly. What is the monthly payment?
$488.26|$416.67|$652.04|*$487.76
Step 1: Quarterly rate = 8% / 4 = 2%; Step 2: Effective monthly rate = (1.02)^{1/3} − 1 = 0.6623%; Step 3: 20,000 = C × [1 − 1/(1.006623)^{48}] / 0.006623; Step 4: C = $487.76; Watch for: 8% / 12 assumes monthly compounding and gives $488.26; BA II Plus: 48 N, 0.6623 I/Y, 20000 PV, 0 FV, CPT PMT = −487.76.

# Chapter 6: Interest Rates and Bond Valuation
===
Coupon rate versus YTM
A firm issued a bond at par with an 8% coupon. Market interest rates have since risen. Which statement is correct?
The coupon rate rises to match the market, so the price stays at par.|*The coupon rate stays at 8%, the YTM rises, and the price falls below par.|The YTM stays at 8% because it is set at issue.|The face value falls to restore the 8% yield.
Coupon rate: set at issue and fixed for the life of the bond; YTM: set by the market and changes every day; Price: whatever makes the two consistent; Here: higher YTM with a fixed coupon means a lower price.
===
★ Semiannual bond price
A $1,000 bond pays an 8% coupon semiannually and matures in 6 years. The yield to maturity is 10% (quoted annually). What is its price?
$591.18|*$911.37|$912.89|$1,000.00
Step 1: Convert to periods: t = 6 × 2 = 12; C = 80 / 2 = 40; r = 10% / 2 = 5%; Step 2: PV of coupons = 40 × [1 − 1/(1.05)^{12}] / 0.05 = 354.53; Step 3: PV of face value = 1,000 / (1.05)^{12} = 556.84; Step 4: Price = 354.53 + 556.84 = 911.37; BA II Plus: 12 N, 5 I/Y, 40 PMT, 1000 FV, CPT PV = −911.37.
===
★ Price change when yields rise
A $1,000 bond pays an 8% annual coupon, matures in 3 years and now sells at par. If its yield rises to 9%, by how much does its price change?
−1.00%|*−2.53%|−3.00%|+2.62%
Step 1: At 8% the price is $1,000 (coupon rate = YTM); Step 2: At 9%: Price = 80 × [1 − 1/(1.09)^3] / 0.09 + 1,000 / (1.09)^3 = 974.69; Step 3: Change = 974.69 / 1,000 − 1 = −2.53%; Rule: prices and yields move in opposite directions.
===
Convexity
A bond's yield can either rise by 2 percentage points or fall by 2 percentage points. Which statement about the price change is correct?
The price changes by the same dollar amount in either direction.|The price falls more when yields rise than it rises when yields fall.|*The price rises more when yields fall than it falls when yields rise.|The price does not change because the coupon is fixed.
Shape: the price-yield curve is convex; Result: prices rise faster when yields fall than they drop when yields rise by the same amount; Note: interest rate risk is price risk, not default risk.
===
Interest rate risk
Four bonds currently yield 8%. Which bond's price changes most when the market yield rises by one percentage point?
5-year maturity, 10% coupon|5-year maturity, 4% coupon|20-year maturity, 10% coupon|*20-year maturity, 4% coupon
Maturity effect: a longer bond has more cash flows exposed, and the distant face value swings most; Coupon effect: a lower coupon pushes more value to maturity, so it is more sensitive; Answer: the 20-year, 4% coupon bond combines both effects.
===
YTM assumptions
A bond's quoted yield to maturity equals the return an investor actually earns only under which conditions?
*The bond is held to maturity, it does not default, and coupons are reinvested at the YTM.|The bond is sold before maturity at par.|Interest rates fall after purchase.|The coupon rate equals the current yield.
YTM: the single discount rate that sets the PV of the promised cash flows equal to the price (the bond's IRR); Assumption 1: held to maturity; Assumption 2: no default (YTM is a promised yield); Assumption 3: coupons reinvested at the YTM; If rates fall, reinvested coupons earn less and the realized return falls short.
===
★ YTM with semiannual coupons
A $1,000 bond pays a 6% coupon semiannually, matures in 10 years and sells for $925. What is its yield to maturity (quoted annually)?
3.53%|6.49%|*7.06%|7.18%
Step 1: t = 20 periods; C = 30; Price = 925; Step 2: Solve 925 = 30 × [1 − 1/(1 + r)^{20}] / r + 1,000 / (1 + r)^{20}; Step 3: r = 3.53% per six months; Step 4: Quoted YTM = 3.53% × 2 = 7.06%; BA II Plus: 20 N, −925 PV, 30 PMT, 1000 FV, CPT I/Y = 3.53; Check: price below par, so YTM > coupon rate.
===
Three yield measures
A bond with an 8% coupon rate and 8 years to maturity trades below par. Which ordering of its yields is correct?
YTM < current yield < coupon rate|Current yield < coupon rate < YTM|Coupon rate = current yield = YTM|*Coupon rate < current yield < YTM
Coupon rate = Annual coupon / Face value; Current yield = Annual coupon / Price; it is higher because the price is below face; YTM: also counts the capital gain, so it is highest; Discount bond: coupon rate < current yield < YTM.
===
Call provision
Compared with an otherwise identical non-callable bond, a callable bond should have which characteristics?
A higher price and a lower yield|*A lower price and a higher yield|The same price and yield|A higher price and a higher yield
Step 1: The issuer calls when rates have fallen; Step 2: Holders lose the high coupon exactly when they would most like to keep it; Step 3: So investors demand a higher yield; Result: a higher yield means a lower price.
===
★ Who should hold the muni
A municipal bond yields 4.2% and a comparable taxable bond yields 6.0%. Three investors face marginal tax rates of 20%, 30% and 35%. Which statement is correct?
All three prefer the taxable bond.|All three prefer the muni.|*Only the 35% investor prefers the muni; the 30% investor is indifferent.|Only the 20% investor prefers the muni.
Formula: Equivalent taxable yield = 4.2% / (1 − t); 20%: 4.2 / 0.80 = 5.25% < 6.0%, taxable is better; 30%: 4.2 / 0.70 = 6.00%, indifferent; 35%: 4.2 / 0.65 = 6.46% > 6.0%, muni is better; Lesson: munis are held mainly by high-bracket investors.
===
Clean and dirty price
A $1,000 bond pays an 8% coupon semiannually. Two months have passed since the last coupon, and the bond is quoted at $985. What is the invoice (dirty) price?
$971.67|$985.00|*$998.33|$1,025.00
Step 1: Coupon per period = 80 / 2 = 40; Step 2: Accrued interest = 40 × (2 / 6) = 13.33; Step 3: Dirty price = Clean price + Accrued interest = 985.00 + 13.33 = 998.33; Why: the buyer reimburses the seller for the part of the next coupon the seller earned.
===
Real rate (Fisher)
A bond yields 11.3% and expected inflation is 6%. What is the exact real rate?
5.30%|*5.00%|17.98%
Formula: 1 + R = (1 + r) × (1 + h); Step 1: 1 + r = 1.113 / 1.06 = 1.05; Step 2: r = 5.00%; Note: the approximation R − h = 5.30% is not exact, and the error grows with inflation.
===
★ Bond price from an effective yield
A $1,000 bond pays a 6% coupon semiannually and matures in 10 years. Investors require an effective annual return of 8.16%. What is the bond's price?
$1,000.00|$854.26|*$864.10|$856.10
Step 1: Semiannual rate = (1.0816)^{1/2} − 1 = 4.00%; Step 2: t = 20; C = 30; Step 3: Price = 30 × [1 − 1/(1.04)^{20}] / 0.04 + 1,000 / (1.04)^{20} = 864.10; Watch for: 8.16% / 2 = 4.08% treats an effective rate as a quoted rate and gives $854.26; BA II Plus: 20 N, 4 I/Y, 30 PMT, 1000 FV, CPT PV = −864.10.
===
Maturity effect
How does interest rate risk change with maturity?
It falls as maturity rises.|It rises with maturity at an increasing rate.|*It rises with maturity, but at a decreasing rate.|It does not depend on maturity.
Rule: longer bonds are hit harder by rate changes; But: the effect rises at a decreasing rate; Example: going from 1 to 10 years matters far more than going from 20 to 30 years.
===
Zero coupon sensitivity
Among bonds with the same maturity, which is the most sensitive to interest rate changes?
A bond with a 15% coupon|A bond with a 10% coupon|A bond with a 5% coupon|*A zero coupon bond
Rule: for a given maturity, the lower the coupon, the greater the price sensitivity; Reason: a low-coupon bond delivers most of its value at maturity, far in the future; Extreme case: a zero coupon bond has all of its value at maturity.
===
Inflation and bond prices
Expected inflation rises, but nothing changes about the issuer's credit or the real return investors require. What happens to the bond's price?
Nothing, because the coupon is fixed.|It rises, because the coupon is worth more.|*It falls, because nominal yields rise with expected inflation.|It rises, because the real rate falls.
Bond yields are nominal; Fisher effect: higher expected inflation raises nominal yields; Higher yield with fixed promised cash flows means a lower price.
===
Yield premiums
Compared with a Treasury bond of the same maturity, which premiums explain the higher yield on a corporate bond?
Real rate and inflation premium|Interest rate risk premium only|*Default risk, taxability and liquidity premiums
Term structure: real rate, inflation premium and interest rate risk premium are common to both bonds; Bond-specific: default risk, taxability and liquidity premiums; A corporate bond carries these and the Treasury largely does not.
===
Bond features
Which pairing of bond type and feature is correct?
Put bond: lets the issuer buy the bond back, lowering its value|*Convertible bond: the holder may exchange it for shares, so it carries a lower coupon|Floating-rate bond: the coupon is fixed for life|Income bond: coupons are paid even if the firm has no income
Convertible: exchangeable for a fixed number of shares at the holder's option; the right is valuable, so the coupon is lower; Put bond: the holder may force the issuer to buy it back; it raises the bond's value; Floater: coupon resets against a reference rate, often with a floor and ceiling (collar); Income bond: coupons paid only if income is sufficient.

# Chapter 7: Equity Markets and Stock Valuation
===
★ Price at a future date
A company just paid a dividend of $2.00. Dividends grow at 5% a year forever and the required return is 12%. What will the stock be worth five years from now?
$36.47|$30.00|*$38.29|$40.20
Rule: the model works from any date, using the dividend that follows; Step 1: D_6 = 2.00 × (1.05)^{6} = 2.68; Step 2: P_5 = D_6 / (R − g) = 2.68 / 0.07 = $38.29; Check: P_0 = 2.10 / 0.07 = 30.00 and P_0 × (1.05)^{5} = 38.29.
===
Growth above the required return
The required return on a stock is 9%. The next dividend is $1.00 and the growth rate is assumed to be 10% forever. What does the dividend growth model say?
The price is $100, so the stock is undervalued.|The price is $11.11 because growth is ignored when g exceeds R.|*The price is −$100, which shows the assumption g > R cannot hold forever.
Step 1: P_0 = D_1 / (R − g) = 1.00 / (0.09 − 0.10) = −$100; Step 2: A negative or infinite price means the assumption is impossible; Rule: the model requires R > g; no firm can outgrow its required return forever.
===
★ Supernormal growth
A firm just paid a dividend of $2.00. Dividends grow at 15% a year for the next 3 years and at 5% a year forever after that. The required return is 12%. What is the stock worth today?
$30.00|$35.32|*$38.80|$45.63
Step 1: D_1 = 2.30; D_2 = 2.645; D_3 = 3.04175; Step 2: D_4 = 3.04175 × 1.05 = 3.1938; Step 3: P_3 = D_4 / (R − g) = 3.1938 / 0.07 = 45.63; Step 4: PV of dividends = 2.0536 + 2.1086 + 2.1651 = 6.33; Step 5: PV of P_3 = 45.63 / (1.12)^{3} = 32.48; Step 6: P_0 = 6.33 + 32.48 = $38.80.
===
★ Firm that pays nothing yet
A firm will pay no dividend for the next 3 years. It will pay $1.20 at the end of year 4, and that dividend will then grow at 5% forever. The required return is 13%. What is the stock worth today?
$15.00|$9.20|*$10.40|$0.74
Step 1: Apply the model one period before the first dividend, at date 3; Step 2: P_3 = D_4 / (R − g) = 1.20 / (0.13 − 0.05) = $15.00; Step 3: PV = 15.00 / (1.13)^{3} = $10.40; Watch for: the model gives the price at date 3, so discount 3 periods, not 4.
===
Four cases at a glance
Which pairing of growth case and its watch-out is correct?
Zero growth: D_1 = D_0 holds in every case.|Constant growth: use D_0 in the numerator.|Nonconstant growth: discount P_t by t + 1 periods.|*Constant growth: use D_1 and require R > g.
Zero growth: D_1 = D_0 here, and only here; Constant growth: use D_1 in the numerator and require R > g; Nonconstant growth: discount P_t by t, not t + 1; Multiples: everything depends on the word "comparable".
===
Preferred stock
Which statement about preferred stock is correct?
Failing to pay a preferred dividend triggers default and bankruptcy.|Preferred dividends are tax-deductible to the issuer.|Preferred holders rank ahead of all creditors in liquidation.|*Preferred dividends are not tax-deductible, and skipping one is not a default.
Legal form: preferred stock is equity; Tax: the dividend is paid from after-tax income and is not deductible; Default: unpaid dividends are not a debt, so skipping one cannot cause default; Ranking: preferred holders rank behind every creditor.
===
★ Two-stage growth value
A firm just paid a dividend of $2.00. Dividends grow at 8% a year for 5 years and at 4% a year forever after that. The required return is 10%. What is the stock worth today?
$34.67|$9.47|$50.94|*$41.10
Step 1: D_1 = 2.00 × 1.08 = 2.16; Stage 1 PV = D_1 / (R − g_1) × [1 − ((1 + g_1) / (1 + R))^5]; Stage 1 PV = 2.16 / 0.02 × [1 − (1.08 / 1.10)^5] = 9.47; Step 2: D_6 = 2.00 × (1.08)^5 × 1.04 = 3.06; Step 3: P_5 = D_6 / (R − g_2) = 3.06 / 0.06 = 50.94; Step 4: PV of P_5 = 50.94 / (1.10)^5 = 31.63; Step 5: P_0 = 9.47 + 31.63 = $41.10.
===
★ Implied growth rate
A stock sells for $50. It just paid a dividend of $2.00, and investors require 11%. What constant growth rate is the market implying?
4.00%|7.00%|*6.73%|5.50%
Setup: P_0 = D_0 × (1 + g) / (R − g); Step 1: 50 = 2.00 × (1 + g) / (0.11 − g); Step 2: 5.50 − 50g = 2.00 + 2.00g; Step 3: 52g = 3.50, so g = 6.73%; Check: D_1 = 2.1346 and 2.1346 / (0.11 − 0.0673) = 50.00.
===
Required return from D_0
A stock sells for $36. It just paid a dividend of $1.80, and dividends grow at 5% forever. What is the required return?
10.00%|*10.25%|5.25%|15.00%
Formula: R = D_1 / P_0 + g; Step 1: D_1 = 1.80 × 1.05 = 1.89; Step 2: Dividend yield = 1.89 / 36 = 5.25%; Step 3: R = 5.25% + 5.00% = 10.25%; Watch for: the dividend just paid is D_0, so grow it first.
===
★ Where growth comes from
A firm earns an ROE of 15% and pays out 40% of its earnings as dividends. Next year's earnings per share are expected to be $3.00, and investors require 13%. What is the stock worth?
$12.86|$20.00|*$30.00|$13.33
Step 1: Retention ratio b = 1 − 0.40 = 0.60; Step 2: g = ROE × b = 0.15 × 0.60 = 9%; Step 3: D_1 = 0.40 × 3.00 = 1.20; Step 4: P_0 = D_1 / (R − g) = 1.20 / (0.13 − 0.09) = $30.00; Idea: growth comes from earnings the firm retains and reinvests at its ROE.
===
Sensitivity to the required return
The next dividend is $2.00 and dividends grow at 5% forever. If the required return rises from 10% to 11%, by how much does the stock price change?
−1.0%|−9.1%|*−16.7%|−50.0%
Step 1: At R = 10%: P_0 = 2.00 / (0.10 − 0.05) = $40.00; Step 2: At R = 11%: P_0 = 2.00 / (0.11 − 0.05) = $33.33; Step 3: Change = 33.33 / 40.00 − 1 = −16.7%; Lesson: the price is highly sensitive to R and g because R − g is a small number.
===
Dividend just paid from price
A stock sells for $60. Investors require 12% and dividends grow at 8% forever. What dividend did the firm just pay?
$2.40|$4.80|*$2.22|$7.20
Step 1: Dividend yield = R − g = 12% − 8% = 4%; Step 2: D_1 = 0.04 × 60 = $2.40; Step 3: D_0 = D_1 / (1 + g) = 2.40 / 1.08 = $2.22; Watch for: $2.40 is next year's dividend, not the one just paid.
===
P/E implied by the growth model
A firm pays out 50% of its earnings. Dividends grow at 6% forever and the required return is 12%. What price-earnings ratio (price ÷ next year's earnings) does the dividend growth model imply?
6.00|16.67|4.17|*8.33
Step 1: P_0 = D_1 / (R − g) and D_1 = Payout × E_1; Step 2: P_0 / E_1 = Payout / (R − g); Step 3: P/E = 0.50 / (0.12 − 0.06) = 8.33; Reading: higher growth or a lower required return raises the justified P/E.
===

===
★ Practice 1 · Preferred, quarterly dividend
Han River Utilities has preferred stock with a $100 par value and an annual dividend rate of 7.5%, paid quarterly. The dividend never changes. Investors require 9%, compounded monthly. What is the price of one preferred share?
$83.33|*$82.71|$79.95|$250.00
Step 1: Quarterly dividend D = 0.075 × 100 / 4 = $1.875; Step 2: Quarterly rate R = (1 + 0.09/12)^3 − 1 = 2.2669%; Step 3: P_0 = D / R = 1.875 / 0.022669 = $82.71; Watch for: 0.09 / 4 = 2.25% ignores monthly compounding and gives $83.33.
===
Practice 2 · Delayed first dividend
Sejong Holdings has just issued preferred stock that pays a fixed $4.50 per year forever, but the first dividend will not be paid until three years from today. The required return is 12%. What is the price today?
$26.69|$33.48|$37.50|*$29.89
Step 1: P = D / R gives the value one period before the first payment, at date 2; Step 2: P_2 = 4.50 / 0.12 = $37.50; Step 3: P_0 = 37.50 / (1.12)^2 = $29.89; Watch for: discounting $37.50 by three years gives $26.69.
===
Practice 3 · Price today and in four years
Daehan Foods just paid a dividend of $1.80. Dividends grow at 6% forever and investors require 13%. What are (a) the price today and (b) the price four years from today?
$25.71; $32.46|*$27.26; $34.41|$27.26; $32.46|$27.26; $36.48
Step 1: P_0 = D_0(1 + g) / (R − g) = 1.80 × 1.06 / 0.07 = $27.26; Step 2: P_4 = D_5 / (R − g) = 1.80 × (1.06)^5 / 0.07 = $34.41; Check: 27.26 × (1.06)^4 = 34.41, because the price grows at g.
===
★ Practice 4 · Growth from dividend history
Mirae Logistics paid a dividend of $1.20 four years ago, and the dividend just paid was $1.62. Dividends will keep growing at the same average annual rate. Investors require 14%. What is the price today?
$33.56|$26.09|*$28.13
Step 1: 1.20 × (1 + g)^4 = 1.62, so g = (1.35)^{1/4} − 1 = 7.79%; Step 2: D_1 = 1.62 × 1.0779 = 1.7462; Step 3: P_0 = 1.7462 / (0.14 − 0.0779) = $28.13; Watch for: 35% / 4 = 8.75% is a simple average and overstates g.
===
★ Practice 5 · Nonconstant growth
Bitgoeul Biotech just paid a dividend of $2.00. Dividends grow 25% next year, 18% the year after and 12% in year 3, then 6% forever. The required return is 14%. What is the price today?
$32.61|$34.57|$26.50|*$36.24
Step 1: D_1 = 2.50; D_2 = 2.95; D_3 = 3.304; Step 2: P_3 = D_4 / (R − g) = 3.304 × 1.06 / 0.08 = 43.778; Step 3: P_0 = 2.50 / 1.14 + 2.95 / (1.14)^2 + (3.304 + 43.778) / (1.14)^3 = $36.24; Watch for: P_3 uses D_4 and is discounted 3 years, not 4.
===
★ Practice 6 · Zero dividends first
Hanbit Robotics will pay no dividend for the next three years. It will pay $2.00 at the end of year 4 and $2.50 at the end of year 5, after which dividends grow at 4% forever. The required return is 15%. What is the price today?
*$14.14|$21.50|$13.69|$12.29
Step 1: P_5 = D_6 / (R − g) = 2.50 × 1.04 / 0.11 = 23.636; Step 2: P_0 = 2.00 / (1.15)^4 + (2.50 + 23.636) / (1.15)^5 = $14.14; Watch for: the three zero years must be counted (CF: F01 = 3), or every later cash flow is discounted too few periods.
===
★ Practice 7 · Two-stage growth
Gyeongbok Software just paid a dividend of $1.50. Dividends grow at 15% a year for five years and at 5% forever after that. The required return is 16%. Using the two-stage model, what is the price today?
$20.37|*$21.02|$14.32|$19.13
Step 1: First stage = [1.50 × 1.15 / (0.16 − 0.15)] × [1 − (1.15 / 1.16)^5] = 7.308; Step 2: D_5 = 1.50 × (1.15)^5 = 3.0170; Step 3: P_5 = 3.0170 × 1.05 / 0.11 = 28.799; Step 4: P_0 = 7.308 + 28.799 / (1.16)^5 = 7.308 + 13.712 = $21.02; Watch for: R − g_1 = 1% is tiny, so keep full precision.
===
★ Practice 8 · Two-stage growth (long first stage)
Seorabeol Pharma just paid a dividend of $3.00. Dividends grow at 10% a year for eight years and then at 3% forever. The required return is 11%. What is the price today?
$57.93|$38.63|$23.05|*$58.97
Step 1: First stage = [3.00 × 1.10 / (0.11 − 0.10)] × [1 − (1.10 / 1.11)^8] = 23.047; Step 2: D_8 = 3.00 × (1.10)^8 = 6.4308; Step 3: P_8 = D_9 / (R − g_2) = 6.4308 × 1.03 / 0.08 = 82.796; Step 4: P_0 = 23.047 + 82.796 / (1.11)^8 = 23.047 + 35.927 = $58.97; Watch for: P_8 is built from D_9, not D_8.
===
Practice 9 · Forward P/E
Namsan Electronics just reported EPS of $3.20, and EPS is expected to grow 8% next year. It pays no dividend. Comparable firms trade at forward P/E ratios of 14, 17, 13 and 16. Using the average benchmark, what should the stock sell for?
$48.00|*$51.84|$58.75|$55.30
Step 1: Benchmark P/E = (14 + 17 + 13 + 16) / 4 = 15; Step 2: EPS_1 = 3.20 × 1.08 = 3.456; Step 3: P_0 = 15 × 3.456 = $51.84; Watch for: a forward P/E must be applied to next year's EPS; 15 × 3.20 = $48.00 mismatches them.
===
Practice 10 · Price-sales ratio
Cheongdam Mobility had sales of $480 million and a net loss of $36 million. It has 24 million shares and pays no dividend. Comparable firms have price-sales ratios of 2.1, 2.6, 1.9 and 2.4, and an average P/E of 22. Estimate the stock price.
−$33.00|$48.00|*$45.00|$1,080.00
Step 1: Sales per share = 480 / 24 = $20.00; Step 2: Benchmark P/S = (2.1 + 2.6 + 1.9 + 2.4) / 4 = 2.25; Step 3: P_0 = 2.25 × 20.00 = $45.00; Why not P/E: EPS = −36 / 24 = −$1.50, so 22 × (−1.50) gives a meaningless negative price.
===
★ Nonconstant growth (three rates)
A firm just paid a dividend of $1.00. Dividends grow at 30% for the next two years, at 15% in year 3, and at 5% forever after that. The required return is 13%. What is the price today?
$20.66|*$21.50|$19.47|$25.51
Step 1: D_1 = 1.30; D_2 = 1.69; D_3 = 1.9435; Step 2: P_3 = D_4 / (R − g) = 1.9435 × 1.05 / 0.08 = 25.508; Step 3: P_0 = 1.30 / 1.13 + 1.69 / (1.13)^2 + (1.9435 + 25.508) / (1.13)^3 = $21.50; Watch for: P_3 uses D_4 and is discounted 3 years, not 4.
===
Trailing P/E
A firm just reported EPS of $2.50, and EPS is expected to grow 10% next year. Comparable firms trade at trailing P/E ratios (price divided by the most recent EPS) of 18, 20, 16 and 22. Using the average benchmark, what should the stock sell for?
$52.25|*$47.50|$45.00|$55.00
Step 1: Benchmark P/E = (18 + 20 + 16 + 22) / 4 = 19; Step 2: A trailing P/E is applied to the most recent EPS: $2.50; Step 3: P_0 = 19 × 2.50 = $47.50; Watch for: applying a trailing P/E to next year's EPS (19 × 2.75 = $52.25) mismatches the ratio and the earnings.
===
Stock versus bond
Why is a share of stock harder to value than a bond?
Stock valuation uses a different principle than bond valuation.|Dividends are contractual obligations, but the discount rate is unknown.|The market price of a stock can be used to back out its required return exactly.|*Dividends are discretionary, there is no maturity date, and both R and g must be estimated.
Same principle: value = PV of expected cash flows; Problem 1: a dividend is declared at the board's discretion and can be cut to zero without default; Problem 2: a share has no maturity, so the stream is infinite with no face value to anchor it; Problem 3: both the required return and the growth rate must be estimated, and the price is very sensitive to both.
===
Firm that pays no dividend
A firm pays no dividend now. It is expected never to pay any dividend, and no one who would pay one will ever buy it. What does the dividend discount model imply?
The shares are valued at book value.|The model cannot be used, so only P/E applies.|*The shares are worthless.|The shares are worth the discounted sales.
Principle: price = PV of every dividend the share will ever pay; Firm that eventually pays: the dividend may be far off, but it must be there; Firm that never pays and is never bought by anyone who would: no cash flow to discount; Answer: the shares are worthless.
===
"I buy to sell higher"
An investor says: "I am not buying this stock for its dividends, I am buying it to sell it higher." Which response is correct?
The dividend discount model does not apply to such investors.|The model values only stocks held to maturity.|*The model already contains this: the future price is itself the present value of later dividends.|Capital gains are not part of the model.
Step 1: One-period holding value P_0 = (D_1 + P_1) / (1 + R); Step 2: P_1 = (D_2 + P_2) / (1 + R); Step 3: Substitute again and again; the price terms disappear; Result: only dividends remain; The objection is contained within the model, not a refutation of it.
===
Skipped common dividend
A board skips the common dividend for several years. What is the legal consequence?
The firm is in default.|Creditors may demand immediate repayment.|The unpaid dividends become a debt of the firm.|*None: dividends are discretionary, so skipping them cannot cause default or bankruptcy.
Dividends are declared at the board's discretion; Unpaid dividends are not a debt of the firm; Result: failing to pay them cannot cause default or bankruptcy; Contrast: a missed coupon is a default.
===
Dealer versus broker
Which statement distinguishes a dealer from a broker?
A broker holds inventory and a dealer earns only a commission.|*A dealer buys and sells for its own account and bears the risk; a broker matches trades for a commission and takes no position.|Both take the other side of the customer's trade.|A dealer arranges trades and never holds shares.
Dealer: trades for its own account, holds an inventory, takes the other side of your trade and bears the risk; Broker: arranges a trade between two other parties, never takes a position; Pay: a broker earns a commission for matching, not for bearing risk.
===

  .lightbox img{max-width:90vw; max-height:84vh;}

  :root{--memo-w:min(300px,86vw);}
  .memo{position:fixed; top:0; right:0; bottom:0; width:var(--memo-w); z-index:22; background:var(--paper); box-shadow:-10px 0 40px rgba(0,0,0,0.08); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; visibility:hidden;}
  body.memo-open .memo{transform:none; visibility:visible;}
  .memo-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px 10px; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);}
  .memo-head .link{text-transform:none; letter-spacing:0; margin-left:14px;}
  .memo-text{flex:1; overflow-y:auto; outline:none; white-space:pre-wrap; word-break:break-word; font-size:0.95rem; padding:6px 20px 16px;}
  .memo-text:empty::before{content:attr(data-placeholder); color:var(--faint);}
  .memo-tab{position:fixed; top:50%; right:0; z-index:22; transform:translateY(-50%); writing-mode:vertical-rl; background:var(--paper); border:none; box-shadow:0 0 0 1px var(--rule); padding:14px 6px; font-size:0.78rem; color:var(--ink-soft); cursor:pointer;}
  body.memo-open .memo-tab{display:none;}
  .tip{position:fixed; z-index:30; transform:translateX(-50%); font-size:0.78rem; color:var(--ink-soft); opacity:0; pointer-events:none; transition:opacity .12s;}
  .tip.show{opacity:1;}
  .to-top{position:fixed; left:50%; bottom:20px; z-index:20; transform:translateX(-50%); background:var(--paper); border:none; box-shadow:0 4px 20px rgba(0,0,0,0.1); border-radius:20px; padding:8px 22px; font-size:0.85rem; color:var(--ink-soft); cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s;}
  .to-top.show{opacity:1; pointer-events:auto;}

  @media (max-width:1420px){
    .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:28px var(--pad) 6px;}
    .case-ex .tables{flex-direction:row; flex-wrap:wrap; align-items:flex-start; gap:0 28px;}
    .case-ex .exbox{display:contents;}
    .case-ex h2, .case-ex .uses{flex:0 0 100%;}
    .case-ex table.t{flex:1 1 auto; width:auto; margin-bottom:30px;}
    .case-ex{scrollbar-width:auto; scrollbar-color:auto;}
  }
  @media (max-width:1180px){
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 20px;}
    .qside:empty{display:none;}
  }
  @media (max-width:820px){
    :root{--paper-w:100vw; --pad:20px;}
    .sheet::before{box-shadow:none;}
    header{padding-top:40px;} header h1{font-size:2.5rem;}
  }

  #printSheet{display:none;}
  @page{size:A4 portrait; margin:22mm 20mm 20mm; @bottom-center{content:counter(page); font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-size:9pt;}}
  @media print{
    html, body{background:#fff !important; color:#000 !important; padding:0 !important; margin:0 !important;}
    body > *:not(#printSheet){display:none !important;}
    #printSheet{display:block; font-family:var(--serif); font-size:10.5pt; line-height:1.5; color:#000;}
    #printSheet h1{font-size:13pt; font-weight:400; text-align:center; margin:0 0 9mm;}
    #printSheet .p-sub{text-align:center; font-size:10pt; margin:-7mm 0 9mm;}
    #printSheet .p-q{break-inside:avoid; page-break-inside:avoid; margin:0 0 5mm;}
    #printSheet .p-q p{margin:0;}
    #printSheet .p-ref{color:#444;}
    #printSheet .p-opt{margin:0 0 0 5mm !important;}
    #printSheet .p-fig{margin:1.5mm 0 2mm; max-width:120mm;}
    #printSheet .p-ex{break-inside:avoid; page-break-inside:avoid; border-top:0.3mm solid #000; border-bottom:0.3mm solid #000; padding:3mm 0 1mm; margin:2mm 0 6mm;}
    #printSheet .p-ex h2{font-size:12.5pt; font-weight:400; margin:0;}
    #printSheet .p-ex .uses{font-size:9pt; margin:0 0 3mm; font-style:italic; color:#333;}
    #printSheet .p-ex .tables{display:flex; gap:8mm; align-items:flex-start;}
    #printSheet .p-ex .tables > table{flex:1 1 0;}
    #printSheet table.t{font-size:9.3pt; color:#000;}
    #printSheet table.t caption{color:#000; font-size:10.5pt; padding-bottom:1.5mm;}
    #printSheet table.t thead th{border-top:0.35mm solid #000;}
    #printSheet table.t tbody tr:last-child td{border-bottom:0.35mm solid #000;}
    #printSheet table.t th, #printSheet table.t td{color:#000;}
    #printSheet table.t th{ border-bottom:0.3mm solid #000; padding:0.8mm 1.5mm;}
    #printSheet table.t td{padding:0.4mm 1.5mm; border-bottom:0.1mm solid #ddd;}
    #printSheet table.t tr.sec td{color:#000; border-bottom:none; padding-top:2mm;}
    #printSheet table.t tr.tot td{border-top:0.25mm solid #000;}
    #printSheet .p-key{break-before:page; page-break-before:always;}
    #printSheet .p-grid{columns:4; font-size:10pt;}
    #printSheet .p-sol{display:none;}
    body.print-solution #printSheet .p-grid{display:none;}
    body.print-solution #printSheet .p-sol{display:block; column-count:2; column-gap:9mm; font-size:9pt; line-height:1.3;}
    #printSheet .p-s{break-inside:avoid; margin:0 0 3mm;}
    #printSheet .p-s p{margin:0;}
    #printSheet .sn-line .lb{font-weight:400; text-shadow:0.3px 0 0 currentColor;}
  }
</style>
</head>
<body>

<div class="sheet" id="sheet">
  <header class="pg"><div class="inpage">
    <h1 id="quizTitle">Quiz</h1>
    <p class="sub" id="quizSub"></p>
    <div class="tools">
      <button class="link" id="allChBtn" type="button">All chapters</button>
      <button class="link" id="printBtn" type="button">Print</button>
      <button class="link" id="printSolBtn" type="button">Print with solution</button>
      <span class="setwrap"><button class="link" id="menuBtn" type="button" aria-expanded="false">Settings</button>
<div class="setrow" id="settings">
        <button class="link" id="layoutToggleBtn" type="button">Single question view</button>
        <button class="link" id="examModeBtn" type="button">Exam mode</button>
        <button class="link" id="darkSw" type="button">Night mode</button>
      </div></span>
      <form class="qsearch" id="qSearchForm" autocomplete="off">
        <input id="qSearch" type="text" inputmode="numeric" placeholder="Go to no. (1, 3-5)" aria-label="Question numbers">
        <button class="link" id="qClear" type="button">Clear</button>

      </form>

    </div>

  </div></header>

  <nav class="pg"><div class="toc inpage" id="toc" aria-label="Chapters"></div></nav>
  <div class="pg"><div class="exam-result inpage" id="examResult"></div></div>

  <div class="scorebar" id="scorebar"><div class="in">
    <div class="tally">Answered <b id="answeredCount">0</b>/<span id="totalCount">0</span> · Correct <b id="correctCount">0</b> <span id="modeLabel"></span></div>
    <div class="bar-links">
      <button class="link on" id="allViewBtn" type="button">All</button>
      <button class="link" id="reviewBtn" type="button" disabled>Review incorrect (0)</button>
      <button class="link" id="flagBtn" type="button" disabled>Marked (0)</button>
      <button class="link" id="copyMissedBtn" type="button" disabled>Copy incorrect #</button>
      <button class="link" id="saveBtn" type="button">Save</button>
      <button class="link" id="resetBtn" type="button">Restart</button>
    </div>
  </div></div>

  <div class="pg"><div class="banner inpage" id="reviewBanner"><span id="reviewBannerText"></span><span id="reviewBannerActions"></span></div></div>
  <main class="pg" id="quiz"></main>
  <div class="pg"><div class="exam-bar inpage" id="examBar"><span id="examInfo"></span><button class="link" id="gradeBtn" type="button">Grade exam →</button></div></div>
  <footer class="pg"><div class="inpage" id="quizFooter"></div></footer>
</div>

<button class="memo-tab" id="memoTab" type="button">Memo</button>
<aside class="memo" id="memo" aria-label="Memo">
  <div class="memo-head"><span>Memo</span><span><button class="link" id="memoBold" type="button" style="font-weight:700">B</button><button class="link" id="memoClose" type="button">Close</button></span></div>
  <div class="memo-text" id="memoText" contenteditable="true" spellcheck="false" data-placeholder="Notes…  Ctrl+B bold"></div>
</aside>

<div id="printSheet"></div>
<div class="lightbox" id="lightbox"><div class="lb-body" id="lbBody"></div></div>
<button class="to-top" id="toTopBtn" type="button">↑ Top</button>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const mathFm = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);
const fm = t => String(t).split(/`([^`]+)`/).map((p, i) => i % 2 ? `<code class="ic">${esc(p)}</code>` : mathFm(p)).join('');

/* explanation -> one line per item; a short leading label in semibold */
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}

function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = rows.shift().split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], chapters = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L.length === 1 && L[0].startsWith('# ')){ chapters.push({ title: L[0].slice(2).trim(), idx: [] }); return; }
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      const tbls = L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5)));
      if(!tbls.length) errs.push(`exhibit ${id}: needs at least one @tbl line`);
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls };
      return;
    }
    if(!chapters.length) chapters.push({ title: meta.title || 'Quiz', idx: [] });
    const ch = chapters.length - 1;
    chapters[ch].seen = (chapters[ch].seen || 0) + 1;
    const who = `${chapters[ch].title} · Q${chapters[ch].seen}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, options, explanation) - check for a missing ===`); return; }
    if(L[0] === '-' && !prevTag) errs.push(`${who}: tag "-" has no previous tag`);
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    let correct = 0;
    const raw3 = L[2].split('|');
    const options = raw3.map((o, i) => { o = o.trim(); if(o.startsWith('*')){ correct = i; return o.slice(1).trim(); } return o; });
    const stars = raw3.filter(o => o.trim().startsWith('*')).length;
    if(stars !== 1) errs.push(`${who}: exactly one option must start with * (found ${stars})`);
    if(options.length < 2 || options.length > 4) errs.push(`${who}: ${options.length} options (use 2-4)`);
    if(options.some(o => !o)) errs.push(`${who}: empty option`);
    let use = null, fig = null;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) use = l.slice(5).trim();
      else if(l.startsWith('@tbl ')) fig = { type: 'tbl', t: parseTbl(l.slice(5)) };
      else if(l.startsWith('@img ')) fig = { type: 'img', src: l.slice(5).trim() };
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…" (use @use, @tbl or @img)`);
    });
    chapters[ch].idx.push(questions.length);
    questions.push({ tag, text: L[1], options, correct, explain: L[3], fig, use, ch, n: chapters[ch].idx.length });
  });
  questions.forEach(q => { if(q.use && !cases[q.use]) errs.push(`question ${q.n}: @use ${q.use} but no "@case ${q.use}" block exists`); });
  chapters.filter(c => !c.idx.length).forEach(c => errs.push(`chapter "${c.title}" has no questions`));
  if(!questions.length) errs.push('no questions found');
  const good = chapters.filter(c => c.idx.length);
  return { meta, questions, cases, chapters: good.length ? good : [{ title: meta.title || 'Quiz', idx: [] }], errs };
}

const PARSED = parseQuizData(document.getElementById('quizData').textContent);
const META = PARSED.meta, QUIZ_TITLE = META.title || 'Quiz', QUESTIONS = PARSED.questions, CHAPTERS = PARSED.chapters, CASES = PARSED.cases;
if(PARSED.errs.length){
  const box = document.createElement('div'); box.className = 'data-errors';
  box.innerHTML = '<b>Quiz data needs fixing</b><ul>' + PARSED.errs.slice(0, 12).map(e => `<li>${esc(e)}</li>`).join('') + '</ul>';
  document.body.insertBefore(box, document.body.firstChild);
}
const $ = id => document.getElementById(id);
$('quizTitle').textContent = QUIZ_TITLE;
$('quizSub').textContent = META.sub || '';
document.title = QUIZ_TITLE + (META.sub ? ' · ' + META.sub.split(' · ')[0] : '');
$('quizFooter').textContent = `${META.subject || ''} — ${META.textbook || ''}`;

let activeCh = 0, viewAll = false, pickNums = null;
const baseIdx = () => viewAll ? QUESTIONS.map((_, i) => i) : CHAPTERS[activeCh].idx;
const scopeIdx = () => pickNums ? baseIdx().filter(i => pickNums.has(QUESTIONS[i].n)) : baseIdx();
const chLabel = ci => { const t = CHAPTERS[ci].title, m = /^\s*(?:chapter|ch\.?|week|lecture)\s*(\d+)/i.exec(t); return m ? 'Ch.' + m[1] : t; };

let current = 0, filterMode = 'all', layoutMode = 'list', reviewList = [], flagList = [];
let answered = new Array(QUESTIONS.length).fill(null);
const missed = new Set(), flagged = new Set();
let examMode = false;
let examPick = new Array(QUESTIONS.length).fill(null), examGraded = new Array(QUESTIONS.length).fill(false), examRes = new Array(QUESTIONS.length).fill(null);
const examActive = qi => examMode && !examGraded[qi];
const shownAns = qi => examActive(qi) ? examPick[qi] : answered[qi];
const setOn = (btn, on) => { btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on)); };
const quizEl = $('quiz'), reviewBtn = $('reviewBtn'), flagBtn = $('flagBtn'), copyMissedBtn = $('copyMissedBtn'), reviewBanner = $('reviewBanner');
const wrongIndices = () => scopeIdx().filter(i => answered[i] !== null && answered[i] !== QUESTIONS[i].correct);
const visibleIndices = () => filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : scopeIdx();

function ranges(nums){
  const a = [...nums].sort((x, y) => x - y), out = [];
  for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; }
  return out.join(', ');
}
function exhibitHTML(id, idx, boxed){
  const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(i => QUESTIONS[i].n);
  const head = `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p>`;
  if(boxed) return `<div class="tables">${c.tbls.map((t, i) => `<div class="exbox">${i ? '' : head}${tblHTML(t)}</div>`).join('')}</div>`;   /* screen: each statement on its own card */
  return head + `<div class="tables">${c.tbls.map(tblHTML).join('')}</div>`;
}
const lightbox = $('lightbox'), lbBody = $('lbBody');
lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ lbBody.innerHTML = html; lightbox.classList.add('show'); }
const figHTML = f => f.type === 'img' ? `<img src="${esc(f.src)}" alt="Figure" style="max-width:100%">` : tblHTML(f.t);

function qaText(qi){
  const q = QUESTIONS[qi], L = i => String.fromCharCode(97 + i);
  const ex = q.use ? `[Exhibit ${q.use}: ${CASES[q.use].title}]\n` + CASES[q.use].tbls.map(tblText).join('\n') + '\n' : '';
  return ex + `Q${q.n}. ${q.text}\n` + (q.fig && q.fig.type === 'tbl' ? tblText(q.fig.t) + '\n' : '') + q.options.map((o, i) => `${L(i)}. ${o}`).join('\n') +
    `\nAnswer: ${L(q.correct)}. ${q.options[q.correct]}\nExplanation:\n${explLines(q.explain).join('\n')}`;
}

/* one question = a block on the page (.qmain, column 2) + a side note in the margin (.qside, column 3) */
function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];
  const main = document.createElement('div');
  main.className = 'qmain inpage' + (first ? ' first' : '');
  main.dataset.index = qi;
  main.addEventListener('click', () => { if(!String(window.getSelection())){ current = qi; markCurrent(); } });
  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<span class="qnum">${q.n}</span>` + (CHAPTERS.length > 1 ? `<span>${esc(chLabel(q.ch))} ·</span>` : '') + `<span class="qtag">${fm(q.tag)}</span>` +
    (q.use ? `<span class="exref">· Exhibit ${esc(q.use)}</span>` : '') + (retry ? '<span class="retry">· retry</span>' : '');
  const tools = document.createElement('span'); tools.className = 'qtools';
  if(!examActive(qi) && answered[qi] !== null){
    const cp = document.createElement('span'); cp.className = 'qcopy'; cp.setAttribute('role', 'button'); cp.textContent = 'copy'; cp.title = 'Copy question, answer and explanation';
    cp.addEventListener('click', e => { e.stopPropagation(); copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed')); });
    tools.appendChild(cp);
  }
  const fl = document.createElement('span');
  fl.className = 'qflag' + (flagged.has(qi) ? ' on' : ''); fl.setAttribute('role', 'button'); fl.textContent = 'review'; fl.title = 'Mark for review';
  fl.addEventListener('click', e => { e.stopPropagation(); const on = !flagged.has(qi); on ? flagged.add(qi) : flagged.delete(qi); fl.classList.toggle('on', on); updateChrome(); });
  tools.appendChild(fl); head.appendChild(tools);
  main.appendChild(head);
  const p = document.createElement('p'); p.className = 'qtext'; p.innerHTML = fm(q.text); main.appendChild(p);
  if(q.fig){
    const f = document.createElement('div'); f.className = 'qfig zoomable'; f.innerHTML = figHTML(q.fig);
    f.addEventListener('click', e => { e.stopPropagation(); openLightbox(figHTML(q.fig)); });
    main.appendChild(f);
  }
  const opts = document.createElement('div'); opts.className = 'options';
  q.options.forEach((o, oi) => {
    const b = document.createElement('div'); b.className = 'opt'; b.setAttribute('role', 'button');
    b.innerHTML = `<span class="optnum">${oi + 1}</span><span>${fm(o)}</span>`;
    if(examActive(qi)){ if(examPick[qi] === oi) b.classList.add('picked'); }
    else if(answered[qi] !== null){ b.classList.add(oi === q.correct ? 'correct' : oi === answered[qi] ? 'incorrect' : 'dim'); }
    b.addEventListener('click', () => { if(String(window.getSelection())) return; selectAnswer(qi, oi); });
    opts.appendChild(b);
  });
  main.appendChild(opts);

  const side = document.createElement('aside');
  side.className = 'qside';
  if(!examActive(qi) && answered[qi] !== null){
    const ok = answered[qi] === q.correct;
    side.innerHTML = `<div class="sn-head"><span class="${ok ? 'ok' : 'no'}">${ok ? 'Correct' : answered[qi] === -1 ? 'Not answered' : 'Incorrect'}</span> · answer ${q.correct + 1}</div>${fmtExpl(q.explain)}`;
  }
  return [main, side];
}

function caseSection(id, qis, idxForNums, retry){
  const sec = document.createElement('section'); sec.className = 'case pg';
  const ex = document.createElement('div'); ex.className = 'case-ex'; ex.innerHTML = exhibitHTML(id, idxForNums, true);
  ex.style.setProperty('--n', String(qis.length + 1));
  ex.querySelectorAll('table').forEach(t => { t.classList.add('zoomable'); t.addEventListener('click', () => openLightbox(t.outerHTML)); });
  sec.appendChild(ex);
  qis.forEach(qi => questionNodes(qi, false, retry).forEach(n => sec.appendChild(n)));
  return sec;
}

function fitExhibits(){   /* an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    const ex = sec.querySelector('.case-ex');
    if(!ex) return;
    const cs = getComputedStyle(ex); if(cs.position !== 'sticky') return;
    const inner = ex.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const tooWide = [...ex.querySelectorAll('table')].some(t => { const p = t.parentElement, ps = getComputedStyle(p); return t.scrollWidth > p.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight) + 1; });
    if(tooWide || ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);
function alignNotes(){   /* a side note starts level with option 1 of its question */
  quizEl.querySelectorAll('.qside').forEach(side => {
    side.style.paddingTop = '';
    const main = side.previousElementSibling, opt = main && main.classList.contains('qmain') && main.querySelector('.opt');
    if(!opt || side.getBoundingClientRect().left < main.getBoundingClientRect().right) return;   /* note sits below the question on narrow screens */
    const lh = el => parseFloat(getComputedStyle(el).lineHeight) || 0;
    const top = opt.getBoundingClientRect().top - main.getBoundingClientRect().top + parseFloat(getComputedStyle(opt).paddingTop) + (lh(opt) - lh(side)) / 2;
    side.style.paddingTop = Math.max(0, Math.round(top)) + 'px';
  });
}
window.addEventListener('resize', alignNotes);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => alignNotes());

const nextChapterIdx = () => (!viewAll && !pickNums && filterMode === 'all' && CHAPTERS.length > 1 && activeCh < CHAPTERS.length - 1) ? activeCh + 1 : -1;
function render(){
  ignoreScrollUntil = performance.now() + 400;
  const y0 = window.scrollY;
  quizEl.innerHTML = '';
  const vis = visibleIndices(), retry = filterMode === 'review';
  if(!vis.length){
    quizEl.innerHTML = `<div class="empty-state inpage">${filterMode === 'flagged' ? 'No questions marked for review.' : 'Nothing to review.'}</div>`;
    updateChrome(); return;
  }
  if(layoutMode === 'single'){
    const pos = Math.max(0, vis.indexOf(current)), qi = vis[pos];
    current = qi;
    const pr = document.createElement('div'); pr.className = 'single-progress inpage'; pr.textContent = `${pos + 1} / ${vis.length}`; quizEl.appendChild(pr);
    const q = QUESTIONS[qi];
    if(q.use){ const sec = caseSection(q.use, [qi], vis, retry); sec.querySelector('.qmain').classList.add('first'); quizEl.appendChild(sec); }
    else questionNodes(qi, true, retry).forEach(n => quizEl.appendChild(n));
    const nav = document.createElement('div'); nav.className = 'single-nav inpage';
    const prev = document.createElement('button'); prev.className = 'link'; prev.textContent = '← Previous'; prev.disabled = pos === 0; prev.addEventListener('click', goPrev);
    const nc = nextChapterIdx(), last = pos === vis.length - 1;
    const next = document.createElement('button'); next.className = 'link'; next.style.color = 'var(--ink)'; next.textContent = last && nc > -1 ? `Next chapter: ${chLabel(nc)} →` : 'Next →'; next.disabled = last && nc < 0;
    next.addEventListener('click', () => { if(last && nc > -1) switchChapter(nc); else goNext(); });
    nav.appendChild(prev); nav.appendChild(next); quizEl.appendChild(nav);
  } else {
    let prevCh = -1, first = true;
    for(let k = 0; k < vis.length; ){
      const qi = vis[k], q = QUESTIONS[qi];
      if(viewAll && CHAPTERS.length > 1 && q.ch !== prevCh){ const h = document.createElement('div'); h.className = 'ch-head inpage'; h.textContent = CHAPTERS[q.ch].title; quizEl.appendChild(h); prevCh = q.ch; first = true; }
      if(q.use){
        const group = [];
        while(k < vis.length && QUESTIONS[vis[k]].use === q.use && QUESTIONS[vis[k]].ch === q.ch){ group.push(vis[k]); k++; }
        const sec = caseSection(q.use, group, vis, retry);
        if(first) sec.querySelector('.qmain').classList.add('first');
        quizEl.appendChild(sec);
      } else { questionNodes(qi, first, retry).forEach(n => quizEl.appendChild(n)); k++; }
      first = false;
    }
    const nc = nextChapterIdx();
    if(nc > -1){ const w = document.createElement('div'); w.className = 'next-ch inpage'; const b = document.createElement('button'); b.className = 'link'; b.textContent = `Next chapter: ${chLabel(nc)} →`; b.addEventListener('click', () => switchChapter(nc)); w.appendChild(b); quizEl.appendChild(w); }
    window.scrollTo(0, y0);
  }
  fitExhibits();
  updateChrome();
  markCurrent();
  alignNotes();
}

function selectAnswer(qi, oi){
  if(examActive(qi)){ if(examPick[qi] === oi) return; examPick[qi] = oi; current = qi; render(); return; }
  if(answered[qi] === oi) return;
  answered[qi] = oi;
  if(oi !== QUESTIONS[qi].correct) missed.add(qi);
  current = qi; render(); scrollToActive();
}
function markCurrent(){ quizEl.querySelectorAll('.qmain').forEach(m => m.classList.toggle('cur', +m.dataset.index === current)); }
function setActive(qi){ const v = visibleIndices(); if(!v.length) return; if(!v.includes(qi)) qi = v[0]; current = qi; render(); scrollToActive(); }
function smoothTop(){ ignoreScrollUntil = performance.now() + 1500; window.scrollTo({ top: 0, behavior: 'smooth' }); }
function scrollToActive(){
  if(layoutMode === 'single') return;
  const el = quizEl.querySelector(`.qmain[data-index="${current}"]`);
  ignoreScrollUntil = performance.now() + 1200;
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function goNext(){ const v = visibleIndices(), p = v.indexOf(current); if(p === -1){ if(v.length) setActive(v[0]); return; } if(p < v.length - 1) setActive(v[p + 1]); }
function goPrev(){ const v = visibleIndices(), p = v.indexOf(current); if(p > 0) setActive(v[p - 1]); }
function enterReviewMode(){ const wl = wrongIndices(); if(!wl.length) return; reviewList = wl; wl.forEach(i => answered[i] = null); filterMode = 'review'; current = wl[0]; render(); scrollToActive(); }
function exitReviewMode(){ filterMode = 'all'; render(); smoothTop(); }

function updateChrome(){
  const ids = scopeIdx(), ex = examMode && ids.some(i => !examGraded[i]);
  const ansN = ids.filter(i => shownAns(i) !== null && shownAns(i) !== -1).length;
  $('totalCount').textContent = ids.length;
  $('answeredCount').textContent = ansN;
  $('correctCount').textContent = ex ? '–' : ids.filter(i => answered[i] === QUESTIONS[i].correct).length;
  const res = examMode && ids.length && ids.every(i => examGraded[i]) ? { c: ids.filter(i => examRes[i] === 'c').length, u: ids.filter(i => examRes[i] === 'u').length, n: ids.length } : null;
  const er = $('examResult'); er.classList.toggle('show', !!res);
  if(res){
    er.innerHTML = `<div class="er-detail">Exam score</div><div class="er-score">${res.c}<small> / ${res.n} · ${Math.round(res.c / res.n * 100)}%</small></div><div class="er-detail">${res.n - res.c - res.u} incorrect · ${res.u} unanswered (counted as incorrect)</div><button class="link" id="retakeBtn" type="button" style="margin-top:8px">Retake exam</button>`;
    $('retakeBtn').addEventListener('click', () => { resetScope(); smoothTop(); });
  }
  $('examBar').classList.toggle('show', ex);
  if(ex){ const left = ids.length - ansN; $('examInfo').textContent = `${ansN} of ${ids.length} answered` + (left ? ` · ${left} unanswered will count as incorrect` : ''); }
  const wl = wrongIndices();
  reviewBtn.disabled = ex || !wl.length || filterMode === 'review';
  reviewBtn.textContent = filterMode === 'review' ? 'Reviewing…' : `Review incorrect (${wl.length})`;
  setOn(reviewBtn, filterMode === 'review');
  copyMissedBtn.disabled = ex || !ids.some(i => missed.has(i));
  setOn($('allViewBtn'), filterMode === 'all');
  const fc = ids.filter(i => flagged.has(i)).length;
  flagBtn.textContent = `Marked (${fc})`; flagBtn.disabled = !fc && filterMode !== 'flagged'; setOn(flagBtn, filterMode === 'flagged');
  $('modeLabel').textContent = ex ? '· exam in progress' : '';
  const still = filterMode === 'review' ? reviewList.filter(i => answered[i] !== null && answered[i] !== QUESTIONS[i].correct) : [];
  const done = filterMode === 'review' && reviewList.length && reviewList.every(i => answered[i] !== null);
  reviewBanner.classList.toggle('show', !!done);
  if(done){
    $('reviewBannerText').textContent = still.length ? `Review complete — ${still.length} of ${reviewList.length} still incorrect.` : `Review complete — all ${reviewList.length} correct.`;
    const a = $('reviewBannerActions'); a.innerHTML = '';
    if(still.length){ const r = document.createElement('button'); r.className = 'link'; r.textContent = 'Retry remaining'; r.addEventListener('click', () => { reviewList = still; still.forEach(i => answered[i] = null); current = still[0]; render(); scrollToActive(); }); a.appendChild(r); }
    const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Back to all'; b.addEventListener('click', exitReviewMode); a.appendChild(b);
  }
  document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px');
}

document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('textarea, input, [contenteditable]')) return;
  if(lightbox.classList.contains('show')){ if(['Escape', 'Enter', ' '].includes(e.key)){ e.preventDefault(); lightbox.classList.remove('show'); } return; }
  if(!visibleIndices().length) return;
  if(e.key >= '1' && e.key <= '4'){ const oi = +e.key - 1; if(QUESTIONS[current] && oi < QUESTIONS[current].options.length){ e.preventDefault(); selectAnswer(current, oi); } }
  else if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){ if(e.target.closest && e.target.closest('button')) return; if(e.altKey || e.ctrlKey || e.metaKey) return; e.preventDefault(); goNext(); }
  else if(e.key === 'ArrowUp'){ if(e.altKey || e.ctrlKey || e.metaKey) return; e.preventDefault(); goPrev(); }
});

reviewBtn.addEventListener('click', enterReviewMode);
$('allViewBtn').addEventListener('click', exitReviewMode);
flagBtn.addEventListener('click', () => { flagList = scopeIdx().filter(i => flagged.has(i)); if(!flagList.length) return; filterMode = 'flagged'; reviewList = []; if(!flagList.includes(current)) current = flagList[0]; render(); smoothTop(); });
$('layoutToggleBtn').addEventListener('click', () => { layoutMode = layoutMode === 'list' ? 'single' : 'list'; setOn($('layoutToggleBtn'), layoutMode === 'single'); render(); });
$('darkSw').addEventListener('click', () => setOn($('darkSw'), document.documentElement.classList.toggle('dark')));
const examModeBtn = $('examModeBtn');
examModeBtn.addEventListener('click', () => { examMode = !examMode; setOn(examModeBtn, examMode); if(examMode){ filterMode = 'all'; reviewList = []; } render(); });
$('gradeBtn').addEventListener('click', () => {
  scopeIdx().filter(i => !examGraded[i]).forEach(i => {
    missed.delete(i); examGraded[i] = true; const p = examPick[i];
    if(p === null){ examRes[i] = 'u'; answered[i] = -1; missed.add(i); }
    else { answered[i] = p; if(p === QUESTIONS[i].correct) examRes[i] = 'c'; else { examRes[i] = 'w'; missed.add(i); } }
  });
  filterMode = 'all'; reviewList = []; current = scopeIdx()[0]; render(); smoothTop();
});

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
function parseNums(txt){
  const t = txt.replace(/[，、;；]/g, ',').replace(/[–—~～]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t) return { empty: true };
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){
    let m;
    if(/^\d+$/.test(tok)) out.add(+tok);
    else if((m = tok.match(/^(\d+)-(\d+)$/)) && +m[1] <= +m[2]){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); }
    else return { err: `Not recognised: "${tok}"` };
  }
  return { set: out };
}
function clearPick(silent){ pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); if(!silent){ filterMode = 'all'; current = scopeIdx()[0]; render(); smoothTop(); } }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const r = parseNums(qSearch.value);
  if(r.empty){ clearPick(false); return; }
  if(r.err){ qBad(r.err); return; }
  const have = new Set(baseIdx().map(i => QUESTIONS[i].n)), miss = [...r.set].filter(n => !have.has(n));
  if(miss.length){ qBad(`No question ${miss.slice(0, 6).join(', ')} (1–${Math.max(...have)})`); return; }
  qBad(''); pickNums = r.set; qForm.classList.add('active'); qSearch.value = [...r.set].sort((a, b) => a - b).join(', ');
  filterMode = 'all'; reviewList = []; current = scopeIdx()[0]; render(); smoothTop();
});
qSearch.addEventListener('input', () => qBad(''));
$('qClear').addEventListener('click', () => clearPick(false));

const allChBtn = $('allChBtn'), tocEl = $('toc');
if(CHAPTERS.length < 2) allChBtn.remove();
function setViewAll(on){ viewAll = on; clearPick(true); setOn(allChBtn, on); filterMode = 'all'; reviewList = []; if(!scopeIdx().includes(current)) current = scopeIdx()[0]; renderToc(); }
allChBtn.addEventListener('click', () => { setViewAll(!viewAll); render(); smoothTop(); });
function renderToc(){
  tocEl.classList.toggle('on', CHAPTERS.length > 1);
  if(CHAPTERS.length < 2) return;
  tocEl.innerHTML = '';
  CHAPTERS.forEach((c, ci) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'link' + (ci === activeCh && !viewAll ? ' on' : ''); b.textContent = chLabel(ci); b.title = c.title; b.addEventListener('click', () => switchChapter(ci)); tocEl.appendChild(b); });
}
function switchChapter(ci){ if(ci === activeCh && !viewAll) return; clearPick(true); if(viewAll) setViewAll(false); activeCh = ci; filterMode = 'all'; reviewList = []; current = CHAPTERS[ci].idx[0]; renderToc(); render(); smoothTop(); }

$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function sheetHtml(title, idx){
  const L = i => String.fromCharCode(97 + i);
  let html = `<h1>${esc(title)}</h1>${META.sub ? `<p class="p-sub">${esc(META.sub)}</p>` : ''}`, lastCase = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== lastCase) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    lastCase = q.use;
    html += `<div class="p-q"><p>${q.n}. ${q.use ? `<span class="p-ref">[Exhibit ${esc(q.use)}]</span> ` : ''}${fm(q.text)}</p>` + (q.fig ? `<div class="p-fig">${figHTML(q.fig)}</div>` : '') +
      q.options.map((o, oi) => `<p class="p-opt">${L(oi)}. ${fm(o)}</p>`).join('') + '</div>';
  });
  html += `<div class="p-key"><h1>${esc(title)} — Answers</h1><div class="p-grid">` + idx.map(qi => `<div>${QUESTIONS[qi].n}. ${L(QUESTIONS[qi].correct)}</div>`).join('') +
    '</div><div class="p-sol">' + idx.map(qi => `<div class="p-s"><p><b>${QUESTIONS[qi].n}. ${L(QUESTIONS[qi].correct)}</b>${QUESTIONS[qi].use ? ` [Exhibit ${esc(QUESTIONS[qi].use)}]` : ''}</p>${fmtExpl(QUESTIONS[qi].explain)}</div>`).join('') + '</div></div>';
  return html;
}
function buildPrintSheet(sel){
  sel = sel || scopeIdx();
  $('printSheet').innerHTML = viewAll && CHAPTERS.length > 1
    ? CHAPTERS.map((c, ci) => ({ c, ix: sel.filter(i => QUESTIONS[i].ch === ci) })).filter(o => o.ix.length).map(o => `<section>${sheetHtml(o.c.title, o.ix)}</section>`).join('')
    : sheetHtml(CHAPTERS.length > 1 ? CHAPTERS[activeCh].title : QUIZ_TITLE, sel);
}
window.addEventListener('beforeprint', () => buildPrintSheet(visibleIndices()));
window.addEventListener('afterprint', () => document.body.classList.remove('print-solution'));

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
copyMissedBtn.addEventListener('click', () => {
  const nums = [...missed].filter(i => scopeIdx().includes(i)).map(i => QUESTIONS[i].n);
  if(!nums.length) return;
  copyText(`${QUIZ_TITLE} incorrect: ${nums.sort((a, b) => a - b).join(', ')}`).then(() => showTip(copyMissedBtn, 'Copied'), () => showTip(copyMissedBtn, 'Copy failed'));
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}

const toTopBtn = $('toTopBtn');
let lastY = window.scrollY, upAcc = 0, topTimer = null, lastUser = 0, ignoreScrollUntil = 0;
['wheel', 'touchmove'].forEach(ev => window.addEventListener(ev, () => lastUser = performance.now(), { passive: true }));
window.addEventListener('scroll', () => {
  const y = window.scrollY, d = y - lastY; lastY = y;
  if(performance.now() - lastUser > 700 || performance.now() < ignoreScrollUntil) return;
  if(d > 0 || y < 900){ toTopBtn.classList.remove('show'); upAcc = 0; return; }
  upAcc -= d;
  if(upAcc > 30){ toTopBtn.classList.add('show'); clearTimeout(topTimer); topTimer = setTimeout(() => { toTopBtn.classList.remove('show'); upAcc = 0; }, 2200); }
}, { passive: true });
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('resize', () => document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px'));

const resetBtn = $('resetBtn'); let armed = false, armTimer = null;
resetBtn.addEventListener('click', () => {
  if(!armed){ armed = true; resetBtn.classList.add('danger'); resetBtn.textContent = 'Click again to restart'; armTimer = setTimeout(disarm, 4000); return; }
  clearTimeout(armTimer); disarm(); resetScope(); smoothTop();
});
function disarm(){ armed = false; resetBtn.classList.remove('danger'); resetBtn.textContent = 'Restart'; }
function resetScope(){ scopeIdx().forEach(i => { answered[i] = null; examPick[i] = null; examGraded[i] = false; examRes[i] = null; missed.delete(i); }); current = scopeIdx()[0]; filterMode = 'all'; reviewList = []; render(); }

const memoEl = $('memoText'), memoTab = $('memoTab');
function setMemoOpen(on){ document.body.classList.toggle('memo-open', on); }
function memoHtml(){ const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['B', 'STRONG'].includes(c.nodeName) ? `<b>${out(c)}</b>` : ['DIV', 'P'].includes(c.nodeName) ? `<div>${out(c)}</div>` : out(c)).join(''); return out(memoEl); }
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
$('memoBold').addEventListener('mousedown', e => e.preventDefault());
$('memoBold').addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
memoTab.addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const saveBtn = $('saveBtn');
const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'caseQuizProgress:' + QUIZ_TITLE + ':case', SAVE_SIG = hashStr(QUESTIONS.map(q => q.text + '|' + q.options.join('|') + '|' + q.correct).join('\n'));
saveBtn.addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, t: Date.now(), answered, missed: [...missed], flagged: [...flagged], activeCh, current, examMode, examPick, examGraded, examRes, memo: memoHtml() })); showTip(saveBtn, 'Saved'); }
  catch(e){ showTip(saveBtn, 'Save failed'); }
});
function loadProgress(){
  let d; try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ return false; }
  if(!d) return false;
  if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = memoHtml(); }
  if(d.sig !== SAVE_SIG || !Array.isArray(d.answered) || d.answered.length !== QUESTIONS.length) return 'mismatch';
  answered = d.answered; (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
  if(Array.isArray(d.examPick) && d.examPick.length === QUESTIONS.length){ examPick = d.examPick; examGraded = d.examGraded || examGraded; examRes = d.examRes || examRes; }
  examMode = !!d.examMode; setOn(examModeBtn, examMode);
  activeCh = CHAPTERS[d.activeCh] ? d.activeCh : 0;
  current = QUESTIONS[d.current] ? d.current : 0;
  return true;
}
let restored = false; try{ restored = loadProgress(); }catch(e){}

if(CHAPTERS.length > 1 && /midterm|final/i.test(QUIZ_TITLE)) setViewAll(true);
if(!scopeIdx().includes(current)) current = scopeIdx()[0];
renderToc();
render();
if(restored === true) showTip(saveBtn, 'Progress restored');
else if(restored === 'mismatch') showTip(saveBtn, 'Saved data is from another version');
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
