<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 테스트 — 법규·실무 100점 시험지와 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     매일 테스트 — 종이 시험지(인쇄) → 손으로 풀기 → 프롬프트로 채점 → 분석노트 업로드 → 점수·연속 기록.
     디자인은 행정법 기본문제 25 페이지와 같은 결(한지색 바탕 + 소나무 초록 + 갈색 강조).
     ========================================================================== */
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e1d8;
    --accent:#8b5e3c; --accent2:#2f5d50; --hi:#fff3e0; --chip:#eee7da;
    --ok:#2f7d5b; --warn:#b7791f; --bad:#b3402f; --law:#2f5d50; --prac:#8b5e3c;
    /* 점수 단계: 0=과락권(40 미만) · 1=40~59 · 2=60~79 · 3=80~89 · 4=90 이상 */
    --t0:#efd2c8; --t1:#f5deb5; --t2:#cfe5d8; --t3:#7fb99c; --t4:#2f6f56;
    --fs-title:32px; --fs-h2:18px; --fs-body:15px; --fs-sm:13px; --pad:16px;
  }
  @media (min-width:640px){ :root{ --fs-title:40px; --fs-h2:20px; --fs-body:16px; --fs-sm:13.5px; --pad:24px; } }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0 auto; max-width:780px; padding:var(--pad); padding-bottom:calc(var(--pad) + 72px);
    font-family:"Noto Serif KR","Nanum Myeongjo","Batang",serif; font-size:var(--fs-body); line-height:1.6;
    background:var(--bg); color:var(--ink);
  }
  button{font:inherit; color:inherit;}
  [hidden]{display:none !important;}
  h1{font-size:var(--fs-title); line-height:1.15; font-weight:900; margin:0; letter-spacing:-0.02em; word-break:keep-all;}
  h2{font-size:var(--fs-h2); margin:0 0 10px; font-weight:800; letter-spacing:-0.01em;}
  h3{font-size:15px; margin:0 0 6px; font-weight:800;}
  p{margin:0;}
  .sub{color:var(--sub); font-size:var(--fs-sm);}
  .mono{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;}

  .back{display:inline-block; margin-bottom:14px; color:var(--sub); font-size:12px; letter-spacing:.06em; text-decoration:none; border-bottom:1px solid transparent;}
  .back:hover{color:var(--accent2); border-color:var(--accent2);}
  .head{margin:4px 0 18px;}
  .head p{margin-top:6px; color:var(--sub); font-size:var(--fs-sm);}

  /* ---- 탭 ---- */
  .tabs{display:flex; gap:6px; margin-bottom:16px; position:sticky; top:0; z-index:20; padding:8px 0; background:linear-gradient(var(--bg) 80%, rgba(247,245,240,0));}
  .tab{flex:1; padding:10px 4px; text-align:center; border:0; border-radius:12px; background:var(--chip); color:var(--sub);
       font-weight:700; font-size:14px; cursor:pointer; user-select:none;}
  .tab:hover{background:#e6dcc9;}
  .tab[aria-selected="true"]{background:var(--accent2); color:#fff;}

  /* ---- 카드·버튼 ---- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 6px rgba(0,0,0,.03);}
  .card.flat{box-shadow:none;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border:1px solid var(--line); border-radius:12px;
       background:#fff; font-weight:700; font-size:14px; cursor:pointer; transition:background .12s, border-color .12s; text-decoration:none; color:var(--ink);}
  .btn:hover{border-color:var(--accent2); color:var(--accent2);}
  .btn:focus-visible, .tab:focus-visible, .chip-btn:focus-visible, .cal-day:focus-visible, .step:focus-visible{outline:2px solid var(--accent2); outline-offset:2px;}
  .btn.primary{background:var(--accent2); border-color:var(--accent2); color:#fff;}
  .btn.primary:hover{background:#244a40; color:#fff;}
  .btn.big{width:100%; padding:14px 18px; font-size:16px; border-radius:14px;}
  .btn.danger{color:var(--bad);}
  .btn.danger:hover{border-color:var(--bad); color:var(--bad);}
  .btn.sm{padding:5px 11px; font-size:12.5px; border-radius:9px;}
  .btn:disabled{opacity:.45; cursor:default;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .row.between{justify-content:space-between;}
  .grow{flex:1;}
  .chip{display:inline-block; padding:2px 9px; border-radius:999px; background:var(--chip); color:#5a4a3a; font-size:12px; font-weight:700; white-space:nowrap;}
  .chip.green{background:#dcebe3; color:#255a44;}
  .chip.brown{background:#efe0d0; color:#7a4f2e;}
  .chip.warn{background:#f8e8c8; color:#8a5a12;}
  .chip.bad{background:#f3d9d1; color:#8e3323;}
  .chip.line{background:#fff; border:1px solid var(--line); color:var(--sub);}
  .note{font-size:var(--fs-sm); color:var(--sub); line-height:1.65;}
  .empty{padding:18px 8px; text-align:center; color:var(--sub); font-size:var(--fs-sm);}
  .msg{padding:10px 12px; border-radius:10px; background:var(--hi); border-left:3px solid var(--accent); font-size:var(--fs-sm); line-height:1.65;}
  .msg.ok{background:#e8f2ec; border-color:var(--ok);}
  .msg.warn{background:#fbeed2; border-color:var(--warn);}
  .msg.bad{background:#f9e4de; border-color:var(--bad);}
  .stack > * + *{margin-top:10px;}
  ul.plain{margin:6px 0 0; padding-left:18px;}
  ul.plain li + li{margin-top:3px;}

  /* ---- 점수 링 · 지표 ---- */
  .hero{display:flex; gap:16px; align-items:center;}
  .ring{width:112px; height:112px; flex:none; position:relative;}
  .ring svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring .bg{fill:none; stroke:var(--chip); stroke-width:11;}
  .ring .fg{fill:none; stroke-width:11; stroke-linecap:round; transition:stroke-dasharray .5s ease;}
  .ring .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1;}
  .ring .num b{font-size:32px; font-weight:900; letter-spacing:-0.03em;}
  .ring .num span{font-size:11px; color:var(--sub);}
  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  @media (min-width:520px){ .kpis.five{grid-template-columns:repeat(5,1fr);} }
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center;}
  .kpi b{display:block; font-size:22px; font-weight:900; letter-spacing:-0.02em; line-height:1.2;}
  .kpi span{display:block; font-size:11.5px; color:var(--sub); margin-top:2px;}
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .wd{border:1px solid var(--line); border-radius:10px; padding:6px 0 7px; text-align:center; background:#fff; min-width:0;}
  .wd small{display:block; font-size:11px; color:var(--sub);}
  .wd b{display:block; font-size:15px; font-weight:800; min-height:22px; line-height:22px;}
  .wd i{display:block; font-style:normal; font-size:10.5px; font-weight:700; line-height:1.2;}
  .wd i.law{color:var(--law);} .wd i.practice{color:var(--prac);} .wd i.rest{color:var(--sub); font-weight:500;}
  .wd.today{border-color:var(--accent2); box-shadow:0 0 0 1px var(--accent2) inset;}
  .wd.future{opacity:.6;}
  .wd.missed{border-style:dashed; border-color:#d9a89c;}
  .t0{background:var(--t0);} .t1{background:var(--t1);} .t2{background:var(--t2);} .t3{background:var(--t3);} .t4{background:var(--t4); color:#fff;}
  .t4 small, .t4 i{color:rgba(255,255,255,.85) !important;}
  .meter{height:8px; border-radius:999px; background:var(--chip); overflow:hidden;}
  .meter i{display:block; height:100%; background:var(--accent2); border-radius:999px; transition:width .4s ease;}
  .meter.prac i{background:var(--prac);}

  /* ---- 오늘 · 회차 카드 · 3단계 ---- */
  .sess-head{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .sess-title{font-size:22px; font-weight:900; letter-spacing:-0.02em;}
  .steps3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .step{display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 6px; border:1.5px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; text-align:center; line-height:1.3;}
  .step:hover{border-color:var(--accent2);}
  .step b{font-size:13.5px;} .step small{font-size:11.5px; color:var(--sub);}
  .step .n{width:22px; height:22px; line-height:22px; border-radius:50%; background:var(--accent2); color:#fff; font-size:12px; font-weight:800;}
  .step.on{border-color:var(--accent2); background:#f1f7f4;}
  .scope-box{margin-top:10px; padding:10px 12px; background:#faf7f0; border-radius:10px; font-size:var(--fs-sm); line-height:1.7;}
  .plan-row{display:flex; gap:10px; align-items:center; padding:9px 2px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .plan-row:first-child{border-top:0;}
  .plan-row .d{min-width:5.6em; font-weight:700;}
  .plan-row .grow{min-width:8em;}
  .sess-row{display:flex; gap:8px; align-items:center; padding:8px 2px; border-top:1px dashed var(--line); flex-wrap:wrap;}
  .sess-row:first-child{border-top:0;}
  .sess-row .k{min-width:4.6em; font-weight:800;}

  /* ---- 회차 화면(문제지 · 프롬프트 · 업로드) ---- */
  .sess-bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
  select, input[type=number], input[type=date]{font:inherit; padding:7px 10px; border:1.5px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); max-width:100%;}
  textarea.box{width:100%; padding:12px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:14px; line-height:1.55; background:#fffdf9; color:var(--ink); resize:vertical;}
  textarea.box:focus{outline:none; border-color:var(--accent2); box-shadow:0 0 0 3px rgba(47,93,80,.15);}
  textarea.prompt{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace; font-size:12.5px; line-height:1.5; min-height:260px; max-height:420px; background:#f7f4ee;}
  .paper-wrap{overflow-x:auto; padding-bottom:4px;}
  .up-table{width:100%; border-collapse:collapse; font-size:var(--fs-sm);}
  .up-table th, .up-table td{padding:6px 6px; border-top:1px solid var(--line); text-align:left; vertical-align:top;}
  .up-table th{color:var(--sub); font-weight:700; border-top:0; white-space:nowrap;}
  .up-table td.n{text-align:right; white-space:nowrap;}
  .field{display:flex; gap:10px; align-items:center; padding:9px 0; border-top:1px dashed var(--line); flex-wrap:wrap;}
  .field:first-of-type{border-top:0;}
  .field > label, .field > .lbl{min-width:8em; font-weight:700;}

  /* ---- 시험지(화면 미리보기 · 인쇄 공용) ---- */
  .paper{background:#fff; color:#111; border:1px solid var(--line); border-radius:6px; padding:28px 30px; box-shadow:0 2px 10px rgba(0,0,0,.06); min-width:0;}
  .paper .p-org{font-size:12.5px; letter-spacing:.08em; color:#444; text-align:center;}
  .paper .p-title{font-size:23px; font-weight:900; text-align:center; margin:4px 0 10px; letter-spacing:-0.01em;}
  .paper .p-meta{display:flex; justify-content:center; gap:18px; flex-wrap:wrap; font-size:13.5px; color:#222; padding-bottom:10px; border-bottom:2px solid #111;}
  .paper .p-fields{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:12px 0 8px; font-size:13.5px;}
  .paper .p-fields i{display:inline-block; width:8em; border-bottom:1px solid #111; height:1em; vertical-align:baseline; margin-left:4px;}
  .paper .p-fields i.s{width:4em;}
  .paper .p-notice{font-size:12.5px; line-height:1.7; color:#333; border:1px solid #999; padding:8px 12px; margin:10px 0 16px;}
  .paper .prob{margin:0 0 20px;}
  .paper .prob-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:1px solid #111; padding-bottom:3px; margin-bottom:8px;}
  .paper .prob-h b{font-size:16px; font-weight:900;}
  .paper .prob-h span{font-size:14px; font-weight:700;}
  .paper .prob-q p{margin:0 0 6px; font-size:14.5px; line-height:1.85; text-align:left; word-break:keep-all;}
  .paper .prob-q p.sq{padding-left:1.4em; text-indent:-1.4em;}
  .paper .prob-ctx{margin:8px 0; padding:8px 12px; border:1px solid #bbb; background:#fafafa; font-size:13.5px; line-height:1.7;}
  .paper .prob-ref{font-size:11.5px; color:#666; margin-top:2px;}
  .paper .lines{margin-top:10px;}
  .paper .lines i{display:block; height:26px; border-bottom:1px solid #bbb;}
  .paper .p-foot{margin-top:18px; padding-top:6px; border-top:1px dashed #999; font-size:10.5px; color:#777; word-break:break-all;}
  .paper table{border-collapse:collapse; margin:6px 0;} .paper td, .paper th{border:1px solid #999; padding:3px 8px; font-size:13px;}

  /* ---- 결과 · 분석노트 ---- */
  .ri{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff;}
  .ri.miss{border-left:4px solid var(--bad);} .ri.part{border-left:4px solid var(--warn);} .ri.full{border-left:4px solid var(--ok);}
  .ri .q{font-weight:700; line-height:1.5; word-break:keep-all;}
  .tag{display:inline-block; margin:2px 4px 2px 0; padding:2px 10px; border-radius:8px; font-size:12.5px; font-weight:700;}
  .tag.weak{background:#f3d9d1; color:#8e3323;} .tag.strong{background:#dcebe3; color:#255a44;} .tag.next{background:#f8e8c8; color:#8a5a12;}
  .md{font-size:14.5px; line-height:1.75; word-break:break-word;}
  .md h4{font-size:15.5px; margin:16px 0 6px; padding-bottom:3px; border-bottom:1px solid var(--line);}
  .md h4:first-child{margin-top:0;}
  .md p{margin:0 0 8px;} .md ul, .md ol{margin:4px 0 10px; padding-left:22px;} .md li{margin:2px 0;}
  .md blockquote{margin:8px 0; padding:6px 12px; border-left:3px solid var(--accent); background:#faf7f0; color:#4b4237;}
  .md table{border-collapse:collapse; width:100%; margin:8px 0 12px; font-size:13.5px;}
  .md th, .md td{border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top;}
  .md th{background:#f5f1e8;}
  .md pre{background:#f4f1ea; padding:10px 12px; border-radius:8px; overflow:auto; font-size:12.5px;}
  .md code{background:#f1ece2; padding:1px 5px; border-radius:4px; font-size:.92em;}
  .md hr{border:0; border-top:1px solid var(--line); margin:12px 0;}
  .scroll-x{overflow-x:auto;}

  /* ---- 기록: 차트 · 달력 · 목록 ---- */
  .chart{width:100%; height:auto; display:block;}
  .chart text{font-size:11px; fill:var(--sub); font-family:inherit;}
  .chart .grid{stroke:var(--line); stroke-width:1;}
  .chart .goal{stroke:var(--accent); stroke-width:1.2; stroke-dasharray:4 4;}
  .chart .line{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
  .chart .line.law{stroke:var(--law);} .chart .line.practice{stroke:var(--prac);}
  .chart circle.pt{stroke:#fff; stroke-width:1.5; cursor:pointer;}
  .chart circle.pt.law{fill:var(--law);} .chart circle.pt.practice{fill:var(--prac);}
  .chart circle.pt:focus{outline:none; stroke:var(--ink); stroke-width:2;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff;}
  .seg button{border:0; background:none; padding:6px 11px; font-size:12.5px; font-weight:700; color:var(--sub); cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--accent2); color:#fff;}
  .seg button[data-v="practice"][aria-pressed="true"]{background:var(--prac);}
  .seg button[data-v="rest"][aria-pressed="true"]{background:#7d776b;}
  .pat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:6px 16px; margin-top:8px;}
  .pat-row{display:flex; align-items:center; gap:10px;}
  .pat-row > b{width:1.5em; text-align:center;}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal .dow{text-align:center; font-size:11.5px; color:var(--sub); padding:2px 0;}
  .cal-day{aspect-ratio:1/1; min-width:0; border:1px solid var(--line); border-radius:9px; background:#fff; padding:3px 2px; cursor:pointer;
           display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15; font-size:12px;}
  .cal-day small{font-size:10.5px; opacity:.85;}
  .cal-day b{font-size:12.5px; font-weight:800;}
  .cal-day.out{visibility:hidden;}
  .cal-day.today{box-shadow:0 0 0 2px var(--accent2) inset;}
  .cal-day.sel{outline:2px solid var(--ink); outline-offset:1px;}
  .cal-day.none{color:#a09a8c;}
  .legend{display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--sub); align-items:center;}
  .legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-2px;}
  .legend i.l{background:var(--law);} .legend i.p{background:var(--prac);}
  .hist{list-style:none; margin:0; padding:0;}
  .hist li{display:flex; gap:8px; align-items:center; padding:9px 2px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .hist li:first-child{border-top:0;}
  .hist .sc{min-width:3.2em; text-align:center; padding:3px 6px; border-radius:8px; font-weight:900;}
  table.ut{width:100%; border-collapse:collapse; font-size:var(--fs-sm);}
  table.ut th, table.ut td{padding:6px 6px; border-top:1px solid var(--line); text-align:left; vertical-align:middle;}
  table.ut th{color:var(--sub); font-weight:700; border-top:0;}
  table.ut td.n{text-align:right; white-space:nowrap;}
  .mini{height:6px; border-radius:999px; background:var(--chip); overflow:hidden; min-width:60px;}
  .mini i{display:block; height:100%; background:var(--accent2);}
  details.fold summary{cursor:pointer; color:var(--accent2); font-weight:700; font-size:var(--fs-sm);}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1f2937; color:#fff; padding:10px 16px; border-radius:12px; font-size:13.5px; z-index:99; max-width:90vw; box-shadow:0 6px 18px rgba(0,0,0,.25);}
  @media (max-width:420px){ .hero{flex-direction:column; align-items:flex-start;} .ring{width:96px; height:96px;} .ring .num b{font-size:27px;} .paper{padding:18px 14px;} }

  /* ---- 인쇄: 시험지(#paper)만 A4로 ---- */
  @page{ size:A4; margin:16mm 15mm 18mm; }
  @media print{
    html, body{background:#fff !important; color:#000 !important;}
    body{max-width:none; padding:0 !important; margin:0; font-size:11pt;}
    .no-print{display:none !important;}
    .paper-wrap{overflow:visible; padding:0;}
    .paper{border:0 !important; box-shadow:none !important; border-radius:0; padding:0 !important;}
    .paper .p-title{font-size:20pt;}
    .paper .prob{break-inside:avoid;}
    .paper .prob.tall{break-inside:auto;}
    .paper .prob-q{break-inside:avoid;}
    .paper .prob-q p{font-size:11.5pt; line-height:1.9;}
    .paper .lines i{height:8.2mm; border-bottom-color:#999;}
    a{color:inherit; text-decoration:none;}
  }
</style>
</head>
<body>

<a class="back no-print" href="/">← BACK TO BOARD</a>

<div class="head no-print" id="head">
  <h1>매일 테스트</h1>
  <p>법규·실무 100점 시험지 — 인쇄해서 손으로 풀고, 프롬프트로 채점한 분석노트를 올리면 점수·연속 기록이 쌓입니다.</p>
</div>

<div class="tabs no-print" id="tabs" role="tablist" aria-label="화면 선택">
  <button class="tab" role="tab" data-tab="today" aria-selected="true">오늘</button>
  <button class="tab" role="tab" data-tab="plan" aria-selected="false">일정</button>
  <button class="tab" role="tab" data-tab="records" aria-selected="false">기록</button>
  <button class="tab" role="tab" data-tab="settings" aria-selected="false">설정</button>
</div>

<main id="app"><div class="empty">문제를 불러오는 중…</div></main>

<script>
(() => {
'use strict';

// ==========================================================================
// 저장소 키 · 상수
// ==========================================================================
const KEY_DATA = 'daily-test-records-v1';      // { v, settings, records[] } — 기록(원본)
const KEY_SUMMARY = 'daily-test-summary-v1';   // 메인 페이지가 읽어 가는 요약(연속일·오늘 과목·다음 회차)
const BANK_URL = 'daily-test-bank.json';       // scripts/build-daily-test-bank.mjs 가 원본 페이지에서 만든 문제 은행
const RESULT_FORMAT = 'daily-test-result';     // 채점 프롬프트가 요구하는 기록용 JSON 형식 이름
const TIER_LABEL = ['과락권', '복습 필요', '합격선 근처', '안정권', '아주 좋음'];
const SUBJ = { law: '법규', practice: '실무' };
const NOTE_MAX = 20000;                        // 분석노트 본문 저장 상한(글자)
const DAY_STARTS = [0, 3, 4, 5, 6];
const DEFAULTS = {
  // 요일별 과목(월~일). 평일엔 짧은 실무 5문항, 주말엔 100분짜리 법규 — 바꿔도 된다.
  pattern: ['practice', 'practice', 'practice', 'practice', 'practice', 'law', 'law'],
  goal: 70,            // 목표 점수
  dayStart: 0,         // 하루가 바뀌는 시각(0=자정). 밤늦게 공부하면 3~5시로 두면 새벽에 본 시험이 "어제"로 묶인다
  lines: false,        // 문제지에 답안 줄을 넣을지
};
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const DEV_HOST = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

// ==========================================================================
// 작은 도구들
// ==========================================================================
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const pad2 = (n) => String(n).padStart(2, '0');
const round1 = (n) => Math.round(n * 10) / 10;
const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
const fmtNum = (n) => (Number.isInteger(n) ? String(n) : String(round1(n)));

// 날짜는 항상 이 기기의 "현지 날짜"(YYYY-MM-DD). 개발 호스트에서는 테스트가 오늘을 바꿔 볼 수 있다.
let todayOverride = null;
const dstr = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const validDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && dstr(parseDate(s)) === s;
const today = () => todayOverride || dstr(new Date(Date.now() - (S.data ? S.data.settings.dayStart : 0) * 3600000));
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dstr(d); };
const diffDays = (a, b) => Math.round((parseDate(a) - parseDate(b)) / 86400000);
const wdIndex = (s) => (parseDate(s).getDay() + 6) % 7;            // 월=0 … 일=6
const weekStart = (s) => addDays(s, -wdIndex(s));
const mdLabel = (s) => { const d = parseDate(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + DOW[d.getDay()] + ')'; };
const longDate = (s) => { const d = parseDate(s); return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일'; };
const tierOf = (score) => (score < 40 ? 0 : score < 60 ? 1 : score < 80 ? 2 : score < 90 ? 3 : 4);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// ---- HTML → 평문(배경자료를 프롬프트에 넣을 때) ---------------------------------
function htmlToText(html) {
  const s = String(html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|tr|h\d)>/gi, '\n').replace(/<\/t[hd]>/gi, ' | ').replace(/<li[^>]*>/gi, '- ');
  const box = document.createElement('div');
  box.innerHTML = s;
  return (box.textContent || '').replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

// ---- 마크다운(분석노트) → 안전한 HTML: 먼저 전부 이스케이프하고, 알려진 서식만 되살린다 ------------
function mdInline(s) {
  return esc(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*(?!\*)/g, '$1<i>$2</i>');
}
function mdToHtml(src) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l || '');
  const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {                                    // 코드 블록
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push('<pre>' + esc(buf.join('\n')) + '</pre>'); continue;
    }
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(/^\s*(#{1,6})\s+(.*)$/))) { out.push('<h4>' + mdInline(m[2]) + '</h4>'); i++; continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (line.includes('|') && isTableSep(lines[i + 1])) {           // 표
      const head = cells(line); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push('<div class="scroll-x"><table><thead><tr>' + head.map((c) => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>'
        + rows.map((r) => '<tr>' + head.map((_, k) => '<td>' + mdInline(r[k] || '') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*>/.test(line)) {                                       // 인용
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + buf.map(mdInline).join('<br>') + '</blockquote>'); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {                       // 목록(글머리표 ↔ 번호가 바뀌면 새 목록)
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const same = (l) => /^\s*([-*+]|\d+[.)])\s+/.test(l) && /^\s*\d+[.)]\s+/.test(l) === ordered;
      const buf = [];
      while (i < lines.length && same(lines[i])) buf.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ''));
      out.push((ordered ? '<ol>' : '<ul>') + buf.map((x) => '<li>' + mdInline(x) + '</li>').join('') + (ordered ? '</ol>' : '</ul>')); continue;
    }
    const buf = [];                                                 // 문단
    while (i < lines.length && lines[i].trim() && !/^\s*(#{1,6}\s|```|>|([-*+]|\d+[.)])\s+)/.test(lines[i]) && !(lines[i].includes('|') && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
    if (!buf.length) { out.push('<p>' + mdInline(lines[i++]) + '</p>'); continue; }
    out.push('<p>' + buf.map(mdInline).join('<br>') + '</p>');
  }
  return out.join('\n');
}

const S = {
  bank: null, pById: {}, sById: {}, sessOf: { law: [], practice: [] },
  data: null,            // 저장되는 것: { v, settings, records }
  view: 'today',         // today | plan | records | settings | session | result
  sid: null, step: 1, sdate: null, recId: null,
  calMonth: null, calSel: null, chartRange: 30, chartSeries: 'all', histCount: 15,
  up: { text: '', parsed: null, date: '', fileName: '' },   // 업로드 화면 상태(다시 그려도 붙여넣은 글이 남도록)
};

// ---- 저장 · 불러오기 -------------------------------------------------------
function freshData() { return { v: 1, settings: JSON.parse(JSON.stringify(DEFAULTS)), records: [] }; }
function normalizeSettings(s) {
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  s = s && typeof s === 'object' ? s : {};
  const pat = Array.isArray(s.pattern) && s.pattern.length === 7 && s.pattern.every((x) => ['law', 'practice', 'rest'].includes(x)) ? s.pattern.slice() : d.pattern;
  return {
    pattern: pat,
    goal: clamp(Math.round(Number(s.goal) || d.goal), 10, 100),
    dayStart: DAY_STARTS.includes(Number(s.dayStart)) ? Number(s.dayStart) : d.dayStart,
    lines: !!s.lines,
  };
}
function normalizeRecord(r) {
  if (!r || typeof r !== 'object' || !r.id || !validDate(r.date) || !Array.isArray(r.items)) return null;
  const items = r.items.filter((it) => it && it.id).map((it) => ({ id: String(it.id), got: Number(it.got) || 0, max: Number(it.max) || 0, t: it.t ? String(it.t).slice(0, 80) : '', missing: Array.isArray(it.missing) ? it.missing.map((x) => String(x).slice(0, 160)).slice(0, 8) : [], comment: it.comment ? String(it.comment).slice(0, 400) : '' }));
  if (!items.length) return null;
  const score = round1(items.reduce((a, it) => a + it.got, 0));
  const strs = (a, n) => (Array.isArray(a) ? a.map((x) => String(x).trim().slice(0, 80)).filter(Boolean).slice(0, n) : []);
  return {
    id: String(r.id), session: String(r.session || ''), s: r.s === 'practice' ? 'practice' : 'law', date: r.date, score, max: round1(items.reduce((a, it) => a + it.max, 0)) || 100,
    items, weak: strs(r.weak, 8), strong: strs(r.strong, 8), next: strs(r.next, 8), summary: String(r.summary || '').slice(0, 800),
    minutes: Number.isFinite(Number(r.minutes)) && r.minutes !== null && r.minutes !== '' ? Math.round(Number(r.minutes)) : null,
    note: String(r.note || '').slice(0, NOTE_MAX), createdAt: Number(r.createdAt) || 0,
  };
}
function loadData() {
  let data = freshData();
  const raw = store.get(KEY_DATA);
  if (raw) {
    try {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.records)) data = { v: 1, settings: p.settings, records: p.records.map(normalizeRecord).filter(Boolean) };
    } catch (e) {
      store.set(KEY_DATA + '-broken-' + Date.now(), raw);   // 깨진 저장값은 지우지 않고 따로 남겨 둔다
    }
  }
  data.settings = normalizeSettings(data.settings);
  data.records.sort(recOrder);
  return data;
}
const recOrder = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
let saveFailed = false;
function flushData() {
  const ok = store.set(KEY_DATA, JSON.stringify(S.data));
  if (!ok && !saveFailed) { saveFailed = true; toast('저장 공간이 부족해요. 설정에서 백업을 받고 오래된 분석노트를 지워 주세요.'); }
  if (ok) saveFailed = false;
  writeSummary();
  return ok;
}

// ==========================================================================
// 문제 은행 · 회차
// ==========================================================================
function indexBank(b) {
  S.bank = b;
  b.problems.forEach((p) => { S.pById[p.id] = p; });
  b.sessions.forEach((s) => { S.sById[s.id] = s; S.sessOf[s.s].push(s); });
}
const sessTitle = (sess) => SUBJ[sess.s] + ' 제' + sess.n + '회';
const probs = (sess) => sess.problems.map((id) => S.pById[id]);
function sessScope(sess) {
  const ps = probs(sess);
  if (sess.s === 'law') return ps[0].label + ' ~ ' + ps[ps.length - 1].label;
  return Array.from(new Set(ps.map((p) => p.unitName))).join(' · ');
}
function sessTopics(sess) {
  const ps = probs(sess);
  return sess.s === 'law' ? ps.map((p) => p.label + ' ' + p.title).join(' · ') : Array.from(new Set(ps.map((p) => p.chapter + ' / ' + p.unitName))).join(' · ');
}
function sessMinutes(sess) {
  if (sess.s === 'law') return 100;                                   // 실제 시험처럼 1점 = 1분
  return Math.round(probs(sess).reduce((a, p) => a + (p.size === 3 ? 8 : p.size === 2 ? 6 : 4), 0) / 5) * 5 || 5;
}
function doneCounts(s) {
  const cnt = {};
  S.sessOf[s].forEach((x) => { cnt[x.id] = 0; });
  S.data.records.forEach((r) => { if (r.s === s && cnt[r.session] != null) cnt[r.session]++; });
  return cnt;
}
// 다음 회차: 이번 회독에서 아직 안 한 가장 앞 회차(모두 했으면 다음 회독의 1회차부터)
function pickNext(s, cnt) {
  const list = S.sessOf[s];
  const min = Math.min.apply(null, list.map((x) => cnt[x.id]));
  return { sess: list.find((x) => cnt[x.id] === min), round: min + 1 };
}
function nextSession(s) { return pickNext(s, doneCounts(s)); }

// ==========================================================================
// 일정 — 요일별 과목 패턴 + "다음 회차" 포인터. 빠진 날이 있어도 회차는 이어서 진행된다.
// ==========================================================================
const subjectOn = (date) => S.data.settings.pattern[wdIndex(date)];
const recordsOn = (date) => S.data.records.filter((r) => r.date === date);
function projection(days) {
  const sim = { law: doneCounts('law'), practice: doneCounts('practice') };
  const t = today();
  const out = [];
  for (let i = 0; i < days; i++) {
    const date = addDays(t, i), subj = subjectOn(date);
    if (subj === 'rest') { out.push({ date, subj }); continue; }
    const done = recordsOn(date).filter((r) => r.s === subj);
    if (i === 0 && done.length) { out.push({ date, subj, done: done[done.length - 1] }); continue; }   // 오늘 이미 함(회차 포인터에 이미 반영됨)
    const nx = pickNext(subj, sim[subj]);
    out.push({ date, subj, sess: nx.sess, round: nx.round });
    sim[subj][nx.sess.id]++;
  }
  return out;
}
const plannedPerWeek = () => S.data.settings.pattern.filter((x) => x !== 'rest').length;

// ==========================================================================
// 기록에서 계산하는 것들
// ==========================================================================
const byDay = () => { const m = {}; S.data.records.forEach((r) => { (m[r.date] = m[r.date] || []).push(r); }); return m; };
const dayAvg = (list) => mean(list.map((r) => r.score));
function streakInfo(daySet, todayS) {
  const doneToday = daySet.has(todayS);
  let cur = 0; let d = doneToday ? todayS : addDays(todayS, -1);
  while (daySet.has(d)) { cur++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  Array.from(daySet).sort().forEach((s) => { run = prev && diffDays(s, prev) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = s; });
  return { current: cur, best, doneToday, lastRun: run };   // lastRun: 마지막 응시일로 끝나는 연속 일수(메인 페이지가 "지금도 이어지는지" 판단할 때 씀)
}
function stats() {
  const recs = S.data.records, t = today();
  const days = byDay(), dayList = Object.keys(days).sort();
  const scores = recs.map((r) => r.score);
  const win = (from, to) => recs.filter((r) => r.date >= from && r.date <= to).map((r) => r.score);
  const last7 = win(addDays(t, -6), t), prev7 = win(addDays(t, -13), addDays(t, -7));
  const sub = (k) => mean(recs.filter((r) => r.s === k).map((r) => r.score));
  return {
    days, dayList, dayCount: dayList.length, recCount: recs.length,
    avg: mean(scores), best: scores.length ? Math.max.apply(null, scores) : null, avg7: mean(last7), avgPrev7: mean(prev7), n7: last7.length,
    lawAvg: sub('law'), practiceAvg: sub('practice'),
    streak: streakInfo(new Set(dayList), t),
  };
}
function nextTitles() { const o = {}; ['law', 'practice'].forEach((s) => { const n = nextSession(s); o[s] = { id: n.sess.id, title: sessTitle(n.sess), round: n.round }; }); return o; }
// 메인 페이지(블로그 홈)가 읽는 요약. "오늘 했는지·연속이 이어지는지"는 페이지를 안 열어도 날짜가 바뀌면 달라지므로,
// 계산 결과가 아니라 재료(마지막 응시일·그날 평균·그날로 끝나는 연속 일수·요일 패턴·다음 회차)를 저장하고 읽는 쪽이 오늘 날짜로 판단한다.
function writeSummary() {
  try {
    const st = stats();
    const last = st.dayList.length ? st.dayList[st.dayList.length - 1] : null;
    store.set(KEY_SUMMARY, JSON.stringify({
      v: 2, lastDate: last, lastScore: last ? Math.round(dayAvg(st.days[last])) : null, run: st.streak.lastRun, best: st.streak.best, days: st.dayCount,
      goal: S.data.settings.goal, dayStart: S.data.settings.dayStart, pattern: S.data.settings.pattern, next: nextTitles(), updatedAt: Date.now(),
    }));
  } catch (e) {}
}
// 문제별 최근 성적(득점률) — 취약 문제 찾기용
function problemStats() {
  const m = {};
  S.data.records.forEach((r) => r.items.forEach((it) => {
    if (!it.max) return;
    const o = m[it.id] || (m[it.id] = { id: it.id, tries: 0, sum: 0, last: 0, date: '', recId: '', t: it.t });
    o.tries++; o.sum += it.got / it.max; o.last = it.got / it.max; o.date = r.date; o.recId = r.id; if (it.t) o.t = it.t;
  }));
  return m;
}
function weakTags() {
  const m = {};
  S.data.records.forEach((r) => r.weak.forEach((w) => {
    const key = w.replace(/\s+/g, ' ').trim();
    const o = m[key] || (m[key] = { tag: key, n: 0, last: '' });
    o.n++; if (r.date > o.last) o.last = r.date;
  }));
  return Object.values(m).sort((a, b) => b.n - a.n || (a.last < b.last ? 1 : -1));
}

// 문제지(인쇄용) · 채점 프롬프트

const paragraphs = (t) => String(t || '').split('\n').map((x) => x.trim()).filter(Boolean);
function qHTML(text) {
  return paragraphs(text).map((p) => '<p' + (/^[⑴⑵⑶⑷⑸①②③④⑤]/.test(p) ? ' class="sq"' : '') + '>' + mdInline(p) + '</p>').join('');
}
function paperNotice(sess) {
  return sess.s === 'law'
    ? '※ 각 문제의 배점은 문제 번호 옆에 표시되어 있습니다. ※ 답안지에 문제 번호를 쓰고 서술하시오. 목차(Ⅰ, Ⅱ …)를 먼저 잡고, 조문·판례·학설과 사안 포섭을 구체적으로 쓰시오.'
    : '※ 각 문항의 주제에 대하여 핵심 개념·산식·근거 법령·유의사항을 간결하게 서술하시오. 배점은 답안 분량을 고려해 정해져 있습니다. ※ 답안지에 문항 번호를 쓰고 서술하시오.';
}
function paperHTML(sess, date, withLines) {
  const ps = probs(sess), subj = S.bank.subjects[sess.s];
  let h = '<article class="paper" id="paper">';
  h += '<header><div class="p-org">감정평가사 2차 시험 · ' + esc(subj.name) + '</div><h2 class="p-title" style="margin-top:4px">매일 테스트 — ' + esc(sessTitle(sess)) + '</h2>';
  h += '<div class="p-meta"><span>총 100점</span><span>권장 시간 ' + sessMinutes(sess) + '분</span><span>' + esc(longDate(date)) + '</span></div>';

function sparkHTML(points, goal) {

  const line = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const dots = points.map((p, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="3.5" class="t' + tierOf(p.v) + '" stroke="#fff" stroke-width="1"><title>' + esc(mdLabel(p.date) + ' ' + fmtNum(p.v) + '점') + '</title></circle>').join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="최근 점수 추이"><line class="goal" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(goal).toFixed(1) + '" y2="' + y(goal).toFixed(1) + '"/><path class="line" style="stroke:var(--accent2)" d="' + line + '"/>' + dots + '</svg>';

function weekHTML() {

function chartHTML() {
  const set = S.data.settings, R = S.chartRange;
  const W = chartW(), H = Math.round(clamp(W * 0.44, 190, 270)), l = 30, r = 10, tp = 12, bt = 26;
  const x = (i) => l + (R === 1 ? 0 : (i / (R - 1))) * (W - l - r);
  const y = (v) => tp + (1 - clamp(v, 0, 100) / 100) * (H - tp - bt);
  const t = today(), from = addDays(t, -(R - 1));
  let g = '';
  [0, 25, 50, 75, 100].forEach((v) => { g += '<line class="grid" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (l - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + v + '</text>'; });
  g += '<line class="goal" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(set.goal).toFixed(1) + '" y2="' + y(set.goal).toFixed(1) + '"/><text x="' + (W - r) + '" y="' + (y(set.goal) - 4).toFixed(1) + '" text-anchor="end" style="fill:var(--accent)">목표 ' + set.goal + '</text>';
  [0, Math.round((R - 1) / 2), R - 1].forEach((i, k) => { g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (k === 0 ? 'start' : k === 2 ? 'end' : 'middle') + '">' + esc(mdLabel(addDays(from, i)).replace(/ \(.\)/, '')) + '</text>'; });
  const recs = S.data.records.filter((r) => r.date >= from && r.date <= t && (S.chartSeries === 'all' || r.s === S.chartSeries));
  if (!recs.length) return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="점수 추이(기록 없음)">' + g + '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" style="font-size:13px">이 기간에는 기록이 없어요</text></svg>';
  let lines = '', dots = '';
  ['law', 'practice'].forEach((s) => {
    const pts = recs.filter((r) => r.s === s);
    if (!pts.length) return;
    if (pts.length > 1) lines += '<path class="line ' + s + '" d="' + pts.map((p, i) => (i ? 'L' : 'M') + x(diffDays(p.date, from)).toFixed(1) + ' ' + y(p.score).toFixed(1)).join(' ') + '"/>';
    dots += pts.map((p) => '<circle class="pt ' + s + '" tabindex="0" data-id="' + esc(p.id) + '" cx="' + x(diffDays(p.date, from)).toFixed(1) + '" cy="' + y(p.score).toFixed(1) + '" r="5.5"><title>' + esc(SUBJ[s] + ' ' + mdLabel(p.date) + ' ' + fmtNum(p.score) + '점') + '</title></circle>').join('');
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="최근 ' + R + '일 점수 추이">' + g + lines + dots + '</svg>';
}
function calendarHTML(st) {

function afterRender() {
  const ta = $('#promptBox'); if (ta) { ta.scrollTop = 0; }
}
function openSession(sid, step) {
  if (!S.sById[sid]) return;
  S.sid = sid; S.step = step || 1;
  if (!S.sdate || S.sdate > today()) S.sdate = today();
  go('session');
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'tab': go(el.dataset.tab); break;
    case 'open': openSession(el.dataset.sid, Number(el.dataset.step) || 1); break;
    case 'print': window.print(); break;
    case 'copyPrompt': { const sess = S.sById[S.sid]; const ok = await copyText(buildPrompt(sess, S.sdate || today())); toast(ok ? '프롬프트를 복사했어요. AI 대화창에 붙여넣으세요.' : '복사에 실패했어요. 아래 칸을 직접 선택해 복사해 주세요.'); break; }
    case 'savePrompt': { const sess = S.sById[S.sid]; download('채점프롬프트-' + sess.id + '-' + (S.sdate || today()) + '.md', buildPrompt(sess, S.sdate || today()), 'text/markdown'); break; }
    case 'upClear': S.up = { text: '', parsed: null, date: '', fileName: '' }; render(); break;
    case 'saveResult': {
      const p = S.up.parsed; if (!p || !p.ok) break;
      const date = S.up.date && validDate(S.up.date) ? S.up.date : p.rec.date;
      const rec = saveParsed(p, date, el.dataset.replace || '');
      if (!rec) { toast('기록을 저장하지 못했어요.'); break; }
      S.up = { text: '', parsed: null, date: '', fileName: '' };
      toast('기록했어요: ' + fmtNum(rec.score) + '점');
      go('result', { recId: rec.id });
      break;
    }
    case 'viewrec': go('result', { recId: el.dataset.id }); break;
    case 'delrec': if (confirm('이 시험 기록(점수와 분석노트)을 삭제할까요? 되돌릴 수 없어요.')) { S.data.records = S.data.records.filter((r) => r.id !== el.dataset.id); flushData(); toast('삭제했어요.'); go('records'); } break;
    case 'pat': { const pat = S.data.settings.pattern.slice(); pat[Number(el.dataset.i)] = el.dataset.v; updateSettings({ pattern: pat }); break; }
    case 'range': S.chartRange = Number(el.dataset.v); render(); break;
    case 'series': S.chartSeries = el.dataset.v; render(); break;
    case 'cal': { const t = today(); const base = S.calMonth || t.slice(0, 7); const [y, m] = base.split('-').map(Number); const nd = new Date(y, m - 1 + Number(el.dataset.d), 1); const nm = nd.getFullYear() + '-' + pad2(nd.getMonth() + 1); if (nm <= t.slice(0, 7)) { S.calMonth = nm; render(); } break; }
    case 'day': S.calSel = S.calSel === el.dataset.date ? null : el.dataset.date; render(); break;
    case 'more': S.histCount += 15; render(); break;
    case 'export': exportData(); break;
    case 'reset': if (confirm('모든 시험 기록(점수·분석노트·연속 일수)을 지웁니다. 되돌릴 수 없어요. 계속할까요?')) { S.data.records = []; flushData(); toast('기록을 모두 지웠어요.'); render(); } break;
    default: break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sessPick') { S.sid = t.value; render(); }
  else if (t.id === 'sdate') { if (validDate(t.value) && t.value <= today()) { S.sdate = t.value; } render(); }
  else if (t.id === 'linesChk') { S.data.settings.lines = t.checked; flushData(); render(); }
  else if (t.id === 'upDate') { S.up.date = validDate(t.value) ? t.value : S.up.date; const box = $('#upResult'); if (box) box.innerHTML = upResultHTML(); }
  else if (t.id === 'upFile') readUpload(t.files && t.files[0]);
  else if (t.id === 'importFile') importData(t.files && t.files[0]);
  else if (t.id === 'setGoal') updateSettings({ goal: Number(t.value) });
  else if (t.id === 'setDayStart') updateSettings({ dayStart: Number(t.value) });
  else if (t.id === 'setLines') updateSettings({ lines: Number(t.value) === 1 });
});
let parseTimer = null;
document.addEventListener('input', (e) => {
  if (e.target.id === 'upText') { S.up.text = e.target.value; S.up.fileName = ''; clearTimeout(parseTimer); parseTimer = setTimeout(runParse, 250); }
});
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) go(b.dataset.tab); });
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1), m = v.match(/^s=([\w-]+)$/);
  if (m && S.sById[m[1]] && !(S.view === 'session' && S.sid === m[1])) openSession(m[1], 1);
  else if (['today', 'plan', 'records', 'settings'].includes(v) && v !== S.view) { S.view = v; render(); }
});
document.addEventListener('pointerover', (e) => { const c = e.target.closest && e.target.closest('circle.pt'); if (c) showChartTip(c.dataset.id); });
document.addEventListener('focusin', (e) => { const c = e.target; if (c.matches && c.matches('circle.pt')) showChartTip(c.dataset.id); });
document.addEventListener('keydown', (e) => { const t = e.target; if (t && t.matches && t.matches('circle.pt') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showChartTip(t.dataset.id); } });
document.addEventListener('click', (e) => { const c = e.target.closest && e.target.closest('circle.pt'); if (c) showChartTip(c.dataset.id); });
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if ((S.view === 'today' || S.view === 'records') && Math.abs(chartW() - lastChartW) > 24) render(); }, 200);
});

function showChartTip(id) {
  const tip = $('#chartTip'); if (!tip) return;
  const r = S.data.records.find((x) => x.id === id); if (!r) return;
  const sess = S.sById[r.session];
  tip.innerHTML = '<b>' + esc(mdLabel(r.date)) + '</b> ' + subjChip(r.s) + ' ' + esc(sess ? sessTitle(sess) : r.session) + ' <b>' + fmtNum(r.score) + '점</b> <button class="btn sm" data-act="viewrec" data-id="' + esc(r.id) + '">결과</button>';
}
function updateSettings(patch) {
  S.data.settings = normalizeSettings(Object.assign({}, S.data.settings, patch));
  flushData(); render();
}
function readUpload(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { S.up.text = String(reader.result || ''); S.up.fileName = file.name; render(); runParse(); };
  reader.onerror = () => toast('파일을 읽지 못했어요.');
  reader.readAsText(file);
}
function exportData() {
  const payload = { app: 'daily-test', v: 1, exportedAt: new Date().toISOString(), data: S.data };
  download('daily-test-backup-' + today() + '.json', JSON.stringify(payload, null, 1), 'application/json');
}
function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const p = JSON.parse(String(reader.result));
      const data = p && p.data ? p.data : p;
      if (!data || !Array.isArray(data.records)) throw new Error('형식이 맞지 않아요');
      const have = new Set(S.data.records.map((r) => r.id));
      const add = data.records.map(normalizeRecord).filter((r) => r && !have.has(r.id));
      if (!confirm('백업에서 시험 기록 ' + add.length + '개를 합칩니다(이미 있는 기록은 그대로 둬요). 계속할까요?')) return;
      S.data.records = S.data.records.concat(add).sort(recOrder);
      flushData(); toast('기록 ' + add.length + '개를 불러왔어요.'); render();
    } catch (err) { toast('불러오지 못했어요: ' + err.message); }
  };
  reader.readAsText(file);
}

// ==========================================================================
// 시작
// ==========================================================================
async function init() {
  const app = $('#app');
  try {
    const res = await fetch(BANK_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const bank = await res.json();
    if (bank.v !== 2) throw new Error('문제 은행 형식이 달라요(v' + bank.v + ')');
    indexBank(bank);
  } catch (err) {
    app.innerHTML = '<div class="card"><div class="msg bad">문제 은행을 불러오지 못했어요 (' + esc(err.message) + '). 네트워크를 확인하고 다시 시도해 주세요.</div><button class="btn primary" style="margin-top:10px" onclick="location.reload()">다시 시도</button></div>';
    return;
  }
  S.data = loadData();
  const h = location.hash.slice(1);
  const m = h.match(/^s=([\w-]+)$/);
  if (m && S.sById[m[1]]) { S.sid = m[1]; S.step = 1; S.sdate = today(); S.view = 'session'; }
  else S.view = ['today', 'plan', 'records', 'settings'].includes(h) ? h : 'today';
  writeSummary();
  render();
}

// 테스트·점검용(로컬 개발 호스트에서는 오늘 날짜도 바꿔 볼 수 있다)
window.DailyTest = {
  get state() { return S; },
  parseResult, buildPrompt, paperHTML, mdToHtml, streakInfo, stats, projection, nextSession, doneCounts, saveParsed, normalizeRecord, problemStats, weakTags, sessTitle, sessScope, sessMinutes,
  save: flushData, render, go, openSession, today, addDays, dstr, normalizeSettings, subjectOn,
  setToday(s) { if (DEV_HOST) { todayOverride = s || null; render(); } },
  reload() { S.data = loadData(); render(); },
  ready: null,
};
window.DailyTest.ready = init();
})();
</script>
