<style>
  :root{ color-scheme:light; --bg:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e6e6; --link:#1a56db; --btn:#fff; --hl:#ffe45c; --note:#fff5da; --note-line:#ebcb7a; --note-ink:#8a4b00; }
  *{ box-sizing:border-box; }
  body{ background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; max-width:64rem; margin:0 auto; padding:2rem 16px 4rem; line-height:1.6; }
  h1{ font-size:1.4rem; margin:0 0 .25rem; }
  .sub{ color:var(--muted); margin:0; }
  .bar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.75rem 1rem; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:.8rem 0; margin:1.25rem 0 1rem; }
  .bar .meta{ color:var(--muted); font-size:.85rem; }
  .act{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .act a, .act button{ font:inherit; font-size:.85rem; padding:.3rem .7rem; border:1px solid #d4d4d4; border-radius:6px; background:var(--btn); color:var(--ink); text-decoration:none; cursor:pointer; }
  .act a:hover, .act button:hover{ background:#f5f5f5; }
  .act a.solve{ border-color:var(--link); color:var(--link); }
  .legend{ display:flex; flex-wrap:wrap; gap:.5rem 1.25rem; font-size:.85rem; color:var(--muted); margin:0 0 1.5rem; }
  .legend mark{ background:var(--hl); color:var(--ink); font-weight:600; padding:0 .2rem; }
  .legend .card{ background:var(--note); border:1px solid var(--note-line); border-radius:5px; color:var(--note-ink); font-weight:600; padding:0 .4rem; }
  ol{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:1.25rem; }
  figure{ margin:0; }
  figure img{ display:block; width:100%; height:auto; aspect-ratio:16/9; border:1px solid var(--line); border-radius:6px; background:#fafafa; }
  figcaption{ font-size:.8rem; color:var(--muted); margin-top:.3rem; }
  .back{ display:inline-block; margin-top:2rem; font-size:.85rem; color:var(--link); text-decoration:none; }
  #pf{ position:fixed; width:0; height:0; border:0; visibility:hidden; }

<iframe id="pf" title="print" aria-hidden="true"></iframe>
<script>
  // 숨은 iframe 에 PDF 를 불러와 그 창의 print() 를 부른다. 막히는 환경(iOS·일부 모바일)은 새 탭으로 연다.
  const pf = document.getElementById('pf');
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  document.querySelectorAll('button[data-pdf]').forEach(b => b.addEventListener('click', () => {
    const url = b.dataset.pdf;
    if (mobile) { window.open(url, '_blank'); return; }
    pf.onload = () => {
      setTimeout(() => {
        try { pf.contentWindow.focus(); pf.contentWindow.print(); }
        catch (e) { window.open(url, '_blank'); }
      }, 300);
    };
    pf.src = url + (pf.src.endsWith(url) ? '#' + Date.now() : '');
  }));
</script>
