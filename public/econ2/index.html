<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Econ2 Exam2 TA Session</title>
<!--
  Econ2 Exam2 TA Session — PDF 를 바로 보고, PPT(원본 _v4.pptx)는 내려받는다.
  파일을 바꾸면 같은 이름(econ2-exam2-ta-session.pdf / .pptx)으로 덮어쓰고 커밋·푸시만 하면 된다.
-->
<style>
  :root { color-scheme: light; --fg: #111; --muted: #666; --line: #d8d8d8; --bg: #fafafa; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
    padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fff;
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: 0.01em; }
  h1 small { display: block; margin-top: 2px; font-size: 0.72rem; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--fg);
    font-size: 0.85rem; font-weight: 600; color: var(--fg); text-decoration: none; white-space: nowrap; background: #fff;
  }
  .btn:hover, .btn:focus-visible { background: var(--fg); color: #fff; outline: none; }
  .btn.primary { background: var(--fg); color: #fff; }
  .btn.primary:hover, .btn.primary:focus-visible { background: #fff; color: var(--fg); }
  main { flex: 1; min-height: 0; }
  iframe { display: block; width: 100%; height: 100%; min-height: 70vh; border: 0; background: #e9e9e9; }
  .home { font-size: 0.78rem; color: var(--muted); text-decoration: none; }
  .home:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>Econ2 Exam2 TA Session<small><a class="home" href="/">← peripheral7</a></small></h1>
  <div class="actions">
    <a class="btn primary" href="/econ2/econ2-exam2-ta-session.pptx" download="Econ2 Exam2 TA Session_v4.pptx">PPT 다운로드 (1.3MB)</a>
    <a class="btn" href="/econ2/econ2-exam2-ta-session.pdf" target="_blank" rel="noopener">PDF 새 창으로 열기</a>
  </div>
</header>
<main>
  <iframe src="/econ2/econ2-exam2-ta-session.pdf#view=FitH" title="Econ2 Exam2 TA Session PDF"></iframe>
</main>
</body>
</html>
