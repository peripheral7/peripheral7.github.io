<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Econ 2 Exam 3 · 계산기와 정리표</title>
<!--
  Econ 2 Exam 3 도구 — 필립스곡선·희생률 계산기(Ch35), 실질환율·PPP 계산기와 NX·NCO 거래 분류(Ch31), 정책·사건별 방향 요약표(Ch32).
  예전 Econoland(Artifact) 복습 탭의 도구를 옮긴 것. 한국어 기본, 영어는 오른쪽 위 단추(언어 선택은 덱·그래프와 같은 'slides.lang' 에 저장, ?lang=en|ko 로도 고른다).
-->
<style>
  @font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:local("Pretendard Variable"),url("/fonts/PretendardVariable.woff2") format("woff2-variations")}
  :root{--ink:#1f2537;--soft:#5b6170;--line:#d8dbe0;--tint:#f3f6fb;--blue:#1f6fd1;--up:#d6322b;--down:#1f6fd1;--good:#1d7348;--bad:#c8352e}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  html[lang=ko] body{word-break:keep-all}
  main{max-width:1000px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 56px}
  .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
  .eyebrow{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
  .lang{margin-left:auto;border:2px solid var(--ink);border-radius:8px;background:#fff;font:inherit;font-weight:700;font-size:14px;padding:4px 12px;cursor:pointer}
  h1{margin:6px 0 8px;font-size:36px;line-height:1.15;letter-spacing:-.01em}
  .lead{margin:0 0 8px;max-width:680px;font-size:17px;line-height:1.55;color:var(--soft)}
  .links{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 8px;font-size:15px}
  .links a{color:var(--blue)}
  section.ch{margin-top:30px;padding-top:16px;border-top:3px solid var(--ink)}
  section.ch>h2{margin:0 0 4px;font-size:24px}
  section.ch>h2 small{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--blue)}
  .card{margin-top:14px;padding:16px 18px;border:2px solid var(--ink);border-radius:12px}
  .card h3{margin:0 0 10px;font-size:18px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,340px);gap:18px;align-items:start}
  .rg{display:grid;grid-template-columns:9.5em minmax(0,1fr) 4.4em;align-items:center;gap:8px;margin:0 0 8px;font-size:15px}
  .rg input{width:100%;accent-color:var(--blue)}
  .rg output{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .out{margin-top:6px;font-size:16px;line-height:1.7}
  .big{font-size:24px;font-weight:800;color:var(--blue)}
  .sep{margin:16px 0 10px;border:0;border-top:1px solid var(--line)}
  svg.pc{width:100%;height:auto;overflow:visible}
  svg.pc text{font-family:inherit}
  .nin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
  .nin label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft)}
  .nin input{height:38px;border:2px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:16px;color:var(--ink);min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:2px solid var(--line);border-radius:999px;background:#fff;padding:5px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .chip:hover{border-color:var(--ink)}
  .chip.on{border-color:var(--blue);color:var(--blue);background:var(--tint)}
  .chip.right{border-color:var(--good);color:var(--good);background:#eef7f1}
  .chip.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
  .srow{padding:10px 0;border-top:1px solid var(--line)}
  .srow:first-of-type{border-top:0}
  .srow p{margin:0 0 6px;font-size:16px}
  .fb{margin:6px 0 0;font-size:14.5px}
  .fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
  .tbl{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:center;white-space:nowrap}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  th{color:var(--soft);font-weight:700}
  td.v{font-weight:800}
  td.v.up{color:var(--up)} td.v.dn{color:var(--down)}
  table.hide td.v:not(.show){color:transparent!important;background:var(--tint);cursor:pointer}
  .chk{display:inline-flex;gap:8px;align-items:center;font-size:14.5px;margin-bottom:8px;cursor:pointer}
  .note{margin:8px 0 0;font-size:14px;color:var(--soft);line-height:1.55}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  td small.sub{display:none}
  @media (max-width:720px){h1{font-size:28px}.grid2{grid-template-columns:minmax(0,1fr)}.nin{grid-template-columns:minmax(0,1fr)}.rg{grid-template-columns:7.5em minmax(0,1fr) 4em}}
  @media (max-width:560px){th:nth-child(2),td:nth-child(2){display:none}td:first-child{white-space:normal;min-width:8em}td small.sub{display:block;margin-top:2px;font-size:12.5px;color:var(--soft)}th,td{padding:8px 5px}}
</style>
</head>
<body>
<main>
  <div class="top"><p class="eyebrow">Econ 2 · Exam 3</p><button type="button" class="lang" id="lang"></button></div>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <p class="links" id="links"></p>

  <section class="ch" id="ch35">
    <h2><small>CH 35</small><span data-t="h35"></span></h2>
    <div class="card"><div class="grid2"><div>
      <h3 data-t="pcH"></h3>
      <label class="rg"><span data-t="un"></span><input type="range" id="r-un" min="3" max="8" step="0.5" value="5"><output id="o-un"></output></label>
      <label class="rg"><span data-t="pe"></span><input type="range" id="r-pe" min="0" max="8" step="0.5" value="3"><output id="o-pe"></output></label>
      <label class="rg"><span>a</span><input type="range" id="r-a" min="0.25" max="1" step="0.25" value="0.5"><output id="o-a"></output></label>
      <label class="rg"><span data-t="pi"></span><input type="range" id="r-pi" min="0" max="10" step="0.5" value="3"><output id="o-pi"></output></label>
      <div class="out" id="pc-out"></div>
    </div><svg class="pc" id="pc-svg" viewBox="0 0 320 260" role="img" aria-label="Phillips curve"></svg></div>
    <hr class="sep">
      <h3 data-t="srH"></h3>
      <label class="rg"><span data-t="sr"></span><input type="range" id="r-sr" min="1" max="8" step="0.5" value="5"><output id="o-sr"></output></label>
      <label class="rg"><span data-t="p0"></span><input type="range" id="r-p0" min="1" max="15" step="0.5" value="10"><output id="o-p0"></output></label>
      <label class="rg"><span data-t="p1"></span><input type="range" id="r-p1" min="0" max="10" step="0.5" value="4"><output id="o-p1"></output></label>
      <label class="rg"><span data-t="yr"></span><input type="range" id="r-yr" min="1" max="5" step="1" value="1"><output id="o-yr"></output></label>
      <div class="out" id="sr-out"></div>
    </div>
  </section>

  <section class="ch" id="ch31">
    <h2><small>CH 31</small><span data-t="h31"></span></h2>
    <div class="card">
      <h3 data-t="rerH"></h3>
      <div class="chips" id="pre"></div>
      <div class="nin">
        <label><span data-t="tE"></span><input type="number" id="n-e" step="any" min="0"></label>
        <label><span data-t="tP"></span><input type="number" id="n-P" step="any" min="0"></label>
        <label><span data-t="tPs"></span><input type="number" id="n-Ps" step="any" min="0"></label>
      </div>
      <div class="out" id="rer-out"></div>
    </div>
    <div class="card">
      <h3 data-t="sortH"></h3>
      <div id="sort"></div>
    </div>
  </section>

  <section class="ch" id="ch32">
    <h2><small>CH 32</small><span data-t="h32"></span></h2>
    <div class="card">
      <h3 data-t="polH"></h3>
      <label class="chk"><input type="checkbox" id="pol-hide"> <span data-t="hide"></span></label>
      <div class="tbl"><table id="pol"></table></div>
      <p class="note" data-t="polNote"></p>
    </div>
  </section>
</main>

    [['수입 할당 · 관세', 'Import quota or tariff'], ['외환 수요(NX) 오른쪽', 'Currency demand (NX) right'], '0', '0', '0', '+', '0'],
    [['해외에서 한국 상품 인기', 'Foreigners like our goods'], ['외환 수요(NX) 오른쪽', 'Currency demand (NX) right'], '0', '0', '0', '+', '0'],
    [['자본 도피', 'Capital flight'], ['NCO 곡선 오른쪽', 'NCO curve right'], '+', '-', '+', '-', '+']
  ];

  function rg(id) { return +$('#r-' + id).value; }
  function pc() {
    var un = rg('un'), pe = rg('pe'), a = rg('a'), pi = rg('pi'), u = un - a * (pi - pe);
    ['un', 'pe', 'pi', 'p0', 'p1'].forEach(function (k) { $('#o-' + k).textContent = rg(k).toFixed(1) + '%'; });
    ['a', 'sr', 'yr'].forEach(function (k) { $('#o-' + k).textContent = String(rg(k)); });
    $('#pc-out').innerHTML = 'u = ' + un.toFixed(1) + ' − ' + a + ' × (' + pi.toFixed(1) + ' − ' + pe.toFixed(1) + ') = <span class="big">' + u.toFixed(2) + '%</span><br>' + esc(L(pi > pe + 1e-9 ? T.pcHi : pi < pe - 1e-9 ? T.pcLo : T.pcEq));
    var W = 320, H = 260, m = { l: 40, r: 18, t: 22, b: 34 }, X = function (v) { return m.l + v / 12 * (W - m.l - m.r); }, Y = function (v) { return H - m.b - v / 12 * (H - m.t - m.b); };
    var pts = []; for (var x = 0; x <= 12.001; x += 0.1) { var p = pe - (x - un) / a; if (p >= 0 && p <= 12) pts.push([X(x).toFixed(1), Y(p).toFixed(1)]); }
    var lp = pts[Math.max(0, Math.floor(pts.length * 0.9) - 1)], inb = u >= 0 && u <= 12 && pi >= 0 && pi <= 12;
    var s = '<path d="M' + m.l + ',' + (H - m.b) + ' L' + (W - m.r + 6) + ',' + (H - m.b) + ' M' + m.l + ',' + (H - m.b) + ' L' + m.l + ',' + (m.t - 10) + '" fill="none" stroke="#1f2537" stroke-width="1.6"/>' +
      '<text x="' + (W - m.r + 6) + '" y="' + (H - m.b + 28) + '" text-anchor="end" font-size="12" fill="#5b6170">u (%)</text><text x="' + (m.l + 6) + '" y="' + (m.t - 8) + '" font-size="12" fill="#5b6170">π (%)</text>';
    [0, 4, 8, 12].forEach(function (v) { s += '<text x="' + X(v) + '" y="' + (H - m.b + 15) + '" text-anchor="middle" font-size="11" fill="#5b6170">' + v + '</text>' + (v ? '<text x="' + (m.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="#5b6170">' + v + '</text>' : ''); });
    s += '<line x1="' + X(un) + '" x2="' + X(un) + '" y1="' + Y(0) + '" y2="' + Y(12) + '" stroke="#1f2537" stroke-width="2.4"/><text x="' + (X(un) + 5) + '" y="' + (Y(12) + 12) + '" font-size="13" font-weight="700" fill="#1f2537">LRPC</text>';
    if (pts.length > 1) s += '<path d="M' + pts.map(function (q) { return q.join(','); }).join(' L') + '" fill="none" stroke="#1f6fd1" stroke-width="3"/><text x="' + (+lp[0] + 8) + '" y="' + (+lp[1] - 4) + '" font-size="13" font-weight="700" fill="#1f6fd1">SRPC</text>';
    if (inb) s += '<path d="M' + m.l + ',' + Y(pi) + ' H' + X(u) + ' V' + Y(0) + '" fill="none" stroke="#8d93a0" stroke-dasharray="4 4"/><circle cx="' + X(u) + '" cy="' + Y(pi) + '" r="6" fill="#1f6fd1" stroke="#fff" stroke-width="2"/>';
    $('#pc-svg').innerHTML = s;
    var sr = rg('sr'), p0 = rg('p0'), p1 = rg('p1'), yr = rg('yr'), d = p0 - p1;
    $('#sr-out').innerHTML = d <= 0 ? esc(L(T.srNone)) : sr + ' × (' + p0.toFixed(1) + ' − ' + p1.toFixed(1) + ') = <span class="big">' + (sr * d).toFixed(1) + '%</span> ' + esc(L(T.srUnit)) + (yr > 1 ? '<br>' + esc(L(T.srSpread).replace('{y}', yr).replace('{v}', (sr * d / yr).toFixed(1))) : '');
  }
  function rer() {
    var e = parseFloat($('#n-e').value), P = parseFloat($('#n-P').value), Ps = parseFloat($('#n-Ps').value), out = $('#rer-out');
    if (!(e > 0 && P > 0 && Ps > 0)) { out.textContent = L(T.rerBad); return; }
    var eP = e * P, eps = eP / Ps, ppp = Ps / P;
    out.innerHTML = esc(L(T.rerEP)) + ': e × P = ' + nf(e) + ' × ' + nf(P) + ' = <b>' + nf(eP) + '</b><br>' + esc(L(T.rerEps)) + ': ε = ' + nf(eP) + ' ÷ ' + nf(Ps) + ' = <span class="big">' + eps.toFixed(2) + '</span><br>' +
      esc(L(eps > 1.02 ? T.rerHi : eps < 0.98 ? T.rerLo : T.rerEq).replace('{x}', eps.toFixed(2))) + '<br>' + esc(L(T.rerPPP)) + ': e = P* ÷ P = <b>' + nf(ppp) + '</b> · ' + esc(L(e > ppp * 1.02 ? T.rerOver : e < ppp * 0.98 ? T.rerUnder : T.rerFair)) +
      '<br><span style="color:#5b6170">1 ÷ e = ' + nf(1 / e) + ' ' + esc(L(T.rerInv)) + '</span>';
  }
  function setPre(i) { var p = PRE[i]; $('#n-e').value = p.e; $('#n-P').value = p.P; $('#n-Ps').value = p.Ps; $$('#pre .chip').forEach(function (b, k) { b.classList.toggle('on', k === i); }); rer(); }
  function render() {
    document.documentElement.lang = LANG;
    $('#lang').textContent = L(T.lang); $('#h1').textContent = L(T.h1); $('#lead').textContent = L(T.lead);
    $('#links').innerHTML = (LANG === 'en' ? T.linksEn : T.links).map(function (x) { return '<a href="' + x[1] + '">' + esc(x[0]) + ' →</a>'; }).join('');
    $$('[data-t]').forEach(function (n) { n.textContent = L(T[n.getAttribute('data-t')]); });
    $('#pre').innerHTML = PRE.map(function (p, i) { return '<button type="button" class="chip">' + esc(L(p.n)) + '</button>'; }).join('');
    $$('#pre .chip').forEach(function (b, i) { b.addEventListener('click', function () { setPre(i); }); });
    $('#sort').innerHTML = SORT.map(function (s, i) { return '<div class="srow" data-i="' + i + '"><p>' + (i + 1) + '. ' + esc(L(s.t)) + '</p><div class="chips">' + OPT.map(function (o) { return '<button type="button" class="chip" data-k="' + o[0] + '">' + esc(L(o[1])) + '</button>'; }).join('') + '</div><p class="fb" hidden></p></div>'; }).join('');
    $$('#sort .srow').forEach(function (r) {
      var s = SORT[+r.getAttribute('data-i')];
      $$('.chip', r).forEach(function (b) { b.addEventListener('click', function () {
        var ok = b.getAttribute('data-k') === s.a;
        $$('.chip', r).forEach(function (x) { x.classList.toggle('right', x.getAttribute('data-k') === s.a); x.classList.toggle('wrong', x === b && !ok); });
        var fb = $('.fb', r); fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'bad'); fb.textContent = L(ok ? T.right : T.wrong) + ' ' + L(s.x);
      }); });
    });
    var cell = function (d) { return '<td class="v ' + (d === '+' ? 'up' : d === '-' ? 'dn' : '') + '">' + (d === '+' ? '↑' : d === '-' ? '↓' : '–') + '</td>'; };
    $('#pol').innerHTML = '<thead><tr><th>' + esc(L(T.polEv)) + '</th><th>' + esc(L(T.polFirst)) + '</th><th>r</th><th>I</th><th>NCO</th><th>E</th><th>NX</th></tr></thead><tbody>' +
      POL.map(function (p) { return '<tr><td>' + esc(L(p[0])) + '<small class="sub">' + esc(L(p[1])) + '</small></td><td>' + esc(L(p[1])) + '</td>' + p.slice(2).map(cell).join('') + '</tr>'; }).join('') + '</tbody>';
    $('#pol').classList.toggle('hide', $('#pol-hide').checked);
    $$('#pol td.v').forEach(function (c) { c.addEventListener('click', function () { c.classList.add('show'); }); });
    pc(); if (!$('#n-e').value) setPre(0); else rer();
  }
  $$('input[type=range]').forEach(function (i) { i.addEventListener('input', pc); });
  $$('.nin input').forEach(function (i) { i.addEventListener('input', function () { $$('#pre .chip').forEach(function (b) { b.classList.remove('on'); }); rer(); }); });
  $('#pol-hide').addEventListener('change', function (e) { $('#pol').classList.toggle('hide', e.target.checked); $$('#pol td.v').forEach(function (c) { c.classList.remove('show'); }); });
  $('#lang').addEventListener('click', function () { LANG = LANG === 'en' ? 'ko' : 'en'; try { localStorage.setItem(KEY, LANG); } catch (e) {} render(); });
  render();
})();
</script>
</body>
