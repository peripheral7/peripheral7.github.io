<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Econ 2 Exam 3 Quiz</title>
<!--
  Econ 2 Exam 3 퀴즈 — scripts/econ2-exam3/build.mjs 가 이 틀(scripts/econ2-exam3/quiz-page.html)에 review-data.json 의 객관식 · 거래 분류를 넣어
  public/econ2/exam3/quiz.html 로 만든다. 이 사본을 직접 고치지 말고 틀이나 데이터를 고쳐 다시 만든다.
  고르면 바로 맞음 · 틀림과 풀이가 나온다(점수는 처음 고른 답으로). 기본 영어, 오른쪽 위 단추로 한국어(?lang=ko 로도 열림).
  정책 · 사건별 방향표는 처음에 모두 가려 두고, 「Show answers」 또는 칸을 눌러 본다.
-->
<style>
  @font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:local("Pretendard Variable"),url("/fonts/PretendardVariable.woff2") format("woff2-variations")}
  :root{--ink:#1f2537;--soft:#5b6170;--line:#d8dbe0;--tint:#f3f6fb;--blue:#1f6fd1;--up:#d6322b;--down:#1f6fd1;--good:#1d7348;--bad:#c8352e}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  html[lang=ko] body{word-break:keep-all}
  main{max-width:900px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 64px}
  .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
  .eyebrow{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
  .lang{margin-left:auto;border:2px solid var(--ink);border-radius:8px;background:#fff;font:inherit;font-weight:700;font-size:14px;padding:4px 12px;cursor:pointer}
  h1{margin:6px 0 8px;font-size:36px;line-height:1.15;letter-spacing:-.01em}
  .lead{margin:0 0 8px;max-width:680px;font-size:17px;line-height:1.55;color:var(--soft)}
  .links{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 4px;font-size:15px}
  .links a{color:var(--blue)}
  .score{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:10px 0;border-bottom:1px solid var(--line);background:#fff;font-size:15px;font-weight:600}
  .score b{font-variant-numeric:tabular-nums}
  .score button{margin-left:auto;border:1.5px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:14px;padding:4px 12px;cursor:pointer}
  section.ch{margin-top:30px;padding-top:16px;border-top:2px solid var(--ink)}
  section.ch>h2{margin:0 0 4px;font-size:24px}
  section.ch>h2 small{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--blue)}
  .card{margin-top:14px;padding:6px 18px 10px;border:2px solid var(--ink);border-radius:12px}
  .card>h3{margin:10px 0 2px;font-size:18px}
  .card>.sub{margin:0 0 4px;font-size:14px;color:var(--soft)}
  .row{padding:14px 0;border-top:1px solid var(--line)}
  .card>h3+.row,.card>.sub+.row{border-top:0}
  .row>p.q{margin:0 0 8px;font-size:16.5px;line-height:1.55}
  .row>p.q .src{margin-left:6px;font-size:12.5px;font-weight:700;color:var(--soft)}
  .opts{display:flex;flex-direction:column;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .opt,.chip{border:2px solid var(--line);background:#fff;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
  .opt{display:flex;gap:8px;border-radius:10px;padding:7px 12px;font-size:15.5px;line-height:1.45}
  .opt i{font-style:normal;font-weight:700;color:var(--soft)}
  .chip{border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
  .opt:hover,.chip:hover{border-color:var(--ink)}
  .opt.right,.chip.right{border-color:var(--good);color:var(--good);background:#eef7f1}
  .opt.wrong,.chip.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
  .fb{margin:8px 0 0;font-size:14.5px;line-height:1.55}
  .fb b{margin-right:4px}
  .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
  .fb ol{margin:4px 0 0;padding-left:1.3em;color:var(--soft)}
  .tblbar{display:flex;align-items:center;gap:12px;margin:6px 0 8px;font-size:14px;color:var(--soft)}
  .tblbar button{border:2px solid var(--ink);border-radius:8px;background:#fff;font:inherit;font-weight:700;font-size:14px;color:var(--ink);padding:4px 12px;cursor:pointer}
  .tbl{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:center;white-space:nowrap}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  th{color:var(--soft);font-weight:700}
  td.v{font-weight:800}
  td.v.up{color:var(--up)} td.v.dn{color:var(--down)}
  table.hide td.v:not(.show){color:transparent!important;background:var(--tint);cursor:pointer}
  td small.sub{display:none}
  .note{margin:8px 0 6px;font-size:14px;color:var(--soft);line-height:1.55}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media (max-width:720px){h1{font-size:28px}}
  @media (max-width:560px){th:nth-child(2),td:nth-child(2){display:none}td:first-child{white-space:normal;min-width:8em}td small.sub{display:block;margin-top:2px;font-size:12.5px;color:var(--soft)}th,td{padding:8px 5px}}
</style>
</head>
<body>
<main>
  <div class="top"><p class="eyebrow">Econ 2 · Exam 3</p><button type="button" class="lang" id="lang"></button></div>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <p class="links" id="links"></p>
  <div class="score"><span id="score"></span><button type="button" id="reset"></button></div>
  <div id="quiz"></div>
</main>
<script>
const DATA = {"ch":[{"n":35,"short":["필립스곡선","Phillips curve"],"mc":[{"id":"35-1","src":["MC 3 유형","Like MC 3"],"q":["올해 AD–AS 균형의 물가수준은 157.5이고, 필립스곡선에서 이에 대응하는 점의 인플레이션율은 5%다. 작년 물가수준은?","This year’s AD–AS equilibrium has a price level of 157.5, and the matching point on the Phillips curve shows 5% inflation. What was last year’s price level?"],"opts":[["150","150"],["152.5","152.5"],["157.5","157.5"],["165.4","165.4"]],"ans":0,"sol":[["인플레이션율 = (올해 P − 작년 P) ÷ 작년 P","Inflation = (this year’s P − last year’s P) ÷ last year’s P"],["157.5 ÷ 1.05 = 150","157.5 ÷ 1.05 = 150"],["검산: (157.5 − 150) ÷ 150 = 5%","Check: (157.5 − 150) ÷ 150 = 5%"]],"trap":["152.5는 퍼센트를 물가 단위로 뺀 값이고, 165.4는 내년 물가다.","152.5 subtracts a percentage as if it were index points; 165.4 is next year’s level."]},{"id":"35-3","src":["MC 8 유형","Like MC 8"],"q":["정부가 단기 상충관계를 이용해 실업률을 자연실업률 아래로 계속 유지하려고 통화를 빠르게 늘린다. 장기 결과는?","The government keeps expanding money fast to hold unemployment below its natural rate. What happens in the long run?"],"opts":[["인플레이션↑, 실업률↓","Higher inflation, lower unemployment"],["인플레이션↑, 실업률은 자연실업률","Higher inflation, unemployment at the natural rate"],["인플레이션 그대로, 실업률↓","Same inflation, lower unemployment"],["인플레이션↑, 실업률↑","Higher inflation, higher unemployment"]],"ans":1,"sol":[["단기: π > πᵉ라서 u \u003c u* (SRPC 위 이동)","Short run: π > πᵉ, so u \u003c u* (along the SRPC)"],["기대가 따라잡으면 πᵉ↑ → SRPC 위로 이동","Expectations catch up: πᵉ rises and the SRPC shifts up"],["장기: u = u*로 복귀, 인플레이션만 높아진다 (LRPC 수직)","Long run: u returns to u* and only inflation is higher (vertical LRPC)"]],"trap":["a는 단기 답이다. 문제에 “장기”가 있으면 수직인 LRPC부터 떠올린다.","(a) is the short-run answer. When a question says “long run,” start from the vertical LRPC."]},{"id":"35-4","src":["MC 10 유형","Like MC 10"],"q":["정부가 실업급여 지급 기간을 줄여 구직 유인을 높이고, 동시에 통화증가율을 낮춘다. 장기에 실업률과 인플레이션율은?","The government shortens unemployment-benefit duration and at the same time slows money growth. In the long run, unemployment and inflation are"],"opts":[["둘 다 높아진다","both higher"],["실업률↑, 인플레이션↓","unemployment higher, inflation lower"],["둘 다 낮아진다","both lower"],["실업률↓, 인플레이션↑","unemployment lower, inflation higher"]],"ans":2,"sol":[["실업급여 축소 → 마찰적 실업↓ → 자연실업률 u*↓ → LRPC 왼쪽","Shorter benefits → less frictional unemployment → lower u* → LRPC shifts left"],["통화증가율↓ → 장기 인플레이션↓","Slower money growth → lower long-run inflation"],["장기 u = u*(낮아짐), 장기 π는 통화증가율을 따른다(낮아짐)","Long-run u = u* (lower); long-run π follows money growth (lower)"]],"trap":["장기에는 두 변수가 서로 다른 원인으로 정해진다. 통화정책은 장기 실업률을 바꾸지 못한다.","In the long run the two are set by different forces; monetary policy cannot move long-run unemployment."]},{"id":"35-5","src":["MC 11 유형","Like MC 11"],"q":["실업률이 자연실업률보다 높은 상태다. 장기 균형으로 가는 과정은?","Unemployment is above its natural rate. How does the economy get back to long-run equilibrium?"],"opts":[["기대인플레이션↑ → SRPC 오른쪽","Expected inflation rises; SRPC shifts right"],["기대인플레이션↑ → SRPC 왼쪽","Expected inflation rises; SRPC shifts left"],["기대인플레이션↓ → SRPC 오른쪽","Expected inflation falls; SRPC shifts right"],["기대인플레이션↓ → SRPC 왼쪽","Expected inflation falls; SRPC shifts left"]],"ans":3,"sol":[["u > u*이면 π \u003c πᵉ (실제 인플레이션이 기대보다 낮다)","u > u* means π \u003c πᵉ: inflation is below expectations"],["사람들이 기대를 낮춘다 → πᵉ↓","People revise expectations down: πᵉ falls"],["πᵉ↓ → SRPC 아래·왼쪽 → u가 u*으로 돌아온다","Lower πᵉ shifts the SRPC down/left and u returns to u*"]],"trap":["문제집 MC 11은 반대 상황(u \u003c u*)이다. 그때는 πᵉ↑, SRPC 오른쪽이 답이다.","Problem-set MC 11 is the mirror case (u \u003c u*): πᵉ rises and the SRPC shifts right."]},{"id":"35-6","src":["MC 14 유형","Like MC 14"],"q":["불리한 공급 충격 직후 중앙은행이 통화량을 늘려 충격을 수용한다. 충격 직후와 비교한 단기 효과는?","Right after an adverse supply shock the central bank accommodates by expanding money. Compared with just after the shock, in the short run"],"opts":[["실업률↓, 인플레이션↑","unemployment falls, inflation rises"],["실업률↓, 인플레이션↓","both fall"],["실업률↑, 인플레이션↓","unemployment rises, inflation falls"],["실업률↑, 인플레이션↑","unemployment and inflation both rise"]],"ans":0,"sol":[["공급 충격: SRPC가 위·오른쪽 → π↑, u↑ (스태그플레이션)","Supply shock: the SRPC shifts up/right → π and u both rise"],["수용 = 확장 통화정책 → AD↑ → 새 SRPC를 따라 위·왼쪽으로","Accommodation = expansion → AD up → up and left along the new SRPC"],["충격 직후 대비 u↓, π↑. 실업은 원래 수준으로, 인플레이션은 충격 전보다 높아진다","Versus just after the shock: u down, π up. Unemployment returns to normal; inflation ends above its pre-shock level"]],"trap":null},{"id":"35-7","src":["MC 16 유형","Like MC 16"],"q":["수입 원자재 가격이 크게 내렸다(유리한 공급 충격). 단기 필립스곡선은?","Imported raw-material prices drop sharply (a favorable supply shock). The short-run Phillips curve shifts"],"opts":[["오른쪽: 각 인플레이션율에서 실업률이 더 높다","right: unemployment is higher at each inflation rate"],["오른쪽: 각 인플레이션율에서 실업률이 더 낮다","right: unemployment is lower at each inflation rate"],["왼쪽: 각 인플레이션율에서 실업률이 더 낮다","left: unemployment is lower at each inflation rate"],["왼쪽: 각 인플레이션율에서 실업률이 더 높다","left: unemployment is higher at each inflation rate"]],"ans":2,"sol":[["비용↓ → SRAS 오른쪽 → 같은 산출에서 물가↓","Lower costs → SRAS shifts right → lower prices at each output"],["필립스곡선: 같은 u에서 π↓ = 같은 π에서 u↓ → SRPC 아래·왼쪽","On the PC: lower π at each u, i.e. lower u at each π → SRPC shifts down/left"]],"trap":["방향과 설명이 짝이 맞는지 본다. 왼쪽 이동이면 같은 π에서 u는 반드시 더 낮다. 문제집 MC 16은 불리한 충격(오른쪽)이다.","Check that direction and description match: a leftward shift always means lower u at each π. Problem-set MC 16 is the adverse case (right)."]},{"id":"35-8","src":["MC 17 유형","Like MC 17"],"q":["희생률이 4로 추정되는 나라가 인플레이션을 9%에서 3%로 낮추려 한다. 이 희생률은 교과서의 대표 추정치보다 높은가, 낮은가? 잃게 되는 산출은?","A country’s sacrifice ratio is estimated at 4. It wants to cut inflation from 9% to 3%. Is 4 above or below the textbook’s typical estimate, and how much output is lost?"],"opts":[["높다 · 연간 산출의 36%","Higher · 36% of a year’s output"],["낮다 · 연간 산출의 24%","Lower · 24% of a year’s output"],["낮다 · 연간 산출의 36%","Lower · 36% of a year’s output"],["높다 · 연간 산출의 24%","Higher · 24% of a year’s output"]],"ans":1,"sol":[["낮출 인플레이션 = 9 − 3 = 6%p","Inflation to remove = 9 − 3 = 6 points"],["산출 손실 = 4 × 6 = 연간 산출의 24% (3년에 나누면 해마다 8%)","Output lost = 4 × 6 = 24% of a year’s output (8% a year over three years)"],["대표 추정치는 5 → 4는 그보다 낮다","The typical estimate is 5, so 4 is lower"]],"trap":["36%는 낮출 폭이 아니라 처음 인플레이션(9)에 4를 곱한 실수다.","36% multiplies the starting rate (9) instead of the reduction."]},{"id":"35-9","src":["MC 18 유형","Like MC 18"],"q":["합리적 기대 이론의 극단적 경우, 중앙은행이 인플레이션을 낮추겠다고 믿을 만하게 약속하고 사람들이 곧바로 기대를 낮추면 희생률은?","In the extreme rational-expectations case, if the central bank credibly commits to lower inflation and people cut their expectations at once, the sacrifice ratio is"],"opts":[["0","0"],["1","1"],["5","5"],["무한대","infinite"]],"ans":0,"sol":[["πᵉ가 곧바로 내려가면 SRPC가 즉시 아래로 이동","If πᵉ falls immediately, the SRPC shifts down at once"],["실업률이 u*에서 벗어나지 않고 인플레이션만 내려간다 → 잃는 산출 0","Unemployment never leaves u*; only inflation falls, so no output is lost"]],"trap":["실제 볼커 디스인플레이션은 비용이 컸다. “극단적 경우”라는 조건이 답을 정한다.","The actual Volcker disinflation was costly; “extreme case” decides the answer."]}]},{"n":31,"short":["개방경제 기본 개념","Open-economy basics"],"mc":[{"id":"31-1","src":["MC 2 유형","Like MC 2"],"q":["무역흑자가 80억 달러인 나라에서 수출이 25억 달러, 수입이 40억 달러 늘었다. 새 순수출은?","A country with an $8 billion trade surplus sees exports rise by $2.5 billion and imports by $4 billion. Its net exports are now"],"opts":[["15억 달러","$1.5 billion"],["65억 달러","$6.5 billion"],["95억 달러","$9.5 billion"],["145억 달러","$14.5 billion"]],"ans":1,"sol":[["수출 증가는 더하고 수입 증가는 뺀다","Add the rise in exports, subtract the rise in imports"],["NX = 80 + 25 − 40 = 65 (억 달러)","NX = 8 + 2.5 − 4 = 6.5 ($ billion)"]],"trap":["95는 수출과 수입의 부호를 바꾼 값이다.","9.5 swaps the signs of exports and imports."]},{"id":"31-2","src":["MC 5 유형","Like MC 5"],"q":["어느 해 수출 450, 수입 520, 국내투자 900이었다(단위: 조 원). 국민저축은?","One year: exports 450, imports 520, domestic investment 900 (trillion won). National saving was"],"opts":[["70","70"],["380","380"],["830","830"],["970","970"]],"ans":2,"sol":[["NX = 450 − 520 = −70","NX = 450 − 520 = −70"],["NX = NCO이므로 NCO = −70","NX = NCO, so NCO = −70"],["S = I + NCO = 900 + (−70) = 830","S = I + NCO = 900 − 70 = 830"]],"trap":["970은 NCO의 부호를 반대로 넣은 값, 70은 NX(= NCO)의 크기만 적은 값이다. 무역적자면 S \u003c I다.","970 uses the wrong sign for NCO; 70 is just the size of NX (= NCO). With a trade deficit, S \u003c I."]},{"id":"31-3","src":["MC 6 유형","Like MC 6"],"q":["GDP 2,000, 국내투자 400, 정부구매 350, 순자본유출 120이다. 소비는?","GDP is 2,000, investment 400, government purchases 350 and net capital outflow 120. Consumption is"],"opts":[["1,010","1,010"],["1,130","1,130"],["1,250","1,250"],["1,370","1,370"]],"ans":1,"sol":[["NX = NCO = 120","NX = NCO = 120"],["C = Y − I − G − NX = 2,000 − 400 − 350 − 120 = 1,130","C = Y − I − G − NX = 2,000 − 400 − 350 − 120 = 1,130"]],"trap":["1,370은 NX를 빼지 않고 더한 값, 1,250은 NX를 빠뜨린 값이다.","1,370 adds NX instead of subtracting it; 1,250 leaves NX out."]},{"id":"31-4","src":["MC 4 유형","Like MC 4"],"q":["다른 조건이 같을 때 한 나라의 국민저축이 줄면?","Other things equal, if a country saves less,"],"opts":[["NCO↑ → NX↑","NCO rises, so NX rises"],["NCO↑ → NX↓","NCO rises, so NX falls"],["NCO↓ → NX↑","NCO falls, so NX rises"],["NCO↓ → NX↓","NCO falls, so NX falls"]],"ans":3,"sol":[["S = I + NCO에서 I가 그대로면 S↓ → NCO↓","In S = I + NCO with I fixed, lower S means lower NCO"],["NX = NCO → NX↓","NX = NCO, so NX falls too"]],"trap":["문제집 MC 4는 저축 증가(NCO↑ → NX↑)다.","Problem-set MC 4 is a rise in saving (NCO up → NX up)."]},{"id":"31-5","src":["MC 7 유형","Like MC 7"],"q":["원화가 엔화 대비 절상되었다. 교과서 표기의 환율 e(엔/원)와 일본인의 한국 여행 비용(엔화)은?","The won appreciates against the yen. What happens to the textbook exchange rate e (yen per won) and to the yen cost of a trip to Korea?"],"opts":[["e↑, 엔화 비용 증가","e rises; the trip costs more yen"],["e↓, 엔화 비용 증가","e falls; the trip costs more yen"],["e↑, 엔화 비용 감소","e rises; the trip costs fewer yen"],["e↓, 엔화 비용 감소","e falls; the trip costs fewer yen"]],"ans":0,"sol":[["절상 = 원화 1단위로 엔화를 더 많이 살 수 있음 → e↑","Appreciation: each won buys more yen, so e rises"],["일본인은 같은 원화를 사려고 엔화를 더 내야 한다 → 한국 여행이 비싸진다","Japanese visitors need more yen for the same won, so Korea gets dearer"]],"trap":["문제집 MC 7은 반대(달러 절하) 상황이다.","Problem-set MC 7 is the mirror case (a depreciating dollar)."]},{"id":"31-6","src":["MC 8·12 유형","Like MC 8 and 12"],"q":["e = 150엔/달러이고 빅맥이 미국에서 5달러, 일본에서 600엔이다. 미국 기준 실질환율과 이익이 나는 차익거래는?","e = ¥150 per dollar; a Big Mac costs $5 in the U.S. and ¥600 in Japan. What is the U.S. real exchange rate, and which arbitrage is profitable?"],"opts":[["1.25 · 미국에서 사서 일본에서 판다","1.25 · buy in the U.S., sell in Japan"],["1.25 · 일본에서 사서 미국에서 판다","1.25 · buy in Japan, sell in the U.S."],["0.8 · 미국에서 사서 일본에서 판다","0.8 · buy in the U.S., sell in Japan"],["0.8 · 일본에서 사서 미국에서 판다","0.8 · buy in Japan, sell in the U.S."]],"ans":1,"sol":[["미국 빅맥의 엔화 가격 = e × P = 150 × 5 = 750엔","U.S. Big Mac in yen: e × P = 150 × 5 = ¥750"],["ε = 750 / 600 = 1.25 → 미국 빅맥 1개 = 일본 빅맥 1.25개","ε = 750 / 600 = 1.25: one U.S. Big Mac trades for 1.25 Japanese ones"],["미국이 더 비싸므로 싼 일본에서 사서 비싼 미국에서 판다","The U.S. is dearer, so buy in Japan and sell in the U.S."]],"trap":["0.8은 P* / (e × P)로 거꾸로 나눈 값이다.","0.8 divides the wrong way round."]},{"id":"31-7","src":["MC 15 유형","Like MC 15"],"q":["빅맥이 미국에서 5달러, 유로 지역에서 4.5유로, 한국에서 6,500원이다. 환율은 0.9유로/달러, 1,400원/달러다. PPP가 성립하는 곳은?","A Big Mac costs $5 in the U.S., €4.50 in the euro area and ₩6,500 in Korea. Exchange rates are €0.90 and ₩1,400 per dollar. Where does PPP hold?"],"opts":[["두 곳 모두","Both"],["둘 다 아님","Neither"],["유로 지역만","Euro area only"],["한국만","Korea only"]],"ans":2,"sol":[["유로 지역: 5 × 0.9 = 4.5유로 = 실제 가격 → 성립","Euro area: 5 × 0.9 = €4.50, the actual price → holds"],["한국: 5 × 1,400 = 7,000원 ≠ 6,500원 → 불성립 (원화 저평가)","Korea: 5 × 1,400 = ₩7,000 ≠ ₩6,500 → fails (the won is undervalued)"],["다른 방법: PPP 환율 = P* / P. 한국 6,500 / 5 = 1,300원/달러 ≠ 1,400","Or compare PPP rates: Korea 6,500 / 5 = ₩1,300/$ ≠ 1,400"]],"trap":null},{"id":"31-8","src":["MC 16·18 유형","Like MC 16 and 18"],"q":["PPP가 성립하는 나라의 중앙은행이 통화량을 크게 늘린다. 물가와 이 나라 통화 가치는?","In a country where PPP holds, the central bank expands the money supply a lot. Its price level and currency"],"opts":[["물가↑ · 절상","P rises · appreciates"],["물가↓ · 절상","P falls · appreciates"],["물가↓ · 절하","P falls · depreciates"],["물가↑ · 절하","P rises · depreciates"]],"ans":3,"sol":[["통화량↑ → 물가 P↑ (Ch30 수량방정식)","More money → higher P (Ch30 quantity theory)"],["PPP: e = P* / P → P↑이면 e↓ → 자국 통화 절하","PPP: e = P* / P, so higher P lowers e: depreciation"]],"trap":["문제집 MC 16은 통화량 감소(물가↓·절상)다.","Problem-set MC 16 is a cut in money (P falls, appreciation)."]},{"id":"31-9","src":["MC 19 유형","Like MC 19"],"q":["한국 물가가 연 4%, 미국 물가가 연 1% 오른다. PPP에 따르면 달러 1단위의 원화 가격(원/달러)은 대략 어떻게 변해야 하나?","Korean prices rise 4% a year and U.S. prices 1%. Under PPP, how should the won price of a dollar (₩ per $) change?"],"opts":[["약 5% 하락","fall about 5%"],["약 3% 하락","fall about 3%"],["약 3% 상승","rise about 3%"],["약 5% 상승","rise about 5%"]],"ans":2,"sol":[["PPP: 원/달러 = P(한국) / P(미국)","PPP: ₩/$ = P(Korea) / P(U.S.)"],["분자가 4%, 분모가 1% 오르면 비율은 약 4 − 1 = 3% 상승","Numerator +4%, denominator +1% → the ratio rises about 3%"],["원/달러 상승 = 원화 절하: 인플레이션이 높은 쪽 통화가 약해진다","₩/$ rising means the won depreciates: the higher-inflation currency weakens"]],"trap":["어느 통화 기준인지 먼저 확인한다. 같은 상황에서 교과서 e(달러/원)는 약 3% 하락한다.","Check the quote first: in the same case the textbook e ($ per ₩) falls about 3%."]}]},{"n":32,"short":["개방경제 이론","Open-economy theory"],"mc":[{"id":"32-1","src":["MC 1·3 유형","Like MC 1 and 3"],"q":["개방경제 거시모형에서 대부자금의 공급과 수요는 각각 어디서 나오나?","In the open-economy model, where do the supply of and demand for loanable funds come from?"],"opts":[["공급: 국민저축 · 수요: 국내투자 + NCO","Supply: national saving · Demand: investment + NCO"],["공급: 국민저축 · 수요: 국내투자만","Supply: national saving · Demand: investment only"],["공급: 민간저축 · 수요: 국내투자 + NCO","Supply: private saving · Demand: investment + NCO"],["공급: 국내투자 + NCO · 수요: 국민저축","Supply: investment + NCO · Demand: national saving"]],"ans":0,"sol":[["S = I + NCO에서 왼쪽(S)이 공급, 오른쪽(I + NCO)이 수요","In S = I + NCO, the left side is supply and the right side is demand"],["자본자산을 사는 일은 국내든 해외든 대부자금 수요다","Buying capital assets, at home or abroad, is demand for loanable funds"]],"trap":["민간저축이 아니라 국민저축(민간 + 정부)이다.","It is national saving (private + public), not private saving."]},{"id":"32-2","src":["MC 2 유형","Like MC 2"],"q":["국민저축 900, 정부구매 300, 국내투자 600, 순자본유출 300이다. 대부자금 공급량은?","National saving 900, government purchases 300, investment 600, NCO 300. The supply of loanable funds is"],"opts":[["300","300"],["600","600"],["900","900"],["1,200","1,200"]],"ans":2,"sol":[["대부자금 공급 = 국민저축 = 900","Supply of loanable funds = national saving = 900"],["검산: 수요 I + NCO = 600 + 300 = 900으로 시장이 균형","Check: demand I + NCO = 600 + 300 = 900, so the market clears"]],"trap":["정부구매는 이미 국민저축(S = Y − C − G)에 들어 있다. 따로 더하거나 빼지 않는다.","Government purchases are already inside national saving (S = Y − C − G); do not add or subtract them again."]},{"id":"32-3","src":["MC 5 유형","Like MC 5"],"q":["대부자금시장에 부족(초과수요)이 있다면?","If there is a shortage in the loanable-funds market,"],"opts":[["NCO > I","NCO > I"],["I + NCO > S","I + NCO > S"],["NCO \u003c I","NCO \u003c I"],["I + NCO \u003c S","I + NCO \u003c S"]],"ans":1,"sol":[["부족 = 수요량 > 공급량","Shortage: quantity demanded > quantity supplied"],["수요는 I + NCO, 공급은 S → I + NCO > S. 이자율이 오르며 해소된다","Demand is I + NCO and supply is S, so I + NCO > S; r rises to clear it"]],"trap":["문제집 MC 5는 잉여(초과공급)라 답이 I + NCO \u003c S다.","Problem-set MC 5 asks about a surplus, so its answer is I + NCO \u003c S."]},{"id":"32-4","src":["MC 6·9 유형","Like MC 6 and 9"],"q":["한국의 대부자금 공급이 오른쪽으로 이동(저축 증가)하면?","Korea’s supply of loanable funds shifts right (more saving). Then"],"opts":[["NCO↑, 대부자금 수요량↑","NCO rises; quantity of loanable funds demanded rises"],["NCO↑, 대부자금 수요량↓","NCO rises; quantity demanded falls"],["NCO↓, 대부자금 수요량↑","NCO falls; quantity demanded rises"]   function tally() {
    var a = 0, c = 0;
    ITEMS.forEach(function (it) { if (first[it.key] != null) { a++; if (first[it.key] === it.ans) c++; } });
    $('#score').textContent = L(T.score).replace('{a}', a).replace('{n}', ITEMS.length).replace('{c}', c);
  }
  function render() {
    document.documentElement.lang = LANG;
    ITEMS = [];
    $('#lang').textContent = L(T.lang); $('#h1').textContent = L(T.h1); $('#lead').textContent = L(T.lead); $('#reset').textContent = L(T.reset);
    $('#links').innerHTML = (LANG === 'en' ? T.linksEn : T.links).map(function (x) { return '<a href="' + x[1] + '">' + esc(x[0]) + ' →</a>'; }).join('');
    var cell = function (d) { return '<td class="v ' + (d === '+' ? 'up' : d === '-' ? 'dn' : '') + '">' + (d === '+' ? '↑' : d === '-' ? '↓' : '–') + '</td>'; };
    $('#quiz').innerHTML = DATA.ch.map(function (c) {
      var h = '<section class="ch" id="ch' + c.n + '"><h2><small>CH ' + c.n + '</small>' + esc(L(c.short)) + '</h2>' +
        '<div class="card"><h3>' + esc(L(T.mc)) + '</h3>' + c.mc.map(function (p, i) { return mcRow(p, i + 1); }).join('') + '</div>';
      if (c.n === 31) h += '<div class="card"><h3>' + esc(L(T.sortH)) + '</h3><p class="sub">' + esc(L(T.sortSub)) + '</p>' + DATA.sort.map(function (s, i) { return sortRow(s, i + 1); }).join('') + '</div>';
      if (c.n === 32) h += '<div class="card"><h3>' + esc(L(T.polH)) + '</h3><div class="tblbar"><button type="button" id="polBtn"></button><span>' + esc(L(T.polSub)) + '</span></div>' +
        '<div class="tbl"><table id="pol"><thead><tr><th>' + esc(L(T.polEv)) + '</th><th>' + esc(L(T.polFirst)) + '</th><th>r</th><th>I</th><th>NCO</th><th>E</th><th>NX</th></tr></thead><tbody>' +
        POL.map(function (p) { return '<tr><td>' + esc(L(p[0])) + '<small class="sub">' + esc(L(p[1])) + '</small></td><td>' + esc(L(p[1])) + '</td>' + p.slice(2).map(cell).join('') + '</tr>'; }).join('') +
        '</tbody></table></div><p class="note">' + esc(L(T.polNote)) + '</p></div>';
      return h + '</section>';
    }).join('');
    $$('#quiz .row').forEach(function (row) {
      var key = row.getAttribute('data-key');
      if (first[key] != null) mark(row, row.getAttribute('data-last') || first[key]);
      $$('.opt,.chip', row).forEach(function (b) { b.addEventListener('click', function () {
        var k = b.getAttribute('data-k');
        if (first[key] == null) first[key] = k;
        row.setAttribute('data-last', k); mark(row, k); tally();
      }); });
    });
    var pol = $('#pol'), btn = $('#polBtn');
    var setPol = function () { pol.classList.toggle('hide', !polShown); $$('td.v', pol).forEach(function (c) { c.classList.remove('show'); }); btn.textContent = L(polShown ? T.hide : T.show); };
    btn.addEventListener('click', function () { polShown = !polShown; setPol(); });
    $$('td.v', pol).forEach(function (c) { c.addEventListener('click', function () { c.classList.add('show'); }); });
    setPol(); tally();
  }
  $('#reset').addEventListener('click', function () { first = {}; polShown = false; render(); window.scrollTo(0, 0); });
  $('#lang').addEventListener('click', function () { LANG = LANG === 'en' ? 'ko' : 'en'; render(); });
  render();
})();
</script>
</body>
</html>
