<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Econ 2 Interactive</title>
<!--
  Econ 2 Interactive — 한국어 대문. 챕터 넷을 고르면 /econ2/graphs/#chXX 로 바로 연다. 영문 대문은 /econ2/en/ (/econ2/ 는 TA 세션 슬라이드).
-->
<style>
  @font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:local("Pretendard Variable"),url("/fonts/PretendardVariable.woff2") format("woff2-variations")}
  :root{--ink:#1f2537;--soft:#5b6170;--line:#d8dbe0;--tint:#f3f6fb;--blue:#1f6fd1}
  *{box-sizing:border-box}
  html,body{word-break:keep-all;margin:0;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:880px;margin:0 auto;padding:56px 20px 48px}
  .eyebrow{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
  h1{margin:6px 0 10px;font-size:44px;line-height:1.1;letter-spacing:-.01em}
  .lead{margin:0 0 32px;max-width:620px;font-size:18px;line-height:1.55;color:var(--soft)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0;padding:0;list-style:none}
  .grid a{display:block;height:100%;padding:20px 22px;border:2px solid var(--ink);border-radius:12px;color:inherit;text-decoration:none;transition:background .2s}
  .grid a:hover,.grid a:focus-visible{background:var(--tint);outline:none}
  .grid .ch{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--blue)}
  .grid .nm{display:block;margin:4px 0 6px;font-size:24px;font-weight:800}
  .grid .ds{font-size:15px;line-height:1.5;color:var(--soft)}
  .foot{display:flex;flex-wrap:wrap;gap:10px 18px;margin:28px 0 0;font-size:15px}
  .foot a{color:var(--soft)}
  @media (max-width:640px){main{padding:36px 16px 40px}h1{font-size:34px}.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Econ 2 · 맨큐의 경제학</p>
  <h1>Econ 2 Interactive</h1>
  <p class="lead">사건을 선택하여 그래프와 균형의 변화를 살펴볼 수 있다.</p>
  <ul class="grid">
    <li><a href="/econ2/graphs/#ch29"><span class="ch">CH 29</span><span class="nm">통화승수</span><span class="ds">지급준비금 × 통화승수 = 통화량, 은행 T계정, 은행 자본과 레버리지</span></a></li>
    <li><a href="/econ2/graphs/#ch30"><span class="ch">CH 30</span><span class="nm">화폐 · 물가</span><span class="ds">화폐시장, 화폐가치 1/P, 화폐수량설</span></a></li>
    <li><a href="/econ2/graphs/#ch33"><span class="ch">CH 33</span><span class="nm">AD–AS</span><span class="ds">AD · AS 를 움직이는 것, 단기와 장기</span></a></li>
    <li><a href="/econ2/graphs/#ch28"><span class="ch">CH 28</span><span class="nm">실업</span><span class="ds">균형보다 높은 임금, 실업률, 경제활동참가율</span></a></li>
  </ul>
  <p class="foot"><a href="/econ2/graphs/">그래프 열기</a><a href="/econ2/en/">English</a></p>
</main>
</body>
</html>
