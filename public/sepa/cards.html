<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116"><meta name="color-scheme" content="light dark"><title>SEPA 매매 확인 — 카드 대시보드형 (예시)</title><style>/* 공통 토큰. 한국 관행: 상승 = 빨강(--up), 하락 = 파랑(--down). 색만으로 구분하지 않게 ▲▼ 를 함께 쓴다. */
:root{
  --up:#d92b2b; --down:#1f5fd6; --flat:#6b7280;
  --up-bg:rgba(217,43,43,.12); --down-bg:rgba(31,95,214,.12);
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f8f9fb; --line:#dfe3e8; --text:#16191d; --sub:#5b6470; --faint:#67707b;  /* 흐린 글자도 바탕 대비 4.5 이상 */
  --accent:#0f766e; --warn-bg:#fff4cc; --warn-line:#e0b400; --warn-text:#4a3900;
  --ok:#0f766e; --bad:#b42318; --grid:#e8ebef;
  --ma1:#e8930c; --ma2:#8e44ad; --ma3:#0e9f6e; --ma4:#7a5c3e; --ma5:#c2188b; --ma6:#0b9bb5; --ma7:#555e6b;
  --pivot:#0e9f6e; --stop:#b45309; --limit:#8a929c;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono","D2Coding","Nanum Gothic Coding",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --r:10px; --gap:12px;
}
/* 어두운 색 토큰: 터미널형은 항상, 나머지는 기기 설정이 어두울 때 */
body.v-terminal{
  --up:#ff5b5b; --down:#4f9cff; --flat:#9aa3ad; --up-bg:rgba(255,91,91,.18); --down-bg:rgba(79,156,255,.18);
  --bg:#07090c; --panel:#0d1116; --panel2:#121820; --line:#1e2630; --text:#e6e9ed; --sub:#9aa3ad; --faint:#6b7480;
  --accent:#f5a623; --warn-bg:#3a2e00; --warn-line:#f5c400; --warn-text:#ffe58a; --ok:#35c28f; --bad:#ff7b72; --grid:#182029;
  --ma1:#f5a623; --ma2:#c58af9; --ma3:#35c28f; --ma4:#c9a27c; --ma5:#ff7ad9; --ma6:#39c5d9; --ma7:#b6bec8;
  --pivot:#35c28f; --stop:#f5a623; --limit:#6b7480;
}
@media (prefers-color-scheme:dark){
  body.v-cards,body.v-journal{
    --up:#ff5b5b; --down:#4f9cff; --flat:#9aa3ad; --up-bg:rgba(255,91,91,.18); --down-bg:rgba(79,156,255,.18);
    --bg:#0e1116; --panel:#161b22; --panel2:#1b212a; --line:#2a323d; --text:#e6e9ed; --sub:#a3acb7; --faint:#8a939f;
    --accent:#35c28f; --warn-bg:#3a2e00; --warn-line:#f5c400; --warn-text:#ffe58a; --ok:#35c28f; --bad:#ff7b72; --grid:#232b35;
    --ma1:#f5a623; --ma2:#c58af9; --ma3:#35c28f; --ma4:#c9a27c; --ma5:#ff7ad9; --ma6:#39c5d9; --ma7:#b6bec8;
    --pivot:#35c28f; --stop:#f5a623; --limit:#77808c;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.sub{color:var(--sub)} .faint{color:var(--faint)}
.nodata{color:var(--faint);padding:10px 0}
.nodata::before{content:"— "}

/* 예시 배너: 데모에서는 항상 맨 위에 붙어 따라온다 */
.demo-banner{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:center;
  background:var(--warn-bg);color:var(--warn-text);border-bottom:2px solid var(--warn-line);padding:7px 16px;text-align:center}
.demo-banner b{font-size:15px;letter-spacing:.02em}
.demo-banner span{font-size:12.5px}
.note{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px;font-size:13px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.panel-h b{color:var(--text);font-size:13px}
.panel-b{padding:10px 12px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)} .badge.bad{color:var(--bad);border-color:var(--bad)} .badge.wait{color:var(--sub)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;min-height:28px;color:var(--sub);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip:focus-visible,input:focus-visible,button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-weight:600;color:var(--sub);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child,table.t .l{text-align:left}
table.t tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 차트 */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart-info{font:12px/1.5 var(--mono);color:var(--sub);min-height:18px;padding:0 2px 2px;display:flex;flex-wrap:wrap;gap:0 10px}
.chart-info b{color:var(--text);font-weight:600}
.c-up{fill:var(--up);stroke:var(--up)} .c-down{fill:var(--down);stroke:var(--down)} .c-flat{fill:var(--flat);stroke:var(--flat)}
.v-up{fill:var(--up);opacity:.55} .v-down{fill:var(--down);opacity:.55} .v-flat{fill:var(--flat);opacity:.55}
.ax{font:10.5px var(--mono);fill:var(--faint)}
.gridl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.ma{fill:none;stroke-width:1.3}
.pl{stroke-width:1.2;fill:none} .pl-pivot{stroke:var(--pivot)} .pl-stop{stroke:var(--stop);stroke-dasharray:5 3}
.pl-entry{stroke:var(--text);stroke-dasharray:2 3} .pl-limit{stroke:var(--limit);stroke-dasharray:1 4} .pl-y52{stroke:var(--limit);stroke-dasharray:8 4}
.pl-exit{stroke:var(--sub);stroke-dasharray:2 3}
.pl-t{font:10.5px var(--sans);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.pl-t.pl-pivot{fill:var(--pivot)} .pl-t.pl-stop{fill:var(--stop)} .pl-t.pl-entry{fill:var(--text)} .pl-t.pl-limit,.pl-t.pl-y52{fill:var(--sub)} .pl-t.pl-exit{fill:var(--sub)}
.mk{font:700 10.5px var(--sans);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.mk-buy{fill:var(--up)} .mk-sell{fill:var(--down)}
.xh{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;shape-rendering:crispEdges}
.lasttag rect{fill:var(--text)} .lasttag text{fill:var(--bg);font:600 10.5px var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.eq-line{fill:none;stroke:var(--accent);stroke-width:1.6} .eq-bench{fill:none;stroke:var(--faint);stroke-width:1.2;stroke-dasharray:4 3}
.hold-shade{fill:var(--text);opacity:.06} .mk-sig{fill:var(--sub);font-weight:400} .rs-high{fill:var(--text)} .eq-dd{fill:var(--down-bg)} .eq-base{stroke:var(--faint);stroke-dasharray:3 3}
.ind-line{fill:none;stroke:var(--ma2);stroke-width:1.3} .ind-sig{fill:none;stroke:var(--ma1);stroke-width:1.1}

/* 호가: 매도(위, 파랑 계열) · 매수(아래, 빨강 계열) */
.book{font:12.5px/1.25 var(--mono);width:100%}
.book-row{display:grid;grid-template-columns:1fr 92px 1fr;align-items:stretch;min-height:21px}
.book-row>div{position:relative;padding:2px 6px;display:flex;align-items:center}
.book-row .px{justify-content:center;font-weight:600}
.book-row.ask .px{background:var(--down-bg)} .book-row.bid .px{background:var(--up-bg)}
.book-row .q{justify-content:flex-end} .book-row .q.r{justify-content:flex-start}
.book-row .bar{position:absolute;top:2px;bottom:2px}
.book-row.ask .bar{right:0;background:var(--down-bg)} .book-row.bid .bar{left:0;background:var(--up-bg)}
.book-row .q span{position:relative}
.book-mid{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;font-size:11.5px;color:var(--sub);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.book-head{display:grid;grid-template-columns:1fr 92px 1fr;font:11px var(--sans);color:var(--faint);padding:0 6px 3px}
.book-head span:nth-child(1){text-align:right}.book-head span:nth-child(2){text-align:center}

/* 베팅 금액·레버리지 검토 패널 */
.risk{display:grid;gap:14px;min-width:0}
.risk>*{min-width:0}
.risk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:2px 8px;align-items:center;min-width:0}
.fld label{grid-column:1/-1;font-size:12px;color:var(--sub)}
.fld input[type=range]{width:100%;min-width:0;accent-color:var(--accent);height:24px;margin:0}
.fld input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:right;font-family:var(--mono);min-height:32px}
.fld .unit{grid-column:1/-1;font-size:11px;color:var(--faint);margin-top:-1px}
.fld.wide{grid-template-columns:minmax(0,1fr)}
.risk-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--sub)} .kpi .v{font:600 17px/1.3 var(--mono);overflow-wrap:anywhere} .kpi .s{font-size:11.5px;color:var(--faint)}
.kpi.zero .v{color:var(--bad)}
.why{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.why li{border-left:3px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);padding:6px 10px;border-radius:0 6px 6px 0;font-size:13px}
.why li.info{border-left-color:var(--line);background:var(--panel2);color:var(--sub)}
.risk h3{font-size:13px;margin-bottom:6px}
.risk .legal{font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px}
.lev-bars .b-raw{fill:var(--faint);opacity:.45} .lev-bars .b-cap{fill:var(--accent)} .lev-bars .lim{stroke:var(--bad);stroke-dasharray:4 3}
.lev-bars text{font:10.5px var(--mono);fill:var(--sub)}
tr.cur td{background:var(--panel2);font-weight:600}

/* 맨 위 머리줄(안을 둘 이상 함께 만들었을 때): 이름 · 한 줄 설명 · 화면 바꾸기. 각 안의 색 토큰을 그대로 쓰고 글자와 1px 선만 */
.vbar{border-bottom:1px solid var(--line);background:var(--bg)}
.vbar-in{margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px}
.v-terminal .vbar-in{max-width:1760px}
.v-cards .vbar-in{max-width:1240px;padding-left:20px;padding-right:20px}
.v-journal .vbar-in{max-width:1360px;padding-left:20px;padding-right:20px}
.vbar-what{flex:1 1 360px;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.vbar-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap}
.vbar-desc{margin:0;font-size:12.5px;color:var(--sub);max-width:64ch}
.vbar-views{display:flex;align-items:stretch;margin:0;padding:0;list-style:none}
.vbar-views a{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding:4px 12px;color:var(--sub);text-decoration:none;font-size:13px;line-height:1.25;white-space:nowrap;border-bottom:2px solid transparent}
.vbar-views li+li a{border-left:1px solid var(--line)}
.vbar-views a small{font-size:11px;color:var(--faint)}
.vbar-views a:hover{color:var(--text)}
.vbar-views a[aria-current="page"]{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.vbar a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (max-width:560px){
  .vbar nav{flex:1 1 100%}
  .vbar-views li{flex:1 1 0}
  .vbar-views a{align-items:center;text-align:center;padding:4px 6px}
  .vbar-views a small{display:none}
}
@media print{.vbar{display:none}}

/* 한글은 낱말 중간에서 줄을 바꾸지 않는다. 띄어쓰기 없이 긴 이름(종목명 등)만 칸 끝에서 끊는다 */
body{word-break:keep-all;overflow-wrap:anywhere}
/* 휴대폰: 16px 보다 작은 입력칸은 iOS 가 누를 때 화면을 확대한다 */
@media (max-width:640px){input,select,textarea{font-size:16px}}
/* 안 2 — 카드 대시보드형: 밝은/어두운 화면 자동, 휴대폰 우선, 쉬운 설명 */
body.v-cards{font-size:15px}
.cards{max-width:1240px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:18px}
.c-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;justify-content:space-between}
.c-head h1{font-size:24px}
.c-head .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cards h2{font-size:18px;margin-top:6px}
.cards .lead{margin:2px 0 0;color:var(--sub);font-size:14px;max-width:70ch}
.c-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .k{font-size:13px;color:var(--sub)}
.tile .v{font:700 22px/1.3 var(--mono);margin:2px 0;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--sub)}
.meter{height:8px;border-radius:99px;background:var(--grid);position:relative;margin:8px 0 4px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.meter.hot i{background:var(--bad)}
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-h h3{font-size:17px}
.card-h .cd{font:12px var(--mono);color:var(--faint)}
.price{font:700 24px/1.2 var(--mono)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--sub)}
.facts dd{margin:0;font:600 15px var(--mono);overflow-wrap:anywhere}
.say{margin:0;padding:10px 12px;background:var(--panel2);border-radius:10px;font-size:14px;line-height:1.6}
.say b{font-family:var(--mono)}
.reasons{margin:0;padding-left:18px;color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;width:100%}
.btn:hover{border-color:var(--accent)}
.dist{position:relative;height:26px;margin-top:4px}
.dist .track{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:9px;background:var(--grid)}
.dist .pin{position:absolute;top:3px;width:2px;height:20px;background:var(--sub)}
.dist .pin.stop{background:var(--stop)} .dist .pin.now{background:var(--text);width:3px}
.dist-l{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.ev{list-style:none;margin:0;padding:0;display:grid}
.ev li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev li:last-child{border-bottom:0}
.ev .badge{align-self:start;justify-self:start}
.ev .when{grid-column:1/-1;font:12px var(--mono);color:var(--faint)}
.ev .what{min-width:0;overflow-wrap:anywhere}
.ev .bad{color:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .cards{padding:14px 16px 32px}
  .c-head h1{font-size:21px}
  .c-grid{grid-template-columns:minmax(0,1fr)}
}

<script>/* 세 화면이 같이 쓰는 도우미: 숫자 표기 · 호가단위 · 사이징 · 차트(SVG 직접 그림) · 호가창 · 검토 패널.

  };

  S.dir = function (x) { return x > 0 ? 'up' : x < 0 ? 'down' : 'flat'; };
  S.arrow = function (x) { return x > 0 ? '▲' : x < 0 ? '▼' : '–'; };
  // 등락: 부호(▲▼)와 색을 함께 쓴다
  S.chg = function (diff, ratio) {

  };

  S.signedPct = function (x, d) { return S.ok(x) ? '<span class="num ' + S.dir(x) + '">' + S.arrow(x) + ' ' + (x > 0 ? '+' : '') + S.pct(x, d == null ? 2 : d) + '</span>' : '-'; };
  S.big = function (x) {       // 시가총액처럼 큰 금액: 조 · 억
    if (!S.ok(x)) return NO;
    if (Math.abs(x) >= 1e12) return (x / 1e12).toFixed(2) + '조';

  };
  S.vol = function (x) { return S.ok(x) ? (x >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : x >= 1e4 ? (x / 1e3).toFixed(0) + 'K' : S.won(x)) : '-'; };

  // ── 호가단위(sepa/krx.py 와 같은 표) ──
  S.tick = function (price) {

  S.sizeWithCaps = function (equity, entry, stop, exposure, p) {
    var qty = S.positionSize(equity, entry, stop, p.risk_per_trade, p.max_stop_pct);
    if (qty <= 0) return 0;

    // 넣은 손절가는 구조 손절로 본다. 실제 손절(o.stop)은 initial_stop 규칙으로 정하고, 아래 계산은 전부 실제 손절 기준이다
    o.inputStopPct = i.entry > 0 ? (i.entry - i.stop) / i.entry : NaN;
    o.stop = i.entry > 0 && i.stop > 0 ? S.initialStop(i.entry, i.stop, i.maxStopPct) : i.stop;
    o.pulled = o.stop > i.stop;
    var stop = o.stop;
    o.stopPct = i.entry > 0 ? (i.entry - stop) / i.entry : NaN;
    o.baseQty = S.positionSize(i.equity, i.entry, stop, i.risk, i.maxStopPct);
    o.rawQty = S.positionSize(i.equity, i.entry, stop, p.risk_per_trade, i.maxStopPct);
    o.singleCap = i.entry > 0 ? Math.floor(i.equity * i.maxPositionPct / i.entry) : 0;
    o.totalCap = i.entry > 0 ? Math.floor(Math.max(i.equity * i.maxExposurePct - i.exposure, 0) / i.entry) : 0;
    o.qty = S.sizeWithCaps(i.equity, i.entry, stop, i.exposure, p);
    o.qtyNoCost = o.qty;
    if (i.fee) o.qty = S.sizeWithCosts(i.equity, i.entry, stop, i.exposure, p, i.fee);       // 비용 반영(주당 위험 + 왕복 비용)
    o.costAtStop = i.fee ? o.qty * S.perShareRoundTrip(i.entry, stop, i.fee) : 0;

    o.loss = o.qty * (i.entry - stop);

    o.totalExposure = i.equity > 0 ? (i.exposure + o.amount) / i.equity : NaN;
    o.borrowed = Math.max(i.exposure + o.amount - i.equity, 0);
    var P = function (x) { return S.pct(x, 1).replace('.0%', '%'); };
    if (!(i.equity > 0)) o.reasons.push('계좌 평가금액을 넣어 주세요.');
    else if (!(i.entry > 0) || !(i.stop > 0)) o.reasons.push('진입가와 손절가를 넣어 주세요.');
    else if (i.stop >= i.entry) o.reasons.push('손절가가 진입가보다 낮아야 해요. 그래서 수량이 0이에요.');
    else {
      if (o.pulled) o.reasons.push('손절폭 ' + S.pct(o.inputStopPct, 2) + '가 상한 ' + P(i.maxStopPct) + '를 넘어서 실제 손절을 ' + S.won(stop) + '원(' + S.pct(o.stopPct, 2) + ')으로 당겨요. 넣은 값 ' + S.won(i.stop) + '원은 예상(구조) 손절이에요.');
      if (o.rawQty > o.singleCap && o.singleCap <= o.totalCap)
        o.reasons.push('단일 종목 비중 상한 ' + P(i.maxPositionPct) + ' 때문에 ' + S.won(o.rawQty) + '주 → ' + S.won(o.singleCap) + '주로 줄었어요.');
      if (o.totalCap < Math.min(o.rawQty, o.singleCap))

      if (o.qty === 0 && o.rawQty === 0) o.reasons.push('위험 금액이 1주 위험보다 작아서 수량이 0이에요.');

    if (i.fee && o.qty < o.qtyNoCost) o.notes.push('왕복 비용을 주당 위험에 더해서 ' + S.won(o.qtyNoCost) + '주 → ' + S.won(o.qty) + '주로 줄였어요.');
    if (i.leverage > 1 && o.qty > 0 && o.qty < o.rawQty)
      o.notes.push('레버리지 ' + i.leverage + '배면 ' + S.won(o.rawQty) + '주를 사려 하지만 상한 때문에 ' + S.won(o.qty) + '주까지만 돼요.');
    o.stopsToDaily = o.lossPct > 0 ? Math.ceil(i.dailyLossLimit / o.lossPct - 1e-9) : null;

    o.worstLoss = o.concurrent * o.loss;
    o.worstPct = i.equity > 0 ? o.worstLoss / i.equity : NaN;

  // ── 시세 요약(일봉에서 계산) ──
  S.quote = function (code) {

    if (!b || !b.length) return null;
    var last = b[b.length - 1], prev = b.length > 1 ? b[b.length - 2][4] : null;
    var yb = b.slice(-(C.year_bars || b.length)), hi = -Infinity, lo = Infinity;
    yb.forEach(function (r) { if (r[2] > hi) hi = r[2]; if (r[3] < lo) lo = r[3]; });

      diff: prev ? last[4] - prev : NaN, ratio: prev ? last[4] / prev - 1 : NaN, hi52: hi, lo52: lo, dn: lim[0], up: lim[1], tick: S.tick(last[4]) };

  };

  // ── 지표 ──
  S.sma = function (v, n) {
    var out = new Array(v.length).fill(null), sum = 0;
    for (var i = 0; i < v.length; i++) { sum += v[i]; if (i >= n) sum -= v[i - n]; if (i >= n - 1) out[i] = sum / n; }

  }

  /* 캔들 차트. bars = [[날짜|시각, 시, 고, 저, 종, 거래량], …]

  S.candleChart = function (host, bars, opt) {

      var padL = 2, padR = o.axis ? 62 : 2, padT = 10, padB = o.axis ? 18 : 2;
      var n = Math.min(o.range || bars.length, bars.length), s0 = bars.length - n, vis = bars.slice(s0);
      var volH = o.volume ? Math.round((H - padT - padB) * VOL_PANE) : 0, gap = o.volume ? 8 : 0;
      var pH = H - padT - padB - volH - gap, pW = W - padL - padR, bw = pW / n;
      var lo = Infinity, hi = -Infinity, vmax = 0;
      vis.forEach(function (r) { if (r[2] > hi) hi = r[2]; if (r[3] < lo) lo = r[3]; if (r[5] > vmax) vmax = r[5]; });
      var lines = o.lines.filter(function (l) { return S.ok(l.price) && l.price > 0; });
      var last = bars[bars.length - 1], prevClose = bars.length > 1 ? bars[bars.length - 2][4] : null;

      if (o.y52 && !o.intraday) {
        var yb = bars.slice(-(C.year_bars || bars.length)), h52 = -Infinity, l52 = Infinity;
        yb.forEach(function (r) { if (r[2] > h52) h52 = r[2]; if (r[3] < l52) l52 = r[3]; });
        lines.push({ price: h52, label: '52주 최고', cls: 'y52' }, { price: l52, label: '52주 최저', cls: 'y52' });
      }
      lines.forEach(function (l) { if (l.fit) { if (l.price > hi) hi = l.price; if (l.price < lo) lo = l.price; } });
      var pad = (hi - lo || hi * 0.01 || 1) * Y_PAD; lo -= pad; hi += pad;

      // 가격 눈금: 호가단위의 배수로만 찍는다

        if (o.axis) g += '<text class="ax" x="' + (W - padR + 6) + '" y="' + (y(p) + 3.5).toFixed(1) + '">' + S.won(p) + '</text>';
      }
      // 가로축: 일봉은 달이 바뀌는 곳, 분봉은 정시
      if (o.axis) {

          if (lab && x(i) - lastX > 46 && x(i) < W - padR - 20) {

        if (a < 0 || b < a) return;

      });

      g += '<rect class="hit" x="' + padL + '" y="0" width="' + pW + '" height="' + H + '" fill="transparent"/>';
      var edge = (above.length ? '<span>↑ ' + above.map(S.esc).join(' · ') + '</span>' : '') + (below.length ? '<span>↓ ' + below.map(S.esc).join(' · ') + '</span>' : '');
      host.innerHTML = (o.info ? '<div class="chart-info"></div>' : '') +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + S.esc(o.label || '캔들 차트') + '">' + g + '</svg>' +

      var show = function (i) {

  /* 보조지표(RSI · MACD). 캔들 차트와 가로 눈금을 맞춘다. */
  S.indicator = function (host, bars, opt) {

      var x = function (i) { return padL + (i + 0.5) * bw; }, g = '', head = '';
      if (o.type === 'rsi') {

        mx = mx || 1;
        var ym = function (v) { return padT + (mx - v) / (2 * mx) * (H - padT - padB); }, w = Math.max(1, bw * 0.6);

  /* 자산곡선 + 낙폭. points = [[날짜, 평가금액], …]. 반환: {mdd, total} */

  // ── 호가창: 매도 10단계(위) · 매수 10단계(아래) ──
  S.orderbook = function (host, code) {

  // ── 로그 이벤트를 쉬운 말로 ──
  var STAGE = { scan_candidate: ['스캔', 'scan'], scan_reject: ['스캔 탈락', 'reject'], entry_confirmed: ['종가 확정', 'signal'], entry_skipped: ['진입 포기', 'reject'], vet: ['VET', 'vet'], entry_signal: ['진입 신호', 'signal'], risk_check: ['RiskGate', 'gate'],
    order_sent: ['주문', 'order'], fill: ['체결', 'fill'], exit_decision: ['청산 판단', 'exit'], killswitch: ['킬스위치', 'kill'], order_error: ['주문 오류', 'reject'], regime: ['시장 국면', 'scan'], plan_saved: ['계획 저장', 'scan'] };

  /* 베팅 금액·레버리지 검토 패널. opt.detail = true 면 표·그래프·증거금 입력까지 보여 준다.

  S.riskPanel = function (host, opt) {

    var LMAX = (D.ui && D.ui.leverage_max) || 1, eq0 = S.ok(D.account_equity) && D.account_equity > 0 ? Math.round(D.account_equity) : null;
    var v = { equity: eq0, riskPct: C.risk_per_trade * 100, entry: opt.entry || null, stop: opt.stop || null, leverage: 1, maxPositions: C.max_positions,
      maxPositionPct: C.max_position_pct * 100, maxExposurePct: C.max_total_exposure_pct * 100, dailyLossPct: C.daily_loss_limit * 100,
      exposure: opt.exposure != null ? Math.round(opt.exposure) : 0, rr: (D.ui && D.ui.reward_risk) || 2, marginPct: null, interestPct: null, holdDays: null };
    var F = [
      { k: 'equity', label: '계좌 평가금액', unit: '원', min: 1e6, max: 5e8, step: 1e6, nstep: 10000 },
      { k: 'riskPct', label: '거래당 위험률', unit: '% · 설정값 ' + S.pct(C.risk_per_trade, 2), min: 0.1, max: 5, step: 0.05 },
      { k: 'entry', label: '진입가', unit: '원', num: true },
      { k: 'stop', label: '손절가(구조 · 예상)', unit: '원 · 슬라이더는 손절폭(%) · 상한 ' + S.pct(C.max_stop_pct, 0) + '보다 넓으면 당겨요', min: 0.5, max: 15, step: 0.1, stopSlider: true },
      { k: 'leverage', label: '레버리지 배수(가정)', unit: '배 · 1배 = 쓰지 않음', min: 1, max: LMAX, step: 0.5 },
      { k: 'maxPositions', label: '최대 보유 수', unit: '종목', min: 1, max: 20, step: 1 },
      { k: 'maxPositionPct', label: '단일 종목 비중 상한', unit: '% (계좌 대비)', min: 5, max: 100, step: 1 },
      { k: 'maxExposurePct', label: '총 노출 상한', unit: '% (계좌 대비) · 100% 초과 = 빌린 돈', min: 10, max: LMAX * 100, step: 5 },
      { k: 'dailyLossPct', label: '일일 손실 한도', unit: '%', min: 0.5, max: 10, step: 0.1 }
    ];
    if (opt.detail) F.push(
      { k: 'exposure', label: '이미 보유한 노출', unit: '원 (보유 평가금액)', min: 0, max: 5e8, step: 1e6, nstep: 10000 },
      { k: 'rr', label: '목표 손익비(이익 ÷ 손실)', unit: '배', min: 0.5, max: 6, step: 0.1 });
    var h = '<div class="risk"><div class="risk-grid">' + F.map(function (f) {
      return '<div class="fld' + (f.num ? ' wide' : '') + '"><label for="rk-' + f.k + '">' + f.label + '</label>' +
        (f.num ? '' : '<input type="range" data-k="' + f.k + '" aria-label="' + f.label + ' 슬라이더" min="' + f.min + '" max="' + f.max + '" step="' + f.step + '">') +
        '<input type="number" id="rk-' + f.k + '" data-k="' + f.k + '" inputmode="decimal" min="0" step="' + (f.nstep || f.step || 1) + '"><span class="unit">' + f.unit + '</span></div>';
    }).join('') + '</div><div class="risk-sel faint"></div><div class="risk-out"></div><ul class="why"></ul>';
    if (opt.detail) h += '<div><h3>레버리지를 올리면</h3><div class="lev-bars"></div><div class="scroll-x"><table class="t lev-table"></table></div></div>' +
      '<div><h3>증거금 · 이자 (값을 직접 넣어야 계산해요)</h3><div class="risk-grid">' +
      [['marginPct', '증거금률', '% · 증권사·종목별로 달라요'], ['interestPct', '신용 이자율(연)', '% · 증권사 확인'], ['holdDays', '빌리는 기간', '일']].map(function (f) {
        return '<div class="fld wide"><label for="rk-' + f[0] + '">' + f[1] + '</label><input type="number" id="rk-' + f[0] + '" data-k="' + f[0] + '" inputmode="decimal" min="0" step="any" placeholder="직접 입력"><span class="unit">' + f[2] + '</span></div>';
      }).join('') + '</div><div class="risk-out margin-out" style="margin-top:8px"></div></div>';
    h += '<p class="legal">이 에이전트의 현재 설정은 레버리지를 쓰지 않아요(총 노출 상한 ' + S.pct(C.max_total_exposure_pct, 0) + '). 레버리지 칸은 가정해 보는 계산일 뿐이에요. ' +
      '신용·미수·증거금률·이자·세금의 법·약관 해석은 하지 않아요 — <b>증권사·법령 확인 필요</b>. 수수료·세율은 자리표시 값이에요.</p></div>';
    host.innerHTML = h;
    var q = function (s) { return host.querySelector(s); }, inputs = host.querySelectorAll('input[data-k]');
    function inp() {
      return { equity: v.equity, risk: v.riskPct / 100, entry: v.entry, stop: v.stop, leverage: v.leverage || 1, maxPositions: v.maxPositions, maxStopPct: C.max_stop_pct,
        maxPositionPct: v.maxPositionPct / 100, maxExposurePct: v.maxExposurePct / 100, dailyLossLimit: v.dailyLossPct / 100, exposure: v.exposure || 0, rr: v.rr,
        marginRate: v.marginPct == null ? null : v.marginPct / 100, interestRate: v.interestPct == null ? null : v.interestPct / 100, holdDays: v.holdDays };
    }
    function sync(skip) {
      inputs.forEach(function (el) {
        if (el === skip) return;
        var k = el.dataset.k, val = v[k];
        if (el.type === 'range' && k === 'stop') val = v.entry > 0 && v.stop > 0 ? +((v.entry - v.stop) / v.entry * 100).toFixed(1) : '';
        el.value = val == null || val === '' ? '' : val;
      });
      var e = q('#rk-entry'), s = q('#rk-stop');
      if (v.entry > 0) { e.step = S.tick(v.entry); e.nextElementSibling.textContent = '원 · 호가단위 ' + S.won(S.tick(v.entry)) + '원'; }
      if (v.stop > 0) s.step = S.tick(v.stop);
    }
    function kpi(k, val, sub, zero) { return '<div class="kpi' + (zero ? ' zero' : '') + '"><div class="k">' + k + '</div><div class="v">' + val + '</div><div class="s">' + (sub || '') + '</div></div>'; }
    function render() {
      var i = inp(), r = S.riskPlan(i), ready = i.equity > 0 && i.entry > 0 && i.stop > 0;
      q('.risk-out').innerHTML = !ready ? '' :
        kpi('수량', S.won(r.qty) + '주', '레버리지 없이 ' + S.won(S.sizeWithCaps(i.equity, i.entry, r.stop, i.exposure, { risk_per_trade: i.risk, max_stop_pct: i.maxStopPct, max_position_pct: i.maxPositionPct, max_total_exposure_pct: i.maxExposurePct })) + '주', r.qty === 0) +
        kpi('투입 금액', S.won(r.amount) + '원', '계좌 대비 ' + S.pct(r.weight, 1)) +
        kpi('손절 시 손실', '▼ ' + S.won(r.loss) + '원', '계좌의 ' + S.pct(r.lossPct, 2) + ' · 실제 손절 ' + S.won(r.stop) + '원(' + S.pct(r.stopPct, 2) + ')') +
        kpi('일일 한도까지', r.stopsToDaily ? '손절 ' + r.stopsToDaily + '번' : '-', '하루 -' + S.pct(i.dailyLossLimit, 1) + '에 닿는 연속 손절 수') +
        kpi('동시 손절 최악', '▼ ' + S.won(r.worstLoss) + '원', r.concurrent + '종목이 같이 손절되면 계좌의 ' + S.pct(r.worstPct, 2)) +
        kpi('손익분기 승률', S.pct(r.breakevenCost, 1), '손익비 ' + i.rr + '배 · 비용이 없다면 ' + S.pct(r.breakeven, 1)) +
        kpi('총 노출', S.pct(r.totalExposure, 1), r.borrowed > 0 ? '빌린 돈 ' + S.won(r.borrowed) + '원' : '자기자본 이내');
      q('.why').innerHTML = r.reasons.map(function (t) { return '<li>' + S.esc(t) + '</li>'; }).join('') + r.notes.map(function (t) { return '<li class="info">' + S.esc(t) + '</li>'; }).join('') +
        (ready && !r.reasons.length && !r.notes.length ? '<li class="info">지금 설정에서 막히는 항목이 없어요.</li>' : '');
      if (!opt.detail) return;
      var rows = [], L;
      for (L = 1; L <= LMAX; L++) rows.push(L);
      if (rows.indexOf(i.leverage) < 0) { rows.push(i.leverage); rows.sort(function (a, b) { return a - b; }); }
      var plans = rows.map(function (lv) { return S.riskPlan(Object.assign({}, i, { leverage: lv })); });
      q('.lev-table').innerHTML = !ready ? '' : '<thead><tr><th>레버리지</th><th>상한 전 수량</th><th>실제 수량</th><th>투입 금액</th><th>총 노출</th><th>손절 손실률</th><th>일일 한도까지</th><th>동시 손절 최악</th></tr></thead><tbody>' +
        plans.map(function (p, n) {
          return '<tr' + (rows[n] === i.leverage ? ' class="cur"' : '') + '><td class="num">' + rows[n] + '배</td><td class="num">' + S.won(p.rawQty) + '</td><td class="num">' + S.won(p.qty) + '</td><td class="num">' + S.won(p.amount) + '</td><td class="num">' + S.pct(p.totalExposure, 0) +
            '</td><td class="num">' + S.pct(p.lossPct, 2) + '</td><td class="num">' + (p.stopsToDaily ? p.stopsToDaily + '번' : '-') + '</td><td class="num">' + S.pct(p.worstPct, 2) + '</td></tr>';
        }).join('') + '</tbody>';
      // 막대: 손절 1번의 손실률 — 흐린 막대는 상한이 없다면, 진한 막대는 상한 적용 뒤. 점선은 일일 손실 한도
      var bars = q('.lev-bars');
      if (!ready) { bars.innerHTML = ''; } else {
        var W = Math.max(Math.min(bars.clientWidth || 600, 720), 240), H = 120, pl = 4, pb = 18, pt = 14, gw = (W - pl - 70) / rows.length;
        var raws = plans.map(function (p) { return i.equity > 0 ? p.rawQty * (i.entry - i.stop) / i.equity : 0; });
        var mx = Math.max.apply(null, raws.concat([i.dailyLossLimit])) * 1.1 || 1, yy = function (x) { return pt + (1 - x / mx) * (H - pt - pb); }, g = '';
        plans.forEach(function (p, n) {
          var x0 = pl + n * gw + gw * 0.15, bw2 = gw * 0.3;
          g += '<rect class="b-raw" x="' + x0.toFixed(1) + '" y="' + yy(raws[n]).toFixed(1) + '" width="' + bw2.toFixed(1) + '" height="' + (H - pb - yy(raws[n])).toFixed(1) + '"/>';
          g += '<rect class="b-cap" x="' + (x0 + bw2 + 2).toFixed(1) + '" y="' + yy(p.lossPct || 0).toFixed(1) + '" width="' + bw2.toFixed(1) + '" height="' + (H - pb - yy(p.lossPct || 0)).toFixed(1) + '"/>';
          g += '<text x="' + (x0 + bw2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + rows[n] + '배</text>';
          g += '<text x="' + (x0 + bw2 * 1.5 + 2).toFixed(1) + '" y="' + (yy(p.lossPct || 0) - 3).toFixed(1) + '" text-anchor="middle">' + S.pct(p.lossPct, 1) + '</text>';
        });
        g += '<line class="lim" x1="' + pl + '" x2="' + (W - 66) + '" y1="' + yy(i.dailyLossLimit).toFixed(1) + '" y2="' + yy(i.dailyLossLimit).toFixed(1) + '"/><text x="' + (W - 62) + '" y="' + (yy(i.dailyLossLimit) + 3.5).toFixed(1) + '">일일 한도</text>';
        bars.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="레버리지별 손절 1번의 손실률">' + g + '</svg>' +
          '<div class="legend"><span><i style="border-color:var(--faint)"></i>상한이 없다면</span><span><i style="border-color:var(--accent)"></i>상한 적용 뒤(실제)</span><span>막대 = 손절 1번에 잃는 계좌 비율</span></div>';
      }
      q('.margin-out').innerHTML = !ready ? '' :
        kpi('필요 증거금', r.margin == null ? '입력 필요' : S.won(r.margin) + '원', '투입 금액 × 증거금률') +
        kpi('예상 이자', r.interest == null ? '입력 필요' : S.won(r.interest) + '원', '빌린 돈 ' + S.won(r.borrowed) + '원 기준(단리 근사)');
    }
    host.addEventListener('input', function (ev) {
      var el = ev.target, k = el.dataset && el.dataset.k;
      if (!k) return;
      var x = el.value === '' ? null : parseFloat(el.value);
      if (x != null && !isFinite(x)) x = null;
      if (el.type === 'range' && k === 'stop') { if (v.entry > 0 && x != null) v.stop = S.roundDownTick(v.entry * (1 - x / 100)); }
      else v[k] = x;
      sync(el); render();
    });
    S.onResize(function () { if (!host.isConnected) return false; render(); });
    sync(); render();
    return {
      set: function (p) {
        if (p.entry != null) v.entry = p.entry;
        if (p.stop != null) v.stop = p.stop;
        if (p.exposure != null) v.exposure = Math.round(p.exposure);
        q('.risk-sel').textContent = p.label ? '지금 넣은 값: ' + p.label : '';
        sync(); render();
      },
      values: inp
    };
  };
})();
</script>
<script>/* 안 2 — 카드 대시보드형: 오늘 계획 · 보유 포지션 · 위험 현황을 카드로, 숫자 옆에 쉬운 설명을 붙인다. */
(function () {
  'use strict';
  var S = window.SEPA, D = S.D, C = S.C, NO = S.NO, esc = S.esc, won = S.won;
  var MINI = { range: 60, height: 190, mas: [20, 60], volume: true, info: false };     // 카드 안 미니 차트
  var RECENT = 9;                                                                        // 최근 판단 줄 수
  var P = S.positions(), I = S.planItems(), eq = D.account_equity, expo = S.exposure();
  var app = document.getElementById('app');
  function meter(ratio, hot) { return '<div class="meter' + (hot ? ' hot' : '') + '"><i style="width:' + Math.max(Math.min(ratio * 100, 100), 0).toFixed(0) + '%"></i></div>'; }
  function tile(k, v, s, extra) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (extra || '') + '<div class="s">' + (s || '') + '</div></div>'; }

  // 지금 보유 종목이 전부 손절되면 잃는 금액(현재가 → 손절가)
  var stopLoss = P.reduce(function (a, p) { var q = S.quote(p.code); return a + p.qty * Math.max((q ? q.last : p.entry) - p.stop, 0); }, 0);
  var hasEq = S.ok(eq) && eq > 0, expoR = hasEq ? expo / eq : NaN, lossR = hasEq ? stopLoss / eq : NaN;
  var h = '<div class="cards"><header class="c-head"><div><h1>오늘의 매매 점검</h1><div class="sub">' + esc((D.generated_at || '').replace('T', ' ')) + ' 기준 · 실시간 연결 없음</div></div>' +
    '<div class="meta">' + S.modeBadges() + ' ' + S.regimeHtml() + '</div></header>';
  h += '<section class="c-sum" aria-label="요약">' +
    tile('계좌 평가금액(오늘 시작)', hasEq ? won(eq) + '원' : NO, hasEq ? '거래 1번에 거는 위험 ' + S.pct(C.risk_per_trade, 2) + ' = ' + won(eq * C.risk_per_trade) + '원' : 'state.json 이 있으면 보여요') +
    tile('보유 종목', D.state ? P.length + ' / ' + C.max_positions : NO, '최대 ' + C.max_positions + '종목까지 들고 가요', D.state ? meter(P.length / C.max_positions) : '') +
    tile('총 노출', hasEq ? S.pct(expoR, 1) : NO, '상한 ' + S.pct(C.max_total_exposure_pct, 0) + ' · 레버리지를 쓰지 않아요', hasEq ? meter(expoR / C.max_total_exposure_pct, expoR > C.max_total_exposure_pct) : '') +
    tile('지금 가격에서 전부 손절되면', hasEq && D.state ? '▼ ' + won(stopLoss) + '원' : NO, hasEq ? '계좌의 ' + S.pct(lossR, 2) + ' · 하루 한도 ' + S.pct(C.daily_loss_limit, 0) + '에서 새 매수를 멈춰요' : '', hasEq && D.state ? meter(lossR / C.daily_loss_limit, lossR >= C.daily_loss_limit) : '') +
    '</section>';

  h += '<section><h2>오늘 계획' + (D.plan && D.plan.date ? ' <span class="sub num" style="font-size:13px">' + esc(D.plan.date) + '</span>' : '') + '</h2>' +
    '<p class="lead">피벗 가격을 평소 거래량의 ' + C.vol_breakout_mult + '배 이상으로 넘을 때만 사요. 피벗보다 ' + S.pct(C.chase_limit_pct, 0) + ' 넘게 오르면 따라 사지 않아요.</p></section>';
  if (!I.length) h += '<div class="card">' + S.nodata(D.plan ? '오늘 후보' : '계획(plan.json)') + '</div>';
  else h += '<div class="c-grid">' + I.map(function (i, n) {
    var q = S.quote(i.code), es = S.initialStop(i.pivot, i.stop, C.max_stop_pct), sp = (i.pivot - es) / i.pivot, qty = hasEq ? S.sizeWithCaps(eq, i.pivot, es, expo, C) : null;   // es = 예상 손절(구조 손절이 넓으면 당김)
    return '<article class="card"><div class="card-h"><div><h3>' + esc(i.name || S.name(i.code)) + '</h3><div class="cd">' + esc(i.code) + ' · ' + esc(i.market || '') + ' · RS ' + (S.ok(i.rs) ? i.rs.toFixed(0) : '-') + '</div></div>' + S.vetBadge(i.vet_approved) + '</div>' +
      '<div><span class="price">' + (q ? won(q.last) + '원' : NO) + '</span> ' + (q ? S.chg(q.diff, q.ratio) : '') + '</div>' +
      '<div class="mini" data-plan="' + n + '"></div>' +
      '<p class="say"><b>' + won(i.pivot) + '원</b>을 거래량과 함께 넘으면 사요. <b>' + won(es) + '원</b> 아래로 내려가면 팔아요(예상 손절폭 ' + S.pct(sp, 1) + ' · 실제 손절은 진입가 기준으로 정해져요).' +
      (i.vet_approved === false ? ' 다만 VET 가 거절해서 지금은 사지 않아요.' : i.vet_approved == null && C.vet_required ? ' VET 승인이 없어서 지금은 사지 않아요.' : '') + '</p>' +
      '<dl class="facts"><div><dt>피벗까지</dt><dd>' + (q ? S.signedPct(i.pivot / q.last - 1, 1) : NO) + '</dd></div><div><dt>예상 수량</dt><dd>' + (qty == null ? NO : won(qty) + '주') + '</dd></div>' +
      '<div><dt>예상 투입 금액</dt><dd>' + (qty == null ? NO : won(qty * i.pivot) + '원') + '</dd></div><div><dt>손절 시 손실</dt><dd>' + (qty == null ? NO : '▼ ' + won(qty * (i.pivot - es)) + '원') + '</dd></div></dl>' +
      ((i.vet_reasons || []).length ? '<ul class="reasons">' + i.vet_reasons.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' : '') +
      '<button class="btn" data-risk="plan:' + n + '">이 값으로 베팅 금액 검토하기</button></article>';
  }).join('') + '</div>';

  h += '<section><h2>보유 포지션</h2><p class="lead">손절가는 킬스위치와 상관없이 항상 지켜요. 종가가 ' + C.exit_ma + '일선 아래로 마감해도 팔아요.</p></section>';
  if (!P.length) h += '<div class="card">' + S.nodata(D.state ? '보유 종목' : '상태(state.json)') + '</div>';
  else h += '<div class="c-grid">' + P.map(function (p, n) {
    var q = S.quote(p.code), last = q ? q.last : NaN, r = (last - p.entry) / (p.entry - p.stop);
    var lo = Math.min(p.stop, last || p.stop), hi = Math.max(last || p.entry, p.entry), span = (hi - lo) || 1, at = function (x) { return ((x - lo) / span * 100).toFixed(1); };
    return '<article class="card"><div class="card-h"><div><h3>' + esc(p.name || S.name(p.code)) + '</h3><div class="cd">' + esc(p.code) + ' · ' + won(p.qty) + '주 · ' + esc((p.opened_at || '').slice(0, 10)) + ' 진입</div></div>' +
      (p.stop_known === false ? '<span class="badge bad">손절 임시값</span>' : '<span class="badge ok">손절 확인</span>') + '</div>' +
      '<div><span class="price">' + (q ? won(last) + '원' : NO) + '</span> ' + (q ? S.signedWon((last - p.entry) * p.qty) + ' ' + S.signedPct(last / p.entry - 1) : '') + '</div>' +
      '<div class="mini" data-pos="' + n + '"></div>' +
      (q ? '<div><div class="dist"><div class="track"></div><div class="pin stop" style="left:' + at(p.stop) + '%"></div><div class="pin" style="left:' + at(p.entry) + '%"></div><div class="pin now" style="left:calc(' + at(last) + '% - 3px)"></div></div>' +
        '<div class="dist-l"><span>손절 ' + won(p.stop) + '</span><span>진입 ' + won(p.entry) + '</span><span>지금 ' + won(last) + '</span></div></div>' : '') +
      '<dl class="facts"><div><dt>손절까지</dt><dd>' + (q ? S.signedPct(p.stop / last - 1, 1) : NO) + '</dd></div><div><dt>지금 손익(R)</dt><dd>' + (q && S.ok(r) ? (r > 0 ? '+' : '') + r.toFixed(1) + 'R' : NO) + '</dd></div>' +
      '<div><dt>평가금액</dt><dd>' + (q ? won(last * p.qty) + '원' : NO) + '</dd></div><div><dt>손절되면</dt><dd>' + (q ? S.signedWon((p.stop - p.entry) * p.qty) + '원' : NO) + '</dd></div></dl>' +
      '<button class="btn" data-risk="pos:' + n + '">이 값으로 베팅 금액 검토하기</button></article>';
  }).join('') + '</div>';

  h += '<section><h2>위험 현황 · 베팅 금액 검토</h2><p class="lead">계좌 · 위험률 · 손절폭을 바꾸면 수량과 손실이 바로 다시 계산돼요.</p></section>' +
    '<div class="two"><div class="card"><h3 style="font-size:16px">최근 판단</h3><ul class="ev" id="c-ev"></ul></div><div class="card" id="c-risk"></div></div></div>';
  app.innerHTML = h;

  app.querySelectorAll('.mini').forEach(function (m) {
    var it, lines, markers = [];
    if (m.dataset.plan != null) { it = I[+m.dataset.plan]; lines = [{ price: it.pivot, label: '피벗', cls: 'pivot', fit: true }, { price: it.stop, label: '손절', cls: 'stop', fit: true }]; }
    else { it = P[+m.dataset.pos]; lines = [{ price: it.entry, label: '진입', cls: 'entry', fit: true }, { price: it.stop, label: '손절', cls: 'stop', fit: true }]; markers = [{ date: (it.opened_at || '').slice(0, 10), side: 'buy', label: '매수' }]; }
    var s = (D.symbols || {})[it.code];
    S.candleChart(m, (s && s.daily) || [], Object.assign({}, MINI, { lines: lines, markers: markers, label: (it.name || it.code) + ' 미니 차트' }));
  });
  var ev = (D.events || []).filter(function (e) { return ['regime', 'notice', 'plan_saved', 'start', 'scan_reject'].indexOf(e.event) < 0; }).slice(-RECENT).reverse();
  document.getElementById('c-ev').innerHTML = ev.length ? ev.map(function (e) {
    var d = S.describe(e);
    return '<li><span class="when">' + esc(String(e.ts || '').replace('T', ' ')) + '</span><span class="badge">' + esc(d.stage) + '</span><span class="what' + (d.tone === 'bad' ? ' bad' : '') + '">' + (d.code ? '<b>' + esc(S.name(d.code)) + '</b> ' : '') + esc(d.text) + '</span></li>';
  }).join('') : '<li>' + S.nodata('결정 로그') + '</li>';
  var first = I[0] ? { entry: I[0].pivot, stop: I[0].stop, label: (I[0].name || I[0].code) + ' 계획(피벗 · 손절가)' } : P[0] ? { entry: P[0].entry, stop: P[0].stop, label: (P[0].name || P[0].code) + ' 보유' } : null;
  var risk = S.riskPanel(document.getElementById('c-risk'), { exposure: expo });
  if (first) risk.set(first);
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-risk]');
    if (!b) return;
    var k = b.dataset.risk.split(':'), it = k[0] === 'plan' ? I[+k[1]] : P[+k[1]];
    risk.set(k[0] === 'plan' ? { entry: it.pivot, stop: it.stop, label: (it.name || it.code) + ' 계획(피벗 · 손절가)' } : { entry: it.entry, stop: it.stop, label: (it.name || it.code) + ' 보유(진입가 · 손절가)' });
    document.getElementById('c-risk').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
})();
</script>
</body></html>
