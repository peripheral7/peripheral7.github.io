===
11.1 Expected return
An analyst gives the economy a 30% chance of a boom and a 50% chance of a normal year; the only other possibility is a recession. Stock M returns 25% in a boom, 10% in a normal year and −15% in a recession. What is the expected return on M?
6.67%|*9.50%|12.50%|15.50%
P(recession) = 1 − 0.30 − 0.50 = 0.20 (probabilities sum to 1); E(R) = Σ p × R = 0.30 × 25% + 0.50 × 10% + 0.20 × (−15%) = 7.50% + 5.00% − 3.00% = 9.50%; BA II Plus: 2nd DATA, 25 ENTER ↓ 30 ENTER ↓ 10 ENTER ↓ 50 ENTER ↓ 15 +/− ENTER ↓ 20 ENTER, 2nd STAT ↓ → x̄ = 9.50; (6.67% weights the states equally; 12.50% leaves out the recession; 15.50% adds the recession return with the wrong sign.)
===

11.1 Expected return and variance
Kumsan and Gwangmyeong. Complete the worksheet: the expected return, the variance and the standard deviation of each stock. Work in decimals for the variance; write the formulas you use.
~
E(R) = Σ p × R: E(R_K) = 0.20 × 30% + 0.60 × 12% + 0.20 × (−10%) = 6.00% + 7.20% − 2.00% = 11.20%; E(R_G) = 0.20 × 4% + 0.60 × 8% + 0.20 × 14% = 0.80% + 4.80% + 2.80% = 8.40%; σ² = Σ p × (R − E(R))²: σ_K² = 0.20 × 0.188² + 0.60 × 0.008² + 0.20 × (−0.212)² = 0.0070688 + 0.0000384 + 0.0089888 = 0.016096; σ_G² = 0.20 × (−0.044)² + 0.60 × (−0.004)² + 0.20 × 0.056² = 0.0003872 + 0.0000096 + 0.0006272 = 0.001024; σ_K = √0.016096 = 12.69%; σ_G = √0.001024 = 3.20%; BA II Plus (K): 2nd DATA, 2nd CLR WORK, 30 ENTER ↓ 20 ENTER ↓ 12 ENTER ↓ 60 ENTER ↓ 10 +/− ENTER ↓ 20 ENTER, 2nd STAT ↓ ↓ → x̄ = 11.20, σx = 12.69; K has the higher expected return — and four times the standard deviation.

11.2 Portfolio expected return and variance
Kumsan and Gwangmyeong. You put 60% of your money in K and 40% in G. Compute the portfolio's return in each state, its expected return, its variance and its standard deviation, writing each formula. Then compare the standard deviation with the 60/40 weighted average of the two stocks' own standard deviations.
19.6 / 19.60 / 0.196|10.4 / 10.40 / 0.104|10.08 / 0.1008|0.004015 / 0.00402 / 0.0040|6.34 / 0.0634|8.89 / 0.0889
State returns R_P = 0.60 × R_K + 0.40 × R_G: Boom = 0.60 × 30% + 0.40 × 4% = 19.60%; Normal = 0.60 × 12% + 0.40 × 8% = 10.40%; Recession = 0.60 × (−10%) + 0.40 × 14% = −0.40%; E(R_P) = 0.20 × 19.60% + 0.60 × 10.40% + 0.20 × (−0.40%) = 10.08% (= 0.60 × 11.20% + 0.40 × 8.40%, the same by either route); σ_P² = 0.20 × (0.196 − 0.1008)² + 0.60 × (0.104 − 0.1008)² + 0.20 × (−0.004 − 0.1008)² = 0.0018126 + 0.0000061 + 0.0021966 = 0.004015; σ_P = √0.004015 = 6.34%; Weighted average of SDs = 0.60 × 12.69% + 0.40 × 3.20% = 8.89%; The portfolio's 6.34% is well below 8.89% — risk is not a weighted average.
@use A
@focus 1
===
-
Kumsan and Gwangmyeong. The 60/40 portfolio of K and G has a standard deviation of 6.34%, although the 60/40 weighted average of the two stocks' standard deviations is 8.89%. Why is the portfolio's figure lower?
Diversification removes the systematic risk of K and G|The portfolio's expected return is lower than K's, and lower return always means lower risk|Portfolio variance is the weighted average of the two variances, and its square root is always below the weighted average of the SDs|*K does well in a boom and G does well in a recession, so part of each stock's swings cancels when they are combined state by state
The portfolio is combined state by state before squaring: boom 19.60%, normal 10.40%, recession −0.40% sit much closer together than K's 30% / 12% / −10%; K and G move in opposite directions across the states, so their swings partly offset; (The weighted average of variances, 0.60 × 0.016096 + 0.40 × 0.001024 = 0.010067, has a square root of 10.03% — not 6.34%; diversification removes unsystematic, not systematic, risk.)
@use A
@focus 1
===
11.2 Portfolio expected return
You invest $5,000 in Stock X (expected return 12%), $3,000 in Stock Y (expected return 18%) and $2,000 in Stock Z (expected return 6%). What is the expected return on your portfolio?
11.40%|12.00%|*12.60%|13.80%
Weights = dollars ÷ total $10,000: w_X = 0.50, w_Y = 0.30, w_Z = 0.20; E(R_P) = Σ w × E(R) = 0.50 × 12% + 0.30 × 18% + 0.20 × 6% = 6.00% + 5.40% + 1.20% = 12.60%; (12.00% is the simple average; 11.40% drops Z; 13.80% attaches the 50% weight to Y and 30% to X.)
===
11.3 Announcements and surprises
Kumho Retail announces that quarterly earnings rose 12% on a year earlier. On the day of the announcement its share price falls 4%, with the overall market flat. Which explanation is most consistent with R = E(R) + U?
*The market had expected earnings growth of more than 12%, so the news was a negative surprise even though earnings rose|Earnings growth always raises the share price, so the fall must be caused by something other than the announcement|The 12% growth is all unexpected return, so the price should have risen by about 12%|The expected part of an announcement moves the price the most, because it is the largest part of the news
Only the surprise moves the price: the expected part of the announcement was already built into the price before the news arrived; Here U < 0 — growth came in below what the market had priced in, so the price fell even though earnings rose.
===
-
Analysts expected Stock N to return 12% this year. It actually returned −3%. What was the unexpected return, and what does the unexpected part of returns average over many years?
−3%, and it averages zero|+15%, and it averages the risk premium|−15%, and it averages the expected return|*−15%, and it averages zero
R = E(R) + U, so U = R − E(R) = −3% − 12% = −15%; U averages to zero over many periods — by definition, since anything with a predictable sign would already be in E(R); (−3% is the actual return, not the surprise; +15% reverses the subtraction.)
===
11.4 Systematic risk
Which of the following events is a source of systematic risk?
A strike at one of Hanbit Motors' assembly plants|A failed clinical trial at a single biotech firm|*An unexpected rise in the central bank's policy interest rate|A product-liability lawsuit against a toy maker
Systematic (market, nondiversifiable) risk reaches nearly every asset: interest rates, inflation, GDP growth, a change in tax law; A strike, a failed product or a lawsuit hits one firm or a small group — unsystematic (unique, asset-specific) risk.
===
11.4 Unsystematic risk in a portfolio
You hold equal amounts of 60 stocks spread across many industries. One holding, a chemical maker, loses 30% of its value after a factory fire. In the same month inflation comes in two points above forecast. Which statement is correct?
*The fire is unsystematic and costs the portfolio only about 0.5%, while the inflation surprise is systematic and touches nearly every holding|Both events are unsystematic, because each is a one-off surprise|The fire is systematic because nobody expected it, and the inflation news is unsystematic because inflation is forecast every month|Both events are systematic, because both change the value of the portfolio
Fire: one firm → unsystematic; with 1/60 of the money in it, the hit is 30% ÷ 60 = 0.5% of the portfolio, and other firms' good luck offsets it; Inflation surprise: affects nearly every asset → systematic, it remains however many stocks are held; Being a surprise does not make a risk systematic — both kinds of risk are surprises (U).
===
11.5 Diversification
A study reports the average standard deviation of randomly chosen portfolios: 1 stock 45.0%, 5 stocks 26.0%, 20 stocks 21.5%, 100 stocks 20.3%, 500 stocks 20.1%. Which statement is correct?
With enough stocks the portfolio's standard deviation would fall to zero|*Most of the reduction comes from the first few stocks, and the level near 20% that remains is systematic risk, which no number of holdings removes|Going from 20 to 100 stocks removes more risk than going from 1 to 5, because more stocks are added|Adding stocks lowers the portfolio's beta toward zero, which is why the standard deviation falls
1 → 5 stocks removes 45.0 − 26.0 = 19.0 points; 20 → 100 removes only 21.5 − 20.3 = 1.2 points: most of the benefit arrives early; Diversification removes unsystematic risk; the floor near 20% is systematic risk, which every holding shares, so the SD never reaches zero; (Adding stocks moves the portfolio's beta toward the market's 1, not toward 0.)
===
-
In two sentences, explain why the market rewards investors only for bearing systematic risk.
diversif|free / no cost / costless / close to zero / almost nothing / cheaply|systematic / market risk / nondiversifiable / beta
Unsystematic risk can be eliminated by diversifying across enough firms, at a cost close to zero, so a market will not pay anyone for bearing a risk they could have shed for free; The reward (risk premium) attaches to systematic risk — the part that cannot be diversified away — which is why expected return depends on beta, not on total risk.
@short
===
11.6 Beta versus standard deviation
Rf = 4% and the market risk premium is 7%. Stock G, a gold miner, has a standard deviation of 55% and a beta of 0.3. Stock U, an electronics maker, has a standard deviation of 25% and a beta of 1.3. Which stock has the higher required return under the CAPM? Choose, then explain.
G, because its total risk is more than twice as large|Neither — high-σ and high-β stocks earn the same on average|It cannot be determined without the correlation between G and U|*U, because its required return is 13.1% against G's 6.1% — only systematic risk is rewarded
CAPM: E(R_U) = 4% + 1.3 × 7% = 13.1%; E(R_G) = 4% + 0.3 × 7% = 6.1%; Standard deviation is total risk, most of G's is unsystematic and can be diversified away for free, so it earns no reward; A high standard deviation does not imply a high beta.
@write 3
===
11.6 Reading a beta
Which statement about beta is correct?
*An airline with a beta of about 1.5 amplifies the market's moves, while a utility with a beta of about 0.5 dampens them|A stock with a beta of 0 carries no risk at all|A stock with a beta of 1 has the same standard deviation as the market|Utilities have betas above 1, because people keep buying electricity in a recession
β > 1 amplifies the market's moves (airlines, luxury goods, technology ≈ 1.5); 0 < β < 1 dampens them (utilities, staple foods ≈ 0.5); β = 1 moves one for one with the market but can carry extra unsystematic risk, so its SD can differ; β = 0 means unaffected by the market, not riskless — it can still be very volatile.
===
11.6 Portfolio beta
You hold $40,000 in Stock A (β = 1.40), $35,000 in Stock B (β = 0.90) and $25,000 in Treasury bills. What is the beta of your portfolio?
0.767|*0.875|1.150|1.167
Weights = dollars ÷ $100,000: 0.40, 0.35, 0.25; T-bills have no systematic risk, β = 0; β_P = Σ w × β = 0.40 × 1.40 + 0.35 × 0.90 + 0.25 × 0 = 0.56 + 0.315 + 0 = 0.875; (0.767 is the simple average of 1.40, 0.90 and 0; 1.150 averages only the two stocks; 1.167 ignores the T-bills' weight: 0.875 ÷ 0.75.)
===
-
A $1,000,000 portfolio holds $350,000 in Stock A (β = 1.40), $250,000 in Stock B (β = 0.90) and $150,000 in the risk-free asset. The remaining $250,000 will go into Stock C. What beta must C have for the portfolio to have a beta of 1.00? If Rf = 4% and the market risk premium is 6%, what is the portfolio's expected return under the CAPM? Write the formulas.
0.49 / .49|0.225 / .225|0.285 / .285|1.14|10% / 10.0% / 0.10
β_P = Σ w × β: 1.00 = 0.35 × 1.40 + 0.25 × 0.90 + 0.15 × 0 + 0.25 × β_C; 0.35 × 1.40 = 0.49 and 0.25 × 0.90 = 0.225, so 0.25 × β_C = 1.00 − 0.49 − 0.225 = 0.285; β_C = 0.285 ÷ 0.25 = 1.14; E(R_P) = R_f + β_P × MRP = 4% + 1.00 × 6% = 10% — a portfolio with β = 1 has the market's expected return.
===
11.7 Reward-to-risk ratio
The risk-free rate is 4%. Stock M has an expected return of 13% and a beta of 1.5; Stock N has an expected return of 10% and a beta of 0.9. Which statement is correct?
M is the better buy because its expected return is higher, so investors buy M until its price rises|Neither is mispriced, because M's higher return exactly compensates for its higher beta|*N pays more per unit of systematic risk, so investors buy N — its price rises and its expected return falls|N pays more per unit of risk, so its price falls until its expected return rises to M's
Reward-to-risk = (E(R) − R_f) ÷ β: M = (13% − 4%) ÷ 1.5 = 6.00%; N = (10% − 4%) ÷ 0.9 = 6.67%; N pays more for each unit of beta, so investors sell M and buy N; N's price rises and its expected return falls (M's does the opposite) until the two ratios meet.
===
11.7 CAPM
The risk-free rate is 3.5%, the expected return on the market is 10.5%, and Stock H has a beta of 1.3. What is H's required return under the CAPM?
9.10%|*12.60%|13.65%|17.15%
E(R_H) = R_f + β × [E(R_M) − R_f] = 3.5% + 1.3 × (10.5% − 3.5%) = 3.5% + 1.3 × 7% = 3.5% + 9.1% = 12.60%; (9.10% leaves out R_f; 13.65% is β × E(R_M); 17.15% uses E(R_M) instead of the risk premium.)
===
-
A portfolio has 30% in a stock with β = 1.5 and 70% in a stock with β = 0.9. The risk-free rate is 5% and the expected return on the market is 11%. What is the portfolio's expected return under the CAPM?
*11.48%|12.20%|12.92%|16.88%
β_P = 0.30 × 1.5 + 0.70 × 0.9 = 0.45 + 0.63 = 1.08; E(R_P) = R_f + β_P × [E(R_M) − R_f] = 5% + 1.08 × (11% − 5%) = 5% + 6.48% = 11.48%; (12.20% uses the simple average beta 1.2; 12.92% swaps the weights, β = 1.32; 16.88% multiplies β by E(R_M) instead of the risk premium.)
===
11.7 Security market line
Two correctly priced stocks lie on the security market line: Stock A has β = 1.2 and an expected return of 13.4%; Stock B has β = 0.7 and an expected return of 9.4%. Find the market risk premium, the risk-free rate and the expected return on the market. Then give the required return on a stock with β = 1.5. Write the formulas.
8% / 8.0% / 0.08|3.8 / 3.80 / 0.038|11.8 / 11.80 / 0.118|15.8 / 15.80 / 0.158
Slope of the SML = market risk premium = (13.4% − 9.4%) ÷ (1.2 − 0.7) = 4% ÷ 0.5 = 8%; R_f = E(R_A) − β_A × MRP = 13.4% − 1.2 × 8% = 13.4% − 9.6% = 3.8% (check: 9.4% − 0.7 × 8% = 3.8%); E(R_M) = R_f + 1 × MRP = 3.8% + 8% = 11.8%; Required return at β = 1.5: 3.8% + 1.5 × 8% = 15.8%.
===
11.7 Undervalued or overvalued
The risk-free rate is 3% and the expected return on the market is 9.5%. An analyst forecasts the following returns: Stock P (β = 0.8) 9.5%, Stock Q (β = 1.2) 10%, Stock S (β = 1.5) 12.75%. Compute each stock's CAPM required return and say whether each is undervalued, overvalued or correctly priced. Write the formula.
8.2 / 8.20 / 0.082|10.8 / 10.80 / 0.108|12.75 / 0.1275|undervalued / under-valued / underpriced|overvalued / over-valued / overpriced
MRP = 9.5% − 3% = 6.5%; Formula: E(R_i) = R_f + β_i × [E(R_M) − R_f]; P = 3% + 0.8 × 6.5% = 8.2% → forecast 9.5% is 1.3 points above the SML: undervalued; Q = 3% + 1.2 × 6.5% = 10.8% → forecast 10% is 0.8 points below: overvalued; S = 3% + 1.5 × 6.5% = 12.75% → forecast 12.75% lies on the SML: correctly priced.
===
-
Stock K has a beta of 1.2, and its expected return plots above the security market line. What should happen to it?
K is overvalued: investors sell it until its price falls back to the SML|K's beta will rise until the stock sits on the SML|Nothing — K simply carries extra unsystematic risk, which the market rewards|*K is undervalued: investors buy it, its price rises and its expected return falls until it sits on the SML
Above the SML = the asset offers more than its beta requires = undervalued (cheap); Buyers compete for it, the price rises and the expected return falls until it lies on the line; Beta does not adjust, and unsystematic risk earns no reward.
===
11.8 SML and the cost of capital
A stable water utility has a beta of 0.6. It is considering a software venture whose risk matches software firms with a beta of 1.5. The risk-free rate is 4.5% and the market risk premium is 6.5%. The venture's expected return is 12.5%. What should the utility decide? Choose, then explain.
Accept — 12.5% exceeds the utility's own required return of 8.4%|Accept — 12.5% exceeds the market's expected return of 11%|*Reject — at the venture's beta the SML requires 14.25%, so 12.5% plots below the SML|Reject — a project riskier than the firm should never be accepted
Use the project's risk, not the firm's: required return = 4.5% + 1.5 × 6.5% = 4.5% + 9.75% = 14.25%; 12.5% < 14.25% → below the SML → negative NPV at the correct discount rate → reject; The utility's own rate, 4.5% + 0.6 × 6.5% = 8.4%, would make almost any project look acceptable; A risky project is fine if it plots above the SML.
@write 3
===
-
Daon Holdings has two divisions: a water utility (β = 0.6) and a semiconductor design unit (β = 1.6). The firm's overall beta is 1.0, and it discounts every project at one firm-wide rate, 4% + 1.0 × 7% = 11%. What will this policy tend to do over time?
Reject too many semiconductor projects and accept too many utility projects|*Accept too many semiconductor projects and reject some good utility projects|Give correct decisions on average, because the two divisions' errors cancel|Nothing — shareholders bear the firm's beta, so the firm-wide rate is right for every project
Correct rates from the SML: utility = 4% + 0.6 × 7% = 8.2%; semiconductor = 4% + 1.6 × 7% = 15.2%; A semiconductor project returning 13% clears 11% but lies below the SML (needs 15.2%) — wrongly accepted; A utility project returning 10% fails 11% but lies above the SML (needs 8.2%) — wrongly rejected; The firm drifts toward riskier projects that destroy value.
===

  .cell{width:calc(var(--w, 8) * 1ch + 8px); font:inherit; font-size:0.86rem; font-variant-numeric:tabular-nums lining-nums; text-align:right; color:var(--ink); background:transparent;
    border:none; border-bottom:1px solid var(--faint); border-radius:0; padding:1px 2px; outline:none; -webkit-appearance:none; appearance:none;}
  .cell:focus{border-bottom-color:var(--ink); background:rgba(128,128,128,0.06);}
  .cell.txt{text-align:left;}
  .cell.ok{color:var(--correct); border-bottom-color:var(--correct);}
  .cell.no{color:var(--wrong); border-bottom-color:var(--wrong);}
  .fix{display:block; font-size:0.72rem; line-height:1.25; color:var(--correct); text-align:right; padding-right:2px;}

  .qside{grid-column:3; align-self:start; padding-top:28px; margin-left:var(--gap); max-width:var(--note-w); font-size:0.8rem; line-height:1.55; color:var(--ink-soft);}
  .sn-head{color:var(--faint); font-size:0.74rem; letter-spacing:0.04em; margin-bottom:4px;}
  .sn-head .ok{color:var(--correct);} .sn-head .no{color:var(--wrong);} .sn-head .part{color:var(--part);}
  .sn-line{margin:0 0 3px;}
  .sn-line .lb{font-weight:400; color:var(--ink); text-shadow:0.35px 0 0 currentColor;}

  table.t{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums lining-nums; font-size:0.86rem; line-height:1.45; color:var(--ink);}
  table.t caption{caption-side:top; text-align:left; font-size:1rem; line-height:1.3; color:var(--ink); padding:0 0 8px;}
  table.t thead th{border-top:1px solid var(--ink);}
  table.t tbody tr:last-child td{border-bottom:1px solid var(--ink);}
  table.t th, table.t td{font-weight:400; font-style:normal; color:var(--ink); padding:2px 6px; text-align:right; white-space:nowrap;}
  table.t th{border-bottom:1px solid var(--rule);}
  table.t th:first-child, table.t td:first-child{text-align:left; padding-left:0;}
  table.t td:last-child, table.t th:last-child{padding-right:0;}
  table.t tr.sec td{padding-top:10px;}
  table.t tr.tot td{border-top:1px solid var(--rule);}
  .zoomable{cursor:zoom-in;}

  .case{grid-column:1 / -1;}
  .case-ex{grid-column:1; grid-row:1 / span var(--n, 1); align-self:start; justify-self:end; position:sticky; top:calc(var(--bar-h) + 18px);
    width:min(var(--ex-w), calc(100% - var(--gap) - 16px)); margin:28px var(--gap) 0 0; max-height:calc(100vh - var(--bar-h) - 36px); overflow:auto;
    background:var(--paper); padding:22px 24px 10px; box-shadow:0 0 0 1px rgba(0,0,0,0.03), 0 10px 40px rgba(0,0,0,0.06);}
  .case-ex h2{font-size:1.2rem; font-weight:400; margin:0;}
  .case-ex .uses{font-size:0.76rem; color:var(--faint); margin:2px 0 14px;}
  .case-ex table.t{margin-bottom:30px; transition:opacity .25s;}
  .case-ex table.t.dimmed{opacity:0.32;}
  .case-ex .tables{min-width:0;}
  .case.stacked .case-ex, .case-ex.flow{overflow-x:auto;}
  .case.stacked .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:28px var(--pad) 6px;}
  .case.stacked .case-ex .tables{display:flex; flex-wrap:wrap; align-items:flex-start; gap:0 28px;}
  .case.stacked .case-ex .tables > table{flex:1 1 auto; width:auto;}

  .single-nav{display:flex; justify-content:space-between; padding-top:16px; padding-bottom:30px;}
  .single-nav .link{font-size:0.9rem;}
  .single-progress{padding-top:20px; font-size:0.8rem; color:var(--faint); text-align:center;}
  .next-ch{padding-top:10px; padding-bottom:30px; text-align:right;}

  .data-errors{max-width:var(--paper-w); margin:16px auto 0; padding:12px 18px; color:var(--wrong); font-size:0.88rem; background:var(--paper);}
  .empty-state{padding-top:60px; padding-bottom:60px; text-align:center; color:var(--ink-soft);}
  footer{padding-top:28px; padding-bottom:40px; color:var(--faint); font-size:0.78rem; text-align:center;}

  .lightbox{position:fixed; inset:0; z-index:40; background:rgba(20,20,22,0.6); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox .lb-body{background:var(--paper); padding:26px 30px; max-width:94vw; max-height:92vh; overflow:auto; min-width:min(560px,90vw);}
  .lightbox table.t{font-size:1rem;}
  .lightbox img{max-width:90vw; max-height:84vh;}

  :root{--memo-w:min(300px,86vw);}
  .memo{position:fixed; top:0; right:0; bottom:0; width:var(--memo-w); z-index:22; background:var(--paper); box-shadow:-10px 0 40px rgba(0,0,0,0.08); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; visibility:hidden;}
  body.memo-open .memo{transform:none; visibility:visible;}
  .memo-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px 10px; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);}
  .memo-head .link{text-transform:none; letter-spacing:0; margin-left:14px;}
  .memo-text{flex:1; overflow-y:auto; outline:none; white-space:pre-wrap; word-break:break-word; font-size:0.95rem; padding:6px 20px 16px;}
  .memo-text:empty::before{content:attr(data-placeholder); color:var(--faint);}
  .memo-tab{position:fixed; top:50%; right:0; z-index:22; transform:translateY(-50%); writing-mode:vertical-rl; background:var(--paper); border:none; box-shadow:0 0 0 1px var(--rule); padding:14px 6px; font-size:0.78rem; color:var(--ink-soft); cursor:pointer;}
  body.memo-open .memo-tab{display:none;}
  .tip{position:fixed; z-index:30; transform:translateX(-50%); font-size:0.78rem; color:var(--ink-soft); opacity:0; pointer-events:none; transition:opacity .12s;}
  .tip.show{opacity:1;}
  .to-top{position:fixed; left:50%; bottom:20px; z-index:20; transform:translateX(-50%); background:var(--paper); border:none; box-shadow:0 4px 20px rgba(0,0,0,0.1); border-radius:20px; padding:8px 22px; font-size:0.85rem; color:var(--ink-soft); cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s;}
  .to-top.show{opacity:1; pointer-events:auto;}

  /* phone: the exhibit goes onto the page above its questions */
  @media (max-width:699px){
    .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:28px var(--pad) 6px;}
    .case-ex .tables{display:flex; flex-wrap:wrap; align-items:flex-start; gap:0 28px;}
    .case-ex .tables > table{flex:1 1 auto; width:auto;}
  }
  @media (max-width:1000px){
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 20px;}
    .qside:empty{display:none;}
  }
  @media (max-width:760px){
    :root{--paper-w:100vw; --pad:20px;}
    .sheet::before{box-shadow:none;}
    header{padding-top:40px;} header h1{font-size:1.8rem;}
  }

  /* tablet split view: exhibit panel on the left, questions on the right (keep this query in sync with SPLIT_MQ in the script) */
  @media (min-width:700px) and (max-width:1500px), (min-width:700px) and (hover:none) and (pointer:coarse){
    :root{--pad:34px;}
    .sheet::before{width:100%; box-shadow:none;}
    .pg{grid-template-columns:minmax(0,1fr) min(760px,100%) minmax(0,1fr);}
    .scorebar{width:100%;}
    .scorebar .in{max-width:760px; margin:0 auto;}
    header{padding-top:44px;}
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 20px;}
    .qside:empty{display:none;}
    .case{grid-template-columns:minmax(0,9fr) minmax(0,11fr); margin-top:8px;}
    .case > .qmain, .case > .qside{grid-column:2;}
    .case-ex, .case.stacked .case-ex{grid-column:1; grid-row:1 / span var(--n2, 2); align-self:start; justify-self:stretch; position:sticky; top:calc(var(--bar-h) + 12px);
      width:auto; margin:12px 4px 12px 16px; max-height:calc(100vh - var(--bar-h) - 24px); max-height:calc(100dvh - var(--bar-h) - 24px);
      overflow:auto; overscroll-behavior:contain; padding:20px 22px 6px; background:var(--paper); box-shadow:0 0 0 1px var(--rule), 0 8px 28px rgba(0,0,0,0.06);}
    .case-ex .tables, .case.stacked .case-ex .tables{display:block;}
    .case-ex table.t, .case.stacked .case-ex .tables > table{width:100%; font-size:0.82rem; margin-bottom:26px;}
    .case-ex h2{font-size:1.1rem;}
  }
  @media (min-width:700px) and (max-width:999px){
    :root{--pad:24px;}
    .case{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
    .case-ex, .case.stacked .case-ex{margin-left:10px; padding:16px 16px 4px;}
    .qtext{font-size:1.02rem;}
    .cell{font-size:0.82rem;}
  }

  #printSheet{display:none;}
  @page{size:A4 portrait; margin:22mm 20mm 20mm; @bottom-center{content:counter(page); font-family:Georgia,"Times New Roman",serif; font-size:9pt;}}
  @media print{
    html, body{background:#fff !important; color:#000 !important; padding:0 !important; margin:0 !important;}
    body > *:not(#printSheet){display:none !important;}
    #printSheet{display:block; font-family:var(--serif); font-size:10pt; line-height:1.42; color:#000;}
    #printSheet h1{font-size:12.5pt; font-weight:400; text-align:center; margin:0 0 7mm;}
    #printSheet .p-q{break-inside:avoid; page-break-inside:avoid; margin:0 0 4.5mm;}
    #printSheet .p-q p{margin:0;}
    #printSheet .p-ref{color:#444;}
    #printSheet .p-opt{margin:0 0 0 5mm !important;}
    #printSheet .p-fig{margin:1.5mm 0 2mm; max-width:130mm;}
    #printSheet .p-lines{height:calc(var(--n, 3) * 7mm); background-image:linear-gradient(to bottom, transparent calc(7mm - 0.2mm), #bbb calc(7mm - 0.2mm)); background-size:100% 7mm; -webkit-print-color-adjust:exact; print-color-adjust:exact; margin-top:1mm;}
    #printSheet .p-gridq{margin:2mm 0 1mm;}
    #printSheet .p-gridq table.t{margin-bottom:3mm;}
    #printSheet table.grid td{height:7mm; vertical-align:middle;}
    #printSheet table.grid td.p-blank{min-width:22mm; border:0.2mm solid #999 !important; background:#fff;}
    #printSheet .p-ex{break-inside:avoid; page-break-inside:avoid; border-top:0.3mm solid #000; border-bottom:0.3mm solid #000; padding:3mm 0 1mm; margin:2mm 0 6mm;}
    #printSheet .p-ex h2{font-size:12.5pt; font-weight:400; margin:0;}
    #printSheet .p-ex .uses{font-size:9pt; margin:0 0 3mm; font-style:italic; color:#333;}
    #printSheet .p-ex .tables{display:flex; flex-wrap:wrap; gap:4mm 8mm; align-items:flex-start;}
    #printSheet .p-ex .tables > table{flex:1 1 0;}
    #printSheet table.t{font-size:9pt; color:#000;}
    #printSheet table.t caption{color:#000; font-size:10pt; padding-bottom:1.5mm;}
    #printSheet table.t thead th{border-top:0.35mm solid #000;}
    #printSheet table.t tbody tr:last-child td{border-bottom:0.35mm solid #000;}
    #printSheet table.t th, #printSheet table.t td{color:#000;}
    #printSheet table.t th{ border-bottom:0.3mm solid #000; padding:0.8mm 1.5mm;}
    #printSheet table.t td{padding:0.4mm 1.5mm; border-bottom:0.1mm solid #ddd;}
    #printSheet table.t tr.sec td{color:#000; border-bottom:none; padding-top:2mm;}
    #printSheet table.t tr.tot td{border-top:0.25mm solid #000;}
    #printSheet table.t td.kcell{font-style:italic;}
    #printSheet .p-key{break-before:page; page-break-before:always;}
    #printSheet .p-letters{columns:4; font-size:10pt;}
    #printSheet .p-sol{display:none;}
    body.print-solution #printSheet .p-letters{display:none;}
    body.print-solution #printSheet .p-sol{display:block; column-count:2; column-gap:9mm; font-size:9pt; line-height:1.3;}
    #printSheet .p-s{break-inside:avoid; margin:0 0 3mm;}
    #printSheet .p-s.wide{column-span:all;}
    #printSheet .p-s p{margin:0;}
    #printSheet .p-s table.t{font-size:8.6pt; margin:1mm 0 2mm;}
    #printSheet .p-kw{font-style:italic; color:#333;}
    #printSheet .sn-line .lb{font-weight:400; text-shadow:0.3px 0 0 currentColor;}
  }
</style>

<body>

<div class="sheet" id="sheet">
  <header class="pg"><div class="inpage">

    <p class="sub" id="quizSub"></p>
    <div class="tools">
      <button class="link" id="allChBtn" type="button">All chapters</button>
      <button class="link" id="printBtn" type="button">Print</button>

<div class="setrow" id="settings">
        <button class="link" id="layoutToggleBtn" type="button">Single question view</button>
        <button class="link" id="examModeBtn" type="button">Exam mode</button>

    <div class="tally">Answered <b id="answeredCount">0</b>/<span id="totalCount">0</span> · Correct <b id="correctCount">0</b> <span id="modeLabel"></span></div>
    <div class="bar-links">
      <button class="link on" id="allViewBtn" type="button">All</button>

</div>

  <div class="memo-head"><span>Memo</span><span><button class="link" id="memoBold" type="button" style="font-weight:700">B</button><button class="link" id="memoClose" type="button">Close</button></span></div>
  <div class="memo-text" id="memoText" contenteditable="true" spellcheck="false" data-placeholder="Notes…  Ctrl+B bold"></div>
</aside>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const mathFm = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);
const fm = t => String(t).split(/`([^`]+)`/).map((p, i) => i % 2 ? `<code class="ic">${esc(p)}</code>` : mathFm(p)).join('');
const plain = t => String(t).replace(/\\([_^])/g, '$1').replace(/\^\{([^}]*)\}/g, '^$1').replace(/_\{([^}]*)\}/g, '_$1');

/* explanation -> one line per item; a short leading label in semibold */
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}

function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = (rows.shift() || '').split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

/* ---------- fill-in tables ---------- */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
function parseNum(s){
  let t = String(s).trim().replace(/[−–—]/g, '-').replace(/[$,\s]/g, '');
  let neg = false; const m = /^-?\((.*)\)$/.exec(t); if(m){ neg = true; t = m[1]; }
  let pct = false; if(t.endsWith('%')){ pct = true; t = t.slice(0, -1); }
  if(t.startsWith('+')) t = t.slice(1);
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  let v = parseFloat(t); if(neg) v = -v;
  return { v, pct };
}
const ZERO = /^\s*(0|0\.0+|[-−–—])\s*$/;
function matchCell(val, b){
  const s = String(val || '').trim(); if(!s) return false;
  return b.alts.some(alt => {
    const k = parseNum(alt);
    if(!k) return !!norm(alt) && norm(alt) === norm(s);
    if(k.v === 0 && ZERO.test(s)) return true;
    const x = parseNum(s); if(!x) return false;
    const tol = Math.max(Math.abs(k.v) * 0.002, 0.006);
    const cands = [x.v]; if(k.pct && !x.pct && Math.abs(x.v) <= 1.5) cands.push(x.v * 100);
    return cands.some(v => b.absOK ? Math.abs(Math.abs(v) - Math.abs(k.v)) <= tol : Math.abs(v - k.v) <= tol);
  });
}
function gridify(t, blanks){
  t.grid = true;
  t.rows.forEach(r => {
    if(r.sec) return;
    const label = r.cells[0] || '';
    r.cells = r.cells.map((c, ci) => {
      if(c[0] !== '?') return c;
      const key = c.slice(1).trim(), alts = key.split(' / ').map(s => s.trim()).filter(Boolean);
      const num = !!parseNum(alts[0] || '');
      const b = { alts, disp: alts[0] || '', num, absOK: /^\s*([−–-]|less\b)/i.test(label), w: Math.max(6, (alts[0] || '').length + 1), label: `${label} · ${t.head[ci] || ''}` };
      blanks.push(b);
      return { blank: b, k: blanks.length - 1 };
    });
  });
  return t;
}
function gridHTML(t, mode){   /* mode: 'input' (screen), 'print' (empty boxes), 'key' (answers filled in) */
  const n = t.head.length;
  const cell = c => {
    if(typeof c === 'string') return `<td>${fm(c)}</td>`;
    if(mode === 'key') return `<td class="kcell">${fm(c.blank.disp)}</td>`;
    if(mode === 'print') return '<td class="p-blank"></td>';
    return `<td class="bcell"><input class="cell${c.blank.num ? '' : ' txt'}" data-k="${c.k}" style="--w:${c.blank.w}" inputmode="${c.blank.num ? 'decimal' : 'text'}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(c.blank.label)}"></td>`;
  };
  return `<table class="t grid">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(cell).join('')}</tr>`).join('') + '</tbody></table>';
}
const gridText = (t, vals) => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.map(c => typeof c === 'string' ? c : (vals ? (vals[c.k] || '___') + (vals.mark ? vals.mark(c) : '') : c.blank.disp)).join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], chapters = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L.length === 1 && L[0].startsWith('# ')){ chapters.push({ title: L[0].slice(2).trim(), idx: [] }); return; }
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      const tbls = L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5)));
      if(!tbls.length) errs.push(`exhibit ${id}: needs at least one @tbl line`);
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls };
      return;
    }
    if(!chapters.length) chapters.push({ title: meta.title || 'Quiz', idx: [] });
    const ch = chapters.length - 1;
    chapters[ch].seen = (chapters[ch].seen || 0) + 1;
    const who = `${chapters[ch].title} · Q${chapters[ch].seen}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, options or key results, explanation) - check for a missing ===`); return; }
    if(L[0] === '-' && !prevTag) errs.push(`${who}: tag "-" has no previous tag`);
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    const raw3 = L[2].split('|');
    const kind0 = raw3.some(o => o.trim().startsWith('*')) ? 'mc' : 'written';
    const q = { tag, text: L[1], explain: L[3], ch, who, kind: kind0, options: [], correct: 0, kws: [], self: false, grids: [], blanks: [], fig: null, use: null, focus: null, write: 0, lines: 0 };
    if(kind0 === 'mc'){
      q.options = raw3.map((o, i) => { o = o.trim(); if(o.startsWith('*')){ q.correct = i; return o.slice(1).trim(); } return o; });
      const stars = raw3.filter(o => o.trim().startsWith('*')).length;
      if(stars !== 1) errs.push(`${who}: exactly one option must start with * (found ${stars})`);
      if(q.options.length < 2 || q.options.length > 4) errs.push(`${who}: ${q.options.length} options (use 2-4)`);
      if(q.options.some(o => !o)) errs.push(`${who}: empty option`);
    } else if(L[2] !== '~'){
      q.kws = raw3.map(g => g.split(' / ').map(s => s.trim()).filter(Boolean));
      if(q.kws.some(g => !g.length)) errs.push(`${who}: empty key-result group`);
    }
    let linesN = null, short = false;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) q.use = l.slice(5).trim();
      else if(l.startsWith('@focus ')){ q.focus = l.slice(7).split(',').map(s => parseInt(s, 10) - 1); if(q.focus.some(n => !(n >= 0))) errs.push(`${who}: @focus needs table numbers such as "@focus 2" or "@focus 1,3"`); }
      else if(l.startsWith('@tbl ')) q.fig = { type: 'tbl', t: parseTbl(l.slice(5)) };
      else if(l.startsWith('@img ')) q.fig = { type: 'img', src: l.slice(5).trim() };
      else if(l.startsWith('@grid ')) q.grids.push(gridify(parseTbl(l.slice(6)), q.blanks));
      else if(l === '@write' || l.startsWith('@write ')) q.write = Math.min(8, parseInt(l.slice(6), 10) || 2);
      else if(l.startsWith('@lines ')) linesN = parseInt(l.slice(7), 10) || 0;
      else if(l === '@short') short = true;
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…" (use @use, @focus, @tbl, @img, @grid, @write, @lines or @short)`);
    });
    if(q.kind === 'mc' && q.grids.length) errs.push(`${who}: @grid belongs to a written question (line 3 = key results or ~), not to MC`);
    if(q.kind === 'written' && q.write) errs.push(`${q.who}: @write is for MC questions; use @lines for a written question`);
    if(q.kind === 'written' && q.grids.length) q.kind = 'grid';
    if(q.kind === 'grid' && !q.blanks.length) errs.push(`${who}: @grid has no blank cells (start a cell with ?)`);
    q.self = q.kind === 'written' && !q.kws.length;
    const steps = explLines(q.explain).length;
    const calc = /=\s*[−\-$(]?\d/.test(q.explain);
    /* print space = what a handwritten answer needs (1 line ≈ 1 step), not the length of the model answer */
    q.lines = q.kind === 'mc' ? q.write : linesN !== null ? Math.min(8, linesN) : short ? 2 : q.kind === 'grid' ? 2 : (!calc && steps <= 2) ? 2 : Math.min(8, Math.max(3, steps));
    if(q.focus && !q.use) errs.push(`${who}: @focus without @use`);
    chapters[ch].idx.push(questions.length);
    q.n = chapters[ch].idx.length;
    questions.push(q);
  });
  questions.forEach(q => {
    if(q.use && !cases[q.use]) errs.push(`question ${q.n}: @use ${q.use} but no "@case ${q.use}" block exists`);
    else if(q.use && q.focus && q.focus.some(n => n >= cases[q.use].tbls.length)) errs.push(`${q.who}: @focus ${q.focus.map(n => n + 1).join(',')} but exhibit ${q.use} has ${cases[q.use].tbls.length} table(s)`);
  });
  chapters.filter(c => !c.idx.length).forEach(c => errs.push(`chapter "${c.title}" has no questions`));
  if(!questions.length) errs.push('no questions found');
  const good = chapters.filter(c => c.idx.length);
  return { meta, questions, cases, chapters: good.length ? good : [{ title: meta.title || 'Quiz', idx: [] }], errs };
}

const PARSED = parseQuizData(document.getElementById('quizData').textContent);
const META = PARSED.meta, QUIZ_TITLE = META.title || 'Quiz', QUESTIONS = PARSED.questions, CHAPTERS = PARSED.chapters, CASES = PARSED.cases, NQ = QUESTIONS.length;

const $ = id => document.getElementById(id);

document.title = QUIZ_TITLE;
$('quizFooter').textContent = `${META.subject || ''} — ${META.textbook || ''}`;

let activeCh = 0, viewAll = false, pickNums = null;

const chLabel = ci => { const t = CHAPTERS[ci].title, m = /^\s*(?:chapter|ch\.?|week|lecture)\s*(\d+)/i.exec(t); return m ? 'Ch.' + m[1] : t; };
const qno = i => viewAll ? i + 1 : QUESTIONS[i].n;   // "All chapters" view and its printout: one running number 1..N, no chapter breaks

/* ---------- state ---------- */
let current = 0, filterMode = 'all', layoutMode = 'list', reviewList = [], flagList = [];
let answered = new Array(NQ).fill(null);                                  /* MC: option index, -1 = unanswered in a graded exam */
let drafts = new Array(NQ).fill('');                                      /* written box (MC + write, written, table) */
let cells = QUESTIONS.map(q => q.blanks.map(() => ''));                   /* table cells */
let snap = new Array(NQ).fill(null);                                      /* written: { html, cells } once checked */
const missed = new Set(), flagged = new Set();
let examMode = false;
let examPick = new Array(NQ).fill(null), examGraded = new Array(NQ).fill(false), examRes = new Array(NQ).fill(null);
const isMC = qi => QUESTIONS[qi].kind === 'mc';
const examActive = qi => examMode && !examGraded[qi];
const setOn = (btn, on) => { btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on)); };
const quizEl = $('quiz'), reviewBtn = $('reviewBtn'), flagBtn = $('flagBtn'), copyMissedBtn = $('copyMissedBtn'), reviewBanner = $('reviewBanner');

/* ---------- checking written answers ---------- */
const PASS_TEXT = 0.6, PASS_GRID = 0.8;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const isShort = alt => /^[\x00-\x7f]+$/.test(alt) && norm(alt).length <= 4;
const shortRe = alt => new RegExp('(^|[^a-z0-9.,])' + reEsc(alt.toLowerCase()).replace(/\s+/g, '\\s*') + '($|[^a-z0-9.,]|[.,](?![0-9]))', 'i');
function altMatch(alt, text){ const n = norm(alt); if(!n) return false; return isShort(alt) ? shortRe(alt).test(text) : norm(text).includes(n); }
function findRange(alt, full){
  const n = norm(alt);
  if(!n) return null;
  if(isShort(alt)){ const m = shortRe(alt).exec(full); return m ? [m.index + m[1].length, m.index + m[0].length - m[2].length] : null; }
  let ns = ''; const idx = [];
  for(let i = 0; i < full.length; i++){ const c = full[i].toLowerCase(); if(/[a-z0-9가-힣]/.test(c)){ ns += c; idx.push(i); } }
  const p = ns.indexOf(n);
  return p < 0 ? null : [idx[p], idx[p + n.length - 1] + 1];
}
const htmlToText = h => { const d = document.createElement('div'); d.innerHTML = String(h).replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(div|p)[^>]*>/gi, '\n'); return d.textContent; };
function grade(qi){
  const q = QUESTIONS[qi], s = snap[qi];
  if(q.kind === 'mc' || s === null) return null;
  if(q.self) return { self: true };
  const text = htmlToText(s.html);
  const kwHits = q.kws.map(g => g.some(a => altMatch(a, text)));
  const cellHits = q.blanks.map((b, k) => matchCell(s.cells[k], b));
  const n = kwHits.filter(Boolean).length + cellHits.filter(Boolean).length, t = kwHits.length + cellHits.length;
  return { kwHits, cellHits, n, t, pass: t > 0 && n / t >= (q.blanks.length ? PASS_GRID : PASS_TEXT) };
}
/* 2 = correct / passed, 1 = partly, 0 = wrong / not yet, 's' = self-check shown, null = not answered */
function resultOf(qi){
  if(isMC(qi)) return answered[qi] === null ? null : answered[qi] === QUESTIONS[qi].correct ? 2 : 0;
  const g = grade(qi); if(!g) return null; if(g.self) return 's';
  return g.pass ? 2 : g.n ? 1 : 0;
}
const hasDraft = qi => !!htmlToText(drafts[qi]).trim() || cells[qi].some(c => String(c).trim());
const isAnswered = qi => isMC(qi) ? (examActive(qi) ? examPick[qi] !== null : answered[qi] !== null && answered[qi] !== -1) : (examActive(qi) ? hasDraft(qi) : snap[qi] !== null);
const isWrong = qi => { const r = resultOf(qi); return r === 0 || r === 1; };
const wrongIndices = () => scopeIdx().filter(isWrong);
const visibleIndices = () => filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : scopeIdx();
function resetForRetry(i){ if(isMC(i)) answered[i] = null; else snap[i] = null; }
function markIn(el, groups, cls){   /* underline the first occurrence of each listed wording group inside an element */
  const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while(w.nextNode()) nodes.push(w.currentNode);
  const starts = []; let full = '';
  nodes.forEach(n => { starts.push(full.length); full += n.nodeValue + '\n'; });
  const rr = [];
  groups.forEach(grp => { for(const a of grp){ const r = findRange(a, full); if(r){ rr.push(r); break; } } });
  rr.sort((a, b) => b[0] - a[0]);
  let limit = Infinity;
  rr.forEach(([s, e]) => {
    if(e > limit) return; limit = s;
    for(let k = nodes.length - 1; k >= 0; k--){
      const ns = starts[k], len = nodes[k].nodeValue.length, a = Math.max(s, ns) - ns, b = Math.min(e, ns + len) - ns;
      if(b <= a) continue;
      let node = nodes[k];
      if(b < len) node.splitText(b);
      if(a > 0) node = node.splitText(a);
      const sp = document.createElement('span'); sp.className = 'mk ' + cls; node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
  });
}
const richHtml = node => { const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['DIV', 'P'].includes(c.nodeName) ? '<div>' + out(c) + '</div>' : out(c)).join(''); return out(node); };
const cleanHtml = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };

function ranges(nums){
  const a = [...nums].sort((x, y) => x - y), out = [];
  for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; }
  return out.join(', ');
}
function exhibitHTML(id, idx){
  const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(qno);
  return `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p><div class="tables">${c.tbls.map(tblHTML).join('')}</div>`;
}
const lightbox = $('lightbox'), lbBody = $('lbBody');
lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ lbBody.innerHTML = html; lightbox.classList.add('show'); }
const figHTML = f => f.type === 'img' ? `<img src="${esc(f.src)}" alt="Figure" style="max-width:100%">` : tblHTML(f.t);

function qaText(qi){
  const q = QUESTIONS[qi], L = i => String.fromCharCode(97 + i);
  const ex = q.use ? `[Exhibit ${q.use}: ${CASES[q.use].title}]\n` + CASES[q.use].tbls.map(tblText).join('\n') + '\n' : '';
  let s = ex + `Q${qno(qi)}. ${q.text}\n` + (q.fig && q.fig.type === 'tbl' ? tblText(q.fig.t) + '\n' : '');
  if(q.kind === 'mc'){
    s += q.options.map((o, i) => `${L(i)}. ${o}`).join('\n') + `\nAnswer: ${L(q.correct)}. ${q.options[q.correct]}\n`;
    if(drafts[qi].trim()) s += `My explanation:\n${htmlToText(drafts[qi]).trim()}\n`;
    return s + `Explanation:\n${explLines(q.explain).join('\n')}`;
  }
  const g = grade(qi);
  if(q.grids.length){
    const vals = Object.assign([...cells[qi]], { mark: c => g && !g.self ? (g.cellHits[c.k] ? ' ✓' : ` ✗ (${c.blank.disp})`) : '' });
    s += 'My table:\n' + q.grids.map(t => gridText(t, vals)).join('\n') + '\n';
  }
  if(htmlToText(drafts[qi]).trim()) s += `My answer:\n${htmlToText(drafts[qi]).trim()}\n`;
  if(g && !g.self && q.kws.length) s += 'Key results: ' + q.kws.map((k, i) => (g.kwHits[i] ? '[x] ' : '[ ] ') + k[0]).join('  ') + '\n';
  return s + `Model answer:\n${explLines(q.explain).join('\n')}`;
}

/* ---------- one question = a block on the page (.qmain) + a side note in the margin (.qside) ---------- */
function headNode(qi, retry){
  const q = QUESTIONS[qi];
  const head = document.createElement('div'); head.className = 'qhead';
  const kl = q.kind === 'grid' ? 'table' : q.kind === 'written' ? 'written' : q.write ? 'MC + written' : '';
  head.innerHTML = `<span class="qnum">${qno(qi)}</span>` + (CHAPTERS.length > 1 ? `<span>${esc(chLabel(q.ch))} ·</span>` : '') + `<span class="qtag">${fm(q.tag)}</span>` +
    (kl ? `<span class="kind">· ${kl}</span>` : '') + (q.use ? `<span class="exref">· Exhibit ${esc(q.use)}</span>` : '') + (retry ? '<span class="retry">· retry</span>' : '');
  const tools = document.createElement('span'); tools.className = 'qtools';
  const done = q.kind === 'mc' ? answered[qi] !== null : snap[qi] !== null;
  if(!examActive(qi) && done){
    const cp = document.createElement('span'); cp.className = 'qcopy'; cp.setAttribute('role', 'button'); cp.textContent = 'copy'; cp.title = 'Copy question, answer and explanation';
    cp.addEventListener('click', e => { e.stopPropagation(); copyText(qaText(qi)).then(() => showTip(cp, 'Copied'), () => showTip(cp, 'Copy failed')); });
    tools.appendChild(cp);
  }
  const fl = document.createElement('span');
  fl.className = 'qflag' + (flagged.has(qi) ? ' on' : ''); fl.setAttribute('role', 'button'); fl.textContent = 'review'; fl.title = 'Mark for review';
  fl.addEventListener('click', e => { e.stopPropagation(); const on = !flagged.has(qi); on ? flagged.add(qi) : flagged.delete(qi); fl.classList.toggle('on', on); updateChrome(); });
  tools.appendChild(fl); head.appendChild(tools);
  return head;
}
function answerBox(qi, placeholder, rows){
  const ed = document.createElement('div'); ed.className = 'answer'; ed.contentEditable = 'true'; ed.spellcheck = false;
  ed.setAttribute('role', 'textbox'); ed.setAttribute('aria-multiline', 'true'); ed.dataset.placeholder = placeholder;
  ed.style.setProperty('--rows', String(rows));

  ed.addEventListener('input', () => { drafts[qi] = richHtml(ed); if(examActive(qi)) updateChrome(); });
  ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
  ed.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !isMC(qi)){ e.preventDefault(); check(qi); } });

}
function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];
  const main = document.createElement('div');
  main.className = 'qmain inpage' + (first ? ' first' : '');
  main.dataset.index = qi;

}
function mcBody(qi, main, side){
  const q = QUESTIONS[qi];
  const opts = document.createElement('div'); opts.className = 'options';
  q.options.forEach((o, oi) => {
    const b = document.createElement('div'); b.className = 'opt'; b.setAttribute('role', 'button');
    b.innerHTML = `<span class="optnum">${oi + 1}</span><span>${fm(o)}</span>`;
    if(examActive(qi)){ if(examPick[qi] === oi) b.classList.add('picked'); }

    b.addEventListener('click', () => { if(String(window.getSelection())) return; selectAnswer(qi, oi); });

  });

    side.innerHTML = `<div class="sn-head"><span class="${ok ? 'ok' : 'no'}">${ok ? 'Correct' : answered[qi] === -1 ? 'Not answered' : 'Incorrect'}</span> · answer ${q.correct + 1}</div>${fmtExpl(q.explain)}`;
  }
}
function writtenBody(qi, main, side){
  const q = QUESTIONS[qi], g = examActive(qi) ? null : grade(qi);
  q.grids.forEach(t => {
    const w = document.createElement('div'); w.className = 'gridwrap'; w.innerHTML = gridHTML(t, 'input');
    w.querySelectorAll('input.cell').forEach(inp => {
      const k = +inp.dataset.k; inp.value = cells[qi][k] || '';
      inp.addEventListener('focus', () => { current = qi; focusExhibit(qi, 'smooth'); });
      inp.addEventListener('input', () => { cells[qi][k] = inp.value; if(examActive(qi)) updateChrome(); });
      inp.addEventListener('keydown', e => {

        if(i < all.length - 1) all[i + 1].focus(); else { const ed = main.querySelector('.answer'); if(ed) ed.focus(); }
      });
      if(g && !g.self){
        const ok = g.cellHits[k]; inp.classList.add(ok ? 'ok' : 'no');
        if(!ok){ const fx = document.createElement('span'); fx.className = 'fix'; fx.innerHTML = fm(q.blanks[k].disp); inp.after(fx); }
      }
    });
    main.appendChild(w);
  });
  const ed = answerBox(qi, q.grids.length ? 'Working (formulas, NPV / IRR, decision)…' : 'Write the formulas and your working here…', q.lines <= 3 ? 2 : Math.min(5, Math.ceil(q.lines / 2)));
  main.appendChild(ed);
  if(g && !g.self && q.kws.length) markIn(ed, q.kws.filter((_, i) => g.kwHits[i]), 'ok');
  const acts = document.createElement('div'); acts.className = 'acts';
  if(!examActive(qi)){
    const cb = document.createElement('button'); cb.type = 'button'; cb.className = 'link'; cb.style.color = 'var(--ink)';
    cb.textContent = q.self ? (snap[qi] ? 'Model answer shown' : 'Show model answer') : snap[qi] !== null ? 'Check again' : 'Check';
    cb.addEventListener('click', () => check(qi)); acts.appendChild(cb);
    if(snap[qi] !== null){
      const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'link'; rb.textContent = 'Hide answer';

      `<div class="sn-head"><span class="${g.pass ? 'ok' : g.n ? 'part' : 'no'}">${g.pass ? 'Passed' : g.n ? 'Partly' : 'Not yet'}</span> · ${g.n} of ${g.t} ${what}</div>`) + fmtExpl(q.explain);

function caseSection(id, qis, idxForNums, retry){

/* split view (tablet): keep this query in sync with the CSS media query of the same name */
const SPLIT_MQ = window.matchMedia('(min-width:700px) and (max-width:1500px), (min-width:700px) and (hover:none) and (pointer:coarse)');
function fitExhibits(){   /* desktop: an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    if(SPLIT_MQ.matches) return;
    const ex = sec.querySelector('.case-ex');
    if(ex && getComputedStyle(ex).position === 'sticky' && ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);

/* the exhibit follows the question: scroll the exhibit panel to the table(s) named by @focus and dim the others */
function focusExhibit(qi, behavior){
  const q = QUESTIONS[qi]; if(!q || !q.use) return;
  const main = quizEl.querySelector(`.qmain[data-index="${qi}"]`); if(!main) return;
  const sec = main.closest('.case'), ex = sec && sec.querySelector('.case-ex'); if(!ex) return;
  const tables = [...ex.querySelectorAll('.tables > table')];
  const panel = getComputedStyle(ex).position === 'sticky';
  const keep = panel && q.focus && tables.length > 1 ? new Set(q.focus) : null;
  tables.forEach((t, ti) => t.classList.toggle('dimmed', !!keep && !keep.has(ti)));
  if(!panel || !q.focus || !tables[q.focus[0]]) return;
  const target = tables[q.focus[0]], last = tables[q.focus[q.focus.length - 1]];
  const exTop = ex.getBoundingClientRect().top, rT = target.getBoundingClientRect(), rL = last.getBoundingClientRect();
  if(rT.top >= exTop + 12 && rL.bottom <= exTop + ex.clientHeight) return;   /* already fully in view: leave the panel alone */
  const top = q.focus[0] === 0 ? 0 : rT.top - exTop + ex.scrollTop - 14;
  ex.scrollTo({ top: Math.max(0, top), left: 0, behavior: behavior || 'smooth' });
}
let exRaf = 0, lastExQ = -1;
function syncExhibit(force){
  let qi = -1;

  else {
    const line = window.innerHeight * 0.42; let bd = Infinity;
    quizEl.querySelectorAll('.case .qmain').forEach(el => {
      const r = el.getBoundingClientRect(); if(r.bottom < 0 || r.top > window.innerHeight) return;
      const d = r.top <= line && r.bottom >= line ? 0 : Math.min(Math.abs(r.top - line), Math.abs(r.bottom - line));
      if(d < bd){ bd = d; qi = +el.dataset.index; }
    });
  }

  if(qi !== lastExQ || force){ lastExQ = qi; focusExhibit(qi, force ? 'auto' : 'smooth'); }
}

const onSplitChange = () => { fitExhibits(); syncExhibit(true); };
if(SPLIT_MQ.addEventListener) SPLIT_MQ.addEventListener('change', onSplitChange); else if(SPLIT_MQ.addListener) SPLIT_MQ.addListener(onSplitChange);

const nextChapterIdx = () => (!viewAll && !pickNums && filterMode === 'all' && CHAPTERS.length > 1 && activeCh < CHAPTERS.length - 1) ? activeCh + 1 : -1;

    updateChrome(); return;
  }

    const pos = Math.max(0, vis.indexOf(current)), qi = vis[pos];
    current = qi;
    const pr = document.createElement('div'); pr.className = 'single-progress inpage'; pr.textContent = `${pos + 1} / ${vis.length}`; quizEl.appendChild(pr);
    const q = QUESTIONS[qi];
    if(q.use){ const sec = caseSection(q.use, [qi], vis, retry); sec.querySelector('.qmain').classList.add('first'); quizEl.appendChild(sec); }
    else questionNodes(qi, true, retry).forEach(n => quizEl.appendChild(n));
    const nav = document.createElement('div'); nav.className = 'single-nav inpage';
    const prev = document.createElement('button'); prev.className = 'link'; prev.textContent = '← Previous'; prev.disabled = pos === 0; prev.addEventListener('click', goPrev);
    const nc = nextChapterIdx(), last = pos === vis.length - 1;
    const next = document.createElement('button'); next.className = 'link'; next.style.color = 'var(--ink)'; next.textContent = last && nc > -1 ? `Next chapter: ${chLabel(nc)} →` : 'Next →'; next.disabled = last && nc < 0;
    next.addEventListener('click', () => { if(last && nc > -1) switchChapter(nc); else goNext(); });
    nav.appendChild(prev); nav.appendChild(next); quizEl.appendChild(nav);
  } else {
    let prevCh = -1, first = true;

      const qi = vis[k], q = QUESTIONS[qi];

function selectAnswer(qi, oi){

document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('textarea, input, [contenteditable]')) return;

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
function parseNums(txt){
  const t = txt.replace(/[，、;；]/g, ',').replace(/[–—~～]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t) return { empty: true };
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){
    let m;
    if(/^\d+$/.test(tok)) out.add(+tok);
    else if((m = tok.match(/^(\d+)-(\d+)$/)) && +m[1] <= +m[2]){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); }
    else return { err: `Not recognised: "${tok}"` };
  }
  return { set: out };
}
function clearPick(silent){ pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); if(!silent){ filterMode = 'all'; current = scopeIdx()[0]; render(); smoothTop(); } }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const r = parseNums(qSearch.value);
  if(r.empty){ clearPick(false); return; }
  if(r.err){ qBad(r.err); return; }
  const have = new Set(baseIdx().map(qno)), miss = [...r.set].filter(n => !have.has(n));
  if(miss.length){ qBad(`No question ${miss.slice(0, 6).join(', ')} (1–${Math.max(...have)})`); return; }
  qBad(''); pickNums = r.set; qForm.classList.add('active'); qSearch.value = [...r.set].sort((a, b) => a - b).join(', ');
  filterMode = 'all'; reviewList = []; current = scopeIdx()[0]; render(); smoothTop();
});

function sheetHtml(title, idx){
  const L = i => String.fromCharCode(97 + i);
  let html = `<h1>${esc(title)}</h1>`, lastCase = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== lastCase) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    lastCase = q.use;
    html += `<div class="p-q"><p>${qno(qi)}. ${q.use ? `<span class="p-ref">[Exhibit ${esc(q.use)}]</span> ` : ''}${fm(q.text)}</p>` + (q.fig ? `<div class="p-fig">${figHTML(q.fig)}</div>` : '') +
      (q.kind === 'mc' ? q.options.map((o, oi) => `<p class="p-opt">${L(oi)}. ${fm(o)}</p>`).join('') : '') +
      (q.grids.length ? `<div class="p-gridq">${q.grids.map(t => gridHTML(t, 'print')).join('')}</div>` : '') +
      (q.lines ? `<div class="p-lines" style="--n:${q.lines}"></div>` : '') + '</div>';
  });
  const mcs = idx.filter(isMC);
  html += `<div class="p-key"><h1>${esc(title)} — Answers</h1><div class="p-letters">` + mcs.map(qi => `<div>${qno(qi)}. ${L(QUESTIONS[qi].correct)}</div>`).join('') +
    (idx.length > mcs.length ? `<div>Written ${ranges(idx.filter(i => !isMC(i)).map(qno))}: see “Print with solution”</div>` : '') +
    '</div><div class="p-sol">' + idx.map(qi => {
      const q = QUESTIONS[qi];
      const head = q.kind === 'mc' ? `<b>${qno(qi)}. ${L(q.correct)}</b>` : `<b>${qno(qi)}.</b> ${fm(q.tag)}`;
      return `<div class="p-s${q.grids.length ? ' wide' : ''}"><p>${head}${q.use ? ` [Exhibit ${esc(q.use)}]` : ''}</p>${q.grids.map(t => gridHTML(t, 'key')).join('')}${fmtExpl(q.explain)}` +
        (q.kws.length ? `<p class="p-kw">Key results: ${q.kws.map(k => fm(k[0])).join(' · ')}</p>` : '') + '</div>';
    }).join('') + '</div></div>';
  return html;
}

memoTab.addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const saveBtn = $('saveBtn');
const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'integratedQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.kind + '|' + q.text + '|' + q.options.join('|') + '|' + q.correct + '|' + q.kws.map(k => k.join('/')).join('|') + '|' + q.blanks.map(b => b.alts.join('/')).join('|')).join('\n'));
saveBtn.addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, t: Date.now(), answered, drafts, cells, snap, missed: [...missed], flagged: [...flagged], activeCh, current, examMode, examPick, examGraded, examRes, memo: memoHtml() })); showTip(saveBtn, 'Saved'); }
  catch(e){ showTip(saveBtn, 'Save failed'); }
});
function loadProgress(){
  let d; try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ return false; }
  if(!d) return false;
  if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = memoHtml(); }
  if(d.sig !== SAVE_SIG || !Array.isArray(d.answered) || d.answered.length !== NQ) return 'mismatch';
  answered = d.answered; (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
  if(Array.isArray(d.drafts) && d.drafts.length === NQ) drafts = d.drafts.map(cleanHtml);
  if(Array.isArray(d.cells) && d.cells.length === NQ) cells = d.cells.map((c, i) => QUESTIONS[i].blanks.map((_, k) => String((c || [])[k] || '')));
  if(Array.isArray(d.snap) && d.snap.length === NQ) snap = d.snap.map((s, i) => s && typeof s === 'object' ? { html: cleanHtml(s.html || ''), cells: QUESTIONS[i].blanks.map((_, k) => String((s.cells || [])[k] || '')) } : null);
  if(Array.isArray(d.examPick) && d.examPick.length === NQ){ examPick = d.examPick; examGraded = d.examGraded || examGraded; examRes = d.examRes || examRes; }
  examMode = !!d.examMode; setOn(examModeBtn, examMode);
  activeCh = CHAPTERS[d.activeCh] ? d.activeCh : 0;
  current = QUESTIONS[d.current] ? d.current : 0;
  return true;
}
let restored = false; try{ restored = loadProgress(); }catch(e){}

if(CHAPTERS.length > 1 && /midterm|final/i.test(QUIZ_TITLE)) setViewAll(true);
if(!scopeIdx().includes(current)) current = scopeIdx()[0];
renderToc();
render();
if(restored === true) showTip(saveBtn, 'Progress restored');
else if(restored === 'mismatch') showTip(saveBtn, 'Saved data is from another version');
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
</body>
</html>
