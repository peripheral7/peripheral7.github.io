===
10.1 Components of return
A year ago you bought shares of Haneul Foods. You have received two dividends, and the share price is now higher than you paid, but you have not sold. Which statement about your return is correct?
The price increase is not part of your return until you sell the shares|*Your return has two parts, the dividends and the price increase, whether or not you sell|Only the dividends count, because they are the only cash you have received|Dollar returns are the best way to compare this investment with others of different size
Total return = income component (dividends) + capital gain or loss; Capital gain = the change in price between the day you bought and the day you value it — no sale is needed; Dollar returns depend on how much was invested, so they do not travel; percentage returns do.
===
10.1 Dollar returns
You bought 250 shares of Sorrel Inc. at $52.40 a share. During the year the company paid a dividend of $1.30 a share, and at year end the shares trade at $55.10. What is your total dollar return for the year?
$325|$675|*$1,000|$14,100
Dividend income = 250 × 1.30 = $325; Capital gain = 250 × (55.10 − 52.40) = 250 × 2.70 = $675; Total dollar return = 325 + 675 = $1,000; ($325 and $675 are each only one component; $14,100 = 250 × 55.10 + 325 is the ending value plus dividends, not the return.)
===
10.1 Percentage returns
Dalim Corp. A year ago you bought 300 shares at $64.00. The company paid a dividend of $2.24 a share, and the shares now trade at $70.40. Complete the table (Rate = per dollar invested at $64.00; Per $100 = dollars earned for every $100 invested) and write the formula R = D_1/P_0 + (P_1 − P_0)/P_0.
~
Dividend yield = D_1 / P_0 = 2.24 / 64.00 = 3.50%; Capital gains yield = (P_1 − P_0) / P_0 = (70.40 − 64.00) / 64.00 = 6.40 / 64.00 = 10.00%; R = 3.50% + 10.00% = 13.50% → $13.50 for every $100 invested; Dollars: 300 × 2.24 = 672 and 300 × 6.40 = 1,920, total 2,592; Check: 2,592 / (300 × 64.00) = 2,592 / 19,200 = 13.50%

A share bought a year ago at $80.00 paid a dividend of $2.00 during the year and now trades at $74.00. What is the total percentage return for the year?
−7.50%|−5.41%|*−5.00%|10.00%
R = D_1/P_0 + (P_1 − P_0)/P_0 = 2.00/80.00 + (74.00 − 80.00)/80.00; R = 2.50% + (−7.50%) = −5.00%; The dividend yield is positive, but the capital loss is larger; (−7.50% leaves out the dividend; −5.41% divides by the ending price of $74 instead of P_0; 10.00% treats the loss as a gain.)

A stock bought at $45.00 paid a dividend of $1.44 during the year (a dividend yield of 3.2%), and its total return for the year was 11.0%. What is the share price at year end?
$46.44|*$48.51|$49.95|$51.39
Capital gains yield = R − dividend yield = 11.0% − 3.2% = 7.8%; P_1 = P_0 × (1 + 0.078) = 45.00 × 1.078 = $48.51; Check: 1.44/45.00 + (48.51 − 45.00)/45.00 = 3.2% + 7.8% = 11.0%; ($49.95 applies the whole 11% to the price, counting the dividend twice; $46.44 adds only the dividend yield; $51.39 adds the dividend yield on top of the 11%.)

10.2 The historical record
According to the 1926–2022 record in the lecture notes, which list ranks average annual returns from highest to lowest?
Large-company stocks, small-company stocks, long-term corporate bonds, long-term government bonds, T-bills|Small-company stocks, large-company stocks, long-term government bonds, long-term corporate bonds, T-bills|Small-company stocks, large-company stocks, long-term corporate bonds, T-bills, long-term government bonds|*Small-company stocks, large-company stocks, long-term corporate bonds, long-term government bonds, T-bills
Averages 1926–2022: small-company stocks 16.0% > large-company stocks 12.0% > long-term corporate bonds 6.1% > long-term government bonds 5.6% > T-bills 3.3% (inflation 3.0%); The order follows uncertainty: lending to a company is riskier than lending to the government, and lending for decades riskier than for months.

10.3 Risk premium
Over 1975–2024 the (hypothetical) market of Norland recorded these average annual returns: small-company stocks 14.8%, large-company stocks 10.9%, long-term corporate bonds 6.7%, long-term government bonds 5.9% and Treasury bills 4.2%. Inflation averaged 3.5%. Complete the risk premium table and write the formula you used.
~
Risk premium = average return on the asset − risk-free rate; The risk-free rate is the T-bill return of 4.2% (not inflation of 3.5%); Small-company stocks: 14.8% − 4.2% = 10.6%; Large-company stocks: 10.9% − 4.2% = 6.7%; Corporate bonds: 6.7% − 4.2% = 2.5%; Government bonds: 5.9% − 4.2% = 1.7%; T-bills: 4.2% − 4.2% = 0.0% — zero because T-bills are the benchmark, not because they are a good investment.
@grid Norland, 1975–2024 :: Investment|Average return|Less T-bills|Risk premium;;Small-company stocks|14.8%|?4.2%|?10.6%;;Large-company stocks|10.9%|?4.2%|?6.7%;;Long-term corporate bonds|6.7%|?4.2%|?2.5%;;Long-term government bonds|5.9%|?4.2%|?1.7%;;Treasury bills|4.2%|?4.2%|?0.0%
@lines 2
===
10.3 The first lesson
Over 1926–2022 large-company stocks earned an average risk premium of 8.7% over Treasury bills. Which statement is correct?
*The premium is a reason to expect compensation for bearing risk, not a guarantee of it|An investor can count on earning about 8.7% a year more than T-bills over the next five years|T-bills have a risk premium of zero because they are a poor investment|Because the premium lines up with risk, a riskier asset always earns the higher return
The first lesson is about averages over a long run and nothing shorter; It does not say a risky asset will beat a safe one over a particular holding period, or that the past premium will be the next one; An investor certain of earning the premium would be taking no risk — and would not be paid it.
===
10.4 Variance and standard deviation
A fund's annual returns over five years were 18%, −6%, 9%, 24% and −10%. Complete the variance worksheet and the summary (use T − 1 in the variance), and write the formulas for the variance and the standard deviation.
~
Average = (18 − 6 + 9 + 24 − 10) / 5 = 35 / 5 = 7.00%; Deviations = R − 7%: +11, −13, +2, +17, −17 (they always sum to 0); Squared: 0.0121 + 0.0169 + 0.0004 + 0.0289 + 0.0289 = 0.0872; Var = sum of squared deviations / (T − 1) = 0.0872 / 4 = 0.0218; SD = √0.0218 = 14.76%; BA II Plus: 2nd DATA, 2nd CLR WORK, enter 18, −6, 9, 24, −10 as X01–X05, 2nd STAT → x̄ = 7.00, Sx = 14.76
@grid Variance worksheet :: Year|Return|Deviation (R − average)|Squared deviation;;1|18%|?11%|?0.0121 / 121;;2|−6%|?−13%|?0.0169 / 169;;3|9%|?2%|?0.0004 / 4;;4|24%|?17%|?0.0289 / 289;;5|−10%|?−17%|?0.0289 / 289;;=Total|35%|?0|?0.0872 / 872
@grid Summary :: Statistic|Value;;Average return|?7.00%;;Variance|?0.0218 / 218;;Standard deviation|?14.76%
@lines 2
===
-
Fund A returned 12% in each of five years. Fund B returned 30%, −15%, 25%, −5% and 25%, so both funds average 12%. What is Fund B's standard deviation (use T − 1)?
4.20%|18.33%|*20.49%|40.99%
Deviations from 12%: +18, −27, +13, −17, +13; Squared: 0.0324 + 0.0729 + 0.0169 + 0.0289 + 0.0169 = 0.1680; Var = 0.1680 / (5 − 1) = 0.0420; SD = √0.0420 = 20.49% (Fund A: 0) — the spread the shared average hides; (18.33% divides by T = 5; 4.20% reports the variance as the SD; 40.99% forgets to divide.)
===
-
A stock returned 16%, −4%, 22% and 2% over four years. Compute the average return, the variance and the standard deviation (use T − 1), writing the formulas. Then, assuming returns are normally distributed, give the range that should contain about 95% of annual returns.
0.0436|0.01453 / 0.0145|12.06 / 12.05|15.11|33.11
Average = (16 − 4 + 22 + 2) / 4 = 36 / 4 = 9.00%; Squared deviations = 0.07^2 + (−0.13)^2 + 0.13^2 + (−0.07)^2 = 0.0049 + 0.0169 + 0.0169 + 0.0049 = 0.0436; Var = 0.0436 / (4 − 1) = 0.01453; SD = √0.01453 = 12.06%; BA II Plus: 2nd DATA, enter 16, −4, 22, 2, 2nd STAT → x̄ = 9.00, Sx = 12.0554; 95% range = average ± 2 SD = 9.00% ± 2 × 12.06% = 9.00% ± 24.11% → −15.11% to 33.11%
===
10.4 Normal distribution
An investment's annual returns average 11% with a standard deviation of 18%. If returns are normally distributed, which range should contain about 95% of annual returns?
−7% to 29%|*−25% to 47%|−36% to 36%|−43% to 65%
About 95% = average ± 2 SD; Range = 11% ± 2 × 18% = 11% ± 36% → −25% to 47%; (−7% to 29% is ±1 SD, about 68% of years; −43% to 65% is ±3 SD, about 99%; −36% to 36% forgets to centre the range on the 11% average.)
===
-
Annual returns on a portfolio average 8% with a standard deviation of 15%. Assuming a normal distribution, in about what share of years should the return be worse than −22%?
0.5%|*2.5%|5%|16%
−22% = 8% − 2 × 15% — two standard deviations below the average; About 95% of years fall within ±2 SD, so about 5% fall outside, half on each side: about 2.5% below −22% (and 2.5% above 38%); The normal curve is only an approximation — real returns produce extreme years more often than it predicts.
===
10.5 Holding-period return
A stock returned 14%, −8% and 21% in three consecutive years. What was its total (holding-period) return over the three years?
8.27%|9.00%|*26.90%|27.00%
HPR = (1 + R_1)(1 + R_2)(1 + R_3) − 1 = 1.14 × 0.92 × 1.21 − 1 = 1.26905 − 1 = 26.90%; Returns compound, so adding them (27.00%) ignores that each year's return is earned on a changed base; (8.27% = 1.26905^{1/3} − 1 is the geometric average per year; 9.00% is the arithmetic average.)
===
10.5 Geometric average
A fund returned 25%, −20% and 15% over three years. What is its geometric average return?
*4.77%|5.00%|6.67%|15.00%
Product = 1.25 × 0.80 × 1.15 = 1.15; Geometric average = [(1 + R_1) × (1 + R_2) × (1 + R_3)]^{1/3} − 1 = 1.15^{1/3} − 1 = 4.77%; BA II Plus: 3 N, 1 +/− PV, 1.15 FV, CPT I/Y = 4.77; (6.67% is the arithmetic average (25 − 20 + 15) / 3; 5.00% divides the 15% holding-period return by 3; 15.00% is the holding-period return itself.)
===
10.5 Arithmetic vs geometric
You invested $5,000 in a fund that returned 12%, −20%, 25% and 6% over four years. Compute (i) the value of your investment at the end, (ii) the holding-period return, (iii) the arithmetic average return and (iv) the geometric average return, writing each formula.
5,936 / 5936|18.72|5.75|4.38
Product = 1.12 × 0.80 × 1.25 × 1.06 = 1.1872; Ending value = 5,000 × 1.1872 = $5,936; HPR = 1.1872 − 1 = 18.72%; Arithmetic = (12 − 20 + 25 + 6) / 4 = 23 / 4 = 5.75%; Geometric = 1.1872^{1/4} − 1 = 4.38%; BA II Plus: 4 N, 5000 +/− PV, 5936 FV, CPT I/Y = 4.38; Check: 5,000 × 1.0438^4 ≈ 5,936 — the geometric average reproduces what the money actually did, while 5,000 × 1.0575^4 = 6,253 overstates it.
===
-
Fund X returned 10% in each of three years. Fund Y returned 30%, −10% and 10%. Both have an arithmetic average return of 10%. What are their geometric average returns?
*X 10.00%, Y 8.77%|X 10.00%, Y 9.57%|X 10.00%, Y 10.00%, since equal arithmetic averages give equal geometric averages|X 10.00%, Y 28.70%
X: 1.10^3 → geometric = 10.00% — identical years make the two averages equal; Y: product = 1.30 × 0.90 × 1.10 = 1.287 → 1.287^{1/3} − 1 = 8.77%; The geometric is never larger: any variation pulls it below the arithmetic, and the more variable the returns, the wider the gap; (28.70% is Y's holding-period return; 9.57% divides it by 3.)
===
10.5 Which average to use
A pension fund's committee needs (i) a figure for what its equity holdings actually earned per year over the past ten years and (ii) an estimate of next year's return for a forecast. Which pairing is correct? Choose, then explain in one or two sentences.
Arithmetic for both, because it is the larger and more familiar figure|Geometric for both, because only it reflects compounding|Arithmetic for (i), geometric for (ii)|*Geometric for (i), arithmetic for (ii)
Geometric average: what the money actually did — the compounded outcome over the whole period, used for reporting past performance; Arithmetic average: each year treated on its own — the better estimate of a single future year, used for forecasts and discount rates; A fund advertising its average return quotes the arithmetic figure, the larger of the two, which is not what any investor received.
@write 3
===
10.6 Market reaction to news
Kanto Robotics trades at $55. It announces news worth $8 a share. The price rises to $57 on the announcement day, then climbs steadily to $63 by day 6 and stays there. Which description is correct?
Efficient-market reaction: nobody can profit by trading after the announcement|*Delayed reaction: an investor who buys on the announcement day can still profit|Overreaction and correction: an investor who sells on the announcement day profits|Delayed reaction: an investor who sells on the announcement day profits
New value = $55 + $8 = $63; An efficient market would jump to $63 on day 0 and stay, leaving nothing to trade on; Here the price only reaches $57 on day 0 and takes six days to fully reflect the news — a delayed reaction; Buying at $57 on the announcement day and holding to day 6 earns $6 a share; Selling on the announcement day profits only under overreaction, where the price overshoots and then corrects back.
===
10.6 Forms of efficiency
Suppose a stock market is semistrong-form efficient but not strong-form efficient. Which strategy could earn reliably above-normal returns?
Buying stocks whose price charts show an upward trend|Buying shares right after a published earnings report beats forecasts|*Trading on unpublished information obtained from inside the company|Picking stocks with low price-earnings ratios from published accounts
Semistrong form: prices reflect all publicly available information — past prices and volumes (the weak form) plus published news, reports and accounts; So charts, published earnings and published ratios are already in the price; Only private (inside) information is not, and trading on it would be ruled out only under strong-form efficiency.
===
10.6 What efficiency does not mean
Which observation is consistent with an efficient market?
*A stock falls 25% in one day when unexpected bad news arrives|Prices are efficient, so each price turns out to have been right in hindsight|No investor beats the market in any given year|Security analysis adds nothing, so analysts could stop without affecting prices
Efficient prices move whenever information arrives, which can be violently — volatility is not evidence of inefficiency; An efficient price is the best guess given what is known and will often turn out wrong; Many investors beat the market in any period — efficiency says only that it is not reliably repeatable; Analysis is what makes prices efficient — stop it and the efficiency goes with it.
===
-
In two sentences, explain why market efficiency does not make security analysis pointless.
analyst / analysts / analysis|compete / competition / competing|public information / information|efficient / efficiency
Prices reflect public information because analysts compete to find and act on it; If everyone stopped analysing, new information would no longer be pushed into prices and the efficiency would disappear — efficiency is the result of analysis, not a reason to abandon it.
@short
===

  .lightbox{position:fixed; inset:0; z-index:40; background:rgba(20,20,22,0.6); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;}

  :root{--memo-w:min(300px,86vw);}
  .memo{position:fixed; top:0; right:0; bottom:0; width:var(--memo-w); z-index:22; background:var(--paper); box-shadow:-10px 0 40px rgba(0,0,0,0.08); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; visibility:hidden;}

  .memo-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px 10px; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);}
  .memo-head .link{text-transform:none; letter-spacing:0; margin-left:14px;}

  .memo-tab{position:fixed; top:50%; right:0; z-index:22; transform:translateY(-50%); writing-mode:vertical-rl; background:var(--paper); border:none; box-shadow:0 0 0 1px var(--rule); padding:14px 6px; font-size:0.78rem; color:var(--ink-soft); cursor:pointer;}

  .to-top.show{opacity:1; pointer-events:auto;}

  /* phone: the exhibit goes onto the page above its questions */
  @media (max-width:699px){
    .case-ex{grid-column:2; grid-row:auto; position:static; justify-self:stretch; width:auto; max-height:none; overflow-x:auto; overflow-y:visible; margin:0; box-shadow:none; padding:28px var(--pad) 6px;}

  }
  @media (max-width:1000px){
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 20px;}
    .qside:empty{display:none;}
  }
  @media (max-width:760px){
    :root{--paper-w:100vw; --pad:20px;}
    .sheet::before{box-shadow:none;}
    header{padding-top:40px;} header h1{font-size:1.8rem;}
  }

  /* tablet split view: exhibit panel on the left, questions on the right (keep this query in sync with SPLIT_MQ in the script) */
  @media (min-width:700px) and (max-width:1500px), (min-width:700px) and (hover:none) and (pointer:coarse){
    :root{--pad:34px;}
    .sheet::before{width:100%; box-shadow:none;}
    .pg{grid-template-columns:minmax(0,1fr) min(760px,100%) minmax(0,1fr);}
    .scorebar{width:100%;}
    .scorebar .in{max-width:760px; margin:0 auto;}
    header{padding-top:44px;}
    .qside{grid-column:2; margin:-10px 0 0; max-width:none; padding:0 var(--pad) 20px;}
    .qside:empty{display:none;}
    .case{grid-template-columns:minmax(0,9fr) minmax(0,11fr); margin-top:8px;}
    .case > .qmain, .case > .qside{grid-column:2;}
    .case-ex, .case.stacked .case-ex{grid-column:1; grid-row:1 / span var(--n2, 2); align-self:start; justify-self:stretch; position:sticky; top:calc(var(--bar-h) + 12px);
      width:auto; margin:12px 4px 12px 16px; max-height:calc(100vh - var(--bar-h) - 24px); max-height:calc(100dvh - var(--bar-h) - 24px);
      overflow:auto; overscroll-behavior:contain; padding:20px 22px 6px; background:var(--paper); box-shadow:0 0 0 1px var(--rule), 0 8px 28px rgba(0,0,0,0.06);}
    .case-ex .tables, .case.stacked .case-ex .tables{display:block;}
    .case-ex table.t, .case.stacked .case-ex .tables > table{width:100%; font-size:0.82rem; margin-bottom:26px;}
    .case-ex h2{font-size:1.1rem;}
  }
  @media (min-width:700px) and (max-width:999px){
    :root{--pad:24px;}
    .case{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
    .case-ex, .case.stacked .case-ex{margin-left:10px; padding:16px 16px 4px;}
    .qtext{font-size:1.02rem;}
    .cell{font-size:0.82rem;}
  }

  #printSheet{display:none;}
  @page{size:A4 portrait; margin:22mm 20mm 20mm; @bottom-center{content:counter(page); font-family:Georgia,"Times New Roman",serif; font-size:9pt;}}
  @media print{
    html, body{background:#fff !important; color:#000 !important; padding:0 !important; margin:0 !important;}
    body > *:not(#printSheet){display:none !important;}
    #printSheet{display:block; font-family:var(--serif); font-size:10.5pt; line-height:1.5; color:#000;}
    #printSheet h1{font-size:13pt; font-weight:400; text-align:center; margin:0 0 9mm;}
    #printSheet .p-q{break-inside:avoid; page-break-inside:avoid; margin:0 0 5mm;}
    #printSheet .p-q p{margin:0;}

    #printSheet .p-fig{margin:1.5mm 0 2mm; max-width:130mm;}
    #printSheet .p-lines{height:calc(var(--n, 6) * 8mm); background-image:linear-gradient(to bottom, transparent calc(8mm - 0.2mm), #bbb calc(8mm - 0.2mm)); background-size:100% 8mm; -webkit-print-color-adjust:exact; print-color-adjust:exact; margin-top:1mm;}
    #printSheet .p-gridq{margin:2mm 0 1mm;}
    #printSheet .p-gridq table.t{margin-bottom:3mm;}
    #printSheet table.grid td{height:8mm; vertical-align:middle;}
    #printSheet table.grid td.p-blank{min-width:22mm; border:0.2mm solid #999 !important; background:#fff;}
    #printSheet .p-ex{break-inside:avoid; page-break-inside:avoid; border-top:0.3mm solid #000; border-bottom:0.3mm solid #000; padding:3mm 0 1mm; margin:2mm 0 6mm;}
    #printSheet .p-ex h2{font-size:12.5pt; font-weight:400; margin:0;}
    #printSheet .p-ex .uses{font-size:9pt; margin:0 0 3mm; font-style:italic; color:#333;}
    #printSheet .p-ex .tables{display:flex; flex-wrap:wrap; gap:4mm 8mm; align-items:flex-start;}
    #printSheet .p-ex .tables > table{flex:1 1 0;}
    #printSheet table.t{font-size:9.3pt; color:#000;}
    #printSheet table.t caption{color:#000; font-size:10.5pt; padding-bottom:1.5mm;}
    #printSheet table.t thead th{border-top:0.35mm solid #000;}
    #printSheet table.t tbody tr:last-child td{border-bottom:0.35mm solid #000;}
    #printSheet table.t th, #printSheet table.t td{color:#000;}
    #printSheet table.t th{ border-bottom:0.3mm solid #000; padding:0.8mm 1.5mm;}
    #printSheet table.t td{padding:0.4mm 1.5mm; border-bottom:0.1mm solid #ddd;}
    #printSheet table.t tr.sec td{color:#000; border-bottom:none; padding-top:2mm;}
    #printSheet table.t tr.tot td{border-top:0.25mm solid #000;}
    #printSheet table.t td.kcell{font-style:italic;}
    #printSheet .p-key{break-before:page; page-break-before:always;}
    #printSheet .p-letters{columns:4; font-size:10pt;}
    #printSheet .p-sol{display:none;}
    body.print-solution #printSheet .p-letters{display:none;}
    body.print-solution #printSheet .p-sol{display:block; column-count:2; column-gap:9mm; font-size:9pt; line-height:1.3;}
    #printSheet .p-s{break-inside:avoid; margin:0 0 3mm;}
    #printSheet .p-s.wide{column-span:all;}
    #printSheet .p-s p{margin:0;}
    #printSheet .p-s table.t{font-size:8.6pt; margin:1mm 0 2mm;}
    #printSheet .p-kw{font-style:italic; color:#333;}
    #printSheet .sn-line .lb{font-weight:400; text-shadow:0.3px 0 0 currentColor;}
  }
</style>

<script>
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MATH = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', omega:'ω',
  Delta:'Δ', Sigma:'Σ', Pi:'Π', Omega:'Ω', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', infty:'∞', to:'→', sqrt:'√', cdot:'·', deg:'°' };
const mathFm = t => esc(t)
  .replace(/\\([_^])/g, (m, c) => c === '_' ? '&#95;' : '&#94;')
  .replace(/\\([A-Za-z]+)/g, (m, k) => MATH[k] || m)
  .replace(/\^(\{[^}]*\}|-?[0-9A-Za-z])/g, (m, s) => `<sup>${s.replace(/^\{|\}$/g, '')}</sup>`)
  .replace(/_(\{[^}]*\}|[0-9A-Za-z])/g, (m, s) => `<sub>${s.replace(/^\{|\}$/g, '')}</sub>`);
const fm = t => String(t).split(/`([^`]+)`/).map((p, i) => i % 2 ? `<code class="ic">${esc(p)}</code>` : mathFm(p)).join('');
const plain = t => String(t).replace(/\\([_^])/g, '$1').replace(/\^\{([^}]*)\}/g, '^$1').replace(/_\{([^}]*)\}/g, '_$1');

/* explanation -> one line per item; a short leading label in semibold */
const explLines = t => String(t).split(/;\s+|\.\s+(?=(?:BA II Plus|Formula|ICONV|CF worksheet)\b)/).map(s => s.trim()).filter(Boolean);
function fmtExpl(t){
  return explLines(t).map(line => {
    const m = line.match(/^([A-Za-zΔ(][^=:]{0,30}?)(\s=\s|:\s)([\s\S]*)$/);
    if(m && !m[1].includes(',')) return `<p class="sn-line"><span class="lb">${fm(m[1])}</span>${m[2] === ': ' ? ': ' : ' = '}${fm(m[3])}</p>`;
    return `<p class="sn-line">${fm(line)}</p>`;
  }).join('');
}

function parseTbl(src){
  let cap = '', body = src;
  const k = src.indexOf('::');
  if(k > -1){ cap = src.slice(0, k).trim(); body = src.slice(k + 2); }
  const rows = body.split(';;').map(r => r.trim()).filter(Boolean);
  const head = (rows.shift() || '').split('|').map(c => c.trim());
  return { cap, head, rows: rows.map(r => r[0] === '!' ? { sec: r.slice(1).trim() } : r[0] === '=' ? { tot: true, cells: r.slice(1).split('|').map(c => c.trim()) } : { cells: r.split('|').map(c => c.trim()) }) };
}
function tblHTML(t){
  const n = t.head.length;
  return `<table class="t">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(c => `<td>${fm(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
const tblText = t => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.join(' | ')).join('\n');

/* ---------- fill-in tables ---------- */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
function parseNum(s){
  let t = String(s).trim().replace(/[−–—]/g, '-').replace(/[$,\s]/g, '');
  let neg = false; const m = /^-?\((.*)\)$/.exec(t); if(m){ neg = true; t = m[1]; }
  let pct = false; if(t.endsWith('%')){ pct = true; t = t.slice(0, -1); }
  if(t.startsWith('+')) t = t.slice(1);
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  let v = parseFloat(t); if(neg) v = -v;
  return { v, pct };
}
const ZERO = /^\s*(0|0\.0+|[-−–—])\s*$/;
function matchCell(val, b){
  const s = String(val || '').trim(); if(!s) return false;
  return b.alts.some(alt => {
    const k = parseNum(alt);
    if(!k) return !!norm(alt) && norm(alt) === norm(s);
    if(k.v === 0 && ZERO.test(s)) return true;
    const x = parseNum(s); if(!x) return false;
    const tol = Math.max(Math.abs(k.v) * 0.002, 0.006);
    const cands = [x.v]; if(k.pct && !x.pct && Math.abs(x.v) <= 1.5) cands.push(x.v * 100);
    return cands.some(v => b.absOK ? Math.abs(Math.abs(v) - Math.abs(k.v)) <= tol : Math.abs(v - k.v) <= tol);
  });
}
function gridify(t, blanks){
  t.grid = true;
  t.rows.forEach(r => {
    if(r.sec) return;
    const label = r.cells[0] || '';
    r.cells = r.cells.map((c, ci) => {
      if(c[0] !== '?') return c;
      const key = c.slice(1).trim(), alts = key.split(' / ').map(s => s.trim()).filter(Boolean);
      const num = !!parseNum(alts[0] || '');
      const b = { alts, disp: alts[0] || '', num, absOK: /^\s*([−–-]|less\b)/i.test(label), w: Math.max(6, (alts[0] || '').length + 1), label: `${label} · ${t.head[ci] || ''}` };
      blanks.push(b);
      return { blank: b, k: blanks.length - 1 };
    });
  });
  return t;
}
function gridHTML(t, mode){   /* mode: 'input' (screen), 'print' (empty boxes), 'key' (answers filled in) */
  const n = t.head.length;
  const cell = c => {
    if(typeof c === 'string') return `<td>${fm(c)}</td>`;
    if(mode === 'key') return `<td class="kcell">${fm(c.blank.disp)}</td>`;
    if(mode === 'print') return '<td class="p-blank"></td>';
    return `<td class="bcell"><input class="cell${c.blank.num ? '' : ' txt'}" data-k="${c.k}" style="--w:${c.blank.w}" inputmode="${c.blank.num ? 'decimal' : 'text'}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(c.blank.label)}"></td>`;
  };
  return `<table class="t grid">${t.cap ? `<caption>${fm(t.cap)}</caption>` : ''}<thead><tr>${t.head.map(h => `<th>${fm(h)}</th>`).join('')}</tr></thead><tbody>` +
    t.rows.map(r => r.sec ? `<tr class="sec"><td colspan="${n}">${fm(r.sec)}</td></tr>` : `<tr${r.tot ? ' class="tot"' : ''}>${r.cells.map(cell).join('')}</tr>`).join('') + '</tbody></table>';
}
const gridText = (t, vals) => (t.cap ? t.cap + '\n' : '') + t.head.join(' | ') + '\n' + t.rows.map(r => r.sec ? '-- ' + r.sec : r.cells.map(c => typeof c === 'string' ? c : (vals ? (vals[c.k] || '___') + (vals.mark ? vals.mark(c) : '') : c.blank.disp)).join(' | ')).join('\n');

function parseQuizData(raw){
  const blocks = raw.replace(/\r\n?/g, '\n').trim().split(/\n===\n?/).filter(b => b.trim() && b.trim() !== '===');
  const meta = {};
  blocks.shift().split('\n').forEach(l => { const i = l.indexOf(':'); if(i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  const questions = [], chapters = [], cases = {}, errs = [];
  let prevTag = '';
  if(!meta.title) errs.push('meta block: title: is missing');
  blocks.forEach(block => {
    const L = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if(L.length === 1 && L[0].startsWith('# ')){ chapters.push({ title: L[0].slice(2).trim(), idx: [] }); return; }
    if(L[0].startsWith('@case ')){
      const id = L[0].slice(6).trim();
      const tbls = L.filter(l => l.startsWith('@tbl ')).map(l => parseTbl(l.slice(5)));
      if(!tbls.length) errs.push(`exhibit ${id}: needs at least one @tbl line`);
      cases[id] = { id, title: (L[1] && !L[1].startsWith('@')) ? L[1] : 'Exhibit ' + id, tbls };
      return;
    }
    if(!chapters.length) chapters.push({ title: meta.title || 'Quiz', idx: [] });
    const ch = chapters.length - 1;
    chapters[ch].seen = (chapters[ch].seen || 0) + 1;
    const who = `${chapters[ch].title} · Q${chapters[ch].seen}`;
    if(L.length < 4){ errs.push(`${who}: needs at least 4 lines (tag, question, options or key results, explanation) - check for a missing ===`); return; }
    if(L[0] === '-' && !prevTag) errs.push(`${who}: tag "-" has no previous tag`);
    const tag = L[0] === '-' ? prevTag : L[0];
    prevTag = tag;
    const raw3 = L[2].split('|');
    const kind0 = raw3.some(o => o.trim().startsWith('*')) ? 'mc' : 'written';
    const q = { tag, text: L[1], explain: L[3], ch, who, kind: kind0, options: [], correct: 0, kws: [], self: false, grids: [], blanks: [], fig: null, use: null, focus: null, write: 0, lines: 0 };
    if(kind0 === 'mc'){
      q.options = raw3.map((o, i) => { o = o.trim(); if(o.startsWith('*')){ q.correct = i; return o.slice(1).trim(); } return o; });
      const stars = raw3.filter(o => o.trim().startsWith('*')).length;
      if(stars !== 1) errs.push(`${who}: exactly one option must start with * (found ${stars})`);
      if(q.options.length < 2 || q.options.length > 4) errs.push(`${who}: ${q.options.length} options (use 2-4)`);
      if(q.options.some(o => !o)) errs.push(`${who}: empty option`);
    } else if(L[2] !== '~'){
      q.kws = raw3.map(g => g.split(' / ').map(s => s.trim()).filter(Boolean));
      if(q.kws.some(g => !g.length)) errs.push(`${who}: empty key-result group`);
    }
    let linesN = null, short = false;
    L.slice(4).forEach(l => {
      if(l.startsWith('@use ')) q.use = l.slice(5).trim();
      else if(l.startsWith('@focus ')){ q.focus = l.slice(7).split(',').map(s => parseInt(s, 10) - 1); if(q.focus.some(n => !(n >= 0))) errs.push(`${who}: @focus needs table numbers such as "@focus 2" or "@focus 1,3"`); }
      else if(l.startsWith('@tbl ')) q.fig = { type: 'tbl', t: parseTbl(l.slice(5)) };
      else if(l.startsWith('@img ')) q.fig = { type: 'img', src: l.slice(5).trim() };
      else if(l.startsWith('@grid ')) q.grids.push(gridify(parseTbl(l.slice(6)), q.blanks));
      else if(l === '@write' || l.startsWith('@write ')) q.write = parseInt(l.slice(6), 10) || 3;
      else if(l.startsWith('@lines ')) linesN = parseInt(l.slice(7), 10) || 0;
      else if(l === '@short') short = true;
      else if(l.startsWith('@')) errs.push(`${who}: unknown line "${l.slice(0, 12)}…" (use @use, @focus, @tbl, @img, @grid, @write, @lines or @short)`);
    });
    if(q.kind === 'mc' && q.grids.length) errs.push(`${who}: @grid belongs to a written question (line 3 = key results or ~), not to MC`);
    if(q.kind === 'written' && q.write) errs.push(`${q.who}: @write is for MC questions; use @lines for a written question`);
    if(q.kind === 'written' && q.grids.length) q.kind = 'grid';
    if(q.kind === 'grid' && !q.blanks.length) errs.push(`${who}: @grid has no blank cells (start a cell with ?)`);
    q.self = q.kind === 'written' && !q.kws.length;
    const steps = explLines(q.explain).length;
    const calc = /=\s*[−\-$(]?\d/.test(q.explain);
    q.lines = q.kind === 'mc' ? q.write : linesN !== null ? linesN : short ? 3 : q.kind === 'grid' ? 3 : (!calc && steps <= 2) ? 3 : Math.min(14, Math.max(6, steps + 3));
    if(q.focus && !q.use) errs.push(`${who}: @focus without @use`);
    chapters[ch].idx.push(questions.length);
    q.n = chapters[ch].idx.length;
    questions.push(q);
  });
  questions.forEach(q => {
    if(q.use && !cases[q.use]) errs.push(`question ${q.n}: @use ${q.use} but no "@case ${q.use}" block exists`);
    else if(q.use && q.focus && q.focus.some(n => n >= cases[q.use].tbls.length)) errs.push(`${q.who}: @focus ${q.focus.map(n => n + 1).join(',')} but exhibit ${q.use} has ${cases[q.use].tbls.length} table(s)`);
  });
  chapters.filter(c => !c.idx.length).forEach(c => errs.push(`chapter "${c.title}" has no questions`));
  if(!questions.length) errs.push('no questions found');
  const good = chapters.filter(c => c.idx.length);
  return { meta, questions, cases, chapters: good.length ? good : [{ title: meta.title || 'Quiz', idx: [] }], errs };
}

/* ---------- checking written answers ---------- */
const PASS_TEXT = 0.6, PASS_GRID = 0.8;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const isShort = alt => /^[\x00-\x7f]+$/.test(alt) && norm(alt).length <= 4;
const shortRe = alt => new RegExp('(^|[^a-z0-9.,])' + reEsc(alt.toLowerCase()).replace(/\s+/g, '\\s*') + '($|[^a-z0-9.,]|[.,](?![0-9]))', 'i');
function altMatch(alt, text){ const n = norm(alt); if(!n) return false; return isShort(alt) ? shortRe(alt).test(text) : norm(text).includes(n); }
function findRange(alt, full){
  const n = norm(alt);
  if(!n) return null;
  if(isShort(alt)){ const m = shortRe(alt).exec(full); return m ? [m.index + m[1].length, m.index + m[0].length - m[2].length] : null; }
  let ns = ''; const idx = [];
  for(let i = 0; i < full.length; i++){ const c = full[i].toLowerCase(); if(/[a-z0-9가-힣]/.test(c)){ ns += c; idx.push(i); } }
  const p = ns.indexOf(n);
  return p < 0 ? null : [idx[p], idx[p + n.length - 1] + 1];
}
const htmlToText = h => { const d = document.createElement('div'); d.innerHTML = String(h).replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(div|p)[^>]*>/gi, '\n'); return d.textContent; };
function grade(qi){
  const q = QUESTIONS[qi], s = snap[qi];
  if(q.kind === 'mc' || s === null) return null;
  if(q.self) return { self: true };
  const text = htmlToText(s.html);
  const kwHits = q.kws.map(g => g.some(a => altMatch(a, text)));
  const cellHits = q.blanks.map((b, k) => matchCell(s.cells[k], b));
  const n = kwHits.filter(Boolean).length + cellHits.filter(Boolean).length, t = kwHits.length + cellHits.length;
  return { kwHits, cellHits, n, t, pass: t > 0 && n / t >= (q.blanks.length ? PASS_GRID : PASS_TEXT) };
}
/* 2 = correct / passed, 1 = partly, 0 = wrong / not yet, 's' = self-check shown, null = not answered */
function resultOf(qi){
  if(isMC(qi)) return answered[qi] === null ? null : answered[qi] === QUESTIONS[qi].correct ? 2 : 0;
  const g = grade(qi); if(!g) return null; if(g.self) return 's';
  return g.pass ? 2 : g.n ? 1 : 0;
}
const hasDraft = qi => !!htmlToText(drafts[qi]).trim() || cells[qi].some(c => String(c).trim());
const isAnswered = qi => isMC(qi) ? (examActive(qi) ? examPick[qi] !== null : answered[qi] !== null && answered[qi] !== -1) : (examActive(qi) ? hasDraft(qi) : snap[qi] !== null);
const isWrong = qi => { const r = resultOf(qi); return r === 0 || r === 1; };
const wrongIndices = () => scopeIdx().filter(isWrong);
const visibleIndices = () => filterMode === 'review' ? reviewList : filterMode === 'flagged' ? flagList : scopeIdx();
function resetForRetry(i){ if(isMC(i)) answered[i] = null; else snap[i] = null; }
function markIn(el, groups, cls){   /* underline the first occurrence of each listed wording group inside an element */
  const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while(w.nextNode()) nodes.push(w.currentNode);
  const starts = []; let full = '';
  nodes.forEach(n => { starts.push(full.length); full += n.nodeValue + '\n'; });
  const rr = [];
  groups.forEach(grp => { for(const a of grp){ const r = findRange(a, full); if(r){ rr.push(r); break; } } });
  rr.sort((a, b) => b[0] - a[0]);
  let limit = Infinity;
  rr.forEach(([s, e]) => {
    if(e > limit) return; limit = s;
    for(let k = nodes.length - 1; k >= 0; k--){
      const ns = starts[k], len = nodes[k].nodeValue.length, a = Math.max(s, ns) - ns, b = Math.min(e, ns + len) - ns;
      if(b <= a) continue;
      let node = nodes[k];
      if(b < len) node.splitText(b);
      if(a > 0) node = node.splitText(a);
      const sp = document.createElement('span'); sp.className = 'mk ' + cls; node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
  });
}
const richHtml = node => { const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['DIV', 'P'].includes(c.nodeName) ? '<div>' + out(c) + '</div>' : out(c)).join(''); return out(node); };
const cleanHtml = s => { const x = document.createElement('div'); x.innerHTML = s; return richHtml(x); };

function ranges(nums){
  const a = [...nums].sort((x, y) => x - y), out = [];
  for(let i = 0; i < a.length; i++){ let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j; }
  return out.join(', ');
}
function exhibitHTML(id, idx){
  const c = CASES[id], nums = idx.filter(i => QUESTIONS[i].use === id).map(qno);
  return `<h2>Exhibit ${esc(id)} · ${fm(c.title)}</h2><p class="uses">Used in question${nums.length > 1 ? 's' : ''} ${ranges(nums)}</p><div class="tables">${c.tbls.map(tblHTML).join('')}</div>`;
}
const lightbox = $('lightbox'), lbBody = $('lbBody');
lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
function openLightbox(html){ lbBody.innerHTML = html; lightbox.classList.add('show'); }
const figHTML = f => f.type === 'img' ? `<img src="${esc(f.src)}" alt="Figure" style="max-width:100%">` : tblHTML(f.t);

function qaText(qi){
  const q = QUESTIONS[qi], L = i => String.fromCharCode(97 + i);
  const ex = q.use ? `[Exhibit ${q.use}: ${CASES[q.use].title}]\n` + CASES[q.use].tbls.map(tblText).join('\n') + '\n' : '';
  let s = ex + `Q${qno(qi)}. ${q.text}\n` + (q.fig && q.fig.type === 'tbl' ? tblText(q.fig.t) + '\n' : '');
  if(q.kind === 'mc'){
    s += q.options.map((o, i) => `${L(i)}. ${o}`).join('\n') + `\nAnswer: ${L(q.correct)}. ${q.options[q.correct]}\n`;
    if(drafts[qi].trim()) s += `My explanation:\n${htmlToText(drafts[qi]).trim()}\n`;
    return s + `Explanation:\n${explLines(q.explain).join('\n')}`;
  }
  const g = grade(qi);
  if(q.grids.length){
    const vals = Object.assign([...cells[qi]], { mark: c => g && !g.self ? (g.cellHits[c.k] ? ' ✓' : ` ✗ (${c.blank.disp})`) : '' });
    s += 'My table:\n' + q.grids.map(t => gridText(t, vals)).join('\n') + '\n';
  }
  if(htmlToText(drafts[qi]).trim()) s += `My answer:\n${htmlToText(drafts[qi]).trim()}\n`;
  if(g && !g.self && q.kws.length) s += 'Key results: ' + q.kws.map((k, i) => (g.kwHits[i] ? '[x] ' : '[ ] ') + k[0]).join('  ') + '\n';
  return s + `Model answer:\n${explLines(q.explain).join('\n')}`;
}

/* ---------- one question = a block on the page (.qmain) + a side note in the margin (.qside) ---------- */

function answerBox(qi, placeholder, rows){
  const ed = document.createElement('div'); ed.className = 'answer'; ed.contentEditable = 'true'; ed.spellcheck = false;
  ed.setAttribute('role', 'textbox'); ed.setAttribute('aria-multiline', 'true'); ed.dataset.placeholder = placeholder;

}
function questionNodes(qi, first, retry){
  const q = QUESTIONS[qi];

function mcBody(qi, main, side){
  const q = QUESTIONS[qi];

  q.options.forEach((o, oi) => {
    const b = document.createElement('div'); b.className = 'opt'; b.setAttribute('role', 'button');

}
function writtenBody(qi, main, side){
  const q = QUESTIONS[qi], g = examActive(qi) ? null : grade(qi);
  q.grids.forEach(t => {
    const w = document.createElement('div'); w.className = 'gridwrap'; w.innerHTML = gridHTML(t, 'input');
    w.querySelectorAll('input.cell').forEach(inp => {

      inp.addEventListener('keydown', e => {

function check(qi){

function caseSection(id, qis, idxForNums, retry){

/* split view (tablet): keep this query in sync with the CSS media query of the same name */
const SPLIT_MQ = window.matchMedia('(min-width:700px) and (max-width:1500px), (min-width:700px) and (hover:none) and (pointer:coarse)');
function fitExhibits(){   /* desktop: an exhibit that cannot fit in the margin without wrapping goes onto the page above its questions */
  document.querySelectorAll('.case').forEach(sec => {
    sec.classList.remove('stacked');
    if(SPLIT_MQ.matches) return;
    const ex = sec.querySelector('.case-ex');
    if(ex && getComputedStyle(ex).position === 'sticky' && ex.scrollWidth > ex.clientWidth + 1) sec.classList.add('stacked');
  });
}
window.addEventListener('resize', fitExhibits);

/* the exhibit follows the question: scroll the exhibit panel to the table(s) named by @focus and dim the others */
function focusExhibit(qi, behavior){
  const q = QUESTIONS[qi]; if(!q || !q.use) return;
  const main = quizEl.querySelector(`.qmain[data-index="${qi}"]`); if(!main) return;
  const sec = main.closest('.case'), ex = sec && sec.querySelector('.case-ex'); if(!ex) return;
  const tables = [...ex.querySelectorAll('.tables > table')];
  const panel = getComputedStyle(ex).position === 'sticky';
  const keep = panel && q.focus && tables.length > 1 ? new Set(q.focus) : null;
  tables.forEach((t, ti) => t.classList.toggle('dimmed', !!keep && !keep.has(ti)));
  if(!panel || !q.focus || !tables[q.focus[0]]) return;
  const target = tables[q.focus[0]], last = tables[q.focus[q.focus.length - 1]];
  const exTop = ex.getBoundingClientRect().top, rT = target.getBoundingClientRect(), rL = last.getBoundingClientRect();
  if(rT.top >= exTop + 12 && rL.bottom <= exTop + ex.clientHeight) return;   /* already fully in view: leave the panel alone */
  const top = q.focus[0] === 0 ? 0 : rT.top - exTop + ex.scrollTop - 14;
  ex.scrollTo({ top: Math.max(0, top), left: 0, behavior: behavior || 'smooth' });
}
let exRaf = 0, lastExQ = -1;
function syncExhibit(force){
  let qi = -1;
  if(force && QUESTIONS[current] && QUESTIONS[current].use && quizEl.querySelector(`.qmain[data-index="${current}"]`)) qi = current;
  else {
    const line = window.innerHeight * 0.42; let bd = Infinity;
    quizEl.querySelectorAll('.case .qmain').forEach(el => {
      const r = el.getBoundingClientRect(); if(r.bottom < 0 || r.top > window.innerHeight) return;
      const d = r.top <= line && r.bottom >= line ? 0 : Math.min(Math.abs(r.top - line), Math.abs(r.bottom - line));
      if(d < bd){ bd = d; qi = +el.dataset.index; }
    });
  }
  if(qi < 0) return;
  if(qi !== lastExQ || force){ lastExQ = qi; focusExhibit(qi, force ? 'auto' : 'smooth'); }
}
window.addEventListener('scroll', () => { if(exRaf) return; exRaf = requestAnimationFrame(() => { exRaf = 0; syncExhibit(false); }); }, { passive: true });
const onSplitChange = () => { fitExhibits(); syncExhibit(true); };
if(SPLIT_MQ.addEventListener) SPLIT_MQ.addEventListener('change', onSplitChange); else if(SPLIT_MQ.addListener) SPLIT_MQ.addListener(onSplitChange);

const nextChapterIdx = () => (!viewAll && !pickNums && filterMode === 'all' && CHAPTERS.length > 1 && activeCh < CHAPTERS.length - 1) ? activeCh + 1 : -1;
function render(){
  ignoreScrollUntil = performance.now() + 400;
  const y0 = window.scrollY;
  quizEl.innerHTML = '';
  const vis = visibleIndices(), retry = filterMode === 'review';
  if(!vis.length){
    quizEl.innerHTML = `<div class="empty-state inpage">${filterMode === 'flagged' ? 'No questions marked for review.' : 'Nothing to review.'}</div>`;
    updateChrome(); return;
  }
  if(layoutMode === 'single'){
    const pos = Math.max(0, vis.indexOf(current)), qi = vis[pos];
    current = qi;
    const pr = document.createElement('div'); pr.className = 'single-progress inpage'; pr.textContent = `${pos + 1} / ${vis.length}`; quizEl.appendChild(pr);
    const q = QUESTIONS[qi];
    if(q.use){ const sec = caseSection(q.use, [qi], vis, retry); sec.querySelector('.qmain').classList.add('first'); quizEl.appendChild(sec); }
    else questionNodes(qi, true, retry).forEach(n => quizEl.appendChild(n));
    const nav = document.createElement('div'); nav.className = 'single-nav inpage';
    const prev = document.createElement('button'); prev.className = 'link'; prev.textContent = '← Previous'; prev.disabled = pos === 0; prev.addEventListener('click', goPrev);
    const nc = nextChapterIdx(), last = pos === vis.length - 1;
    const next = document.createElement('button'); next.className = 'link'; next.style.color = 'var(--ink)'; next.textContent = last && nc > -1 ? `Next chapter: ${chLabel(nc)} →` : 'Next →'; next.disabled = last && nc < 0;
    next.addEventListener('click', () => { if(last && nc > -1) switchChapter(nc); else goNext(); });
    nav.appendChild(prev); nav.appendChild(next); quizEl.appendChild(nav);
  } else {
    let prevCh = -1, first = true;
    for(let k = 0; k < vis.length; ){
      const qi = vis[k], q = QUESTIONS[qi];
      if(q.use){
        const group = [];
        while(k < vis.length && QUESTIONS[vis[k]].use === q.use && QUESTIONS[vis[k]].ch === q.ch){ group.push(vis[k]); k++; }
        const sec = caseSection(q.use, group, vis, retry);
        if(first) sec.querySelector('.qmain').classList.add('first');
        quizEl.appendChild(sec);
      } else { questionNodes(qi, first, retry).forEach(n => quizEl.appendChild(n)); k++; }
      first = false;
    }
    const nc = nextChapterIdx();
    if(nc > -1){ const w = document.createElement('div'); w.className = 'next-ch inpage'; const b = document.createElement('button'); b.className = 'link'; b.textContent = `Next chapter: ${chLabel(nc)} →`; b.addEventListener('click', () => switchChapter(nc)); w.appendChild(b); quizEl.appendChild(w); }
    window.scrollTo(0, y0);
  }
  fitExhibits();
  updateChrome();
  syncExhibit(true);
}

function selectAnswer(qi, oi){
  if(examActive(qi)){ if(examPick[qi] === oi) return; examPick[qi] = oi; current = qi; render(); return; }
  if(answered[qi] === oi) return;
  answered[qi] = oi;
  if(oi !== QUESTIONS[qi].correct) missed.add(qi);
  current = qi; render();
}
function setActive(qi){ const v = visibleIndices(); if(!v.length) return; if(!v.includes(qi)) qi = v[0]; current = qi; render(); scrollToActive(); }
function smoothTop(){ ignoreScrollUntil = performance.now() + 1500; window.scrollTo({ top: 0, behavior: 'smooth' }); }
function scrollToActive(){
  if(layoutMode === 'single') return;
  const el = quizEl.querySelector(`.qmain[data-index="${current}"]`);
  ignoreScrollUntil = performance.now() + 1200;
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function goNext(){ const v = visibleIndices(), p = v.indexOf(current); if(p === -1){ if(v.length) setActive(v[0]); return; } if(p < v.length - 1) setActive(v[p + 1]); }
function goPrev(){ const v = visibleIndices(), p = v.indexOf(current); if(p > 0) setActive(v[p - 1]); }
function enterReviewMode(){ const wl = wrongIndices(); if(!wl.length) return; reviewList = wl; wl.forEach(resetForRetry); filterMode = 'review'; current = wl[0]; render(); scrollToActive(); }
function exitReviewMode(){ filterMode = 'all'; render(); smoothTop(); }

function updateChrome(){
  const ids = scopeIdx(), ex = examMode && ids.some(i => !examGraded[i]);
  const ansN = ids.filter(isAnswered).length;
  $('totalCount').textContent = ids.length;
  $('answeredCount').textContent = ansN;
  $('correctCount').textContent = ex ? '–' : ids.filter(i => resultOf(i) === 2).length;
  const graded = ids.filter(i => examRes[i] !== 's');
  const res = examMode && ids.length && ids.every(i => examGraded[i]) ? { c: graded.filter(i => examRes[i] === 'c').length, u: graded.filter(i => examRes[i] === 'u').length, n: graded.length } : null;
  const er = $('examResult'); er.classList.toggle('show', !!res);
  if(res){
    er.innerHTML = `<div class="er-detail">Exam score</div><div class="er-score">${res.c}<small> / ${res.n} · ${Math.round(res.c / Math.max(1, res.n) * 100)}%</small></div><div class="er-detail">${res.n - res.c - res.u} incorrect / not passed · ${res.u} unanswered (counted as incorrect)</div><button class="link" id="retakeBtn" type="button" style="margin-top:8px">Retake exam</button>`;
    $('retakeBtn').addEventListener('click', () => { resetScope(); smoothTop(); });
  }
  $('examBar').classList.toggle('show', ex);
  if(ex){ const left = ids.length - ansN; $('examInfo').textContent = `${ansN} of ${ids.length} answered` + (left ? ` · ${left} unanswered will count as incorrect` : '') + ' · written answers and tables are checked when you grade'; }
  const wl = wrongIndices();
  reviewBtn.disabled = ex || !wl.length || filterMode === 'review';
  reviewBtn.textContent = filterMode === 'review' ? 'Reviewing…' : `Review incorrect (${wl.length})`;
  setOn(reviewBtn, filterMode === 'review');
  copyMissedBtn.disabled = ex || !ids.some(i => missed.has(i));
  setOn($('allViewBtn'), filterMode === 'all');
  const fc = ids.filter(i => flagged.has(i)).length;
  flagBtn.textContent = `Marked (${fc})`; flagBtn.disabled = !fc && filterMode !== 'flagged'; setOn(flagBtn, filterMode === 'flagged');
  $('modeLabel').textContent = ex ? '· exam in progress' : '';
  const still = filterMode === 'review' ? reviewList.filter(isWrong) : [];
  const done = filterMode === 'review' && reviewList.length && reviewList.every(i => resultOf(i) !== null);
  reviewBanner.classList.toggle('show', !!done);
  if(done){
    $('reviewBannerText').textContent = still.length ? `Review complete — ${still.length} of ${reviewList.length} still incorrect.` : `Review complete — all ${reviewList.length} correct.`;
    const a = $('reviewBannerActions'); a.innerHTML = '';
    if(still.length){ const r = document.createElement('button'); r.className = 'link'; r.textContent = 'Retry remaining'; r.addEventListener('click', () => { reviewList = still; still.forEach(resetForRetry); current = still[0]; render(); scrollToActive(); }); a.appendChild(r); }
    const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Back to all'; b.addEventListener('click', exitReviewMode); a.appendChild(b);
  }
  document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px');
}

document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('textarea, input, [contenteditable]')) return;
  if(lightbox.classList.contains('show')){ if(['Escape', 'Enter', ' '].includes(e.key)){ e.preventDefault(); lightbox.classList.remove('show'); } return; }
  if(!visibleIndices().length) return;
  if(e.key >= '1' && e.key <= '4'){ const q = QUESTIONS[current], oi = +e.key - 1; if(q && q.kind === 'mc' && oi < q.options.length){ e.preventDefault(); selectAnswer(current, oi); } }
  else if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){ if(e.target.closest && e.target.closest('button')) return; if(e.altKey || e.ctrlKey || e.metaKey) return; e.preventDefault(); goNext(); }
  else if(e.key === 'ArrowUp'){ if(e.altKey || e.ctrlKey || e.metaKey) return; e.preventDefault(); goPrev(); }
});

reviewBtn.addEventListener('click', enterReviewMode);
$('allViewBtn').addEventListener('click', exitReviewMode);
flagBtn.addEventListener('click', () => { flagList = scopeIdx().filter(i => flagged.has(i)); if(!flagList.length) return; filterMode = 'flagged'; reviewList = []; if(!flagList.includes(current)) current = flagList[0]; render(); smoothTop(); });
$('layoutToggleBtn').addEventListener('click', () => { layoutMode = layoutMode === 'list' ? 'single' : 'list'; setOn($('layoutToggleBtn'), layoutMode === 'single'); render(); });
$('darkSw').addEventListener('click', () => setOn($('darkSw'), document.documentElement.classList.toggle('dark')));
const examModeBtn = $('examModeBtn');
examModeBtn.addEventListener('click', () => { examMode = !examMode; setOn(examModeBtn, examMode); if(examMode){ filterMode = 'all'; reviewList = []; } render(); });
$('gradeBtn').addEventListener('click', () => {
  scopeIdx().filter(i => !examGraded[i]).forEach(i => {
    missed.delete(i); examGraded[i] = true; const q = QUESTIONS[i];
    if(q.kind === 'mc'){
      const p = examPick[i];
      if(p === null){ examRes[i] = 'u'; answered[i] = -1; missed.add(i); }
      else { answered[i] = p; if(p === q.correct) examRes[i] = 'c'; else { examRes[i] = 'w'; missed.add(i); } }
    } else {
      const empty = !hasDraft(i);
      snap[i] = { html: drafts[i], cells: [...cells[i]] };
      if(q.self){ examRes[i] = 's'; return; }
      examRes[i] = empty ? 'u' : resultOf(i) === 2 ? 'c' : 'w';
      if(examRes[i] !== 'c') missed.add(i);
    }
  });
  filterMode = 'all'; reviewList = []; current = scopeIdx()[0]; render(); smoothTop();
});

const qSearch = $('qSearch'), qWarn = $('qWarn'), qForm = $('qSearchForm');
function qBad(m){ qWarn.textContent = m; qWarn.classList.toggle('show', !!m); qSearch.classList.toggle('bad', !!m); }
function parseNums(txt){
  const t = txt.replace(/[，、;；]/g, ',').replace(/[–—~～]/g, '-').replace(/\s*-\s*/g, '-').trim();
  if(!t) return { empty: true };
  const out = new Set();
  for(const tok of t.split(/[\s,]+/).filter(Boolean)){
    let m;
    if(/^\d+$/.test(tok)) out.add(+tok);
    else if((m = tok.match(/^(\d+)-(\d+)$/)) && +m[1] <= +m[2]){ for(let k = +m[1]; k <= +m[2]; k++) out.add(k); }
    else return { err: `Not recognised: "${tok}"` };
  }
  return { set: out };
}
function clearPick(silent){ pickNums = null; qSearch.value = ''; qBad(''); qForm.classList.remove('active'); if(!silent){ filterMode = 'all'; current = scopeIdx()[0]; render(); smoothTop(); } }
qForm.addEventListener('submit', e => {
  e.preventDefault();
  const r = parseNums(qSearch.value);
  if(r.empty){ clearPick(false); return; }
  if(r.err){ qBad(r.err); return; }
  const have = new Set(baseIdx().map(qno)), miss = [...r.set].filter(n => !have.has(n));
  if(miss.length){ qBad(`No question ${miss.slice(0, 6).join(', ')} (1–${Math.max(...have)})`); return; }
  qBad(''); pickNums = r.set; qForm.classList.add('active'); qSearch.value = [...r.set].sort((a, b) => a - b).join(', ');
  filterMode = 'all'; reviewList = []; current = scopeIdx()[0]; render(); smoothTop();
});
qSearch.addEventListener('input', () => qBad(''));
$('qClear').addEventListener('click', () => clearPick(false));

const allChBtn = $('allChBtn'), tocEl = $('toc');
if(CHAPTERS.length < 2) allChBtn.remove();
function setViewAll(on){ viewAll = on; clearPick(true); setOn(allChBtn, on); filterMode = 'all'; reviewList = []; if(!scopeIdx().includes(current)) current = scopeIdx()[0]; renderToc(); }
allChBtn.addEventListener('click', () => { setViewAll(!viewAll); render(); smoothTop(); });
function renderToc(){
  tocEl.classList.toggle('on', CHAPTERS.length > 1);
  if(CHAPTERS.length < 2) return;
  tocEl.innerHTML = '';
  CHAPTERS.forEach((c, ci) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'link' + (ci === activeCh && !viewAll ? ' on' : ''); b.textContent = chLabel(ci); b.title = c.title; b.addEventListener('click', () => switchChapter(ci)); tocEl.appendChild(b); });
}
function switchChapter(ci){ if(ci === activeCh && !viewAll) return; clearPick(true); if(viewAll) setViewAll(false); activeCh = ci; filterMode = 'all'; reviewList = []; current = CHAPTERS[ci].idx[0]; renderToc(); render(); smoothTop(); }

/* ---------- print ---------- */
$('printBtn').addEventListener('click', () => { document.body.classList.remove('print-solution'); window.print(); });
$('printSolBtn').addEventListener('click', () => { document.body.classList.add('print-solution'); window.print(); });
function sheetHtml(title, idx){
  const L = i => String.fromCharCode(97 + i);
  let html = `<h1>${esc(title)}</h1>`, lastCase = null;
  idx.forEach(qi => {
    const q = QUESTIONS[qi];
    if(q.use && q.use !== lastCase) html += `<div class="p-ex">${exhibitHTML(q.use, idx)}</div>`;
    lastCase = q.use;
    html += `<div class="p-q"><p>${qno(qi)}. ${q.use ? `<span class="p-ref">[Exhibit ${esc(q.use)}]</span> ` : ''}${fm(q.text)}</p>` + (q.fig ? `<div class="p-fig">${figHTML(q.fig)}</div>` : '') +
      (q.kind === 'mc' ? q.options.map((o, oi) => `<p class="p-opt">${L(oi)}. ${fm(o)}</p>`).join('') : '') +
      (q.grids.length ? `<div class="p-gridq">${q.grids.map(t => gridHTML(t, 'print')).join('')}</div>` : '') +
      (q.lines ? `<div class="p-lines" style="--n:${q.lines}"></div>` : '') + '</div>';
  });
  const mcs = idx.filter(isMC);
  html += `<div class="p-key"><h1>${esc(title)} — Answers</h1><div class="p-letters">` + mcs.map(qi => `<div>${qno(qi)}. ${L(QUESTIONS[qi].correct)}</div>`).join('') +
    (idx.length > mcs.length ? `<div>Written ${ranges(idx.filter(i => !isMC(i)).map(qno))}: see “Print with solution”</div>` : '') +
    '</div><div class="p-sol">' + idx.map(qi => {
      const q = QUESTIONS[qi];
      const head = q.kind === 'mc' ? `<b>${qno(qi)}. ${L(q.correct)}</b>` : `<b>${qno(qi)}.</b> ${fm(q.tag)}`;
      return `<div class="p-s${q.grids.length ? ' wide' : ''}"><p>${head}${q.use ? ` [Exhibit ${esc(q.use)}]` : ''}</p>${q.grids.map(t => gridHTML(t, 'key')).join('')}${fmtExpl(q.explain)}` +
        (q.kws.length ? `<p class="p-kw">Key results: ${q.kws.map(k => fm(k[0])).join(' · ')}</p>` : '') + '</div>';
    }).join('') + '</div></div>';
  return html;
}
function buildPrintSheet(sel){
  sel = sel || scopeIdx();
  $('printSheet').innerHTML = sheetHtml(viewAll || CHAPTERS.length < 2 ? QUIZ_TITLE : CHAPTERS[activeCh].title, sel);   // all chapters: one sheet, one running number
}
window.addEventListener('beforeprint', () => buildPrintSheet(visibleIndices()));
window.addEventListener('afterprint', () => document.body.classList.remove('print-solution'));

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let d = false; try{ d = document.execCommand('copy'); }catch(e){} ta.remove(); d ? ok() : fail(); });
}
copyMissedBtn.addEventListener('click', () => {
  const nums = [...missed].filter(i => scopeIdx().includes(i)).map(qno);
  if(!nums.length) return;
  copyText(`${QUIZ_TITLE} incorrect: ${nums.sort((a, b) => a - b).join(', ')}`).then(() => showTip(copyMissedBtn, 'Copied'), () => showTip(copyMissedBtn, 'Copy failed'));
});
function showTip(anchor, msg, ms = 800){
  const el = document.createElement('div'); el.className = 'tip'; el.textContent = msg; document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(); el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = Math.max(4, r.top - 22) + 'px';
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 150); }, ms);
}

const toTopBtn = $('toTopBtn');
let lastY = window.scrollY, upAcc = 0, topTimer = null, lastUser = 0, ignoreScrollUntil = 0;
['wheel', 'touchmove'].forEach(ev => window.addEventListener(ev, () => lastUser = performance.now(), { passive: true }));
window.addEventListener('scroll', () => {
  const y = window.scrollY, d = y - lastY; lastY = y;
  if(performance.now() - lastUser > 700 || performance.now() < ignoreScrollUntil) return;
  if(d > 0 || y < 900){ toTopBtn.classList.remove('show'); upAcc = 0; return; }
  upAcc -= d;
  if(upAcc > 30){ toTopBtn.classList.add('show'); clearTimeout(topTimer); topTimer = setTimeout(() => { toTopBtn.classList.remove('show'); upAcc = 0; }, 2200); }
}, { passive: true });
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('resize', () => document.documentElement.style.setProperty('--bar-h', $('scorebar').offsetHeight + 'px'));

const resetBtn = $('resetBtn'); let armed = false, armTimer = null;
resetBtn.addEventListener('click', () => {
  if(!armed){ armed = true; resetBtn.classList.add('danger'); resetBtn.textContent = 'Click again to restart'; armTimer = setTimeout(disarm, 4000); return; }
  clearTimeout(armTimer); disarm(); resetScope(); smoothTop();
});
function disarm(){ armed = false; resetBtn.classList.remove('danger'); resetBtn.textContent = 'Restart'; }
function resetScope(){ scopeIdx().forEach(i => { answered[i] = null; examPick[i] = null; examGraded[i] = false; examRes[i] = null; missed.delete(i); drafts[i] = ''; cells[i] = cells[i].map(() => ''); snap[i] = null; }); current = scopeIdx()[0]; filterMode = 'all'; reviewList = []; render(); }

const memoEl = $('memoText'), memoTab = $('memoTab');
function setMemoOpen(on){ document.body.classList.toggle('memo-open', on); }
function memoHtml(){ const out = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.nodeValue) : c.nodeName === 'BR' ? '<br>' : ['B', 'STRONG'].includes(c.nodeName) ? `<b>${out(c)}</b>` : ['DIV', 'P'].includes(c.nodeName) ? `<div>${out(c)}</div>` : out(c)).join(''); return out(memoEl); }
memoEl.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); });
$('memoBold').addEventListener('mousedown', e => e.preventDefault());
$('memoBold').addEventListener('click', () => { memoEl.focus(); document.execCommand('bold'); });
memoTab.addEventListener('click', () => { setMemoOpen(true); memoEl.focus(); });
$('memoClose').addEventListener('click', () => setMemoOpen(false));
document.addEventListener('mousedown', e => { if(document.body.classList.contains('memo-open') && !e.target.closest('#memo, #memoTab')) setMemoOpen(false); });
window.addEventListener('keydown', e => { if(e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'q'){ e.preventDefault(); const on = !document.body.classList.contains('memo-open'); setMemoOpen(on); if(on) memoEl.focus(); } });

const saveBtn = $('saveBtn');
const hashStr = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const SAVE_KEY = 'integratedQuiz:' + QUIZ_TITLE, SAVE_SIG = hashStr(QUESTIONS.map(q => q.kind + '|' + q.text + '|' + q.options.join('|') + '|' + q.correct + '|' + q.kws.map(k => k.join('/')).join('|') + '|' + q.blanks.map(b => b.alts.join('/')).join('|')).join('\n'));
saveBtn.addEventListener('click', () => {
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ sig: SAVE_SIG, t: Date.now(), answered, drafts, cells, snap, missed: [...missed], flagged: [...flagged], activeCh, current, examMode, examPick, examGraded, examRes, memo: memoHtml() })); showTip(saveBtn, 'Saved'); }
  catch(e){ showTip(saveBtn, 'Save failed'); }
});
function loadProgress(){
  let d; try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ return false; }
  if(!d) return false;
  if(typeof d.memo === 'string'){ memoEl.innerHTML = d.memo; memoEl.innerHTML = memoHtml(); }
  if(d.sig !== SAVE_SIG || !Array.isArray(d.answered) || d.answered.length !== NQ) return 'mismatch';
  answered = d.answered; (d.missed || []).forEach(i => missed.add(i)); (d.flagged || []).forEach(i => flagged.add(i));
  if(Array.isArray(d.drafts) && d.drafts.length === NQ) drafts = d.drafts.map(cleanHtml);
  if(Array.isArray(d.cells) && d.cells.length === NQ) cells = d.cells.map((c, i) => QUESTIONS[i].blanks.map((_, k) => String((c || [])[k] || '')));
  if(Array.isArray(d.snap) && d.snap.length === NQ) snap = d.snap.map((s, i) => s && typeof s === 'object' ? { html: cleanHtml(s.html || ''), cells: QUESTIONS[i].blanks.map((_, k) => String((s.cells || [])[k] || '')) } : null);
  if(Array.isArray(d.examPick) && d.examPick.length === NQ){ examPick = d.examPick; examGraded = d.examGraded || examGraded; examRes = d.examRes || examRes; }
  examMode = !!d.examMode; setOn(examModeBtn, examMode);
  activeCh = CHAPTERS[d.activeCh] ? d.activeCh : 0;
  current = QUESTIONS[d.current] ? d.current : 0;
  return true;
}
let restored = false; try{ restored = loadProgress(); }catch(e){}

if(CHAPTERS.length > 1 && /midterm|final/i.test(QUIZ_TITLE)) setViewAll(true);
if(!scopeIdx().includes(current)) current = scopeIdx()[0];
renderToc();
render();
if(restored === true) showTip(saveBtn, 'Progress restored');
else if(restored === 'mismatch') showTip(saveBtn, 'Saved data is from another version');
const menuBtn = document.getElementById('menuBtn'), settingsEl = document.getElementById('settings');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const on = settingsEl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(on)); menuBtn.classList.toggle('on', on); });
document.addEventListener('click', e => { if(settingsEl.classList.contains('open') && !e.target.closest('.setwrap')){ settingsEl.classList.remove('open'); menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); } });
</script>
