  PDF 가 바뀌면: 그림을 다시 뽑고(PyMuPDF 로 2배, JPG 82) 그래프 자리·단계를 새 장 번호에 맞춘다.

<style>

  .gsvg{display:block;width:100%;height:100%;font-family:inherit;overflow:visible}
  .g.orig .gsvg{opacity:0;pointer-events:none}
  .gtools{position:absolute;right:4px;top:4px;display:flex;gap:6px;opacity:.5;transition:opacity .2s}
  .g:hover .gtools,.gtools:focus-within{opacity:1}
  .gtools button{font-family:inherit;font-size:16px;font-weight:600;line-height:1;padding:6px 10px;border:1.5px solid #1f2537;border-radius:0;background:#fff;color:#1f2537;cursor:pointer;-webkit-appearance:none;appearance:none}
  .gtools button:hover{background:#1f2537;color:#fff}
  .g.orig .gtools button:last-child{background:#1f2537;color:#fff}
  #overview .gtools{display:none}
  @media print{.gtools{display:none}}
</style>
