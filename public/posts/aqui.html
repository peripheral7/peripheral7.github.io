<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clockwork — THE FIELD FILE</title>
  <style>
    body { margin: 0; padding: 0; background-color: #ffffff; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
    header { margin-bottom: 50px; border-bottom: 2px solid #1a1a1a; padding-bottom: 20px; }
    .back-link { display: inline-block; margin-bottom: 30px; color: #1a1a1a; text-decoration: none; font-family: monospace; font-size: 0.85rem; font-weight: bold; }
    .back-link:hover { color: #E24A35; }
    h1 { font-size: 2.5rem; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.03em; }
    .meta { font-family: monospace; font-size: 0.85rem; color: #E24A35; text-transform: uppercase; letter-spacing: 0.15em; }
    .intro-text { margin-top: 20px; line-height: 1.6; color: #4b5563; }

    /* Masonry & Animation */
    .gallery-masonry { column-count: 3; column-gap: 20px; margin-top: 40px; }
    .gallery-item { break-inside: avoid; margin-bottom: 20px; opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
    .gallery-item.visible { opacity: 1; transform: translateY(0); }
    .gallery-item img { width: 100%; height: auto; display: block; border-radius: 4px; background-color: #f9f9f9; }
    .caption { margin-top: 8px; font-size: 0.8rem; color: #6b7280; text-align: center; }

    @media (max-width: 768px) {
      .gallery-masonry { column-count: 2; column-gap: 12px; }
      .gallery-item { margin-bottom: 12px; }
    }

    footer { margin-top: 80px; padding-top: 20px; border-top: 1px solid #e5e7eb; font-family: monospace; font-size: 0.75rem; color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← BACK TO BOARD</a>
    
    <header>
      <h1>Clockwork</h1>
      <div class="meta">Category: Photography / Filed: 2026.07.08</div>
      <div class="intro-text">
        <p>A roll of film: captured moments and light around the cafe.</p>
      </div>
    </header>
    
    <div class="gallery-masonry" id="gallery"></div>

    <footer>THE FIELD FILE — PHOTOGRAPHY SERIES / ALL RIGHTS RESERVED.</footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const gallery = document.getElementById("gallery");
      const manifestUrl = "/images/photography/aqui/manifest.json";

      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

      try {
        const response = await fetch(manifestUrl);
        if (!response.ok) throw new Error("Manifest load failed");
        const images = await response.json();
        
        images.forEach(img => {
          const item = document.createElement("div");
          item.className = "gallery-item";
          
          const fileName = img.file || img.filename; 
          const captionHtml = img.caption ? `<div class="caption">${img.caption}</div>` : "";

          item.innerHTML = `<img src="/images/photography/aqui/${fileName}" alt="AQUI." loading="lazy">${captionHtml}`;
          
          gallery.appendChild(item);
          observer.observe(item);
        });
      } catch (error) {
        gallery.innerHTML = "<p>이미지를 불러오지 못했습니다.</p>";
      }
    });
  </script>
</body>
</html>
