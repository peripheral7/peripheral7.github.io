<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBR650F (2016)</title>
<style>
  :root { --bg: #f6f3ee; --ink: #1a1a1a; --muted: #6b6b6b; --accent: #b5432f; --border: #d9d3c8; --card: #ffffff; --nav-w: 220px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif; line-height: 1.5; }
  .shell { display: flex; min-height: 100vh; }

  .side-nav { position: sticky; top: 0; align-self: flex-start; height: 100vh; width: var(--nav-w); flex-shrink: 0; background: var(--ink); color: #eee; padding: 28px 20px; overflow-y: auto; }
  .side-nav .brand { font-family: monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 4px; }
  .side-nav h1 { font-size: 0.95rem; line-height: 1.35; margin: 0 0 20px 0; font-weight: 700; }
  .side-nav .home-link { display: block; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.18); color: #fff; text-decoration: none; font-size: 0.78rem; font-weight: 600; }
  .side-nav .home-link:hover { color: var(--accent); }

  .top-bar { max-width: 1000px; margin: 0 auto 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .top-bar .back-link { font-weight: 700; text-decoration: none; color: var(--ink); font-size: 0.85rem; }
  .top-bar .back-link:hover { color: var(--accent); }
  .top-bar .cat-links { display: flex; gap: 14px; }
  .top-bar .cat-links a { font-family: monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); text-decoration: none; border: 1px solid var(--border); padding: 5px 10px; }
  .top-bar .cat-links a:hover { color: var(--accent); border-color: var(--accent); }

  .content { flex: 1; min-width: 0; padding: 32px clamp(16px, 4vw, 48px) 80px; }

  #overview { max-width: 1000px; margin: 0 auto 40px; }
  #overview .eyebrow { font-family: monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); }
  #overview h1 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; margin: 8px 0 10px; }
  #overview p { color: var(--muted); max-width: 640px; }

  /* Masonry & Animation */
  .gallery-masonry { max-width: 1000px; margin: 0 auto; column-count: 3; column-gap: 20px; }
  .photo-card { break-inside: avoid; margin: 0 0 20px 0; opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; text-align: center; }
  .photo-card.visible { opacity: 1; transform: translateY(0); }
  .photo-card img { width: 100%; height: auto; display: block; border-radius: 4px; background: #eee; }
  .photo-card figcaption { margin-top: 8px; font-size: 0.75rem; color: var(--muted); }

  @media (max-width: 768px) {
    .shell { flex-direction: column; }
    .side-nav { position: static; width: 100%; height: auto; padding: 16px 20px; }
    .content { padding: 24px 16px 60px; }
    .top-bar { flex-direction: column; align-items: flex-start; }
    .gallery-masonry { column-count: 2; column-gap: 12px; }
    .photo-card { margin-bottom: 12px; }
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="side-nav">
    <p class="brand">Field File / Motorcycle</p>
    <h1>CBR650F (2016)</h1>
    <a class="home-link" href="/">← 메인으로</a>
  </aside>

  <main class="content">
    <div class="top-bar">
      <a class="back-link" href="/">← 메인으로</a>
      <div class="cat-links">
        <a href="/">Research</a>
        <a href="/">Photography</a>
        <a href="/">Motorcycle</a>
      </div>
    </div>

    <section id="overview">
      <p class="eyebrow">Garage Log · MOTO-2016</p>
      <h1>CBR650F (2016)</h1>
      <p></p>
    </section>

    <div id="gallery" class="gallery-masonry"></div>
  </main>
</div>

<script>
  const IMAGE_FOLDER = "/images/motorcycles/CBR650F/";

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

  fetch(IMAGE_FOLDER + "manifest.json")
    .then((res) => res.json())
    .then((items) => {
      const gallery = document.getElementById("gallery");
      items.forEach((item, i) => {
        const figure = document.createElement("figure");
        figure.className = "photo-card";

        const fileName = item.file || item.filename;
        const img = document.createElement("img");
        img.src = IMAGE_FOLDER + encodeURIComponent(fileName);
        img.alt = item.caption || `CBR650F 사진 ${i + 1}`;
        img.loading = "lazy";
        figure.appendChild(img);

        if (item.caption) {
          const caption = document.createElement("figcaption");
          caption.textContent = item.caption;
          figure.appendChild(caption);
        }

        gallery.appendChild(figure);
        observer.observe(figure);
      });
    })
    .catch((err) => {
      console.error("Failed to load photo manifest:", err);
    });
</script>
</body>
</html>
